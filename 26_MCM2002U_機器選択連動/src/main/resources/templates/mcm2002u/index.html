<!-- JavaScript: 行選択フィルタ + チェックボックス連動 -->
<!-- 【変換元】
    MCM_TM_KIKIKOSEIDataGridView_CellContentClick()（111行）
    MCM_TM_KIKIMEISAIDataGridView_CellContentClick()（71行）
    MCM_TM_KOTAIMEISAIDataGridView_CellContentClick()（108行）
    MeisaiToKosei()（45行）
    BindingSource リレーション設定（構成→明細、構成→個体）
-->
<!-- ============================================================ -->
<script>
/**
 * 現在選択中の機器構成ID
 */
let selectedKikikoseiId = null;

// Decimalの桁数に左右されず比較する。Number変換による大きなIDの丸めも避ける。
function normalizeId(value) {
    return String(value ?? '').replace(/\.0+$/, '').replace(/(\.\d*?[1-9])0+$/, '$1');
}

/**
 * 画面初期化: 最初の構成行を選択
 */
document.addEventListener('DOMContentLoaded', function() {
    const firstRow = document.querySelector('#koseiTable tbody tr');
    if (firstRow) {
        selectKoseiRow(firstRow);
    }
});

/**
 * 構成行クリック → 明細・個体をフィルタ
 * 【変換元】BindingSource リレーション設定
 *   MCM_MA_KIKIMEISAIBindingSource.DataSource = MCM_MA_KIKIKOSEIBindingSource
 *   MCM_MA_KIKIMEISAIBindingSource.DataMember = "MCM_MA_KIKIKOSEI_MCM_MA_KIKIMEISAI"
 */
function selectKoseiRow(tr, event) {
    applyCellSelection(tr, event);

    selectedKikikoseiId = normalizeId(tr.dataset.kikikoseiId);

    // 明細テーブル: 同一構成IDの行のみ表示
    document.querySelectorAll('#meisaiTable tbody tr').forEach(r => {
        r.style.display = (normalizeId(r.dataset.kikikoseiId) === selectedKikikoseiId) ? '' : 'none';
    });

    // 個体テーブル: 同一構成IDの行のみ表示
    document.querySelectorAll('#kotaiTable tbody tr').forEach(r => {
        r.style.display = (normalizeId(r.dataset.kikikoseiId) === selectedKikikoseiId) ? '' : 'none';
    });

    // 表示行の行番号を振り直し、明細・個体のカレント行を先頭行に合わせる
    renumberVisibleRows('#meisaiTable');
    renumberVisibleRows('#kotaiTable');
    selectFirstVisibleRow('#meisaiTable');
    selectFirstVisibleRow('#kotaiTable');
}

/**
 * 単一セル選択（MCM2004U準拠）
 * 【変換元】mcm2004u.js: selectCell() / select()
 *   行頭マーカー(row-head)クリック＝行選択（全セルグレー＋▶）、
 *   データセルクリック＝セル単体選択（別セルを選ぶと直前の選択は解除される）。
 * 他画面（MCM2004U）と同じ「グリッド内で1箇所のみ選択状態にする」動作を維持するため、
 * 選択解除・付与の対象はクリックされたテーブル全体（tbody）に限定する。
 */
function selectGridRow(tr, event) {
    applyCellSelection(tr, event);
}

function applyCellSelection(tr, event) {
    const table = tr.closest('table');
    const cell = event ? event.target.closest('td') : null;
    table.querySelectorAll('tbody .cell-active').forEach(c => c.classList.remove('cell-active'));
    if (cell && !cell.classList.contains('row-head')) {
        // データセルクリック＝セル単体選択。行全体の選択(selected)は解除する。
        table.querySelectorAll('tbody tr').forEach(r => r.classList.remove('selected'));
        cell.classList.add('cell-active');
    } else {
        // 行頭マーカー(row-head)クリック＝行選択。
        table.querySelectorAll('tbody tr').forEach(r => r.classList.remove('selected'));
        tr.classList.add('selected');
    }
}

/**
 * 表示中（display!=none）の行の先頭を選択状態にする
 */
function selectFirstVisibleRow(tableSelector) {
    const table = document.querySelector(tableSelector);
    if (!table) return;
    table.querySelectorAll('tbody tr').forEach(r => r.classList.remove('selected'));
    table.querySelectorAll('tbody .cell-active').forEach(c => c.classList.remove('cell-active'));
    const first = Array.from(table.querySelectorAll('tbody tr')).find(r => r.style.display !== 'none');
    if (first) first.classList.add('selected');
}

/**
 * 構成行フィルタ後、表示中の行にのみ連番を振り直す（行番号列）
 */
function renumberVisibleRows(tableSelector) {
    const table = document.querySelector(tableSelector);
    if (!table) return;
    let no = 0;
    table.querySelectorAll('tbody tr').forEach(r => {
        const cell = r.querySelector('.row-number');
        if (!cell) return;
        if (r.style.display !== 'none') {
            no += 1;
            cell.textContent = no;
        }
    });
}

/**
 * 構成チェックボックス変更 → 明細・個体のチェックを連動
 * 【変換元】MCM_TM_KIKIKOSEIDataGridView_CellContentClick()
 *   元コード:
 *     If CHECK_FLG = ON Then
 *       For Each meisaiRow → CHECK_FLG = ON（見積あり行のみ）
 *       For Each kotaiRow  → CHECK_FLG = ON
 *     Else
 *       For Each meisaiRow → CHECK_FLG = OFF
 *       For Each kotaiRow  → CHECK_FLG = OFF
 *     End If
 */
function onKoseiCheckChange(chk) {
    const tr = chk.closest('tr');
    const kikikoseiId = normalizeId(tr.dataset.kikikoseiId);
    const isChecked = chk.checked;

    // 明細のチェックを連動
    document.querySelectorAll('#meisaiTable tbody tr').forEach(r => {
        if (normalizeId(r.dataset.kikikoseiId) === kikikoseiId) {
            const cb = r.querySelector('input[type="checkbox"]');
            if (cb && !cb.disabled) {
                cb.checked = isChecked;
            }
        }
    });

    // VBと同じく、選択可能な親明細の個体だけを連動させる。
    const selectedMeisai = new Set(Array.from(document.querySelectorAll('#meisaiTable tbody tr'))
        .filter(r => normalizeId(r.dataset.kikikoseiId) === kikikoseiId)
        .filter(r => { const cb = r.querySelector('input[type="checkbox"]'); return cb && !cb.disabled && cb.checked; })
        .map(r => normalizeId(r.dataset.kikimeisaiId)));
    document.querySelectorAll('#kotaiTable tbody tr').forEach(r => {
        if (normalizeId(r.dataset.kikikoseiId) === kikikoseiId) {
            const cb = r.querySelector('input[type="checkbox"]');
            if (cb && !cb.disabled) cb.checked = isChecked && selectedMeisai.has(normalizeId(r.dataset.kikimeisaiId));
        }
    });
}

/**
 * 明細チェックボックス変更 → 個体のチェックを連動 + 構成への逆伝播
 * 【変換元】MCM_TM_KIKIMEISAIDataGridView_CellContentClick()
 *   + MeisaiToKosei()
 */
function onMeisaiCheckChange(chk) {
    const tr = chk.closest('tr');
    const kikikoseiId = normalizeId(tr.dataset.kikikoseiId);
    const kikimeisaiId = normalizeId(tr.dataset.kikimeisaiId);
    const isChecked = chk.checked;

    // 個体のチェックを連動（同一構成ID+明細IDの行）
    document.querySelectorAll('#kotaiTable tbody tr').forEach(r => {
        if (normalizeId(r.dataset.kikikoseiId) === kikikoseiId &&
            normalizeId(r.dataset.kikimeisaiId) === kikimeisaiId) {
            const cb = r.querySelector('input[type="checkbox"]');
            if (cb && !cb.disabled) {
                cb.checked = isChecked;
            }
        }
    });

    // 構成への逆伝播（MeisaiToKosei相当）
    // 明細に1つでもチェックがあれば構成もON、全てOFFなら構成もOFF
    const anyMeisaiChecked = Array.from(
        document.querySelectorAll('#meisaiTable tbody tr')
    ).filter(r => normalizeId(r.dataset.kikikoseiId) === kikikoseiId)
     .some(r => {
        const cb = r.querySelector('input[type="checkbox"]');
        return cb && cb.checked;
     });

    document.querySelectorAll('#koseiTable tbody tr').forEach(r => {
        if (normalizeId(r.dataset.kikikoseiId) === kikikoseiId) {
            const cb = r.querySelector('input[type="checkbox"]');
            if (cb && !cb.disabled) {
                cb.checked = anyMeisaiChecked;
            }
        }
    });
}

/**
 * 個体チェックボックス変更 → 明細・構成への逆伝播
 * 【変換元】MCM_TM_KOTAIMEISAIDataGridView_CellContentClick()
 */
function onKotaiCheckChange(chk) {
    const tr = chk.closest('tr');
    const kikikoseiId = normalizeId(tr.dataset.kikikoseiId);
    const kikimeisaiId = normalizeId(tr.dataset.kikimeisaiId);

    // 同一構成+明細の個体に1つでもチェックがあれば明細をON
    const anyKotaiChecked = Array.from(
        document.querySelectorAll('#kotaiTable tbody tr')
    ).filter(r => normalizeId(r.dataset.kikikoseiId) === kikikoseiId &&
                  normalizeId(r.dataset.kikimeisaiId) === kikimeisaiId)
     .some(r => {
        const cb = r.querySelector('input[type="checkbox"]');
        return cb && cb.checked;
     });

    // 明細のチェック更新
    document.querySelectorAll('#meisaiTable tbody tr').forEach(r => {
        if (normalizeId(r.dataset.kikikoseiId) === kikikoseiId &&
            normalizeId(r.dataset.kikimeisaiId) === kikimeisaiId) {
            const cb = r.querySelector('input[type="checkbox"]');
            if (cb && !cb.disabled) {
                cb.checked = anyKotaiChecked;
            }
        }
    });

    // 構成への逆伝播
    const anyMeisaiChecked = Array.from(
        document.querySelectorAll('#meisaiTable tbody tr')
    ).filter(r => normalizeId(r.dataset.kikikoseiId) === kikikoseiId)
     .some(r => {
        const cb = r.querySelector('input[type="checkbox"]');
        return cb && cb.checked;
     });

    document.querySelectorAll('#koseiTable tbody tr').forEach(r => {
        if (normalizeId(r.dataset.kikikoseiId) === kikikoseiId) {
            const cb = r.querySelector('input[type="checkbox"]');
            if (cb && !cb.disabled) {
                cb.checked = anyMeisaiChecked;
            }
        }
    });
}

/**
 * 見積基本設定ボタン確認ダイアログ
 * 【変換元】KIHONSETTEIButton_Click() - ConfirmMessage
 *   元コード: If ConfirmMessage("見積基本設定を行います。よろしいですか？") <> Yes Then Return
 */
function confirmKihonSettei() {
    if (confirm('見積基本設定を行います。よろしいですか？')) {
        document.getElementById('mainForm').submit();
    }
}
</script>
