# ==============================================================================
# 【変換元】CPMessage.xml (FRAMEWORK/XML/CPMessage.xml)
#           CPMessageConstant.vb (FRAMEWORK/CONSTANT/CPMessageConstant.vb)
#
# メッセージ定義
# VB.NETの CPMessage.xml のメッセージ定義を
# Spring MessageSource (messages.properties) に移行。
#
# 命名規則:
#   FWM_xxxxE = Framework エラーメッセージ
#   FWM_xxxxW = Framework 警告メッセージ
#   FWM_xxxxI = Framework 情報メッセージ
#   MSG_xxxxE = アプリケーション エラーメッセージ
#   MSG_xxxxW = アプリケーション 警告メッセージ
#   MSG_xxxxI = アプリケーション 情報メッセージ
#   MSG_xxxxC = アプリケーション 確認メッセージ
# ==============================================================================

# ---------------------------------------------------------------------------
# Framework メッセージ (FWM_xxxx)
# 【変換元】CPMessage.xml - Frameworkセクション
# ---------------------------------------------------------------------------
FWM_0001E=システムエラーが発生しました。管理者に連絡してください。
FWM_0002E=データベース接続エラーが発生しました。
FWM_0003E=データの取得に失敗しました。
FWM_0004E=データの更新に失敗しました。
FWM_0005E=データの削除に失敗しました。
FWM_0006E=排他制御エラーが発生しました。他のユーザーによりデータが更新されています。
FWM_0007E=タイムアウトが発生しました。再度操作してください。
FWM_0008E=ファイルの読み込みに失敗しました。
FWM_0009E=ファイルの書き込みに失敗しました。
FWM_0010E=ログインに失敗しました。ユーザーIDまたはパスワードが正しくありません。
FWM_0011E=セッションがタイムアウトしました。再度ログインしてください。
FWM_0012E=権限がないため遷移できません。
FWM_0013E=メール送信に失敗しました。
FWM_0014E=Excel出力に失敗しました。
FWM_0015E=入力値が不正です。
FWM_0016W=処理を中断しました。
FWM_0017I=処理が正常に完了しました。
FWM_0018I=ログアウトしました。
FWM_0019I=該当するデータはありません。
FWM_0020I=データを読み込みました。{0}件

