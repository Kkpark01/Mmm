# アプリケーション 警告メッセージ (MSG_xxxxW)
# ---------------------------------------------------------------------------
MSG_0001W=変更されたデータがあります。保存しますか？
MSG_0002W=処理に時間がかかる場合があります。続行しますか？
# ---------------------------------------------------------------------------
# MCM3006U 担当者マスタ
# ---------------------------------------------------------------------------
# 【不具合修正 INT09-028】排他制御（楽観的排他制御）メッセージ
#   移行元VB（CPMessage.xml）では FWM_0009E =
#     「他のユーザがデータを変更した可能性があります。処理をやり直してください。」
#   だったが、本システムの FWM_0009E は「ファイルの書き込みに失敗しました。」で
#   用途が異なるため、同一IDを流用せず MCM3006U 専用キーを新設する。
#   ※ 汎用の FWM_0006E / MSG_0003E も存在するが、旧システムと同一文言を出す
#      必要があるため MCM3006U 専用キーに旧FWM_0009の文言を定義する。
#   ※ フレームワーク共通の FWM_0009E を旧文言へ戻す方針となった場合は、
#      本キーを廃止して FWM_0009E を参照するよう Mcm3006uService を変更すること。
mcm3006u.msg.exclusive=他のユーザがデータを変更した可能性があります。処理をやり直してください。

# 画面が保持している排他情報（更新日時）が不正・欠落している場合
mcm3006u.msg.invalidLockInfo=画面情報が不正です。画面を再表示してから操作してください。

# ---------------------------------------------------------------------------
# MCM0025U パスワード変更
# ---------------------------------------------------------------------------
# 【不具合修正 INT09-010】排他制御（楽観的排他制御）メッセージ
#   文言は移行元VB（CPMessage.xml）の FWM_0009E と同一にしている。
#
#   ※ メッセージIDについて
#     旧: FWM_0009E = 他のユーザがデータを変更した可能性があります。処理をやり直してください。
#     新: FWM_0009E = ファイルの書き込みに失敗しました。  ← 本システムでは用途が異なる
#     そのため FWM_0009E を上書きせず、MCM0025U 専用キーに旧FWM_0009の文言を定義する。
#     フレームワーク共通の FWM_0009E を旧文言へ戻す方針となった場合は、
#     本キーを廃止して FWM_0009E を参照するよう Mcm0025uService を変更すること。
mcm0025u.msg.exclusive=他のユーザがデータを変更した可能性があります。処理をやり直してください。

# #296: 納入先・プラントの楽観的排他制御（チケット指定 FWM_0009 文言）
mcm0011u.msg.exclusive=他のユーザがデータを変更した可能性があります。処理をやり直してください。
mcm0012u.msg.exclusive=他のユーザがデータを変更した可能性があります。処理をやり直してください。
