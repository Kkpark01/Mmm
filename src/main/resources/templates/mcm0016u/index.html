<!DOCTYPE html>
<!--
  【変換元】Mcm0016uScreen.Designer.vb（UI定義）+ Mcm0016uScreen.vb（イベント処理）
  MCM0016U — 製造メーカーマスタ（パターンE: 親子2階層DataGridView編集型）

  VB.NETコントロール対応:
    DataGridView1             → table#makerTable (製造メーカー)
    DataGridView2             → table#koseiTable (保守会社構成)
    UpdateButton              → button#btnUpdate (登録)
    MCM_MA_SEIZOMAKERRowDeleteButton → button.deleteMakerBtn (各行)
    MCM_MA_SEIZOMAKER_KOSEIRowDeleteButton → button.deleteKoseiBtn (各行)
    HOSHUGAISHALabel          → h2 (保守会社セクション)
  【レイアウト】MCM0015U（ブランドマスタ）に統一
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM0016U — 製造メーカーマスタ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../css/common.css"/>
    <link rel="stylesheet" th:href="@{/css/mcm0016u.css}" href="../css/mcm0016u.css"/>
    <link rel="stylesheet" th:href="@{/css/custom-dialog.css}" href="../css/custom-dialog.css"/>
    <script th:src="@{/js/common.js}"></script>

    <style>
        /* ===== MCM0015U 準拠 共通レイアウト ===== */
        .header, .toolbar, .form-actions, button, .btn, .btn-close,
        .mini-dialog, .custom-dialog {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        button, .btn, .btn-close { cursor: pointer; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px; box-sizing: border-box;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 {
            margin: 0; font-size: 18px; font-weight: bold; color: #fff;
            letter-spacing: 2px; line-height: 30px;
        }
        .header .header-left, .header .header-right { display: flex; align-items: center; }

        .grid-container {
            height: calc(100vh - 250px);
            overflow-y: auto; overflow-x: auto;
            border: 1px solid #d5dbdb; position: relative;
        }
        .data-grid { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; white-space: nowrap; table-layout: fixed; }
        .data-grid thead th {
            position: -webkit-sticky; position: sticky; top: 0; z-index: 5;
            background-color: #eef2f5;
            box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5;
            text-align: left;
        }
        .data-grid th, .data-grid td {
            border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb; padding: 4px 6px;
        }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }

        .data-grid thead th,
        .data-grid td.col-select,
        .data-grid td.col-readonly {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            cursor: default;
        }
        .data-grid td { padding: 0; }
        .data-grid thead th { padding: 4px 6px; }
        .data-grid td.col-readonly { padding: 4px 6px; }
        .data-grid .grid-input {
            box-sizing: border-box; width: 100%;
            height: 100%; min-height: 26px;
            border: none; margin: 0; padding: 3px 6px;
            background: transparent;
        }
        .data-grid .grid-input:focus { outline: none; }
        .data-grid td.col-select { padding: 2px; }
        .data-grid .input-right { text-align: right; }
        .data-grid .input-left  { text-align: left; }
        .data-grid .col-select { text-align: center; }

        .data-grid td.col-readonly {
            background-color: #d9d9d9; color: #333; font-size: 11px; white-space: nowrap;
        }
        /* 【MCM0018U準拠】読取専用列（登録日時/登録者/更新日時/更新者）の罫線を可視化する。
           通常罫線色 #d5dbdb と背景色 #d9d9d9 が同系色で見分けづらいため、
           読取専用セルのみ一段濃い罫線色にする。 */
        .data-grid tbody tr > td.col-readonly {
            border-right: 1px solid #a9b0b0; border-bottom: 1px solid #a9b0b0;
        }
        .data-grid tbody tr > td.col-readonly:first-child { border-left: 1px solid #a9b0b0; }
        .data-grid tr.row-deleted td {
            background-color: #fadbd8 !important; text-decoration: line-through; opacity: 0.6;
        }

        .data-grid thead th.col-required { color: #d32f2f; }
        .data-grid td.col-required { background-color: #e3f2fd; }
        .data-grid td.col-required .grid-input { background-color: #e3f2fd; }

        .data-grid .row-select-label { display: block; width: 100%; height: 100%; cursor: pointer; line-height: 1.6; }
        .data-grid .row-select { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
        .data-grid .row-marker::before { content: ""; display: inline-block; min-width: 1em; }
        .data-grid tr.row-active .row-marker::before { content: "\25B6"; color: #000000; font-size: 13px; }

        .data-grid tr.row-selected td { background-color: #bdbdbd !important; }
        .data-grid tr.row-selected td .grid-input { background-color: #bdbdbd !important; }

        .data-grid input.field-error { outline: 2px solid #d32f2f; background-color: #ffebee !important; }

        .data-grid input[type="number"]::-webkit-outer-spin-button,
        .data-grid input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .data-grid input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        /* ========== 横スクロール固定列（#155） ========== */
        /* makerTable: 選択列(22px), No(40px), 無効(60px), 製造メーカー(190px) */
        #makerTable th:nth-child(1), #makerTable td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px);   z-index: 3; background: #fff; overflow: hidden; }
        #makerTable th:nth-child(2), #makerTable td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 22px);  z-index: 3; background: #fff; overflow: hidden; }
        #makerTable th:nth-child(3), #makerTable td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 62px);  z-index: 3; background: #fff; overflow: hidden; }
        #makerTable th:nth-child(4), #makerTable td:nth-of-type(4) { position: sticky; left: var(--mcm-fixed-left-4, 122px); z-index: 3; background: #fff; overflow: hidden; box-shadow: 2px 0 0 rgba(0,0,0,.08); }
        #makerTable thead th:nth-child(1),
        #makerTable thead th:nth-child(2),
        #makerTable thead th:nth-child(3),
        #makerTable thead th:nth-child(4) { z-index: 20; background: #eef2f5; }

        /* koseiTable: 選択列(22px), No(40px), 保守会社名(200px) */
        #koseiTable th:nth-child(1), #koseiTable td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px);  z-index: 3; background: #fff; overflow: hidden; }
        #koseiTable th:nth-child(2), #koseiTable td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 22px); z-index: 3; background: #fff; overflow: hidden; }
        #koseiTable th:nth-child(3), #koseiTable td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 62px); z-index: 3; background: #fff; overflow: hidden; box-shadow: 2px 0 0 rgba(0,0,0,.08); }
        #koseiTable thead th:nth-child(1),
        #koseiTable thead th:nth-child(2),
        #koseiTable thead th:nth-child(3) { z-index: 20; background: #eef2f5; }

        /* 必須項目の背景色を固定列でも維持 */
        #makerTable td.col-required:nth-of-type(2), #makerTable td.col-required:nth-of-type(4),
        #koseiTable td.col-required:nth-of-type(2), #koseiTable td.col-required:nth-of-type(3) { background-color: #e3f2fd; }

        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            text-decoration: none; background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; cursor: pointer; line-height: 1.6;
        }
        .btn-close:hover  { background-color: #e5f1fb; border-color: #7eb4ea; }
        .btn-close:active { background-color: #cce4f7; border-color: #569de5; }

        .toolbar { display: flex !important; justify-content: flex-end !important; gap: 6px; }

        .mini-dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .mini-dialog {
            background: #fbfbfb; min-width: 300px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #ffffff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; font-weight: normal; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; line-height: 1;
            color: #444; cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 16px; background: #fbfbfb; white-space: pre-line;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; }
        .mini-dialog-body .mini-msg { color: #000000; font-size: 13px; }
        .mini-dialog-foot { padding: 10px 16px 14px; text-align: right; background: #fbfbfb; }
        .mini-dialog-foot button {
            min-width: 84px; padding: 5px 12px; font-size: 12px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button:focus { outline: 1px solid #0078d4; outline-offset: 1px; }

        /* MCM0015U基準：登録ボタンを右側へ配置 */
        .form-actions {
            display: flex !important;
            justify-content: flex-end !important;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            padding: 8px 10px 12px;
            text-align: right !important;
        }
        .form-actions #btnUpdate {
            margin-left: auto !important;
            margin-right: 0 !important;
        }
    /* #155: 削除行も不透明にし、背後のスクロール列を隠す。削除色と取消線は維持。 */
        table.data-grid[data-mcm-fixed-columns] tr.row-deleted,
        table.data-grid[data-mcm-fixed-columns] tr.row-deleted td { opacity: 1; }
    </style>
    <style>
        /* 親子2階層レイアウト（MCM0016U 固有） */
        .section { margin: 0 0 6px 0; }
        .section-header { display: flex; align-items: center; gap: 8px; padding: 2px 6px; }
        /* 【MCM0015U 準拠】見出しはグリッド見出し(12px)に合わせる */
        .section-header .grid-title { margin: 0; font-size: 12px; font-weight: bold; color: #333; }
        .section-header .toolbar { margin-left: auto; padding: 0; background: none; border-bottom: none; }
        .section-note { font-size: 11px; color: #666; }

        /* 【MCM0017U/0018U 準拠】表の高さ（vh按分方式・登録ボタンは通常フロー） */
        .grid-scroll-parent { height: calc(42vh - 60px); }
        .grid-scroll-child  { height: calc(32vh - 40px); }
        .data-grid td.readonly { background: #f5f5f5; }
        td.center { text-align: center; padding: 4px 6px; }
        td.right { text-align: right; padding: 4px 6px; }
        td.no-data { text-align: center; color: #888; padding: 8px; }
        /* [MCM0015U統一] 行内「選択」リンク・行内「削除」ボタンは廃止（▶行マーカー＋ツールバー「行削除」に統合）
        .link-btn { background: none; border: none; color: #1a56db; cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }
        .btn-del-sm { padding: 1px 8px; font-size: 11px; } */
        /* ===== MCM0015U 準拠：列幅リサイズ・セル選択 ===== */
        .data-grid { table-layout: fixed; }
        .data-grid th, .data-grid td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .data-grid th { position: relative; }
        .data-grid th .col-resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%;
                                     cursor: col-resize; user-select: none; z-index: 6; }
        .data-grid th .col-resizer:hover { background: rgba(69,63,120,.25); }
        body.col-resizing { cursor: col-resize !important; }
        body.col-resizing * { user-select: none !important; }
        .data-grid td { height: 22px; line-height: 22px; vertical-align: middle; }
        .data-grid tbody tr:hover { background: transparent !important; }
        .data-grid tbody tr.selected-row > td { background-color: #bdbdbd !important; }
        /* MCM0015U基準：青背景の必須列も行選択時は行全体と同じグレー */
        .data-grid tbody tr.selected-row > td.col-required,
        .data-grid tbody tr.selected-row > td.col-required .grid-input,
        .data-grid tbody tr.selected-row > td.col-required input,
        .data-grid tbody tr.selected-row > td.col-required select {
            background-color: #bdbdbd !important;
        }
        .data-grid tbody td.cell-selected { background-color: #e0e0e0 !important; outline: 2px solid #7a7a7a; outline-offset: 0; }
        .data-grid tbody td.cell-selected .grid-input { background-color: transparent !important; }
		.data-grid tbody td.cell-error,
		.data-grid tbody tr.selected-row > td.cell-error {
		    background-color: #ffebee !important;
		}

		.data-grid tbody td.cell-error .grid-input,
		.data-grid input.field-error,
		.data-grid select.field-error {
		    background-color: #ffebee !important;
		}
        /* ===== ▶行マーカー列（MCM0015U 準拠：旧「選択」ボタン列を置換） ===== */
        .data-grid th.col-select, .data-grid td.col-select {
            width: 22px; min-width: 22px; padding: 0;
            text-align: center; vertical-align: middle;
        }
        .row-marker { display: inline-flex; align-items: center; justify-content: center;
                      width: 14px; height: 18px; font-size: 11px; color: #333; }
        .data-grid tbody tr.row-active .row-marker::before { content: "\25B6"; }
        .data-grid tbody tr[data-id] { cursor: pointer; }
    </style>
    <script th:src="@{/js/mcm-fixed-columns.js}" defer></script>
</head>
<body>

    <div class="header">
        <div class="header-left"></div>
        <div class="header-center"><h1>製造メーカーマスタ（MCM0016U）</h1></div>
        <div class="header-right"><a class="btn-close" id="btnCloseLink" th:href="@{/menu}" href="/mcm/menu">閉じる</a></div>
    </div>

    <!-- MCM0017U 準拠：タイトル直下の赤枠メッセージは表示せず、ダイアログへ統一 -->
    <div id="serverMessageData" hidden
         th:attr="data-error=${error},data-errors=${errors != null ? #strings.listJoin(errors, ' / ') : ''}"></div>

    <!-- 行選択・行削除用の隠しフォーム（updateForm の入れ子を避けるため外に配置） -->
    <!-- 【変換元】DataGridView1_SelectionChanged — 行選択POST用 -->
	<form id="selectMakerForm" th:action="@{/mcm0016u/selectSeizomaker}" method="post" style="display:none;">
	    <!-- ★初期表示時点で選択されているメーカーIDをJS側の追跡用フィールドにも反映する。
	         従来は空のままだったため、画面を開いて最初に別メーカーへ切り替えた際、
	         captureCurrentKoseiRows()の対象キーが特定できず、
	         最初に表示されていたメーカーの保守会社編集内容がキャッシュされない不具合があった。 -->
	    <input type="hidden" id="selectMakerId" name="selectedSeizomakerId" th:value="${form.selectedSeizomakerId}"/>
	</form>
    <!-- 【変換元】MCM_MA_SEIZOMAKERRowDeleteButton — 行削除POST用 -->
    <form id="deleteMakerForm" th:action="@{/mcm0016u/deleteSeizomakerRow}" method="post" style="display:none;">
        <input type="hidden" id="deleteMakerId" name="seizomakerId"/>
    </form>
    <!-- 【変換元】MCM_MA_SEIZOMAKER_KOSEIRowDeleteButton — 行削除POST用 -->
    <form id="deleteKoseiForm" th:action="@{/mcm0016u/deleteKoseiRow}" method="post" style="display:none;">
        <input type="hidden" id="deleteKoseiId" name="seizomakerkoseiId"/>
    </form>

    <!-- ▼ updateForm：2グリッド＋登録ボタンを包む（【変換元】UpdateButton_Click） -->
    <form id="updateForm" th:action="@{/mcm0016u/update}" method="post">
        <input type="hidden" name="selectedSeizomakerId" th:value="${form.selectedSeizomakerId}"/>

    <!-- ================================================================ -->
    <!-- Section 1: 製造メーカー（DataGridView1）                          -->
    <!-- ================================================================ -->
    <div class="section">
        <div class="section-header">
            <!-- 【変換元】MCM_MA_SEIZOMAKERRowDeleteButton（行内ボタン → ツールバーに統合） -->
            <div class="toolbar">
                <button type="button" id="btnDeleteMaker" class="btn btn-danger">行削除</button>
            </div>
        </div>

        <div class="grid-container grid-scroll-parent">
            <table id="makerTable" data-mcm-fixed-columns="4" class="data-grid" style="visibility:hidden;">
                <colgroup>
                    <col style="width:22px;"/>
                    <col style="width:40px;"/>
                    <col style="width:60px;"/>
                    <col style="width:190px;"/>
                    <col style="width:400px;"/>
                    <col style="width:115px;"/>
                    <col style="width:70px;"/>
                    <col style="width:115px;"/>
                    <col style="width:70px;"/>
                </colgroup>
                <thead>
                    <tr>
                        <th class="col-select"></th>
                        <th class="col-required">No</th>
                        <th>無効</th>
                        <th class="col-required">製造メーカー</th>
                        <th>備考</th>
                        <th class="col-readonly">登録日時</th>
                        <th class="col-readonly">登録者</th>
                        <th class="col-readonly">更新日時</th>
                        <th class="col-readonly">更新者</th>
                    </tr>
                </thead>
                <tbody id="gridBody">
                    <tr th:each="row, stat : ${makerList}"
                        th:attr="data-id=${row.seizomakerId}"
                        th:classappend="${form.selectedSeizomakerId != null and row.seizomakerId.longValue() == form.selectedSeizomakerId} ? 'row-active' : ''">
                        <!-- ▶行マーカー＋行キー hidden（MCM0015U 準拠：旧「選択」ボタン列を置換） -->
                        <td class="col-select">
                            <span class="row-marker" aria-hidden="true"></span>
                            <input type="hidden" class="row-status-input"
                                   th:name="|seizomakerRows[${stat.index}].rowStatus|" value="unchanged"/>
                            <input type="hidden"
                                   th:name="|seizomakerRows[${stat.index}].seizomakerId|"
                                   th:value="${row.seizomakerId}"/>
                        </td>
                        <!-- No -->
                        <!-- MCM0015U準拠：HYOJIJUN(表示順)を編集可能なNo項目として表示する。
                             新規行選択時は自動採番(data-auto-no)し、未入力のまま離れると消える。 -->
                        <td class="right col-no col-required">
                            <input type="text" class="grid-input input-right no-spin"
                                   th:name="|seizomakerRows[${stat.index}].hyojijun|"
                                   th:value="${row.hyojijun}" readonly/>
                        </td>
                        <!-- 無効フラグ -->
                        <!-- 【変換元】YUKO_FLG — チェック=無効("0") / 未チェック=有効("1") -->
                        <td class="center">
                            <input type="checkbox" class="yuko-check"
                                   th:checked="${row.yukoFlg != null and row.yukoFlg.intValue() == 1}"/>
                            <input type="hidden" class="yuko-hidden"
                                   th:name="|seizomakerRows[${stat.index}].yukoFlg|"
                                   th:value="${row.yukoFlg != null and row.yukoFlg.intValue() == 1} ? '1' : '0'"/>
                        </td>
                        <!-- 製造メーカー名 -->
                        <td class="col-required">
                            <input type="text" class="grid-input input-left maker-nk"
                                   th:name="|seizomakerRows[${stat.index}].seizomakerNk|"
                                   th:value="${row.seizomakerNk}" readonly/>
                        </td>
                        <!-- 備考 -->
                        <td>
                            <input type="text" class="grid-input input-left"
                                   th:name="|seizomakerRows[${stat.index}].biko|"
                                   th:value="${row.biko == null or row.biko == '&lt;&lt;NULL&gt;&gt;' or row.biko == '＜＜NULL＞＞' or row.biko == '« NULL »' or row.biko == '«NULL»' ? '' : row.biko}" readonly/>
                        </td>
                        <!-- 監査列（参照のみ） -->
                        <td class="center col-readonly" th:text="${row.createdDt}"></td>
                        <td class="col-readonly" th:text="${row.createdBy}"></td>
                        <td class="center col-readonly" th:text="${row.lastupdateDt}"></td>
                        <td class="col-readonly" th:text="${row.lastupdateBy}"></td>
                    </tr>
                    <!-- 新規追加用の空行（MCM0015U 準拠 blank-row） -->
                    <tr class="blank-row" th:with="bi=${makerList != null} ? ${#lists.size(makerList)} : 0">
                        <td class="col-select">
                            <span class="row-marker" aria-hidden="true"></span>
                            <input type="hidden" class="row-status-input"
                                   th:name="|seizomakerRows[${bi}].rowStatus|" value="unchanged"/>
                        </td>
                        <td class="right col-no col-required">

    <!-- 確認用ダイアログ（? アイコン・OK/キャンセル） -->

                        <circle cx="16" cy="9" r="2" fill="#ffffff"/>
                        <rect x="14" y="13" width="4" height="11" rx="1" fill="#ffffff"/>
                    </svg>
                </span>

            </div>
            <div class="mini-dialog-foot"><button type="button" id="miniDialogOk">OK</button></div>
        </div>
