<!DOCTYPE html>
<!--
  【変換元】Mcm0018uScreen.Designer.vb / Mcm0018uScreen.vb
  MCM0018U — 取扱機器マスタ（取扱機器 / 取引先 の2グリッド）
  【レイアウト】MCM0015U（ブランドマスタ）に統一
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM0018U - 取扱機器マスタ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../css/common.css"/>
    <link rel="stylesheet" th:href="@{/css/mcm0018u.css}" href="../css/mcm0018u.css"/>
    <link rel="stylesheet" th:href="@{/css/custom-dialog.css}" href="../css/custom-dialog.css"/>
    <script th:src="@{/js/common.js}"></script>

    <style>
        /* ===== MCM0015U 準拠 共通レイアウト ===== */
        .header, .toolbar, .form-actions, button, .btn, .btn-close,
        .mini-dialog, .custom-dialog {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        button, .btn, .btn-close { cursor: pointer; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px; box-sizing: border-box;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 {
            margin: 0; font-size: 18px; font-weight: bold; color: #fff;
            letter-spacing: 2px; line-height: 30px;
        }
        .header .header-left, .header .header-right { display: flex; align-items: center; }

        .grid-container {
            height: calc(100vh - 250px);
            overflow-y: auto; overflow-x: auto;
            border: 1px solid #d5dbdb; position: relative;
        }
        .data-grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
        .data-grid thead th {
            position: -webkit-sticky; position: sticky; top: 0; z-index: 5;
            background-color: #eef2f5;
            box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5;
            text-align: left;
        }
        .data-grid th, .data-grid td {
            border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb; padding: 4px 6px;
        }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }

        .data-grid thead th,
        .data-grid td.col-select,
        .data-grid td.col-readonly, .data-grid td.readonly {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            cursor: default;
        }
        .data-grid td { padding: 0; }
        .data-grid thead th { padding: 4px 6px; }
        .data-grid td.col-readonly { padding: 4px 6px; }
        .data-grid .grid-input {
            box-sizing: border-box; width: 100%;
            height: 100%; min-height: 26px;
            border: none; margin: 0; padding: 3px 6px;
            background: transparent;
        }
        .data-grid .grid-input:focus { outline: 1px solid #7eb4ea; outline-offset: -1px; }
        .data-grid td.col-select { padding: 2px; }
        .data-grid .input-right { text-align: right; }
        .data-grid .input-left  { text-align: left; }
        .data-grid .col-select { text-align: center; }

        .data-grid td.col-readonly {
            background-color: #d9d9d9; color: #333; font-size: 11px; white-space: nowrap;
        }
        .data-grid tr.row-deleted td {
            background-color: #fadbd8 !important; text-decoration: line-through; opacity: 0.6;
        }

        .data-grid thead th.col-required { color: #d32f2f; }
        .data-grid td.col-required { background-color: #e3f2fd; }
        .data-grid td.col-required .grid-input { background-color: #e3f2fd; }

        .data-grid .row-select-label { display: block; width: 100%; height: 100%; cursor: pointer; line-height: 1.6; }
        .data-grid .row-select { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
        .data-grid .row-marker::before { content: ""; display: inline-block; min-width: 1em; }
        .data-grid tr.row-active .row-marker::before { content: "\25B6"; color: #000000; font-size: 13px; }

        .data-grid tr.row-selected td { background-color: #bdbdbd !important; }
        .data-grid tr.row-selected td .grid-input { background-color: #bdbdbd !important; }

        /* 必須未入力の強調。input は直接、select はセル(td)側に赤背景を付ける。
           select に appearance:none を使うと ▼ が消えてしまうため使わない。 */
        .data-grid input.field-error { outline: 2px solid #d32f2f; background-color: #ffebee !important; }
        .data-grid select.field-error { outline: 2px solid #d32f2f; background-color: transparent; }
        .data-grid td.cell-error { background-color: #ffebee !important; }

        .data-grid input[type="number"]::-webkit-outer-spin-button,
        .data-grid input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .data-grid input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        /* ========== 横スクロール固定列（#155） ========== */
        /* atsukaikikiGrid: 選択列(22px), No(50px), 無効(54px), 製造メーカー(130px), 取扱機器名(178px), 型式(170px) */
        #atsukaikikiGrid th:nth-child(1), #atsukaikikiGrid td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px);   z-index: 3; background: #fff; overflow: hidden; }
        #atsukaikikiGrid th:nth-child(2), #atsukaikikiGrid td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 22px);  z-index: 3; background: #fff; overflow: hidden; }
        #atsukaikikiGrid th:nth-child(3), #atsukaikikiGrid td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 72px);  z-index: 3; background: #fff; overflow: hidden; }
        #atsukaikikiGrid th:nth-child(4), #atsukaikikiGrid td:nth-of-type(4) { position: sticky; left: var(--mcm-fixed-left-4, 126px); z-index: 3; background: #fff; overflow: hidden; }
        #atsukaikikiGrid th:nth-child(5), #atsukaikikiGrid td:nth-of-type(5) { position: sticky; left: var(--mcm-fixed-left-5, 256px); z-index: 3; background: #fff; overflow: hidden; }
        #atsukaikikiGrid th:nth-child(6), #atsukaikikiGrid td:nth-of-type(6) { position: sticky; left: var(--mcm-fixed-left-6, 434px); z-index: 3; background: #fff; overflow: hidden; box-shadow: 2px 0 0 rgba(0,0,0,.08); }
        #atsukaikikiGrid thead th:nth-child(1),
        #atsukaikikiGrid thead th:nth-child(2),
        #atsukaikikiGrid thead th:nth-child(3),
        #atsukaikikiGrid thead th:nth-child(4),
        #atsukaikikiGrid thead th:nth-child(5),
        #atsukaikikiGrid thead th:nth-child(6) { z-index: 20; background: #eef2f5; }

        /* koseiGrid: 選択列(22px), No(50px), 取引先(250px) */
        #koseiGrid th:nth-child(1), #koseiGrid td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px);  z-index: 3; background: #fff; overflow: hidden; }
        #koseiGrid th:nth-child(2), #koseiGrid td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 22px); z-index: 3; background: #fff; overflow: hidden; }
        #koseiGrid th:nth-child(3), #koseiGrid td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 72px); z-index: 3; background: #fff; overflow: hidden; box-shadow: 2px 0 0 rgba(0,0,0,.08); }
        #koseiGrid thead th:nth-child(1),
        #koseiGrid thead th:nth-child(2),
        #koseiGrid thead th:nth-child(3) { z-index: 20; background: #eef2f5; }

        /* 必須項目の背景色を固定列でも維持 */
        #atsukaikikiGrid td:nth-of-type(2), #atsukaikikiGrid td:nth-of-type(4), #atsukaikikiGrid td:nth-of-type(5),
        #koseiGrid td:nth-of-type(2), #koseiGrid td:nth-of-type(3) { background-color: #e3f2fd; }

        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            text-decoration: none; background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; cursor: pointer; line-height: 1.6;
        }
        .btn-close:hover  { background-color: #e5f1fb; border-color: #7eb4ea; }
        .btn-close:active { background-color: #cce4f7; border-color: #569de5; }

        .toolbar { display: flex !important; justify-content: flex-end !important; gap: 6px; }

        .mini-dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .mini-dialog {
            background: #fbfbfb; min-width: 300px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #ffffff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; font-weight: normal; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; line-height: 1;
            color: #444; cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 16px; background: #fbfbfb; white-space: pre-line;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; }
        .mini-dialog-body .mini-msg { color: #000000; font-size: 13px; }
        .mini-dialog-foot { padding: 10px 16px 14px; text-align: right; background: #fbfbfb; }
        .mini-dialog-foot button {
            min-width: 84px; padding: 5px 12px; font-size: 12px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button:focus { outline: 1px solid #0078d4; outline-offset: 1px; }
        /* #155: 削除行も不透明にし、背後のスクロール列を隠す。削除色と取消線は維持。 */
        table.data-grid[data-mcm-fixed-columns] tr.row-deleted,
        table.data-grid[data-mcm-fixed-columns] tr.row-deleted td { opacity: 1; }
    </style>
    <style>
        /* 2グリッド構成（MCM0018U 固有） */
        .section { margin: 0 0 6px 0; }
        .section-header { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
        .section-header .grid-title { font-size: 13px; font-weight: bold; color: #333; }
        .section-header .toolbar { margin-left: auto; padding: 0; }
        .grid-scroll-parent { height: calc(42vh - 60px); }
        .grid-scroll-child  { height: calc(32vh - 40px); }
        .data-grid td.readonly { background: #d9d9d9; color: #333; } /* [MCM0015U統一] 登録日時/登録者/更新日時/更新者の灰色背景を #d9d9d9 に復元（#f5f5f5では灰色に見えないため） */
        /* 検索エリア（MCM0018U 固有） */
        .search-area {
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            padding: 6px 8px; background: #f7f7f7; border-bottom: 1px solid #d1d5db;
        }
        .search-area label { font-size: 12px; color: #333; }
        .search-area .required-label { background: transparent; color: #333; padding: 1px 4px; } /* [MCM0015U統一] 薄黄色の必須背景と赤文字を除去 */
        .search-area .combo-search, .search-area .input-search {
            height: 22px; box-sizing: border-box; line-height: 18px; vertical-align: middle; margin: 0; font-size: 12px; padding: 1px 4px;
            border: 1px solid #b5b5b5; border-radius: 2px;
        }
        .search-area .input-search { width: 220px; }
        .search-area .combo-search { min-width: 160px; }
        .search-area .combo-search#searchKikibunruiId { width: 320px; min-width: 320px; } /* [調整] 機器分類のみ横幅を2倍(160px→320px) */
        .search-area .btn-search { margin-left: auto; } /* [調整] 検索ボタンを右端に配置 */
        /* JS(mcm0018u.js)が参照するクラス名は維持。selected-row / new-row の配色は下部で一元定義 */
        /* ===== MCM0015U 準拠：▶列・列幅リサイズ・2クリック編集 ===== */
        .data-grid { table-layout: fixed; }
        .data-grid th, .data-grid td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .data-grid th.col-select, .data-grid td.col-select { width: 22px; min-width: 22px; text-align: center; vertical-align: middle; padding: 0; }
        .data-grid .row-marker { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 18px; line-height: 18px; }
        .data-grid .row-marker::before { content: ""; display: inline-block; width: 14px; min-width: 14px; text-align: center; }
        .data-grid tr.row-active .row-marker::before { content: "\25B6"; color: #000; font-size: 13px; line-height: 18px; }
        /* 列幅リサイザ */
        .data-grid th { position: relative; }
        .data-grid th .col-resizer { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; user-select: none; z-index: 6; }
        .data-grid th .col-resizer:hover { background: rgba(69,63,120,.25); }
        body.col-resizing { cursor: col-resize !important; }
        body.col-resizing * { user-select: none !important; }
        /* セル選択（2クリック編集） */
        /* cell-selected の配色は下部（行選択との排他ルール）で一元定義 */
        .data-grid td.cell-selected .edit-input { background-color: transparent !important; }
        /* .edit-input は MCM0015U の .grid-input と同じ枠なし・セル全面表示に揃える */
        .data-grid tbody td:not(.readonly):not(.col-select) { padding: 0; }
        .data-grid td { height: 22px; line-height: 22px; vertical-align: middle; }
        .data-grid .edit-input, .data-grid select.edit-input {
            box-sizing: border-box; display: block; width: 100% !important;
            min-height: 22px; height: 22px; line-height: 22px;
            border: none !important; margin: 0; padding: 0 4px; background: transparent;
        }
        .data-grid .edit-input:focus { outline: none; box-shadow: inset 0 0 0 1px #7eb4ea; }
        .data-grid .edit-input[readonly] { caret-color: transparent; cursor: default; }
        .data-grid .text-right { text-align: right; }
        .data-grid input[type="number"]::-webkit-outer-spin-button,
        .data-grid input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .data-grid input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
        /* チェックボックス列は中央寄せ */
        .data-grid td.col-check, .data-grid td.col-ctrl-check,
        .data-grid td.col-mitsumori, .data-grid td.col-dummy,
        .data-grid td.col-hosyu-check { text-align: center; vertical-align: middle; padding: 0; line-height: 22px; }
        .data-grid td.col-check input[type="checkbox"], .data-grid td.col-ctrl-check input[type="checkbox"],
        .data-grid td.col-mitsumori input[type="checkbox"], .data-grid td.col-dummy input[type="checkbox"],
        .data-grid td.col-hosyu-check input[type="checkbox"] { margin: 0; vertical-align: middle; float: none; display: inline-block; }
        /* 行選択グレー（▶列クリック時のみ）とセル選択グレー（セルクリック時のみ）は排他 */
        .data-grid tbody tr:hover { background: transparent !important; }
        .data-grid tbody tr:hover > td { background: none; } /* [修正] hover時は td 自身の背景指定を活かす（inherit だと親の白で塗り潰され readonly灰色・必須水色が消える） */
        /* 行選択：行全体を灰色 */
        .data-grid tbody tr.selected-row > td { background-color: #bdbdbd !important; }
        /* 新規行の背景（行選択より弱い） */
        .data-grid tbody tr.new-row > td { background-color: #fff; } /* [MCM0015U統一] 新規行の薄黄色(#fffdf0)を白に変更 */
        /* ===== 必須項目セル背景（MCM0015U準拠 #e3f2fd） 親:No/製造メーカー/取扱機器名/機器分類 子:No/取引先 ===== */
        .data-grid tbody tr > td.col-no, .data-grid tbody tr > td.col-seizomaker, .data-grid tbody tr > td.col-atsukaikiki-nk, .data-grid tbody tr > td.col-kikibunrui, .data-grid tbody tr > td.col-torihikisaki { background-color: #e3f2fd; }
        .data-grid tbody tr > td.col-no .edit-input, .data-grid tbody tr > td.col-seizomaker .edit-input, .data-grid tbody tr > td.col-atsukaikiki-nk .edit-input, .data-grid tbody tr > td.col-kikibunrui .edit-input, .data-grid tbody tr > td.col-torihikisaki .edit-input { background-color: transparent; }
        /* ===== [修正] 背景の優先順位を最終確定（下にあるものほど強い） ===== */
        /* 1) 読取専用列(登録日時/登録者/更新日時/更新者)は常に灰色 #d9d9d9 */
        .data-grid tbody tr > td.col-readonly,
        .data-grid tbody tr > td.readonly { background-color: #d9d9d9 !important; color: #333; }
        /* 2) 行選択(▶列クリック)は行全体を灰色 #bdbdbd。必須水色・readonly灰色より強くする */
        .data-grid tbody tr.selected-row > td,
        .data-grid tbody tr.selected-row > td.readonly,
        .data-grid tbody tr.selected-row > td.col-readonly { background-color: #bdbdbd !important; }
        /* セル選択：そのセルだけ灰色（行選択より優先） */
        .data-grid tbody td.cell-selected { background-color: #bdbdbd !important; outline: 2px solid #7a7a7a; outline-offset: -2px; }
        /* 新規行マーカー * は ▶列に表示（行アクティブ時は ▶ を優先） */
        .data-grid tbody td.cell-error,
        .data-grid tbody tr.selected-row > td.cell-error,
        .data-grid tbody tr.new-row > td.cell-error,
        .data-grid tbody td.cell-error.cell-selected { background-color: #ffebee !important; }
        .data-grid tbody td.cell-error select.edit-input { background: transparent !important; }
        /* [修正] 読取専用列(登録日時/登録者/更新日時/更新者)の罫線を可視化 */
        /*   罫線#d5dbdb と 背景#d9d9d9 が同系色で見えないため、灰色セルのみ一段濃い罫線にする */
        .data-grid tbody tr > td.col-readonly,
        .data-grid tbody tr > td.readonly { border-right: 1px solid #a9b0b0; border-bottom: 1px solid #a9b0b0; }
        .data-grid tbody tr > td.readonly:first-child { border-left: 1px solid #a9b0b0; }
        .data-grid tbody td.cell-error select.field-error { outline: 2px solid #d32f2f; outline-offset: -2px; }
    </style>
    <script th:src="@{/js/mcm-fixed-columns.js}" defer></script>
</head>
<body>

    <div class="header">
        <div class="header-left"></div>
        <div class="header-center"><h1>取扱機器マスタ（MCM0018U）</h1></div>
        <div class="header-right"><a class="btn-close" id="btnCloseLink" th:href="@{/menu}" href="/mcm/menu">閉じる</a></div>
    </div>

    <!-- サーバから受信したメッセージをJSでカスタムモーダル表示するためhiddenで保持 -->
    <div id="serverMessages" style="display:none;">
        <div id="serverErrors" th:if="${errors}" th:attr="data-error-type=${errorType != null ? errorType : 'input'}">
            <span th:each="e : ${errors}" class="server-error-item" th:text="${e}"></span>
        </div>
        <div id="serverSuccessMessage" th:if="${message}" th:attr="data-message-type=${messageType != null ? messageType : 'success'}" th:text="${message}"></div>
    </div>

    <!-- 検索フォーム -->
    <!-- ★data-mcm-no-progress: 検索ボタン押下時、common.jsの自動プログレス表示（showProgress）を
         抑止する。未保存の変更がある場合、mcm0018u.js側でe.preventDefault()して確認ダイアログ
         (customConfirm)を表示するが、この属性が無いとcommon.jsのキャプチャフェーズsubmitハンドラが
         先に発火してプログレスオーバーレイ（z-index:2000）を表示してしまい、確認ダイアログ
         （z-index:1000）がその裏に隠れて操作不能に見える不具合があった。 -->
    <form id="searchForm" th:action="@{/mcm0018u/search}" method="post" th:object="${form}" data-mcm-no-progress>
        <input type="hidden" th:field="*{changeStatus}" id="changeStatusField"/>
        <input type="hidden" name="discardConfirmed" id="discardConfirmed" value="false"/>
            <div class="search-area">
                <label class="required-label">製造メーカー:</label>
                <select th:field="*{searchSeizomakerId}" class="combo-search">
                    <option value=""></option>
                    <option th:each="m : ${seizomakerList}" th:value="${m.SEIZOMAKER_ID}" th:text="${m.SEIZOMAKER_NK}"></option>
                </select>
                <label>取扱機器名・型式:</label>
                <input type="text" th:field="*{searchAtsukaikikiKatashiki}" class="input-search"/>
                <label class="required-label">機器分類:</label>
                <select th:field="*{searchKikibunruiId}" class="combo-search">
                    <option value=""></option>
                    <option th:each="k : ${kikibunruiList}" th:value="${k.KIKIBUNRUI_ID}" th:text="${k.KIKIBUNRUI_NK}"></option>
                </select>
                <button type="submit" id="searchBtn" class="btn btn-primary btn-search">検索</button>
            </div>
    </form>

    <script th:src="@{/js/mcm0018u.js}" src="../js/mcm0018u.js"></script>

    <script>
        /* ===== 閉じる（MCM0015U 準拠：変更があるときだけ確認ダイアログ） ===== */
        (function () {
            var link = document.getElementById("btnCloseLink");
            if (!link) return;
            link.addEventListener("click", function (e) {
                var href = link.getAttribute("href");
                /* 変更が無ければ確認せずそのまま遷移（MCM0015U 準拠） */
                var dirty = (typeof window.hasUnsavedChanges === "function") ? window.hasUnsavedChanges() : false;
                if (!dirty) { return; }
                e.preventDefault();
                var MSG = "データが変更されています。破棄されますがよろしいですか？";
                /* 共通の確認ダイアログ（タイトル「確認」＋○に？アイコン）を使う */
                if (typeof window.customConfirmMcm === "function") {
                    window.customConfirmMcm(MSG, function () { window.location.href = href; });
                    return;
                }
                if (window.confirm(MSG)) { window.location.href = href; }
            });
        })();

        /* 行選択(tr.selected-row)／▶マーカー(tr.row-active) の付け替えは
           mcm0018u.js の bindRowSelectByMarker() に一元化した。 */
        /* ===== 列幅調整（リサイズ）機能 / MCM0015U 準拠 ===== */
        function setupColumnResize(tableSel) {
            var table = document.querySelector(tableSel);
            if (!table) return;
            var cols = table.querySelectorAll("colgroup col");
            var ths  = table.querySelectorAll("thead th");
            if (!cols.length || cols.length !== ths.length) { table.style.visibility = "visible"; return; }
            var baseWidths = [];
            for (var i = 0; i < cols.length; i++) {
                baseWidths.push(parseFloat(cols[i].style.width) || 80);
            }
            var LAST = cols.length - 1;
            function applyWidths(ws) {
                var total = 0;
                for (var i = 0; i < cols.length; i++) {
                    cols[i].style.width = ws[i] + "px";
                    total += ws[i];
                }
                table.style.width = total + "px";
            }
            function fitInitial() {
                var ws = baseWidths.slice();
                var total = 0;
                for (var i = 0; i < ws.length; i++) { total += ws[i]; }
                var wrap = table.parentElement;
                var avail = wrap ? wrap.clientWidth : 0;
                if (avail > total) { ws[LAST] += (avail - total); }
                applyWidths(ws);
                table.style.visibility = "visible";
            }
            fitInitial();
            var rt = null;
            window.addEventListener("resize", function () {
                if (rt) { clearTimeout(rt); }
                rt = setTimeout(fitInitial, 100);
            });
            for (var c = 0; c < ths.length; c++) {
                (function (idx) {
                    var th = ths[idx];
                    if (th.querySelector(".col-resizer")) return;
                    var grip = document.createElement("span");
                    grip.className = "col-resizer";
                    th.appendChild(grip);
                    grip.addEventListener("mousedown", function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var startX = e.clientX;
                        var startW = parseFloat(cols[idx].style.width) || th.offsetWidth;
                        document.body.classList.add("col-resizing");
                        function onMove(ev) {
                            var w = startW + (ev.clientX - startX);
                            if (w < 40) { w = 40; }
                            cols[idx].style.width = w + "px";
                            var total = 0;
                            for (var i = 0; i < cols.length; i++) {
                                total += parseFloat(cols[i].style.width) || 0;
                            }
                            table.style.width = total + "px";
                        }
                        function onUp() {
                            document.body.classList.remove("col-resizing");
                            document.removeEventListener("mousemove", onMove);
                            document.removeEventListener("mouseup", onUp);
                        }
                        document.addEventListener("mousemove", onMove);
                        document.addEventListener("mouseup", onUp);
                    });
                })(c);
            }
        }

        /* ===== 2クリック編集 + Spaceキーチェック / MCM0015U 準拠 =====
         * 既存の clearSel / setActiveRow と名前衝突しないよう IIFE でスコープ分離。
         */
        function setupTwoClickEdit(gridSel) {
            var table = document.querySelector(gridSel);
            if (!table) return;
            var tbody = table.querySelector("tbody");
            if (!tbody) return;
            var selTd = null;
            var editing = null;
            var lastRow = null;    /* 最後に触った行（MCM0015U 準拠） */
			var lastTd = null;

            function isCellTd(td) {
                return td && td.querySelector &&
                    (td.querySelector(".edit-input") || td.querySelector("input[type=checkbox]"));
            }
            /* テキスト入力は既定で readonly。編集開始時のみ解除（矢印キー移動を効かせるため / MCM0015U 準拠） */
            function lockAll() {
                tbody.querySelectorAll("input.edit-input").forEach(function (i) {
                    i.setAttribute("readonly", "readonly");
                });
            }
            function clearCellSel() {
                table.querySelectorAll("td.cell-selected").forEach(function (t) {
                    t.classList.remove("cell-selected");
                });
                selTd = null;
            }
            /* 行選択グレー(tr.selected-row)をこのグリッド内から解除 */
            function clearRowSelected() {
                table.querySelectorAll("tr.selected-row").forEach(function (t) { t.classList.remove("selected-row"); });
            }
            function stopEdit() {
                if (editing) { try { editing.blur(); } catch (ev) { } editing = null; }
                lockAll();
                try { var s = window.getSelection(); if (s) s.removeAllRanges(); } catch (ev) { }
            }
            /* 未入力の必須項目があるときにエラーを表示する共通処理 */
            function showRequiredError(tr) {
                var msg = (typeof window.buildRequiredMsg === "function" && typeof window.getMissingLabelsForRow === "function")
                    ? window.buildRequiredMsg(window.getMissingLabelsForRow(tr))
                    : "未入力の必須項目があります。";
                if (typeof window.customAlertMcm === "function") { window.customAlertMcm(msg, "input"); }
                else { window.alert(msg); }
                var fm = tr.querySelector(".field-error");
                if (fm) { try { fm.removeAttribute("readonly"); fm.focus({ preventScroll: true }); } catch (ev) { } }
            }
            /* 前に触った行に「一部入力あり＆必須未入力」があればエラーを出して移動を止める（MCM0015U 準拠） */
            function guardLeaveRow(nextTr) {
                if (!lastRow || !nextTr || lastRow === nextTr) return true;
                if (!document.body.contains(lastRow)) return true;
                if (typeof window.validateRowRequired !== "function") return true;
                if (window.validateRowRequired(lastRow, true)) return true;
                showRequiredError(lastRow);
                return false;
            }
			/*
			 * ★追加: メーカー保守日セルを離れる（別セルへ移動する）時点で書式チェックを行う。
			 *   既存の guardLeaveRow（No/取引先などの必須項目・行単位）とは別に、
			 *   このセル固有でチェックする。従来はここでチェックされず、登録ボタン押下時
			 *   まで不正な書式が検知されなかった（チケット記載の不具合の原因）。
			 */
			function guardLeaveMakerHosyuDateCell(nextTd) {
			    if (!lastTd || lastTd === nextTd || !document.body.contains(lastTd)) return true;
			    if (!lastTd.classList.contains("col-maker-dt")) return true;
			    if (typeof window.validateMakerHosyuDateForRow !== "function") return true;
			    return window.validateMakerHosyuDateForRow(lastTd.closest("tr"), true);
			}
			
			function selectTd(td) {
			    if (!td) return;
			    var tr = td.closest("tr");
			    /* 新規行を編集した状態で他のセルへ移った場合は必須チェックエラー */
			    if (!guardLeaveRow(tr)) return;
			    /* ★追加: メーカー保守日セルを離れる場合の書式チェック */
			    if (!guardLeaveMakerHosyuDateCell(td)) return;
			    clearRowSelected();
			    stopEdit();
			    clearCellSel();
			    selTd = td;
			    td.classList.add("cell-selected");
			    /* 前に触った新規行が「No以外空」なら自動採番した No を消す（MCM0015U 準拠） */
			    if (lastRow && lastRow !== tr && typeof clearAutoNoIfUntouched === "function") { clearAutoNoIfUntouched(lastRow); }
			    lastRow = tr;
			    lastTd = td;
			    /* 新規行を選択したら前行 No + 1 を自動採番（MCM0015U 準拠） */
			    if (typeof assignNoForRow === "function") { assignNoForRow(tr); }
			    if (tr && typeof setActiveRow === "function") { setActiveRow(tr); }
			    var f = td.querySelector(".edit-input") || td.querySelector("input[type=checkbox]");
			    if (f) { try { f.focus({ preventScroll: true }); } catch (ev) { f.focus(); } }
			}
            /* 編集開始。typedChar があればその文字で上書き開始 */
			function startEdit(td, typedChar) {
			    if (!td) return;
			    var inp = td.querySelector(".edit-input");
			    var trE = td.closest("tr");
			    /* 新規行を編集した状態で他の行を触った場合は必須チェックエラー（MCM0015U 準拠） */
			    if (!guardLeaveRow(trE)) return;
			    /* ★追加: メーカー保守日セルを離れる場合の書式チェック */
			    if (!guardLeaveMakerHosyuDateCell(td)) return;
			    if (!inp || inp.disabled) return;
			    if (lastRow && lastRow !== trE && typeof clearAutoNoIfUntouched === "function") { clearAutoNoIfUntouched(lastRow); }
			    lastRow = trE;   /* 編集した行を記録（MCM0015U 準拠） */
			    lastTd = td;
			    clearRowSelected();
			    clearCellSel();
                /* MCM0015U 準拠: 編集開始時はセル選択グレーを付けない（clearCellSel のみ） */
                if (inp.tagName === "SELECT") {
                    editing = inp;
                    try { inp.focus({ preventScroll: true }); } catch (ev) { inp.focus(); }
                    return;
                }
                inp.removeAttribute("readonly");
                editing = inp;
                if (typedChar != null) {
                    inp.value = typedChar;
                    try { inp.dispatchEvent(new Event("input", { bubbles: true })); } catch (ev) { }
                }
                setTimeout(function () {
                    try { inp.focus({ preventScroll: true }); } catch (ev) { inp.focus(); }
                    if (typedChar != null) {
                        var L = inp.value.length;
                        try { inp.setSelectionRange(L, L); } catch (ev) { }
                    } else {
                        try { inp.select(); } catch (ev) { }
                    }
                }, 0);
            }

            lockAll();

            /* === ROW-DESELECT-GUARD / MCM0015U 準拠 ===
             * 「行選択グレー(tr.selected-row)」と「セル選択グレー(td.cell-selected)」を排他にする。
             * ・最左の▶列(td.col-select)以外を押した → 行選択グレーを解除
             * ・▶列 または 入力欄を持たないセル(readonly列等)を押した → セル選択グレーを解除
             * キャプチャフェーズなので 2クリック編集の mousedown や bindRowSelect より先に走る。
             */
            function deselectRowOnOtherClick(e) {
                var t = e.target;
                if (!t || typeof t.closest !== "function") return;
                var mk = t.closest("td.col-select");
                var onMarker = !!mk;
                /* [修正] ▶列を押した時は行選択グレーを確実に付与（capture段階で確定） */
                if (onMarker) {
                    var trMk = mk.closest("tr");
                    if (trMk) { clearRowSelected(); trMk.classList.add("selected-row"); }
                } else {
                    clearRowSelected();
                }
                if (onMarker || !(t.closest(".edit-input") || t.closest("input[type=checkbox]"))) {
                    stopEdit();
                    clearCellSel();
                }
            }
            table.addEventListener("mousedown", deselectRowOnOtherClick, true);
            table.addEventListener("click", deselectRowOnOtherClick, true);
            /* === /ROW-DESELECT-GUARD === */

            table.addEventListener("mousedown", function (e) {
                var inp = e.target.closest(".edit-input") || e.target.closest("input[type=checkbox]");
                if (!inp) return;
                var td = inp.closest("td");
                if (!isCellTd(td)) return;
                if (inp === editing) return;
                if (inp.type === "checkbox") {
                    e.preventDefault();
                    selectTd(td);
                    return;
                }
                if (td === selTd) { startEdit(td); }
                else { e.preventDefault(); selectTd(td); }
            });

            table.addEventListener("keydown", function (e) {
                if (editing) {
                    if (e.key === "Escape") { var te = editing.closest("td"); stopEdit(); selectTd(te); return; }
                    if (e.key === "Enter") {
                        var t2 = editing.closest("td");
                        var ci2 = Array.prototype.indexOf.call(t2.parentElement.children, t2);
                        stopEdit();
                        var nr2 = t2.parentElement.nextElementSibling;
                        while (nr2 && !isCellTd(nr2.children[ci2])) nr2 = nr2.nextElementSibling;
                        if (nr2) { selectTd(nr2.children[ci2]); nr2.children[ci2].scrollIntoView({ block: "nearest", inline: "nearest" }); }
                        else { selectTd(t2); }
                        e.preventDefault();
                    }
                    return;
                }
                if (!selTd) return;
                var tr = selTd.parentElement;
                var tds = Array.prototype.slice.call(tr.children);
                var ci = tds.indexOf(selTd);
                var target = null;
                if (e.key === "ArrowDown") { var nr = tr.nextElementSibling; while (nr && !isCellTd(nr.children[ci])) nr = nr.nextElementSibling; if (nr) target = nr.children[ci]; }
                else if (e.key === "ArrowUp") { var pr = tr.previousElementSibling; while (pr && !isCellTd(pr.children[ci])) pr = pr.previousElementSibling; if (pr) target = pr.children[ci]; }
                else if (e.key === "ArrowRight") { for (var j = ci + 1; j < tds.length; j++) { if (isCellTd(tds[j])) { target = tds[j]; break; } } }
                else if (e.key === "ArrowLeft") { for (var k = ci - 1; k >= 0; k--) { if (isCellTd(tds[k])) { target = tds[k]; break; } } }
                /* チェックボックスセル：SpaceでON/OFF（Excel準拠）／文字入力・編集開始は無効 */
                var chk = selTd.querySelector("input[type=checkbox]");
                if (chk) {
                    if (e.key === " " || e.key === "Spacebar" || e.code === "Space") {
                        e.preventDefault();
                        if (chk.disabled) return;
                        chk.checked = !chk.checked;
                        try { chk.dispatchEvent(new Event("change", { bubbles: true })); } catch (ev) { }
                        return;
                    }
                    if (!target && (e.key === "Enter" || e.key === "F2" || e.key === "Backspace" ||
                        e.key === "Delete" ||
                        (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey))) {
                        e.preventDefault();
                        return;
                    }
                }
                if (!target) {
                    if (e.key === "Enter" || e.key === "F2") { startEdit(selTd); e.preventDefault(); return; }
                    if (e.key === "Backspace" || e.key === "Delete") { startEdit(selTd, ""); e.preventDefault(); return; }
                    if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { startEdit(selTd, e.key); e.preventDefault(); return; }
                }
                if (target) { e.preventDefault(); selectTd(target); target.scrollIntoView({ block: "nearest", inline: "nearest" }); }
            });
        }

        /* ===== MCM0015U 準拠機能の初期化（列幅リサイズ / 2クリック編集 / Space） ===== */
        document.addEventListener("DOMContentLoaded", function () {
            setupColumnResize("#atsukaikikiGrid");
            setupColumnResize("#koseiGrid");
            setupTwoClickEdit("#atsukaikikiGrid");
            setupTwoClickEdit("#koseiGrid");
        });
		
		/*
		 * ★追加: No欄（.hyojijun-input）は半角数字（0-9）以外を入力自体できないようにする。
		 *   type="number"→type="text"への変更だけでも通常のキーボード入力での
		 *   "e"/"+"/"-"/"."の混入は防げるが、貼り付け・ドラッグ&ドロップ・IME確定後の
		 *   入力はブラウザ標準の入力制限を経由しないため、input イベントで
		 *   半角数字以外を即時除去することで確実にブロックする（他画面のNo欄と同じ方針）。
		 */
		document.addEventListener("input", function (e) {
		    if (e.target && e.target.classList && e.target.classList.contains("hyojijun-input")) {
		        var filtered = e.target.value.replace(/[^0-9]/g, "");
		        if (filtered !== e.target.value) e.target.value = filtered;
		    }
		});
		
		(function setupMakerHosyuDateCheck() {
		    var MAKER_DT_MSG = "メーカ保守日はyyyy/MM/ddの書式で入力してください。";

		    /* 2桁までの年を4桁へ補完（1~49→2000年代 / 50~99→1900年代）。補完不可・0 は null。 */
		    function expandShortYear(yStr) {
		        var n = parseInt(yStr, 10);
		        if (isNaN(n)) return null;
		        if (n >= 1 && n <= 49) return 2000 + n;
		        if (n >= 50 && n <= 99) return 1900 + n;
		        return null;
		    }

		    /* 正規化。成功: "yyyy/MM/dd" / 空欄: "" / 失敗（書式・範囲・実在チェックNG）: null */
		    function normalizeMakerDate(raw) {
		        if (raw == null) return "";
		        var v = String(raw).trim();
		        if (v === "") return "";
		        /* 区切りは "/" のみ。数字の羅列や桁数過不足はここで弾かれる。 */
		        var m = v.match(/^(\d{1,4})\/(\d{1,2})\/(\d{1,2})$/);
		        if (!m) return null;
		        var year;
		        if (m[1].length <= 2) {
		            year = expandShortYear(m[1]);
		            if (year == null) return null;
		        } else {
		            year = parseInt(m[1], 10);
		        }
		        var month = parseInt(m[2], 10);
		        var day = parseInt(m[3], 10);
		        /* 範囲: 年 1~9999 / 月 1~12 / 日 1~31 */
		        if (year < 1 || year > 9999) return null;
		        if (month < 1 || month > 12) return null;
		        if (day < 1 || day > 31) return null;
		        /* 実在日付チェック（2025/02/31 等を弾く） */
		        var dt = new Date(year, month - 1, day);
		        if (dt.getFullYear() !== year || dt.getMonth() !== (month - 1) || dt.getDate() !== day) return null;
		        /* ゼロ埋め yyyy/MM/dd */
		        var ys = ("000" + year).slice(-4);
		        var ms = ("0" + month).slice(-2);
		        var ds = ("0" + day).slice(-2);
		        return ys + "/" + ms + "/" + ds;
		    }

		    function makerDateInputs() {
		        return document.querySelectorAll("#koseiTbody td.col-maker-dt input.edit-input");
		    }
			
			/*
			 * ★追加: 指定した行(tr)内のメーカー保守日セルを検証する。
			 *   setupTwoClickEdit() の guardLeaveMakerHosyuDateCell() から呼び出される。
			 *   不正な場合は field-error（入力欄）に加えて cell-error（セル）も付与し、
			 *   cell-selected 等の他の状態と背景色が競合しても確実に薄い赤色になるようにする。
			 */
			 window.validateMakerHosyuDateForRow = function (tr, markError) {
			     if (!tr) return true;
			     var inp = tr.querySelector("td.col-maker-dt input.edit-input");
			     if (!inp) return true;
			     var td = inp.closest("td");
			     var norm = normalizeMakerDate(inp.value);
			     if (norm === null) {
			         if (markError) {
			             /*
			              * ★Enter／矢印キーでは発生せず、マウスクリックでのみ発生する現象のため、
			              *   原因は「mousedownの直後に別イベントとして発生するclickイベント」の
			              *   処理（table への click キャプチャリスナー等）が、requestAnimationFrame
			              *   による再付与よりも後のタイミングでクラスへ影響している可能性が高い。
			              *   同期処理・rAFに加え、setTimeout(...,0)（mousedown/mouseup/click一連の
			              *   同期処理がすべて完了した後に実行されるマクロタスク）でも再付与し、
			              *   さらにミニダイアログ自身がOKボタンへ自動フォーカスする際（100ms後）の
			              *   フォーカス移動による影響も考慮し、それより後のタイミングでも
			              *   念のため再付与する（多重の安全策）。
			              */
			             var applyMakerDtError = function () {
			                 if (!document.body.contains(inp)) return;
			                 if (inp.classList) inp.classList.add("field-error");
			                 if (td) td.classList.add("cell-error");
			             };
			             applyMakerDtError();
			             requestAnimationFrame(applyMakerDtError);
			             setTimeout(applyMakerDtError, 0);
			             setTimeout(applyMakerDtError, 200);
			             if (typeof window.customAlertMcm === "function") { window.customAlertMcm(MAKER_DT_MSG, "input"); }
			             else { window.alert(MAKER_DT_MSG); }
			         }
			         return false;
			     }
			     if (inp.classList) inp.classList.remove("field-error");
			     if (td) td.classList.remove("cell-error");
			     if (norm !== inp.value) {
			         inp.value = norm;
			         try { inp.dispatchEvent(new Event("change", { bubbles: true })); } catch (ev) { }
			     }
			     return true;
			 };

		    /* セルを離れたとき（blur）に、正しい書式なら自動変換する。 */
		    document.addEventListener("blur", function (e) {
		        var inp = e.target;
		        if (!inp || typeof inp.closest !== "function") return;
		        var td = inp.closest("td.col-maker-dt");
		        if (!td) return;
		        var norm = normalizeMakerDate(inp.value);
		        if (norm !== null && norm !== inp.value) {
		            inp.value = norm;
		            try { inp.dispatchEvent(new Event("change", { bubbles: true })); } catch (ev) { }
		        }
		    }, true);

			/* 登録前チェック（document キャプチャ段階で先行）。不正書式があれば登録を止める。 */
			document.addEventListener("click", function (e) {
			    var btn = (e.target && typeof e.target.closest === "function") ? e.target.closest("#btnUpdate") : null;
			    if (!btn) return;
			    var invalid = null;
			    makerDateInputs().forEach(function (inp) {
			        if (invalid) return;
			        if (inp.classList) inp.classList.remove("field-error");
			        var td0 = inp.closest("td");
			        if (td0) td0.classList.remove("cell-error");
			        var norm = normalizeMakerDate(inp.value);
			        if (norm === null) { invalid = inp; return; }
			        if (norm !== inp.value) { inp.value = norm; }  /* 有効値はゼロ埋め補完 */
			    });
			    if (invalid) {
			        e.preventDefault();
			        e.stopImmediatePropagation();
			        if (invalid.classList) invalid.classList.add("field-error");
			        var invalidTd = invalid.closest("td");
			        if (invalidTd) invalidTd.classList.add("cell-error");
			        if (typeof window.customAlertMcm === "function") { window.customAlertMcm(MAKER_DT_MSG, "input"); }
			        else { window.alert(MAKER_DT_MSG); }
			        try { invalid.removeAttribute("readonly"); invalid.focus({ preventScroll: true }); } catch (ev) { }
			    }
			}, true);
		})();

    </script>
