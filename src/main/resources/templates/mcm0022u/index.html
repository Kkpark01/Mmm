<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM0022U 店舗マスタ</title>
    <!--
        【変換元】Mcm0022uScreen.Designer.vb
          画面ID: MCM0022U / 画面名: 店舗マスタ
        【レイアウト】MCM0015U（ブランドマスタ）に統一
        【エラー表示】赤帯は出さず、ミニダイアログ（ポップアップ）で表示。
        【今回の修正】必須エラーの括弧内を「未入力の必須項目名」にする（例：店舗略名）。
    -->
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../css/common.css"/>
    <link rel="stylesheet" th:href="@{/css/mcm0022u.css}" href="../css/mcm0022u.css"/>
    <link rel="stylesheet" th:href="@{/css/custom-dialog.css}" href="../css/custom-dialog.css"/>
    <script th:src="@{/js/common.js}"></script>

    <style>
        /* ===== MCM0015U 準拠 共通レイアウト ===== */
        .header, .toolbar, .form-actions, button, .btn, .btn-close,
        .mini-dialog, .custom-dialog {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        button, .btn, .btn-close { cursor: pointer; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px; box-sizing: border-box;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 {
            margin: 0; font-size: 18px; font-weight: bold; color: #fff;
            letter-spacing: 2px; line-height: 30px;
        }
        .header .header-left, .header .header-right { display: flex; align-items: center; }

        .grid-container {
            height: calc(100vh - 250px);
            overflow-y: auto; overflow-x: auto;
            border: 1px solid #d5dbdb; position: relative;
        }
        .data-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; }
        /* ========== 列幅リサイズ（MCM0015U 準拠） ========== */
        .data-grid th .col-resizer {
            position: absolute; top: 0; right: 0; width: 6px; height: 100%;
            cursor: col-resize; user-select: none; z-index: 6;
        }
        .data-grid th .col-resizer:hover { background: rgba(69,63,120,.25); }
        body.col-resizing { cursor: col-resize !important; }
        body.col-resizing * { user-select: none !important; }
        .data-grid td { overflow: hidden; }
        .data-grid th, .data-grid td { box-sizing: border-box; }
        .data-grid thead th {
            position: -webkit-sticky; position: sticky; top: 0; z-index: 5;
            background-color: #eef2f5;
            box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5;
            text-align: left;
        }
        .data-grid th, .data-grid td {
            border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb; padding: 4px 6px;
        }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }

        .data-grid thead th,
        .data-grid td.col-select,
        .data-grid td.col-readonly {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            cursor: default;
        }
        .data-grid td { padding: 0; }
        .data-grid thead th { padding: 4px 6px; }
        .data-grid td.col-readonly { padding: 4px 6px; }
        .data-grid .grid-input {
            box-sizing: border-box; width: 100%;
            height: 100%; min-height: 26px;
            border: none; margin: 0; padding: 3px 6px;
            background: transparent;
        }
        .data-grid .grid-input:focus { outline: 1px solid #7eb4ea; outline-offset: -1px; }
        .data-grid td.col-select { padding: 2px; }
        .data-grid .input-right { text-align: right; }
        .data-grid .input-left  { text-align: left; }
        .data-grid .col-select { text-align: center; }
        .data-grid td.col-checkbox { padding: 2px; text-align: center; }
        .data-grid .col-checkbox { text-align: center; }

        .data-grid td.col-readonly {
            background-color: #d9d9d9; color: #333; font-size: 11px; white-space: nowrap;
        }
        .data-grid tr.row-deleted td {
            background-color: #fadbd8 !important; text-decoration: line-through; opacity: 0.6;
        }

        /* 必須項目：ヘッダー赤字 / セル青背景 */
        .data-grid thead th.col-required { color: #d32f2f; }
        .data-grid td.col-required { background-color: #e3f2fd; }
        .data-grid td.col-required .grid-input { background-color: #e3f2fd; }

        .data-grid .row-select-label { display: block; width: 100%; height: 100%; cursor: pointer; line-height: 1.6; }
        .data-grid .row-select { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
        .data-grid .row-marker::before { content: ""; display: inline-block; min-width: 1em; }
        .data-grid tr.row-active .row-marker::before { content: "\25B6"; color: #000000; font-size: 13px; }

        .data-grid tr.row-selected td { background-color: #bdbdbd !important; }
        .data-grid tr.row-selected td .grid-input { background-color: #bdbdbd !important; }

        .data-grid input.field-error { outline: 2px solid #d32f2f; background-color: #ffebee !important; }
        /* Excel風2クリック編集：選択セル（MCM0015U 準拠） */
        .data-grid td.cell-selected { background-color: #e0e0e0 !important; outline: 2px solid #7a7a7a; outline-offset: -2px; }
        .data-grid td.cell-selected .grid-input { background-color: transparent !important; }

        .data-grid input[type="number"]::-webkit-outer-spin-button,
        .data-grid input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .data-grid input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        /* ========== 横スクロール固定列（#155） ========== */
        /* tenpoGrid: 選択列(30px), No(35px), 無効(55px), 事業所CD(100px) */
        #tenpoGrid th:nth-child(1), #tenpoGrid td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px);   z-index: 3; background: #fff; overflow: hidden; }
        #tenpoGrid th:nth-child(2), #tenpoGrid td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 30px);  z-index: 3; background: #fff; overflow: hidden; }
        #tenpoGrid th:nth-child(3), #tenpoGrid td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 65px);  z-index: 3; background: #fff; overflow: hidden; }
        #tenpoGrid th:nth-child(4), #tenpoGrid td:nth-of-type(4) { position: sticky; left: var(--mcm-fixed-left-4, 120px); z-index: 3; background: #fff; overflow: hidden; box-shadow: 2px 0 0 rgba(0,0,0,.08); }
        #tenpoGrid thead th:nth-child(1),
        #tenpoGrid thead th:nth-child(2),
        #tenpoGrid thead th:nth-child(3),
        #tenpoGrid thead th:nth-child(4) { z-index: 20; background: #eef2f5; }

        /* 必須項目の背景色を固定列でも維持 */
        #tenpoGrid td:nth-of-type(2),
        #tenpoGrid td:nth-of-type(4) { background-color: #e3f2fd; }

        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            text-decoration: none; background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; cursor: pointer; line-height: 1.6;
        }
        .btn-close:hover  { background-color: #e5f1fb; border-color: #7eb4ea; }
        .btn-close:active { background-color: #cce4f7; border-color: #569de5; }

        .toolbar { display: flex !important; justify-content: flex-end !important; gap: 6px; }

        .mini-dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .mini-dialog {
            background: #fbfbfb; min-width: 300px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #ffffff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; font-weight: normal; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; line-height: 1;
            color: #444; cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 16px; background: #fbfbfb; white-space: pre-line;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; }
        .mini-dialog-body .mini-msg { color: #000000; font-size: 13px; }
        .mini-dialog-foot { padding: 10px 16px 14px; text-align: right; background: #fbfbfb; }
        .mini-dialog-foot button {
            min-width: 84px; padding: 5px 12px; font-size: 12px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button:focus { outline: 1px solid #0078d4; outline-offset: 1px; }
        /* #155: 削除行も不透明にし、背後のスクロール列を隠す。削除色と取消線は維持。 */
        table.data-grid[data-mcm-fixed-columns] tr.row-deleted,
        table.data-grid[data-mcm-fixed-columns] tr.row-deleted td { opacity: 1; }
    </style>
    <script th:src="@{/js/mcm-fixed-columns.js}" defer></script>
</head>
<body>

    <div class="header">
        <div class="header-left"></div>
        <div class="header-center"><h1>店舗マスタ（MCM0022U）</h1></div>
        <div class="header-right"><a class="btn-close" id="btnCloseLink" th:href="@{/menu}" href="/mcm/menu">閉じる</a></div>
    </div>

    <!-- 登録完了の緑帯メッセージは表示しない（要望により廃止） -->

    <!-- サーバーからのエラー/警告は非表示で保持し、読み込み時に JS がポップアップ表示する -->
    <div id="serverMessages" style="display:none;">
        <span class="srv-error" th:each="err : ${errors}" th:text="${err}"></span>
        <span class="srv-error" th:if="${error}" th:text="${error}"></span>
        <span class="srv-warn"  th:if="${warn}"  th:text="${warn}"></span>
    </div>

    <!-- データグリッド -->
    <form id="updateForm"
          th:action="@{/mcm0022u/update}"
          th:object="${mcm0022uForm}"
          method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- ツールバー -->
        <div class="toolbar">
            <button type="button" id="btnDeleteRow" class="btn btn-danger">行削除</button>
        </div>

        <div class="grid-container">
            <table id="tenpoGrid" data-mcm-fixed-columns="4" class="data-grid" style="visibility:hidden;">
                <colgroup>
                    <col style="width:30px"/>
                    <col style="width:35px"/>
                    <col style="width:55px"/>
                    <col style="width:100px"/>
                    <col style="width:100px"/>
                    <col style="width:100px"/>
                    <col style="width:100px"/>
                    <col style="width:165px"/>
                    <col style="width:90px"/>
                    <col style="width:200px"/>
                    <col style="width:200px"/>
                    <col style="width:130px"/>
                    <col style="width:70px"/>
                    <col style="width:130px"/>
                    <col style="width:70px"/>
                </colgroup>
                <thead>
                    <tr>
                        <th class="col-select"></th>
                        <th class="col-frozen col-required">No</th>
                        <th class="col-frozen">無効</th>
                        <th class="col-frozen col-required">事業所コード</th>
                        <th>名称1</th>
                        <th>名称2</th>
                        <th>名称3</th>
                        <th class="col-required">事業所名</th>
                        <th>担当者名</th>
                        <th class="col-required">店舗略名</th>
                        <th>備考</th>
                        <th class="col-readonly">登録日時</th>
                        <th class="col-readonly">登録者</th>
                        <th class="col-readonly">更新日時</th>
                        <th class="col-readonly">更新者</th>
                    </tr>
                </thead>
                <tbody id="gridBody">
                    <tr th:each="row, stat : ${mcm0022uForm.rows}"
                        th:classappend="${row.rowStatus == 'deleted'} ? 'row-deleted' : ''"
                        th:data-index="${stat.index}">

                        <td class="col-select">
                            <label class="row-select-label">
                                <input type="radio" name="rowSelect" class="row-select"/>
                                <span class="row-marker"></span>
                            </label>
                            <input type="hidden" th:name="|rows[${stat.index}].tenpoId|" th:value="${row.tenpoId}" class="key-id-input"/>
                            <input type="hidden" th:name="|rows[${stat.index}].rowStatus|" th:value="${row.rowStatus}"
                                   th:id="|rowStatus_${stat.index}|" class="row-status row-status-input"/>
                        </td>

                        <!-- No (HYOJIJUN) -->
                        <td class="col-frozen col-no col-required">
                            <!-- 【修正】type="number"は"e"/"+"/"-"/"."が入力可能で、数値以外入力チェックを
                                 すり抜ける不具合があったため type="text" に統一する（MCM0015U準拠）。 -->
                            <input type="text" inputmode="numeric" th:name="|rows[${stat.index}].hyojijun|"
                                   th:value="${row.hyojijun}" class="grid-input input-right no-spin" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 無効 (YUKOU_FLG) -->
                        <td class="col-frozen col-checkbox" style="text-align:center;">
                            <input type="checkbox" class="yukou-check" th:name="|rows[${stat.index}].yukouFlg|"
                                   th:checked="${row.yukouFlg}" value="true"
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 事業所コード (JIGYOSHO_CD) — Frozen, Required -->
                        <td class="col-frozen col-required">
                            <input type="text" th:name="|rows[${stat.index}].jigyoshoCd|"
                                   th:value="${row.jigyoshoCd}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 名称1 -->
                        <td>
                            <input type="text" th:name="|rows[${stat.index}].meisho1Nk|"
                                   th:value="${row.meisho1Nk}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 名称2 -->
                        <td>
                            <input type="text" th:name="|rows[${stat.index}].meisho2Nk|"
                                   th:value="${row.meisho2Nk}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 名称3 -->
                        <td>
                            <input type="text" th:name="|rows[${stat.index}].meisho3Nk|"
                                   th:value="${row.meisho3Nk}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 事業所名 -->
                        <td class="col-required">
                            <input type="text" th:name="|rows[${stat.index}].meisho4Nk|"
                                   th:value="${row.meisho4Nk}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 担当者名 -->
                        <td>
                            <input type="text" th:name="|rows[${stat.index}].tantoNk|"
                                   th:value="${row.tantoNk}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 店舗略名 — 必須（青背景） -->
                        <td class="col-required">
                            <input type="text" th:name="|rows[${stat.index}].tenporyakuNk|"
                                   th:value="${row.tenporyakuNk}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 備考 -->
                        <td>
                            <input type="text" th:name="|rows[${stat.index}].biko|"
                                   th:value="${row.biko}" class="grid-input input-left" readonly
                                   onchange="markModified(this)"/>
                        </td>

                        <!-- 登録日時 (CREATED_DT) — ReadOnly -->
                        <td class="col-readonly">
                            <span th:text="${row.createdDt != null ? #temporals.format(row.createdDt, 'yyyy/MM/dd HH:mm:ss') : ''}"></span>
                            <input type="hidden" th:name="|rows[${stat.index}].createdDt|" th:value="${row.createdDt}"/>
                        </td>

                        <!-- 登録者 (CREATED_BY) — ReadOnly -->
                        <td class="col-readonly">
                            <span th:text="${row.createdBy}"></span>
                            <input type="hidden" th:name="|rows[${stat.index}].createdBy|" th:value="${row.createdBy}"/>
                        </td>

                        <!-- 更新日時 (LASTUPDATE_DT) — ReadOnly -->
                        <td class="col-readonly">
                            <span th:text="${row.lastupdateDt != null ? #temporals.format(row.lastupdateDt, 'yyyy/MM/dd HH:mm:ss') : ''}"></span>
                            <input type="hidden" th:name="|rows[${stat.index}].lastupdateDt|" th:value="${row.lastupdateDt}"/>
                        </td>

                        <!-- 更新者 (LASTUPDATE_BY) — ReadOnly -->
                        <td class="col-readonly">
                            <span th:text="${row.lastupdateBy}"></span>
                            <input type="hidden" th:name="|rows[${stat.index}].lastupdateBy|" th:value="${row.lastupdateBy}"/>
                        </td>
                    </tr>

                    <!-- 末尾空行（行追加ボタンの代替：入力すると自動で次の空行が生成される） -->
                    <tr class="blank-row" th:with="bi=${mcm0022uForm.rows.size()}">
                        <td class="col-select">
                            <label class="row-select-label">
                                <input type="radio" name="rowSelect" class="row-select"/>
                                <span class="row-marker"></span>
                            </label>
                            <input type="hidden" th:name="'rows[' + ${bi} + '].tenpoId'" value="" class="key-id-input"/>
                            <input type="hidden" th:name="'rows[' + ${bi} + '].rowStatus'" value="unchanged" class="row-status row-status-input"/>
                        </td>
                        <td class="col-frozen col-no col-required">
                            <input type="text" inputmode="numeric" th:name="'rows[' + ${bi} + '].hyojijun'" class="grid-input input-right no-spin" readonly/>
                        </td>
                        <td class="col-frozen col-checkbox" style="text-align:center;">
                            <input type="checkbox" class="yukou-check" th:name="'rows[' + ${bi} + '].yukouFlg'" value="true"/>
                        </td>
                        <td class="col-frozen col-required">
                            <input type="text" th:name="'rows[' + ${bi} + '].jigyoshoCd'" class="grid-input input-left" readonly/>
                        </td>
                        <td>
                            <input type="text" th:name="'rows[' + ${bi} + '].meisho1Nk'" class="grid-input input-left" readonly/>
                        </td>
                        <td>
                            <input type="text" th:name="'rows[' + ${bi} + '].meisho2Nk'" class="grid-input input-left" readonly/>
                        </td>
                        <td>
                            <input type="text" th:name="'rows[' + ${bi} + '].meisho3Nk'" class="grid-input input-left" readonly/>
                        </td>
                        <td class="col-required">
                            <input type="text" th:name="'rows[' + ${bi} + '].meisho4Nk'" class="grid-input input-left" readonly/>
                        </td>
                        <td>
                            <input type="text" th:name="'rows[' + ${bi} + '].tantoNk'" class="grid-input input-left" readonly/>
                        </td>
                        <!-- 店舗略名 — 必須（青背景） -->
                        <td class="col-required">
                            <input type="text" th:name="'rows[' + ${bi} + '].tenporyakuNk'" class="grid-input input-left" readonly/>
                        </td>
                        <td>
                            <input type="text" th:name="'rows[' + ${bi} + '].biko'" class="grid-input input-left" readonly/>
                        </td>
                        <td class="col-readonly"></td>
                        <td class="col-readonly"></td>
                        <td class="col-readonly"></td>
                        <td class="col-readonly"></td>
                    </tr>
                </tbody>
            </table>
        </div>


        <div class="form-actions">
            <button type="button" id="btnUpdate" class="btn btn-primary">登録</button>
        </div>
    </form>

    <!-- 確認用ダイアログ（? アイコン・OK/キャンセル） -->
    <div id="confirmDialogOverlay" class="mini-dialog-overlay">
        <div class="mini-dialog">
            <div class="mini-dialog-head">
                <span>確認</span>
                <button type="button" class="mini-close" id="confirmCloseX" aria-label="閉じる">✕</button>
            </div>
            <div class="mini-dialog-body">
                <span class="mini-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                        <circle cx="16" cy="16" r="15" fill="#1a6fd4"/>
                        <text x="16" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif"
                              font-size="20" font-weight="bold" fill="#ffffff">?</text>
                    </svg>
                </span>
                <span class="mini-msg" id="confirmMsg"></span>
            </div>
            <div class="mini-dialog-foot">
                <button type="button" id="confirmOk">OK</button>
                <button type="button" id="confirmCancel">キャンセル</button>
            </div>
        </div>
    </div>

    <div id="miniDialogOverlay" class="mini-dialog-overlay">
        <div class="mini-dialog">
            <div class="mini-dialog-head">
                <span id="miniDialogTitle">入力エラー</span>
                <button type="button" class="mini-close" id="miniDialogCloseX" aria-label="閉じる">✕</button>
            </div>
            <div class="mini-dialog-body">
                <span class="mini-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                        <circle cx="16" cy="16" r="15" fill="#1a6fd4"/>
                        <circle cx="16" cy="9" r="2" fill="#ffffff"/>
                        <rect x="14" y="13" width="4" height="11" rx="1" fill="#ffffff"/>
                    </svg>
                </span>
                <span class="mini-msg" id="miniDialogMsg"></span>
            </div>
            <div class="mini-dialog-foot"><button type="button" id="miniDialogOk">OK</button></div>
        </div>
    </div>

    <script th:inline="javascript">
        "use strict";

        /* ===== MCM0015U 準拠 ミニダイアログ ===== */
        function showError(msg, title) {
            var ov = document.getElementById("miniDialogOverlay");
            var body = document.getElementById("miniDialogMsg");
            var titleEl = document.getElementById("miniDialogTitle");
            if (titleEl) titleEl.textContent = title || "入力エラー";
            if (ov && body) {
                body.textContent = msg; ov.style.display = "flex";
                var okBtn = document.getElementById("miniDialogOk");
                var closeX = document.getElementById("miniDialogCloseX");
                function close() { ov.style.display = "none"; okBtn.onclick = null; if (closeX) closeX.onclick = null; }
                okBtn.onclick = close; if (closeX) closeX.onclick = close;
                setTimeout(function () { okBtn.focus(); }, 50);
            } else { alert(msg); }
        }
        /* 【MCM0015U準拠】完了メッセージ：入力エラー用miniDialogを流用し、タイトルを「完了」にして表示する */
        function showInfo(msg, onClose) {
            var ov = document.getElementById("miniDialogOverlay");
            var body = document.getElementById("miniDialogMsg");
            var titleEl = document.getElementById("miniDialogTitle");
            if (titleEl) titleEl.textContent = "完了";
            if (ov && body) {
                body.textContent = msg || "登録処理が完了しました。";
                ov.style.display = "flex";
                var okBtn = document.getElementById("miniDialogOk");
                var closeX = document.getElementById("miniDialogCloseX");
                function close() {
                    ov.style.display = "none"; okBtn.onclick = null; if (closeX) closeX.onclick = null;
                    if (onClose) onClose();
                }
                okBtn.onclick = close; if (closeX) closeX.onclick = close;
                setTimeout(function () { okBtn.focus(); }, 50);
            } else { alert(msg || "登録処理が完了しました。"); if (onClose) onClose(); }
        }
        function showConfirm(msg, onOk) {
            var ov = document.getElementById("confirmDialogOverlay");
            var body = document.getElementById("confirmMsg");
            var okBtn = document.getElementById("confirmOk");
            var cancelBtn = document.getElementById("confirmCancel");
            var closeX = document.getElementById("confirmCloseX");
            if (ov && body && okBtn && cancelBtn) {
                body.textContent = msg; ov.style.display = "flex";
                function cleanup() { ov.style.display = "none"; okBtn.onclick = null; cancelBtn.onclick = null; if (closeX) closeX.onclick = null; }
                okBtn.onclick = function () { cleanup(); if (onOk) onOk(); };
                cancelBtn.onclick = function () { cleanup(); };
                if (closeX) closeX.onclick = function () { cleanup(); };
                setTimeout(function () { okBtn.focus(); }, 50);
            } else { if (window.confirm(msg) && onOk) onOk(); }
        }

        function markModified(el) {
            var tr = el.closest('tr');
            var statusInput = tr ? tr.querySelector('.row-status') : null;
            if (statusInput && statusInput.value === 'unchanged') {
                statusInput.value = 'modified';
            }
        }

        /* ===== 行選択（ラジオ＋▶マーカー） ===== */
        function setActiveRow(tr) {
            document.querySelectorAll("#gridBody tr.row-active").forEach(function (r) { if (r !== tr) r.classList.remove("row-active"); });
            if (tr) tr.classList.add("row-active");
        }
        function clearSelectedHighlight() {
            document.querySelectorAll("#gridBody tr.row-selected").forEach(function (r) { r.classList.remove("row-selected"); });
            document.querySelectorAll("#gridBody .row-select:checked").forEach(function (rb) { rb.checked = false; });
        }
        function isEmpty(el) { return !el || el.value === "" || el.value == null; }
        var ROW_TEXT_SELS = ['.jigyoshoCd', '.meisho1Nk', '.meisho2Nk', '.meisho3Nk',
                             '.meisho4Nk', '.tantoNk', '.tenporyakuNk', '.biko'];
        function isRowContentEmpty(tr) {
            if (!tr) return true;
            /* 【修正】判定対象を isRowStarted と同じ8項目に統一（名称2/名称3/担当者名の入力漏れ判定バグ対応） */
            return ROW_TEXT_SELS.every(function (n) { return isEmpty(tr.querySelector('input[name$="' + n + '"]')); });
        }

        /* ===== 必須はサーバーと一致：No / 事業所コード / 事業所名 / 店舗略名 ===== */
        var REQUIRED_DEFS = [
            { sel: '.col-no input.grid-input', label: "No" },
            { sel: 'input[name$=".jigyoshoCd"]',   label: "事業所コード" },
            { sel: 'input[name$=".meisho4Nk"]',    label: "事業所名" },
            { sel: 'input[name$=".tenporyakuNk"]', label: "店舗略名" }
        ];
        function getReq(tr) {
            return REQUIRED_DEFS.map(function (d) {
                return { el: tr.querySelector(d.sel), label: d.label };
            });
        }
        /* 行に何か入力があるか（サーバーの isRowEmpty と対になる判定）。 */
        function isRowStarted(tr) {
            if (!tr) return false;
            var sels = ROW_TEXT_SELS;
            var anyText = sels.some(function (n) {
                var el = tr.querySelector('input[name$="' + n + '"]');
                return el && el.value && el.value.trim() !== "";
            });
            var no = tr.querySelector('.col-no input.grid-input');
            /* 【修正】自動採番された No（data-auto-no）は「着手」とみなさない。これが無いと、No だけ入った空行から離れる際に validateRow が false になり、clearAutoNoIfUntouched に到達せず No が消えなかった。 */
            var hasNo = no && !no.hasAttribute("data-auto-no") && no.value && no.value.trim() !== "";
            return anyText || hasNo;
        }
        function validateRow(tr, mark) {
            if (!tr) return true;
            var reqs = getReq(tr);
            reqs.forEach(function (r) { if (r.el) r.el.classList.remove("field-error"); });
            if (!isRowStarted(tr)) return true;
            var missing = reqs.filter(function (r) { return isEmpty(r.el); });
            if (missing.length > 0) {
                if (mark) missing.forEach(function (r) { if (r.el) r.el.classList.add("field-error"); });
                return false;
            }
            return true;
        }

        /* ===== 【修正】必須エラーメッセージ：未入力の必須「項目名」を括弧表示 =====
           例: 未入力の必須項目があります。（店舗略名）
               複数: 未入力の必須項目があります。（事業所名／店舗略名） */
        function buildRequiredMsg(tr) {
            if (!tr) return "未入力の必須項目があります。";
            var reqs = getReq(tr);
            var missingLabels = reqs.filter(function (r) { return isEmpty(r.el); })
                                    .map(function (r) { return r.label; });
            return missingLabels.length
                ? "未入力の必須項目があります。（" + missingLabels.join("／") + "）"
                : "未入力の必須項目があります。";
        }

        /* 【修正】No欄は type="text" に変更したため、type="number"前提だった
           スピンボタン制御（矢印キー/ホイール）は不要（type=textにはスピンボタンが無い）。 */

        /*
         * ===== No 自動採番（既存Noの MAX+1）／未確定なら取り消し =====
         * 【性能改善】MAX値をキャッシュし、フォーカス移動のたびの全行再スキャンを避ける。
         */
        var __maxHyojijunCache = null;
        function invalidateHyojijunCache() { __maxHyojijunCache = null; }
        function nextHyojijunMax() {
            if (__maxHyojijunCache === null) {
                var maxNo = 0;
                document.querySelectorAll('#gridBody input[name$=".hyojijun"]').forEach(function (el) {
                    var v = parseInt(el.value, 10);
                    if (!isNaN(v) && v > maxNo) maxNo = v;
                });
                __maxHyojijunCache = maxNo;
            }
            __maxHyojijunCache += 1;
            return __maxHyojijunCache;
        }
        function assignNoForRow(tr) {
            if (!tr) return;
            var st = tr.querySelector(".row-status-input");
            var isNew = tr.classList.contains("blank-row") || (st && st.value === "new");
            var noInput = tr.querySelector('.col-no input.grid-input');
            if (!isNew || !noInput || noInput.value !== "") return;
            noInput.value = nextHyojijunMax();
            noInput.setAttribute("data-auto-no", "1");
        }
        function clearAutoNoIfUntouched(tr) {
            if (!tr) return;
            var st = tr.querySelector(".row-status-input");
            var isNew = tr.classList.contains("blank-row") || (st && st.value === "new");
            if (!isNew) return;
            if (!isRowContentEmpty(tr)) return;
            var noInput = tr.querySelector('.col-no input.grid-input');
			if (noInput && noInput.getAttribute("data-auto-no") !== "1") return;
            if (noInput) { noInput.value = ""; noInput.removeAttribute("data-auto-no"); invalidateHyojijunCache(); }
        }

        var activeRow = null;
        document.addEventListener("focusin", function (e) {
            var tr = e.target.closest ? e.target.closest("#gridBody tr") : null;
            if (tr && tr !== activeRow) {
                if (activeRow && document.body.contains(activeRow) && !validateRow(activeRow, true)) {
                    var prevRow = activeRow;
                    showError(buildRequiredMsg(prevRow));
                    var fm = prevRow.querySelector(".field-error");
                    setTimeout(function () { if (fm) fm.focus(); }, 0);
                    return;
                }
                if (activeRow && activeRow !== tr) clearAutoNoIfUntouched(activeRow);
                activeRow = tr;
            }
            if (tr) {
                assignNoForRow(tr);
                setActiveRow(tr);
                if (!e.target.classList.contains("row-select")) clearSelectedHighlight();
            }
        });

        document.addEventListener("change", function (e) {
            if (e.target && e.target.classList && e.target.classList.contains("row-select")) {
                var trSel = e.target.closest("tr");
                if (trSel) {
                    var stSel = trSel.querySelector(".row-status-input");
                    var selIsNew = trSel.classList.contains("blank-row") || (stSel && stSel.value === "new");
                    if (selIsNew && isRowContentEmpty(trSel)) {
                        showError("入力が確定していない行は選択できません。");
                        e.target.checked = false;
                        return;
                    }
                }
                document.querySelectorAll("#gridBody tr.row-selected").forEach(function (tr) { tr.classList.remove("row-selected"); });
                if (trSel && e.target.checked) { trSel.classList.add("row-selected"); activeRow = trSel; setActiveRow(trSel); }
            }
        });

        /* ===== 末尾空行の自動生成（行追加ボタンの代替） ===== */
        document.addEventListener("input", function (e) {
            var tbody = document.getElementById("gridBody");
            if (!tbody) return;
            var tr = e.target.closest ? e.target.closest("tr.blank-row") : null;
            if (!tr || !tbody.contains(tr)) return;
            var st = tr.querySelector(".row-status-input");
            if (st) st.value = "new";
            tr.classList.remove("blank-row");
            assignNoForRow(tr);
            if (!tbody.querySelector("tr.blank-row")) spawnBlankRow(tr);
        });

        /* ===== 新規行の内容が全て空になったら空行に戻す（MCM0015U 準拠） ===== */
        document.addEventListener("input", function (e) {
            var tbody = document.getElementById("gridBody");
            if (!tbody) return;
            var tr = e.target.closest ? e.target.closest("#gridBody tr") : null;
            if (!tr) return;
			if (e.target.matches && e.target.matches('.col-no input.grid-input')) return;
            var st = tr.querySelector(".row-status-input");
            var isNew = (st && st.value === "new") && !tr.classList.contains("blank-row");
            if (!isNew) return;
            if (!isRowContentEmpty(tr)) return;
            if (st) st.value = "unchanged";
            tr.classList.add("blank-row");
            var noInput = tr.querySelector('.col-no input.grid-input');
            if (noInput) { noInput.value = ""; noInput.removeAttribute("data-auto-no"); }
            normalizeBlankRows(tr);
        });

        function normalizeBlankRows(keep) {
            var tbody = document.getElementById("gridBody");
            if (!tbody) return;
            var blanks = tbody.querySelectorAll("tr.blank-row");
            if (blanks.length <= 1) return;
            blanks.forEach(function (b) {
                if (b !== keep && !b.contains(document.activeElement)) b.parentNode.removeChild(b);
            });
            if (!tbody.querySelector("tr.blank-row")) spawnBlankRow(keep || tbody.querySelector("tr:last-child"));
        }

        function spawnBlankRow(baseTr) {
            var tbody = document.getElementById("gridBody");
            var idx = nextRowIndex();
            var clone = baseTr.cloneNode(true);
            clone.className = "blank-row";
            clone.querySelectorAll("input").forEach(function (inp) {
                if (inp.name) inp.name = inp.name.replace(/rows\[\d+\]/, "rows[" + idx + "]");
                inp.classList.remove("field-error");
                inp.removeAttribute("data-auto-no");
                if (inp.type === "checkbox" || inp.type === "radio") { inp.checked = false; inp.removeAttribute("checked"); }
                else if (inp.classList.contains("row-status-input")) { inp.value = "unchanged"; inp.setAttribute("value","unchanged"); }
                else {
                    inp.value = "";
                    inp.setAttribute("value","");
                    inp.defaultValue = "";
                    if (inp.classList.contains("grid-input")) inp.setAttribute("readonly","readonly");
                }
            });
            clone.querySelectorAll("td.cell-selected").forEach(function(td){ td.classList.remove("cell-selected"); });
            clone.querySelectorAll("td.col-readonly").forEach(function (td) { td.textContent = ""; });
            tbody.appendChild(clone);
        }
        function nextRowIndex() {
            var max = -1;
            document.querySelectorAll('#gridBody input[name^="rows["]').forEach(function (inp) {
                var m = inp.name.match(/rows\[(\d+)\]/); if (m) { var n = parseInt(m[1], 10); if (n > max) max = n; }
            });
            return max + 1;
        }

        document.addEventListener("input", function (e) {
            if (e.target && e.target.classList && e.target.classList.contains("field-error")) {
                if (e.target.value !== "") e.target.classList.remove("field-error");
            }
            /*
             * ★No欄は数値（半角0-9）以外を入力自体できないようにする。
             *   キーボード入力・貼り付け・ドラッグ&ドロップ・IME確定後のいずれも
             *   input イベントで捕捉されるため、ここで半角数字以外を即時除去する。
             */
            if (e.target && e.target.name && /\.hyojijun$/.test(e.target.name)) {
                var filtered = e.target.value.replace(/[^0-9]/g, "");
                if (filtered !== e.target.value) e.target.value = filtered;
				e.target.removeAttribute("data-auto-no");
            }
            var t = e.target;
            if (t && t.name && /\.(jigyoshoCd|meisho4Nk|tenporyakuNk)$/.test(t.name) && t.value !== "") {
                var tr = t.closest("tr");
                var noInput = tr && tr.querySelector('.col-no input.grid-input');
                if (noInput) noInput.removeAttribute("data-auto-no");
            }
        });

        function hasUnsavedChanges() {
            var tbody = document.getElementById("gridBody");
            if (!tbody) return false;
            var changed = false;
            tbody.querySelectorAll("tr").forEach(function (tr) {
                var st = tr.querySelector(".row-status-input");
                var status = st ? st.value : "unchanged";
                if (status === "modified" || status === "deleted") { changed = true; return; }
                if (status === "new" && !isRowContentEmpty(tr)) { changed = true; return; }
            });
            return changed;
        }

		function resolveMcm0022uBaseUrl() {
		    var f = document.getElementById("updateForm");
		    var act = f ? f.getAttribute("action") : "/mcm0022u/update";
		    return act.replace(/\/update(\?.*)?$/, "");
		}
        /* ===== 行削除ボタン（単一選択） ===== */
		var btnDeleteRow = document.getElementById("btnDeleteRow");
		if (btnDeleteRow) {
		    btnDeleteRow.addEventListener("click", function (e) {
		        e.stopImmediatePropagation(); e.preventDefault();
		        var tbody = document.getElementById("gridBody");
		        var selected = tbody ? tbody.querySelector(".row-select:checked") : null;
		        if (!selected) { showError("行が選択されていません。"); return; }
		        var trDel = selected.closest("tr");
		        if (!trDel) { showError("行が選択されていません。"); return; }

		        function doConfirmAndDelete() {
		            showConfirm("選択した行を削除します。よろしいですか？", function () {
		                var st = trDel.querySelector(".row-status-input");
		                var status = st ? st.value : "unchanged";
		                if (status === "new" || trDel.classList.contains("blank-row")) {
		                    trDel.parentNode.removeChild(trDel);
		                } else if (st) {
		                    st.value = "deleted";
		                    trDel.style.display = "none";
		                    trDel.classList.add("row-deleted");
		                }
		            });
		        }

		        var st = trDel.querySelector(".row-status-input");
		        var status = st ? st.value : "unchanged";
		        var idInput = trDel.querySelector(".key-id-input");
		        var tenpoIdVal = idInput ? idInput.value : "";
		        var isNewRow = status === "new" || trDel.classList.contains("blank-row") || !tenpoIdVal;
		        if (isNewRow) { doConfirmAndDelete(); return; }

		        var base = resolveMcm0022uBaseUrl();
		        window.McmCommon && window.McmCommon.showProgress();
		        fetch(base + "/checkDelete?tenpoId=" + encodeURIComponent(tenpoIdVal), { credentials: "same-origin" })
		            .then(function (res) { if (!res.ok) throw new Error(); return res.json(); })
		            .then(function (data) {
		                if (data && data.referenced) {
		                    showError(data.message || "既に使用されている為、削除する事が出来ません。", "削除エラー");
		                } else {
		                    doConfirmAndDelete();
		                }
		            })
		            .catch(function () {
		                showError("削除可否の確認に失敗しました。時間をおいて再度お試しください。", "削除エラー");
		            })
		            .finally(function () {
		                window.McmCommon && window.McmCommon.hideProgress();
		            });
		    }, true);
		}

        /* ===== 閉じる ===== */
        var btnCloseLink = document.getElementById("btnCloseLink");
        if (btnCloseLink) {
            btnCloseLink.addEventListener("click", function (e) {
                if (hasUnsavedChanges()) {
                    e.preventDefault();
                    var href = btnCloseLink.getAttribute("href");
                    showConfirm("データが変更されています。破棄されますがよろしいですか？", function () {
                        window.location.href = href;
                    });
                }
            });
        }

        /*
         * ★No専用の数値チェック（MCM0015U準拠、半角数字のみ許容）。
         *   全角数字・英字・記号・小数点・指数表記(e/E)・正負符号は不可とする。
         */
        function isHalfWidthDigits(v) {
            var s = String(v == null ? "" : v).trim();
            if (s === "") return true;
            return /^\d+$/.test(s);
        }
        /* ===== 桁数・文字数チェック（VB CPValidate 相当）===== */
        var LENGTH_RULES = [
            { pattern: /\.hyojijun$/,      maxLen: 6,    label: "No",      decimal: true, numericStrict: true },
            { pattern: /\.jigyoshoCd$/,    maxLen: 10,   label: "事業所コード" },
            { pattern: /\.meisho1Nk$/,     maxLen: 100,  label: "名称1" },
            { pattern: /\.meisho2Nk$/,     maxLen: 100,  label: "名称2" },
            { pattern: /\.meisho3Nk$/,     maxLen: 100,  label: "名称3" },
            { pattern: /\.meisho4Nk$/,     maxLen: 100,  label: "事業所名" },
            { pattern: /\.tantoNk$/,       maxLen: 100,  label: "担当者名" },
            { pattern: /\.tenporyakuNk$/,  maxLen: 100,  label: "店舗略名" },
            { pattern: /\.biko$/,          maxLen: 4000, label: "備考" }
        ];
        function checkCellLength(inp) {
            if (!inp || inp.value === "") return null;
            var name = inp.name || "";
            for (var i = 0; i < LENGTH_RULES.length; i++) {
                var rule = LENGTH_RULES[i];
                if (!rule.pattern.test(name)) continue;
                if (rule.numericStrict && !isHalfWidthDigits(inp.value)) {
                    return rule.label + "は数値で入力してください。";
                }
                if (rule.decimal) {
                    var num = parseFloat(inp.value);
                    if (!isNaN(num) && Math.abs(Math.trunc(num)) >= Math.pow(10, rule.maxLen))
                        return rule.label + "は" + rule.maxLen + "桁以下で入力してください。";
                } else if (inp.value.length > rule.maxLen) {
                    return rule.label + "は" + rule.maxLen + "文字以内で入力してください。";
                }
                return null;
            }
            return null;
        }

        /*
         * ★行移動時バリデーション用: 1行分の grid-input/select.grid-input を走査し、
         *   桁数超過があれば { msg, inp } を返す（なければ null）。
         *   登録時の一括走査(btnUpdateハンドラ)と同じ checkCellLength/LENGTH_RULES を使うため、
         *   桁数ルール自体は変更せず、行移動時にも同じ判定を適用できるようにする。
         */
        function checkRowLength(tr) {
            if (!tr) return null;
            var st = tr.querySelector(".row-status");
            if (st && String(st.value || "") === "deleted") return null;
            var result = null;
            tr.querySelectorAll("input.grid-input, select.grid-input").forEach(function (inp) {
                if (result || !inp.name) return;
                var msg = checkCellLength(inp);
                if (msg) { inp.classList.add("field-error"); result = { msg: msg, inp: inp }; }
            });
            return result;
        }

        /* ===== 登録ボタン ===== */
        var btnUpdate = document.getElementById("btnUpdate");
        var updForm = document.getElementById("updateForm");
        if (btnUpdate && updForm) {
            btnUpdate.addEventListener("click", function (e) {
                e.stopImmediatePropagation(); e.preventDefault();
                var tbody = document.getElementById("gridBody");
                var rows = tbody ? tbody.querySelectorAll("tr") : [];
                /*
                 * 【性能改善】必須チェックと桁数チェックを1回の行ループ内で行い、
                 *   全行・全セルの走査を2回から1回に削減する。
                 */
                var firstErrorInput = null, hasError = false, firstErrorRow = null;
                var lenErr = null, lenErrInp = null;
                rows.forEach(function (tr) {
                    if (!validateRow(tr, true)) {
                        hasError = true;
                        if (!firstErrorInput) firstErrorInput = tr.querySelector(".field-error");
                        if (!firstErrorRow) firstErrorRow = tr;
                    }
                    if (lenErr) return;
                    var st = tr.querySelector(".row-status");
                    if (st && String(st.value || "") === "deleted") return;
                    tr.querySelectorAll("input.grid-input, select.grid-input").forEach(function (inp) {
                        if (lenErr || !inp.name) return;
                        var msg = checkCellLength(inp);
                        if (msg) { inp.classList.add("field-error"); lenErr = msg; lenErrInp = inp; }
                    });
                });
                if (hasError) {
                    showError(buildRequiredMsg(firstErrorRow));
                    if (firstErrorInput) firstErrorInput.focus();
                    return;
                }
                if (!hasUnsavedChanges()) { showError("値が変更されていません。"); return; }
                if (lenErr) {
                    showError(lenErr);
                    if (lenErrInp) lenErrInp.focus();
                    return;
                }
                showConfirm("登録を実施します。よろしいですか？", function () {
                    document.querySelectorAll('.row-deleted input:disabled').forEach(function (inp) { inp.disabled = false; });
                    submitUpdateAjax();
                });
            }, true);
        }

        /*
         * 【性能改善（MCM0015U準拠）】行データをname属性(rows[n].xxx)から読み取り、
         *   JSONオブジェクトとして構築する。従来の application/x-www-form-urlencoded
         *   形式の通常フォーム送信では、行数の多いフォームでSpring MVCのバインディングが
         *   極端に遅くなる問題があった。
         */
        function buildRowsPayload() {
            var rows = [];
            var tbody = document.getElementById("gridBody");
            if (!tbody) return rows;
            tbody.querySelectorAll("tr").forEach(function (tr) {
                var statusInp = tr.querySelector('input[name$=".rowStatus"]');
                if (!statusInp || statusInp.disabled) return;
                var row = {};
                tr.querySelectorAll("[name^='rows[']").forEach(function (el) {
                    if (el.disabled) return;
                    var m = el.name.match(/^rows\[\d+\]\.(.+)$/);
                    if (!m) return;
                    var field = m[1];
                    if (el.type === "checkbox") {
                        row[field] = el.checked;
                    } else {
                        var v = el.value;
                        row[field] = (v === "") ? null : v;
                    }
                });
                rows.push(row);
            });
            return rows;
        }

        function submitUpdateAjax() {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            var payload = { rows: buildRowsPayload() };
            var headers = { "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/json" };
            var mh = document.querySelector('meta[name="_csrf_header"]');
            var mt = document.querySelector('meta[name="_csrf"]');
            if (mh && mt && mh.content && mt.content) headers[mh.content] = mt.content;

            window.McmCommon && window.McmCommon.showProgress();
            fetch(updForm.getAttribute("action"), {
                method: "POST", headers: headers, body: JSON.stringify(payload)
            }).then(function (res) {
                if (!res.ok) {
                    return res.json().catch(function () { return null; }).then(function (data) {
                        showError((data && data.message) ? data.message : "登録に失敗しました。時間をおいて再度お試しください。");
                    });
                }
                return res.json().catch(function () { return {}; }).then(function (data) {
                    showInfo((data && data.message) ? data.message : "登録しました。", function () {
                        window.location.reload();
                    });
                });
            }).catch(function () {
                showError("通信エラーが発生しました。時間をおいて再度お試しください。");
            }).finally(function () {
                window.McmCommon && window.McmCommon.hideProgress();
            });
        }

        /* ===== サーバー返却のエラー/警告をポップアップ表示（赤帯は出さない） ===== */
        (function showServerMessagesOnLoad() {
            function collect(sel) {
                return Array.prototype.map.call(
                    document.querySelectorAll("#serverMessages " + sel),
                    function (e) { return (e.textContent || "").trim(); }
                ).filter(function (t) { return t.length > 0; });
            }
            var errs = collect(".srv-error");
            var warns = collect(".srv-warn");
            if (errs.length > 0) {
                showError(errs.join("\n"), "エラー");
            } else if (warns.length > 0) {
                showError(warns.join("\n"), "確認");
            }
        })();

        /* ===== Excel風 2クリック編集：1回目=セル選択 / 2回目=編集（MCM0015U 準拠） ===== */
        /* ============ 列幅リサイズ（MCM0015U index.html!A820-A892 準拠） ============ */
        (function setupColumnResize() {
            var table = document.getElementById("tenpoGrid");
            if (!table) return;
            var container = table.parentElement;
            var cols = table.querySelectorAll("colgroup col");
            if (!cols.length) { table.style.visibility = "visible"; return; }
            function pxOf(col) {
                var w = parseFloat(col.style.width);
                if (!isNaN(w)) return w;
                return col.getBoundingClientRect().width;
            }
            var baseWidths = [];
            cols.forEach(function (c) { baseWidths.push(Math.round(pxOf(c))); });
            var widths = baseWidths.slice();
            var LAST = 10; // 余りを吸収する調整役の列
            function applyWidths() {
                var total = 0;
                widths.forEach(function (w, i) { cols[i].style.width = w + "px"; total += w; });
                table.style.width = total + "px";
            }
            function fitInitial() {
                widths = baseWidths.slice();
                var avail = container.clientWidth - 2;
                var total = widths.reduce(function (a, b) { return a + b; }, 0);
                if (total < avail) { widths[LAST] += (avail - total); }
                applyWidths();
            }
            fitInitial();
            table.style.visibility = "visible";
            var rzTimer = null;
            window.addEventListener("resize", function () {
                if (rzTimer) clearTimeout(rzTimer);
                rzTimer = setTimeout(fitInitial, 100);
            });
            var ths = table.querySelectorAll("thead th");
            ths.forEach(function (th, idx) {
                var handle = document.createElement("span");
                handle.className = "col-resizer";
                th.appendChild(handle);
                var startX = 0, startW = 0;
                function onMove(ev) {
                    var x = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    widths[idx] = Math.max(40, Math.round(startW + (x - startX)));
                    applyWidths();
                }
                function onUp() {
                    document.removeEventListener("mousemove", onMove);
                    document.removeEventListener("mouseup", onUp);
                    document.removeEventListener("touchmove", onMove);
                    document.removeEventListener("touchend", onUp);
                    document.body.classList.remove("col-resizing");
                }
                function onDown(ev) {
                    ev.preventDefault(); ev.stopPropagation();
                    startX = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    startW = widths[idx];
                    document.body.classList.add("col-resizing");
                    document.addEventListener("mousemove", onMove);
                    document.addEventListener("mouseup", onUp);
                    document.addEventListener("touchmove", onMove, { passive: false });
                    document.addEventListener("touchend", onUp);
                }
                handle.addEventListener("mousedown", onDown);
                handle.addEventListener("touchstart", onDown, { passive: false });
            });
        })();

        (function twoClickEdit(){
            var tbody=document.getElementById("gridBody");
            if(!tbody) return;
            var selTd=null, lastRow=null, editing=null;

            function clearSel(){
                tbody.querySelectorAll("td.cell-selected").forEach(function(td){td.classList.remove("cell-selected");});
                selTd=null;
            }
            function stopEdit(){
                if(editing){ try{editing.blur();}catch(e){} editing=null; }
                tbody.querySelectorAll(".grid-input").forEach(function(i){ i.setAttribute("readonly","readonly"); });
                try{ var sel=window.getSelection(); if(sel) sel.removeAllRanges(); }catch(e){}
            }
            function selectTd(td){
                if(!td) return;
                var newTr=td.closest("tr");
                if(lastRow && newTr && lastRow!==newTr && document.body.contains(lastRow)){
                    if(!validateRow(lastRow, true)){
                        showError(buildRequiredMsg(lastRow));
                        var fm=lastRow.querySelector(".field-error");
                        if(fm){ try{fm.removeAttribute("readonly"); fm.focus({preventScroll:true});}catch(e){} }
                        return;
                    }
                    /* ★行移動前に桁数チェックを行う。超過があればエラー解消まで移動を止める。 */
                    var lenErr=checkRowLength(lastRow);
                    if(lenErr){
                        showError(lenErr.msg);
                        if(lenErr.inp){ try{lenErr.inp.removeAttribute("readonly"); lenErr.inp.focus({preventScroll:true});}catch(e){} }
                        return;
                    }
                }
                clearSelectedHighlight();   // 左端▶以外を触ったら行選択(グレー)を解除
                stopEdit(); clearSel();
                selTd=td; td.classList.add("cell-selected");
                var tr=td.closest("tr");
                if(lastRow && lastRow!==tr){ clearAutoNoIfUntouched(lastRow); }
                lastRow=tr;
                assignNoForRow(tr);
                setActiveRow(tr);
            }
            function startEdit(td, typedChar){
                if(!td) return;
                var inp=td.querySelector(".grid-input"); if(!inp) return;
                lastRow=td.closest("tr");
                clearSelectedHighlight();   // 左端▶以外を触ったら行選択(グレー)を解除
                clearSel();
                inp.removeAttribute("readonly"); editing=inp;
                if(typedChar!=null){
                    inp.value=typedChar;
                    try{ inp.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
                }
                setTimeout(function(){
                    inp.focus({preventScroll:true});
                    if(typedChar!=null){ var L2=inp.value.length; try{inp.setSelectionRange(L2,L2);}catch(e){} }
                    else { if(inp.type!=="checkbox"&&inp.type!=="radio"){ try{inp.select();}catch(e){} } }
                },0);
            }
            function isCellTd(td){ return td && td.querySelector && (td.querySelector(".grid-input") || td.querySelector(".yukou-check")); }

            // === ROW-DESELECT-GUARD ===
            // 左端▶(row-select-label)以外を押したら「行選択グレー」を解除する。
            // 入力欄(.grid-input)を持たないセル(readonly列/チェック列/▶列)を押したら「セル選択グレー」も解除する。
            // キャプチャフェーズなので、2クリック編集の mousedown や必須チェックの early return より先に走る。
            function deselectRowOnOtherClick(e){
                var t = e.target;
                if(!t || typeof t.closest !== "function") return;
                var onMarker = t.closest(".row-select-label") || t.closest(".row-select");
                if(!onMarker) clearSelectedHighlight();                 // ▶以外 → 行選択グレーを解除
                if(onMarker || !(t.closest(".grid-input")||t.closest(".yukou-check"))){
                    stopEdit(); clearSel();                        // 入力欄の無いセル/▶列 → セル選択グレーも解除
                }
            }
            tbody.addEventListener("mousedown", deselectRowOnOtherClick, true);
            tbody.addEventListener("click", deselectRowOnOtherClick, true);
            // === /ROW-DESELECT-GUARD ===
            tbody.addEventListener("mousedown", function(e){
                var inp=e.target.closest(".grid-input")||e.target.closest(".yukou-check"); if(!inp) return;
                var td=inp.closest("td");
                if(inp===editing) return;
                e.preventDefault();
                if(inp.classList.contains("yukou-check")){ selectTd(td); return; }   // チェック列は選択のみ（切替はSpaceキー）
                if(td===selTd){ startEdit(td); } else { selectTd(td); }
            });

            document.addEventListener("keydown", function(e){
                if(editing){
                    if(e.key==="Escape"){ var t=editing.closest("td"); stopEdit(); selectTd(t); }
                    if(e.key==="Enter"){
                        var t2=editing.closest("td"); var ci2=Array.prototype.indexOf.call(t2.parentElement.children,t2);
                        stopEdit();
                        var nr=t2.parentElement.nextElementSibling;
                        while(nr && !(nr.children[ci2] && nr.children[ci2].querySelector && nr.children[ci2].querySelector(".grid-input"))) nr=nr.nextElementSibling;
                        if(nr){ selectTd(nr.children[ci2]); nr.children[ci2].scrollIntoView({block:"nearest"}); }
                        else { selectTd(t2); }
                        e.preventDefault();
                    }
                    return;
                }
                if(!selTd) return;
                var tr=selTd.parentElement;
                var tds=Array.prototype.slice.call(tr.children);
                var ci=tds.indexOf(selTd);
                var target=null;

                if(e.key==="ArrowDown"){ var nd=tr.nextElementSibling; while(nd && !isCellTd(nd.children[ci])) nd=nd.nextElementSibling; if(nd) target=nd.children[ci]; }
                else if(e.key==="ArrowUp"){ var pr=tr.previousElementSibling; while(pr && !isCellTd(pr.children[ci])) pr=pr.previousElementSibling; if(pr) target=pr.children[ci]; }
                else if(e.key==="ArrowRight"){ for(var j=ci+1;j<tds.length;j++){ if(isCellTd(tds[j])){ target=tds[j]; break; } } }
                else if(e.key==="ArrowLeft"){ for(var k=ci-1;k>=0;k--){ if(isCellTd(tds[k])){ target=tds[k]; break; } } }
                // ★チェックボックスセル：SpaceキーでチェックON/OFF（Excel準拠）
                var chk = selTd.querySelector(".yukou-check");
                if(chk){
                    if(e.key===" "||e.key==="Spacebar"||e.code==="Space"){
                        e.preventDefault();
                        if(chk.disabled) return;
                        chk.checked = !chk.checked;
                        try{ chk.dispatchEvent(new Event("change",{bubbles:true})); }catch(ev){}
                        return;
                    }
                    if(e.key==="Enter"||e.key==="F2"||e.key==="Backspace"||e.key==="Delete"||
                       (e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey)){
                        e.preventDefault(); return;
                    }
                }
                if(e.key==="Enter"||e.key==="F2"){ startEdit(selTd); e.preventDefault(); return; }
                else if(e.key==="Backspace"||e.key==="Delete"){ startEdit(selTd,""); e.preventDefault(); return; }
                else if(e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){
                    startEdit(selTd, e.key); e.preventDefault(); return;
                }

                if(target){ e.preventDefault(); selectTd(target); target.scrollIntoView({block:"nearest",inline:"nearest"}); }
            });

            document.addEventListener("mousedown", function(e){
                if(!e.target.closest("#gridBody")){ stopEdit(); clearSel(); }
            });
        })();
    </script>
