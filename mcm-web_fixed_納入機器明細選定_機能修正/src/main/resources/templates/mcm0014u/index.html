<!DOCTYPE html>
<!--
  【変換元】Mcm0014uScreen.Designer.vb + Mcm0014uScreen.vb
  MCM0014U — 納入機器明細選定（パターンF: 画面間データ連携型）

  ★ 2026-06-16 修正:
    - セット数をテキスト入力に変更
    - 明細行の納入区分/数量/備考を入力可能に
    - 設定ボタンのformで明細編集値を送信
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCM0014U — 納入機器明細選定</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/mcm0014u.css}" />
    <script th:src="@{/js/common.js}"></script>
</head>
<body class="mcm0014u-screen">

<div class="screen-header">
    <h1>納入機器明細選定（MCM0014U）</h1>
    <button type="button" id="btnClose14" form="editForm" class="header-close">閉じる</button>
</div>

<div th:if="${message}" class="msg-success" th:text="${message}"></div>
<div th:if="${errors}" class="msg-error">
    <ul><li th:each="e : ${errors}" th:text="${e}"></li></ul>
</div>

<form id="editForm" data-mcm-no-progress novalidate th:action="@{/mcm0014u/settei}" method="post" th:data-changed="${hasChanges}">
<input type="hidden" id="editToken" name="editToken" th:value="${form.editToken}">
<!-- ===== 検索条件 ===== -->

    <div class="search-area">
        <div class="search-row">
            <div class="search-item">
                <label for="seizomakerText">製造メーカー:</label>
                <input id="seizomakerText" name="seizomakerText" class="text-input" list="makerOptions" th:value="${form.seizomakerText}" autocomplete="off" />
                <input id="seizomakerId" name="seizomakerId" type="hidden" th:value="${form.seizomakerId}" />
                <datalist id="makerOptions">
                    <option th:each="c : ${seizomakerCombo}"
                            th:value="${c.SEIZOMAKER_NK}"
                            th:text="${c.SEIZOMAKER_NK}"
                            th:data-id="${c.SEIZOMAKER_ID}"></option>
                </datalist>
            </div>
            <div class="search-item">
                <label for="kikihinmeiNk">品名:</label>
                <input type="text" id="kikihinmeiNk" name="kikihinmeiNk"
                       th:value="${form.kikihinmeiNk}" class="text-input" />
            </div>
            <div class="search-item">
                <label for="kikikatashiki">型式:</label>
                <input type="text" id="kikikatashiki" name="kikikatashiki"
                       th:value="${form.kikikatashiki}" class="text-input" />
            </div>
        </div>
        <div class="search-row">
            <div class="search-item">
                <label for="kikibunruiId">機器分類:</label>
                <select id="kikibunruiId" name="kikibunruiId" class="combo">
                    <option value="">-- 全て --</option>
                    <option th:each="c : ${kikibunruiCombo}"
                            th:value="${c.KIKIBUNRUI_ID}"
                            th:text="${c.KIKIBUNRUI_NK}"
                            th:selected="${c.KIKIBUNRUI_ID == form.kikibunruiId}"></option>
                </select>
            </div>
            <div class="search-item">
                <label for="torihikisakiId">取引先:</label>
                <select id="torihikisakiId" name="torihikisakiId" class="combo">
                    <option value="">-- 全て --</option>
                    <option th:each="c : ${torihikisakiCombo}"
                            th:value="${c.TORIHIKISAKI_ID}"
                            th:text="${c.TORIHIKISAKI_NK}"
                            th:selected="${c.TORIHIKISAKI_ID == form.torihikisakiId}"></option>
                </select>
            </div>
            <div class="search-item search-action">
                <button type="button" id="btnSearch14" class="btn btn-primary">検索</button>
            </div>
        </div>
    </div>


<!-- ===== Section 1: 取扱機器（DataGridView ReadOnly） ===== -->
<div class="section equipment-section">
    <div class="section-header"><h2>&lt;&lt; 取扱機器 &gt;&gt;</h2></div>
    <div class="table-container">
        <table id="atsukaikikiTable" class="data-grid readonly" th:data-selected-equipment="${form.selectedAtsukaikikiId}">
            <colgroup><col style="width:48px"><col style="width:150px"><col style="width:220px"><col style="width:220px"><col style="width:180px"><col style="width:200px"></colgroup>
            <thead>
                <tr>
                    <th>選択</th>
                    <th>製造メーカー</th>
                    <th>品名</th>
                    <th>型式</th>
                    <th>機器分類</th>
                    <th>備考</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${atsukaikikiList}" class="equipment-row" tabindex="0"
                    th:data-equipment-id="${row.ATSUKAIKIKI_ID}">
                    <td class="center">
                            <button type="button" class="link-btn" th:if="${row.SELECTABLE != null and row.SELECTABLE > 0}" th:data-equipment-id="${row.ATSUKAIKIKI_ID}">選択</button>
                        
                    </td>
                    <td th:text="${row.SEIZOMAKER_NK}"></td>
                    <td th:text="${row.ATSUKAIKIKI_NK}"></td>
                    <td th:text="${row.KATASHIKI}"></td>
                    <td th:text="${row.KIKIBUNRUI_NK}"></td>
                    <td th:text="${row.BIKO}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(atsukaikikiList)}">
                    <td colspan="6" class="no-data">検索条件を入力して検索してください</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>


<!-- VB: 取扱機器の選択行に連動する取引先一覧 -->
<div class="partner-area" aria-label="選択した取扱機器の取引先">
    <div class="table-container partner-container">
        <table id="partnerTable" class="data-grid">
            <colgroup><col style="width:50px"><col style="width:110px"><col style="width:250px"></colgroup>
            <thead><tr><th>無効</th><th>取引先コード</th><th>取引先</th></tr></thead>
            <tbody>
                <tr th:each="row : ${atsukaikikiPartnerList}" class="partner-row" hidden
                    th:data-equipment-id="${row.ATSUKAIKIKI_ID}">
                    <td class="center"><input type="checkbox" disabled aria-label="無効"
                        th:checked="${row.YUKO_FLG != null and row.YUKO_FLG != 0}" /></td>
                    <td th:text="${row.TORIHIKISAKI_CD}"></td>
                    <td th:text="${row.TORIHIKISAKI_NK}"></td>
                </tr>
                <tr id="partnerEmpty"><td colspan="3" class="no-data">取扱機器を選択してください</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ===== Section 2: 構成明細（★ 修正: 設定formで包含し入力可能に） ===== -->

    <div class="section details-section">
        <div class="section-header">
            <h2>&lt;&lt; 1セット分の構成明細 &gt;&gt;</h2>
            <div class="section-note">
                <span>（</span><label for="patternName">機器構成パターン</label>
                <input id="patternName" class="text-input pattern-name" type="text" readonly th:value="${form.kikikoseiNk}" />
                <input id="setCount" type="text" name="setNm" th:value="${form.setNmText}" class="text-input set-count" />
                <label for="setCount">セット</label><span>）</span>
            </div>
            <button id="deleteSelectedRow" type="button" class="btn btn-secondary" disabled>行削除</button>
        </div>
        <div class="table-container meisai-container">
            <table id="meisaiTable" class="data-grid editable">
                <colgroup><col style="width:32px"><col style="width:60px"><col style="width:80px"><col style="width:130px"><col style="width:220px"><col style="width:220px"><col style="width:180px"><col style="width:60px"><col style="width:267px"><col style="width:115px"><col style="width:70px"><col style="width:115px"><col style="width:70px"></colgroup>
            <thead>
                    <tr>
                        <th aria-label="行選択"></th>
                        <th>No</th>
                        <th>納入区分</th>
                        <th>製造メーカー</th>
                        <th>品名</th>
                        <th>型式</th>
                        <th>機器分類</th>
                        <th>数量</th>
                        <th>備考</th>
						<th>登録日時</th>
						<th>登録者</th>
						<th>更新日時</th>
						<th>更新者</th>
                        
                    </tr>
                </thead>
                <tbody>
                    <tr class="detail-row" th:data-row-index="${stat.index}" th:each="row, stat : ${form.meisaiRows}"
                        th:if="${row.rowStatus != 'Delete' and row.rowStatus != 'deleted'}"
                        th:classappend="${row.rowStatus == 'Added' or row.rowStatus == 'new'} ? 'new-row' : ''">
                        <td class="center row-select"><input type="hidden" name="editRowKey" th:value="${stat.index}" /><input type="radio" name="selectedMeisaiRow" th:value="${stat.index}" aria-label="明細行を選択" /></td>
                        <td class="right"><input name="editHyojijun" class="text-input order-input" aria-label="No" th:value="${row.hyojijunText}" /></td>
                        <!-- ★ 修正: 納入区分をプルダウンに変更 -->
						<td>
						    <select name="editNounyuKbn" class="grid-input">
						        <option value=""></option>
						        <option th:each="item : ${nounyukubunList}"
						                th:value="${item.key}"
						                th:text="${item.value}"
						                th:selected="${item.key == row.nounyuKbn}">
						        </option>
						    </select>
						</td>
                        <td th:text="${row.seizomakerNk}"></td>
                        <td th:text="${row.kikihinmeiNk}"></td>
                        <td th:text="${row.kikikatashiki}"></td>
                        <td th:text="${row.kikibunruiNk}"></td>
                        <!-- ★ 修正: 数量をテキスト入力に変更 -->
                        <td>
                            <input type="text" name="editSuryoNm" th:value="${row.suryoNmText}"
                                   style="text-align:right;"
                                   class="text-input" />
                        </td>
                        <!-- ★ 修正: 備考をテキスト入力に変更 -->
                        <td>
                            <input type="text" name="editBiko" th:value="${row.biko}"
                                   
                                   class="text-input" />
                        </td>
						<td th:text="${row.createdDt != null ? #temporals.format(row.createdDt, 'yyyy/MM/dd HH:mm') : ''}"
						        ></td>
					    <td th:text="${row.createdBy}" ></td>
					    <td th:text="${row.lastupdateDt != null ? #temporals.format(row.lastupdateDt, 'yyyy/MM/dd HH:mm') : ''}"
					        ></td>
					    <td th:text="${row.lastupdateBy}" ></td>

                    </tr>
                    <tr th:if="${activeMeisaiCount == 0}">
                        <td colspan="13" class="no-data">取扱機器を検索して「選択」してください</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== フッターボタン ===== -->
    <div class="footer-buttons">
        <button type="submit" id="btnSettei14" class="btn btn-primary">設定</button>
    </div>


</form>
<dialog id="messageDialog" class="mcm14-dialog" role="alertdialog" aria-labelledby="dialogTitle" aria-describedby="dialogMessage">
 <div class="dialog-head"><span id="dialogTitle"></span><button type="button" id="dialogClose" aria-label="閉じる">×</button></div>
 <div class="dialog-body"><span id="dialogIcon" aria-hidden="true">!</span><span id="dialogMessage"></span></div>
 <div class="dialog-foot"><button type="button" id="dialogOk">OK</button><button type="button" id="dialogCancel" hidden>キャンセル</button></div>
</dialog>
<script th:src="@{/js/mcm0014u.js}"></script>
</body></html>
