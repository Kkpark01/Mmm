<!DOCTYPE html>
<!-- Mcm2007uScreen.Designer.vb / Mcm2007uScreen.vb: Step1の見積選択と参照明細 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCM2007U - ユーザ契約内容変更 Step1</title>
<script th:src="@{/js/common.js}"></script><link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/><script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
<link rel="stylesheet" th:href="@{/css/mcm-customer-screens.css(v=20260911-title2)}"/><link rel="stylesheet" th:href="@{/css/mcm2007u-step1.css(v=20260912-step1)}"/><script defer th:src="@{/js/mcm2007u-step1.js(v=20260912-step1)}"></script></head>
<body class="mcm-customer-screen mcm2007u-step1"><div class="header"><div class="header-left"></div><div class="header-center"><h1>ユーザ契約内容変更（MCM2007U）</h1></div><div class="header-right"><a th:href="@{/mcm2007u/back}" class="btn-close">閉じる</a></div></div>
<div class="msg-area"><th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block></div>
<form id="selectionForm" th:action="@{/mcm2007u/step2}" method="post"><input type="hidden" name="workflowToken" th:value="${workflowToken}"/><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/><input type="hidden" id="selectedEstimateIndex" name="selectedEstimateIndex" th:value="${form.selectedEstimateIndex}"/>
<noscript>見積の切替と選択にはJavaScriptを有効にしてください。</noscript><div class="selection-workspace"><main class="selection-canvas">
<div class="context-grid">
<label for="nonyusakiCd">納入先コード</label><input id="nonyusakiCd" readonly th:value="${form.nonyusakiCd}"/><label for="nonyusakiNk">納入先名</label><input id="nonyusakiNk" readonly th:value="${form.nonyusakiNk}"/>
<label for="supportId">サポートID</label><input id="supportId" readonly th:value="${form.supportId}"/><label for="plantNk">プラント名</label><input id="plantNk" readonly th:value="${form.plantNk}"/>
<label for="contractNo">契約NO</label><input id="contractNo" readonly th:value="${contractNo}"/><label for="kaisiDt">期間</label><div class="period-fields"><input id="kaisiDt" name="kaisiDt" th:value="${form.kaisiDt}" th:readonly="${form.ukKeiyakuId != null}" aria-label="期間の開始日" placeholder="yyyy/MM/dd"/><span>～</span><input id="syuryoDt" name="syuryoDt" th:value="${form.syuryoDt}" aria-label="期間の終了日" placeholder="yyyy/MM/dd"/></div>
</div><div class="top-grids"><section><h2 class="grid-heading">≪店舗見積情報≫</h2><div class="grid-scroll" id="estimateScroll"><table class="data-grid" id="estimateTable" style="width:470px"><colgroup><col style="width:32px"/><col style="width:30px"/><col style="width:100px"/><col style="width:90px"/><col style="width:69px"/><col style="width:69px"/><col style="width:80px"/></colgroup><thead><tr><th aria-label="行番号"></th><th></th><th>見積NO</th><th>見積作成日</th><th>開始日</th><th>終了日</th><th>見積金額</th></tr></thead><tbody><tr th:each="row,stat : ${form.mitsumoriRows}" th:attr="data-estimate=${stat.index}" tabindex="0"><td class="row-number" th:text="${stat.count}"></td><td class="check-cell"><input type="checkbox" class="estimate-check" th:checked="${row.checkFlg}" th:attr="aria-label=|見積 ${row.umMitsumoriNo} ${row.kaisiDt} を選択|"/></td><td th:text="${row.display['UM_MITSUMORI_NO']}" th:title="${row.display['UM_MITSUMORI_NO']}"></td><td th:text="${row.display['MITSUMORI_DT']}" th:title="${row.display['MITSUMORI_DT']}"></td><td th:text="${row.display['KAISI_DT']}" th:title="${row.display['KAISI_DT']}"></td><td th:text="${row.display['SYURYO_DT']}" th:title="${row.display['SYURYO_DT']}"></td><td class="amount" th:text="${row.display['MITSUMORI_GKIN']}" th:title="${row.display['MITSUMORI_GKIN']}"></td></tr></tbody></table><p class="empty-grid" th:if="${form.mitsumoriRows.isEmpty()}">対象の店舗見積がありません（承認済み・廃棄でない見積が必要です）。</p></div></section><section><h2 class="grid-heading">≪ブランド≫</h2><div class="grid-scroll" id="brandScroll"><table class="data-grid" id="brandTable" style="width:1127px"><colgroup><col style="width:32px"/><col style="width:100px"/><col style="width:100px"/><col style="width:60px"/><col style="width:90px"/><col style="width:100px"/><col style="width:85px"/><col style="width:95px"/><col style="width:95px"/><col style="width:80px"/><col style="width:90px"/><col style="width:200px"/></colgroup><thead><tr><th aria-label="行番号"></th><th>ブランド名</th><th>ブランド詳細</th><th>時間</th><th>保守方法</th><th>DREMOS契約</th><th>リモート保守</th><th>ハード保守費</th><th>ソフト保守費</th><th>調整費</th><th>保守費</th><th>備考</th></tr></thead><tbody th:each="estimate,stat : ${form.mitsumoriRows}" th:attr="data-estimate-panel=${stat.index}"><tr th:each="row,bs : ${estimate.brandRows}"><td class="row-number"><span th:text="${bs.count}"></span><input hidden type="checkbox" name="brandSelection" th:value="${brands.indexOf(row)}" th:checked="${row.checkFlg}"/></td><td th:text="${row.display['BRAND_NK']}" th:title="${row.display['BRAND_NK']}"></td><td th:text="${row.display['BRANDSYOSAI_NK']}" th:title="${row.display['BRANDSYOSAI_NK']}"></td><td th:text="${row.display['KEIYAKUJIKANTAI']}" th:title="${row.display['KEIYAKUJIKANTAI']}"></td><td th:text="${({'F':'オンサイト','S':'センドバック','C':'コンテック製品','H':'持ち帰り','I':'スポット','T':'TEL対応'})[row.display['HOSYUHOHO']]}" th:title="${({'F':'オンサイト','S':'センドバック','C':'コンテック製品','H':'持ち帰り','I':'スポット','T':'TEL対応'})[row.display['HOSYUHOHO']]}"></td><td class="check-cell"><input type="checkbox" disabled th:checked="${row.display['DREMOS_FLG'] == '1'}" aria-label="契約フラグ"/></td><td class="check-cell"><input type="checkbox" disabled th:checked="${row.display['REMOTE_FLG'] == '1'}" aria-label="契約フラグ"/></td><td class="amount" th:text="${row.display['HARDHOSYU_KIN']}" th:title="${row.display['HARDHOSYU_KIN']}"></td><td class="amount" th:text="${row.display['HOSEISOFTHOSHU_KIN']}" th:title="${row.display['HOSEISOFTHOSHU_KIN']}"></td><td class="amount" th:text="${row.display['CHOSEI_KIN']}" th:title="${row.display['CHOSEI_KIN']}"></td><td class="amount" th:text="${row.display['HOSHU_KIN']}" th:title="${row.display['HOSHU_KIN']}"></td><td th:text="${row.display['BIKO']}" th:title="${row.display['BIKO']}"></td></tr></tbody></table><p class="empty-grid" id="brandEmpty" hidden>ブランド情報がありません。</p></div></section></div>
<section class="preview-section"><h2 class="grid-heading">≪機器明細≫</h2><div class="grid-scroll" id="previewScroll"><table class="data-grid" id="previewTable" style="width:1697px"><colgroup><col style="width:32px"/><col style="width:100px"/><col style="width:110px"/><col style="width:100px"/><col style="width:100px"/><col style="width:110px"/><col style="width:100px"/><col style="width:55px"/><col style="width:100px"/><col style="width:70px"/><col style="width:100px"/><col style="width:100px"/><col style="width:150px"/><col style="width:90px"/><col style="width:90px"/><col style="width:90px"/><col style="width:100px"/><col style="width:100px"/></colgroup><thead><tr><th aria-label="行番号"></th><th>ブランド名</th><th>ブランド詳細名</th><th>手配製番</th><th>製造メーカー</th><th>品名</th><th>型式</th><th>数量</th><th>標準価格</th><th>パック契約</th><th>契約内容</th><th>契約番号</th><th>保守時間</th><th>点検回数</th><th>点検曜日</th><th>保守方法</th><th>サービス形態</th><th>備考</th></tr></thead><tbody th:each="estimate,stat : ${form.mitsumoriRows}" th:attr="data-estimate-panel=${stat.index}"><tr th:each="row,ds : ${estimate.previewRows}"><td class="row-number" th:text="${ds.count}"></td><td th:text="${row['BRAND_NK']}" th:title="${row['BRAND_NK']}"></td><td th:text="${row['BRANDSYOSAI_NK']}" th:title="${row['BRANDSYOSAI_NK']}"></td><td th:text="${row['TEHAISEIBAN']}" th:title="${row['TEHAISEIBAN']}"></td><td th:text="${row['SEIZOMAKER_NK']}" th:title="${row['SEIZOMAKER_NK']}"></td><td th:text="${row['KIKIHINMEI_NK']}" th:title="${row['KIKIHINMEI_NK']}"></td><td th:text="${row['KIKIKATASHIKI']}" th:title="${row['KIKIKATASHIKI']}"></td><td class="amount" th:text="${row['SURYO_NM']}" th:title="${row['SURYO_NM']}"></td><td class="amount" th:text="${row['HYOJUN_KIN']}" th:title="${row['HYOJUN_KIN']}"></td><td class="check-cell"><input type="checkbox" disabled th:checked="${row['PACK_FLG'] == '1'}" aria-label="契約フラグ"/></td><td th:text="${row['KEIYAKUNAIYO']}" th:title="${row['KEIYAKUNAIYO']}"></td><td th:text="${row['KEIYAKU_NO']}" th:title="${row['KEIYAKU_NO']}"></td><td th:text="${supportHours[row['DAIFUKUHOSYUJIKAN_ID']]}" th:title="${supportHours[row['DAIFUKUHOSYUJIKAN_ID']]}"></td><td class="amount" th:text="${row['TENKENKAISU']}" th:title="${row['TENKENKAISU']}"></td><td th:text="${({'1':'月～金','2':'月～土','3':'月～日','4':'土・日'})[row['TENKENYOBI']]}" th:title="${({'1':'月～金','2':'月～土','3':'月～日','4':'土・日'})[row['TENKENYOBI']]}"></td><td th:text="${({'F':'オンサイト','S':'センドバック','C':'コンテック製品','H':'持ち帰り','I':'スポット','T':'TEL対応'})[row['HOSYUHOHO']]}" th:title="${({'F':'オンサイト','S':'センドバック','C':'コンテック製品','H':'持ち帰り','I':'スポット','T':'TEL対応'})[row['HOSYUHOHO']]}"></td><td th:text="${row['SERVICEKEITAI']}" th:title="${row['SERVICEKEITAI']}"></td><td th:text="${row['BIKO']}" th:title="${row['BIKO']}"></td></tr></tbody></table><p class="empty-grid" id="previewEmpty" hidden>機器明細がありません。</p></div></section>
</main></div><div class="footer-actions"><span class="step-caption">1 / 2　店舗見積選択</span><button type="submit" class="btn-primary" id="nextButton">次へ</button></div></form></body></html>
