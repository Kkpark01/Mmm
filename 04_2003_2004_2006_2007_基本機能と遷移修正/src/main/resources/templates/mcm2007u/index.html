<!DOCTYPE html>
<!--
  【変換元】Mcm2007uScreen1.Designer.vb / Mcm2007uScreen1.vb
  MCM2007U Step1 — 店舗見積・ブランド選択
  DB書き込みなし（SELECT専用）
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf"        th:content="${_csrf != null} ? ${_csrf.token}      : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM2007U - ユーザ契約内容変更 Step1</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI","Yu Gothic UI","Meiryo",sans-serif; font-size: 12px; background: #fff; }
        button { cursor: pointer; -webkit-user-select: none; user-select: none; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 { margin: 0; font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 1px; line-height: 30px; }
        .header .header-left, .header .header-right { display: flex; align-items: center; }
        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; line-height: 1.6;
        }
        .btn-close:hover { background-color: #e5f1fb; border-color: #7eb4ea; }

        .action-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #ccc; background: #f0f0f0; }
        .btn-primary { padding: 3px 14px; font-size: 12px; background: #0078d4; color: #fff; border: 1px solid #0067b8; border-radius: 2px; }
        .btn-primary:hover:not(:disabled) { background: #0067b8; }
        .btn-default { padding: 3px 14px; font-size: 12px; background: #e1e1e1; color: #000; border: 1px solid #adadad; border-radius: 2px; }
        .btn-default:hover { background: #e5f1fb; border-color: #0078d4; }

        .msg-area { padding: 4px 10px; }
        .msg-error { background: #f8d7da; border: 1px solid #f5c2c7; color: #842029; padding: 4px 10px; border-radius: 3px; margin-bottom: 4px; }

        .section { padding: 6px 10px; border-bottom: 1px solid #e0e0e0; }
        .section-title { font-size: 12px; font-weight: bold; color: #fff; background: #453f78; padding: 2px 8px; margin-bottom: 6px; display: inline-block; border-radius: 2px; }
        .form-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .form-row label { white-space: nowrap; min-width: 80px; color: #333; font-size: 12px; }
        .form-row input[type="text"] { height: 22px; border: 1px solid #aaa; padding: 0 4px; font-size: 12px; border-radius: 2px; }

        .data-grid { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
        .data-grid th { background: #453f78; color: #fff; padding: 3px 6px; text-align: left; font-weight: bold; white-space: nowrap; border: 1px solid #6860a0; }
        .data-grid td { padding: 2px 6px; border: 1px solid #ddd; }
        .data-grid tr:nth-child(even) td { background: #f8f6ff; }
        .data-grid tr:hover td { background: #e8e0f0; }
        .data-grid input[type="checkbox"] { cursor: pointer; }

        .step-indicator { padding: 6px 10px; background: #f5f0ff; border-bottom: 1px solid #d0c8e8; font-size: 12px; color: #453f78; }
        .step-indicator strong { font-size: 13px; }
    </style>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
    <div class="header-left">
        <span th:text="${functionId}" style="font-size:11px; opacity:0.8;"></span>
    </div>
    <div class="header-center"><h1>ユーザ契約内容変更</h1></div>
    <div class="header-right">
        <a th:href="@{/mcm2007u/back}" class="btn-close">キャンセル</a>
    </div>
</div>

<!-- ステップインジケータ -->
<div class="step-indicator">
    <strong>Step 1/2</strong> — 店舗見積・ブランド選択　→　Step 2: 機器構成・個体選択
</div>

<!-- メッセージ -->
<div class="msg-area">
    <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
</div>

<!-- フォーム -->
<form th:action="@{/mcm2007u/step2}" method="post">
    <input type="hidden" name="workflowToken" th:value="${workflowToken}"/>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

    <!-- 期間入力 -->
    <div class="section">
        <span class="section-title">適用期間</span>
        <div class="form-row">
            <label>開始日</label>
            <input type="text" name="kaisiDt" th:value="${form.kaisiDt}" th:readonly="${form.ukKeiyakuId != null}" placeholder="yyyy/MM/dd" style="width:100px;"/>
            <label>終了日 <span style="color:red;">*</span></label>
            <input type="text" name="syuryoDt" th:value="${form.syuryoDt}" placeholder="yyyy/MM/dd" style="width:100px;"/>
        </div>
    </div>

    <!-- 店舗見積一覧 -->
    <div class="section">
        <span class="section-title">店舗見積選択</span>
        <div th:if="${form.mitsumoriRows.isEmpty()}" style="color:#888; padding:4px;">
            対象の店舗見積がありません（承認済み・廃棄でない見積が必要です）
        </div>
        <table class="data-grid" th:if="${!form.mitsumoriRows.isEmpty()}">
            <thead>
                <tr>
                    <th style="width:40px;">選択</th>
                    <th>見積NO</th>
                    <th>開始日</th>
                    <th>終了日</th>
                    <th>ブランド名</th>
                    <th>ブランド詳細名</th>
                    <th>契約時間帯</th>
                    <th>保守方法</th>
                </tr>
            </thead>
            <tbody>
                <th:block th:each="mitsumori, mStat : ${form.mitsumoriRows}">
                    <tr th:each="brand, bStat : ${mitsumori.brandRows}">
                        <td style="text-align:center;">
                            <input type="checkbox"
                                   name="brandSelection" th:value="${brands.indexOf(brand)}"
                                   th:checked="${brand.checkFlg}"/>
                        </td>
                        <!-- 見積行（ブランドが複数の場合も個別に表示） -->
                        <td th:text="${mitsumori.umMitsumoriNo}"></td>
                        <td th:text="${mitsumori.kaisiDt}"></td>
                        <td th:text="${mitsumori.syuryoDt}"></td>
                        <td th:text="${brand.brandNk}"></td>
                        <td th:text="${brand.brandsyosaiNk}"></td>
                        <td th:text="${brand.keiyakujikantai}"></td>
                        <td th:text="${brand.hosyuhoho}"></td>
                    </tr>
                </th:block>
            </tbody>
        </table>
    </div>

    <!-- アクション -->
    <div class="action-bar">
        <button type="submit" class="btn-primary">次へ &gt;</button>
        <a th:href="@{/mcm2007u/back}" class="btn-default" style="text-decoration:none; padding:3px 14px;">キャンセル</a>
    </div>
</form>

</body>
</html>
