<!DOCTYPE html>
<!--
  【変換元】Mcm2007uScreen2.Designer.vb / Mcm2007uScreen2.vb
  MCM2007U Step2 — 機器構成・機器明細・個体管理選択
  DB書き込みなし（SELECT専用）
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf"        th:content="${_csrf != null} ? ${_csrf.token}      : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM2007U - ユーザ契約内容変更 Step2</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI","Yu Gothic UI","Meiryo",sans-serif; font-size: 12px; background: #fff; }
        button, a.btn-default { cursor: pointer; -webkit-user-select: none; user-select: none; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 { margin: 0; font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 1px; line-height: 30px; }
        .header .header-left, .header .header-right { display: flex; align-items: center; }
        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; line-height: 1.6;
        }
        .btn-close:hover { background-color: #e5f1fb; border-color: #7eb4ea; }

        .action-bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #ccc; background: #f0f0f0; }
        .btn-primary { padding: 3px 14px; font-size: 12px; background: #0078d4; color: #fff; border: 1px solid #0067b8; border-radius: 2px; }
        .btn-primary:hover:not(:disabled) { background: #0067b8; }
        .btn-default { padding: 3px 14px; font-size: 12px; background: #e1e1e1; color: #000; border: 1px solid #adadad; border-radius: 2px; text-decoration: none; }
        .btn-default:hover { background: #e5f1fb; border-color: #0078d4; }

        .msg-area { padding: 4px 10px; }
        .msg-error { background: #f8d7da; border: 1px solid #f5c2c7; color: #842029; padding: 4px 10px; border-radius: 3px; margin-bottom: 4px; }

        .section { padding: 6px 10px; border-bottom: 1px solid #e0e0e0; }
        .section-title { font-size: 12px; font-weight: bold; color: #fff; background: #453f78; padding: 2px 8px; margin-bottom: 6px; display: inline-block; border-radius: 2px; }

        .data-grid { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
        .data-grid th { background: #453f78; color: #fff; padding: 3px 6px; text-align: left; font-weight: bold; white-space: nowrap; border: 1px solid #6860a0; }
        .data-grid td { padding: 2px 6px; border: 1px solid #ddd; }
        .data-grid tr:nth-child(even) td { background: #f8f6ff; }
        .data-grid tr:hover td { background: #e8e0f0; }
        .data-grid input[type="checkbox"] { cursor: pointer; }

        .step-indicator { padding: 6px 10px; background: #f5f0ff; border-bottom: 1px solid #d0c8e8; font-size: 12px; color: #453f78; }
        .step-indicator strong { font-size: 13px; }

        .period-info { padding: 4px 10px; background: #f5f0ff; border-bottom: 1px solid #d0c8e8; font-size: 12px; color: #453f78; }

        /* 全選択チェックボックス */
        .check-all { font-size: 11px; margin-left: 4px; color: #0078d4; cursor: pointer; }
    </style>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
    <div class="header-left">
        <span th:text="${functionId}" style="font-size:11px; opacity:0.8;"></span>
    </div>
    <div class="header-center"><h1>ユーザ契約内容変更</h1></div>
    <div class="header-right">
        <a th:href="@{/mcm2007u/back}" class="btn-close">キャンセル</a>
    </div>
</div>

<!-- ステップインジケータ -->
<div class="step-indicator">
    Step 1: 店舗見積・ブランド選択　→　<strong>Step 2/2</strong> — 機器構成・個体選択
</div>

<!-- 期間情報 -->
<div class="period-info">
    適用期間: <strong th:text="${form.kaisiDt}"></strong>
    ～ <strong th:text="${form.syuryoDt}"></strong>
</div>

<!-- メッセージ -->
<div class="msg-area">
    <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
</div>

<!-- 適用フォーム -->
<form th:action="@{/mcm2007u/apply}" method="post">
    <input type="hidden" name="workflowToken" th:value="${workflowToken}"/>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
    <!-- Step1のコンテキストを引き継ぐ隠しフィールド -->

    <!-- 機器構成グリッド -->
    <div class="section">
        <span class="section-title">機器構成選択
            <input type="checkbox" id="chkAllKosei" class="check-all" title="全選択/解除"
                   onchange="toggleAll('kosei', this.checked)"/>
        </span>
        <div th:if="${form.koseiRows.isEmpty()}" style="color:#888; padding:4px;">機器構成データがありません</div>
        <table class="data-grid" th:if="${!form.koseiRows.isEmpty()}">
            <thead>
                <tr>
                    <th style="width:36px;"><input type="checkbox" onchange="toggleAll('kosei', this.checked)" title="全選択"/></th>
                    <th>機器構成名</th>
                    <th>セット名</th>
                    <th>単位</th>
                    <th>手配製番</th>
                    <th>コントローラ</th>
                    <th>保守方法</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="kosei, kStat : ${form.koseiRows}">
                    <td style="text-align:center;">
                        <input type="checkbox"
                               class="chk-kosei"
                               name="koseiSelection" th:value="${kStat.index}" th:attr="data-brand=${kosei.brandkoseiId},data-kosei=${kosei.kikikoseiId}"
                               th:checked="${kosei.checkFlg}"/>
                    </td>
                    <td th:text="${kosei.kikikoseiNk}"></td>
                    <td th:text="${kosei.setNm}"></td>
                    <td th:text="${kosei.tani}"></td>
                    <td th:text="${kosei.tehaiseiban}"></td>
                    <td th:text="${kosei.controllerFlg}"></td>
                    <td th:text="${kosei.hosyuhoho}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 機器明細グリッド -->
    <div class="section">
        <span class="section-title">機器明細選択</span>
        <div th:if="${form.meisaiRows.isEmpty()}" style="color:#888; padding:4px;">機器明細データがありません</div>
        <table class="data-grid" th:if="${!form.meisaiRows.isEmpty()}">
            <thead>
                <tr>
                    <th style="width:36px;"><input type="checkbox" onchange="toggleAll('meisai', this.checked)" title="全選択"/></th>
                    <th>品名</th>
                    <th>型式</th>
                    <th>数量</th>
                    <th>メーカー</th>
                    <th>保守方法</th>
                    <th>点検回数</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="meisai, mStat : ${form.meisaiRows}">
                    <td style="text-align:center;">
                        <input type="checkbox"
                               class="chk-meisai"
                               name="meisaiSelection" th:value="${mStat.index}" th:attr="data-brand=${meisai.brandkoseiId},data-kosei=${meisai.kikikoseiId},data-meisai=${meisai.kikimeisaiId}"
                               th:checked="${meisai.checkFlg}"/>
                    </td>
                    <td th:text="${meisai.kikihinmeiNk}"></td>
                    <td th:text="${meisai.kikikatashiki}"></td>
                    <td th:text="${meisai.suryoNm}"></td>
                    <td th:text="${meisai.seizomankerNk}"></td>
                    <td th:text="${meisai.hosyuhoho}"></td>
                    <td th:text="${meisai.tenkenkaisu}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 個体管理グリッド -->
    <div class="section">
        <span class="section-title">個体選択</span>
        <div th:if="${form.kotaiRows.isEmpty()}" style="color:#888; padding:4px;">個体管理データがありません</div>
        <table class="data-grid" th:if="${!form.kotaiRows.isEmpty()}">
            <thead>
                <tr>
                    <th style="width:36px;"><input type="checkbox" onchange="toggleAll('kotai', this.checked)" title="全選択"/></th>
                    <th>個体名</th>
                    <th>シリアルNO</th>
                    <th>設置場所</th>
                    <th>一時納入日</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="kotai, kStat : ${form.kotaiRows}">
                    <td style="text-align:center;">
                        <input type="checkbox"
                               class="chk-kotai"
                               name="kotaiSelection" th:value="${kStat.index}" th:attr="data-brand=${kotai.brandkoseiId},data-kosei=${kotai.kikikoseiId},data-meisai=${kotai.kikimeisaiId}"
                               th:checked="${kotai.checkFlg}"/>
                    </td>
                    <td th:text="${kotai.kotaiNk}"></td>
                    <td th:text="${kotai.serialNo}"></td>
                    <td th:text="${kotai.setchibasyo}"></td>
                    <td th:text="${kotai.itizinonnyuDt}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- アクション -->
    <div class="action-bar">
        <button type="submit" class="btn-primary">適用</button>
        <button type="submit" th:formaction="@{/mcm2007u/previous}" class="btn-default">&lt; 戻る (Step1)</button>
        <a th:href="@{/mcm2007u/back}" class="btn-default">キャンセル</a>
    </div>

</form>

<script th:src="@{/js/mcm2007u.js}"></script>

</body>
</html>
