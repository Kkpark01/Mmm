<!DOCTYPE html>
<!-- Mcm2007u2Screen.Designer.vb / Mcm2007u2Screen.vb: ブランド→構成と明細→個体 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>MCM2007U - ユーザ契約内容変更 Step2</title>
<script th:src="@{/js/common.js}"></script><link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/><script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script><link rel="stylesheet" th:href="@{/css/mcm-customer-screens.css(v=20260911-title2)}"/><link rel="stylesheet" th:href="@{/css/mcm2007u-step2.css(v=20260912-buttons)}"/><script defer th:src="@{/js/mcm2007u.js(v=20260912-buttons)}"></script></head>
<body class="mcm-customer-screen mcm2007u-step2"><div class="header"><div class="header-left"><button type="submit" form="equipmentForm" th:formaction="@{/mcm2007u/previous}" class="btn-close" id="previousButton">戻る（Step1）</button></div><div class="header-center"><h1>ユーザ契約内容変更（MCM2007U）</h1></div><div class="header-right"><a th:href="@{/mcm2007u/back}" class="btn-close">閉じる</a></div></div>
<div class="msg-area"><th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block></div>
<form id="equipmentForm" th:action="@{/mcm2007u/apply}" method="post"><input type="hidden" name="workflowToken" th:value="${workflowToken}"/><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/><input type="hidden" id="selectedBrandIndex" name="selectedBrandIndex" th:value="${form.selectedBrandIndex}"/><input type="hidden" id="selectedKoseiIndex" name="selectedKoseiIndex" th:value="${form.selectedKoseiIndex}"/>
<div class="equipment-workspace"><main class="equipment-canvas"><div class="context-grid">
<label for="nonyusakiCd">納入先コード</label><input id="nonyusakiCd" readonly th:value="${form.nonyusakiCd}"/><label for="nonyusakiNk">納入先名</label><input id="nonyusakiNk" readonly th:value="${form.nonyusakiNk}"/>
<label for="supportId">サポートID</label><input id="supportId" readonly th:value="${form.supportId}"/><label for="plantNk">プラント名</label><input id="plantNk" readonly th:value="${form.plantNk}"/>
<label for="contractNo">契約NO</label><input id="contractNo" readonly th:value="${contractNo}"/><label for="kaisiDt">期間</label><div class="period-fields"><input id="kaisiDt" th:value="${form.kaisiDt}" readonly aria-label="期間の開始日" placeholder="yyyy/MM/dd"/><span>～</span><input readonly id="syuryoDt" th:value="${form.syuryoDt}" aria-label="期間の終了日" placeholder="yyyy/MM/dd"/></div>
</div>
<section class="brand-section"><h2 class="grid-heading">《ブランド》</h2><div class="grid-scroll" id="brandScroll"><table class="data-grid" id="brandTable" style="width:652px"><colgroup><col style="width:32px"/><col style="width:100px"/><col style="width:110px"/><col style="width:80px"/><col style="width:90px"/><col style="width:85px"/><col style="width:75px"/><col style="width:80px"/></colgroup><thead><tr><th aria-label="行番号"></th><th>見積NO</th><th>ブランド詳細名</th><th>契約時間</th><th>保守方法</th><th>DREMOS契約</th><th>リモート保守</th><th>ソフト契約</th></tr></thead><tbody><tr th:each="row,stat : ${form.step2Brands}" th:attr="data-brand=${row['BRANDKOSEI_ID']}" th:attrappend="data-index=${stat.index}" tabindex="0"><td class="row-number" th:text="${stat.count}"></td><td th:text="${row['UM_MITSUMORI_NO']}" th:title="${row['UM_MITSUMORI_NO']}"></td><td th:text="${row['BRANDSYOSAI_NK']}" th:title="${row['BRANDSYOSAI_NK']}"></td><td th:text="${row['KEIYAKUJIKANTAI']}" th:title="${row['KEIYAKUJIKANTAI']}"></td><td th:text="${row['SOFTHOSYUHOHO']}" th:title="${row['SOFTHOSYUHOHO']}"></td><td class="check-cell"><input type="checkbox" disabled th:checked="${row['DREMOS_FLG'] == '1'}" aria-label="DREMOS契約"/></td><td class="check-cell"><input type="checkbox" disabled th:checked="${row['REMOTE_FLG'] == '1'}" aria-label="リモート保守"/></td><td class="check-cell"><input type="checkbox" disabled th:checked="${row['SOFT_FLG'] == '1'}" aria-label="ソフト契約"/></td></tr></tbody></table><p class="empty-grid" id="brandEmpty" hidden>表示するデータがありません。</p></div></section>
<div class="middle-grids"><section class="kosei-section"><h2 class="grid-heading">《機器構成パターン》</h2><div class="grid-scroll" id="koseiScroll"><table class="data-grid" id="koseiTable" style="width:592px"><colgroup><col style="width:32px"/><col style="width:30px"/><col style="width:100px"/><col style="width:100px"/><col style="width:75px"/><col style="width:55px"/><col style="width:100px"/><col style="width:100px"/></colgroup><thead><tr><th aria-label="行番号"></th><th class="check-cell"><input type="checkbox" class="check-visible" data-kind="kosei" aria-label="表示中の機器構成を全選択・解除"/></th><th>見積NO</th><th>機器構成名</th><th>セット数</th><th>単位</th><th>手配製番</th><th>備考</th></tr></thead><tbody><tr th:each="row,stat : ${form.koseiRows}" th:attr="data-brand=${row.brandkoseiId},data-kosei=${row.kikikoseiId}" th:attrappend="data-index=${stat.index}" tabindex="0"><td class="row-number" th:text="${stat.count}"></td><td class="check-cell"><input type="checkbox" class="chk-kosei" name="koseiSelection" th:value="${stat.index}" th:checked="${row.checkFlg}" th:disabled="${!row.quoted && !row.checkFlg}" th:attr="data-quoted=${row.quoted},data-brand=${row.brandkoseiId},data-kosei=${row.kikikoseiId}" aria-label="選択"/></td><td th:text="${row.display['UM_MITSUMORI_NO']}" th:title="${row.display['UM_MITSUMORI_NO']}"></td><td th:text="${row.kikikoseiNk}" th:title="${row.kikikoseiNk}"></td><td class="amount" th:text="${row.setNmText}" th:title="${row.setNmText}"></td><td th:text="${row.tani}" th:title="${row.tani}"></td><td th:text="${row.tehaiseiban}" th:title="${row.tehaiseiban}"></td><td th:text="${row.display['BIKO']}" th:title="${row.display['BIKO']}"></td></tr></tbody></table><p class="empty-grid" id="koseiEmpty" hidden>表示するデータがありません。</p></div></section><section class="meisai-section"><h2 class="grid-heading">《１セット分の構成明細》</h2><div class="grid-scroll" id="meisaiScroll"><table class="data-grid" id="meisaiTable" style="width:622px"><colgroup><col style="width:32px"/><col style="width:30px"/><col style="width:100px"/><col style="width:100px"/><col style="width:100px"/><col style="width:100px"/><col style="width:60px"/><col style="width:100px"/></colgroup><thead><tr><th aria-label="行番号"></th><th class="check-cell"><input type="checkbox" class="check-visible" data-kind="meisai" aria-label="表示中の構成明細を全選択・解除"/></th><th>見積NO</th><th>製造メーカー</th><th>品名</th><th>型式</th><th>数量</th><th>備考</th></tr></thead><tbody><tr th:each="row,stat : ${form.meisaiRows}" th:attr="data-brand=${row.brandkoseiId},data-kosei=${row.kikikoseiId}" th:attrappend="data-index=${stat.index}" tabindex="0"><td class="row-number" th:text="${stat.count}"></td><td class="check-cell"><input type="checkbox" class="chk-meisai" name="meisaiSelection" th:value="${stat.index}" th:checked="${row.checkFlg}" th:disabled="${!row.quoted && !row.checkFlg}" th:attr="data-quoted=${row.quoted},data-brand=${row.brandkoseiId},data-kosei=${row.kikikoseiId},data-meisai=${row.kikimeisaiId}" aria-label="選択"/></td><td th:text="${row.display['UM_MITSUMORI_NO']}" th:title="${row.display['UM_MITSUMORI_NO']}"></td><td th:text="${row.seizomankerNk}" th:title="${row.seizomankerNk}"></td><td th:text="${row.kikihinmeiNk}" th:title="${row.kikihinmeiNk}"></td><td th:text="${row.kikikatashiki}" th:title="${row.kikikatashiki}"></td><td class="amount" th:text="${row.suryoNmText}" th:title="${row.suryoNmText}"></td><td th:text="${row.display['BIKO']}" th:title="${row.display['BIKO']}"></td></tr></tbody></table><p class="empty-grid" id="meisaiEmpty" hidden>表示するデータがありません。</p></div></section></div>
<section class="kotai-section"><h2 class="grid-heading">《機器個体毎の明細》</h2><div class="grid-scroll" id="kotaiScroll"><table class="data-grid" id="kotaiTable" style="width:1042px"><colgroup><col style="width:32px"/><col style="width:30px"/><col style="width:100px"/><col style="width:110px"/><col style="width:110px"/><col style="width:60px"/><col style="width:110px"/><col style="width:100px"/><col style="width:100px"/><col style="width:110px"/><col style="width:90px"/><col style="width:90px"/></colgroup><thead><tr><th aria-label="行番号"></th><th class="check-cell"><input type="checkbox" class="check-visible" data-kind="kotai" aria-label="表示中の個体を全選択・解除"/></th><th>見積NO</th><th>品名</th><th>型式</th><th>数量</th><th>個体名</th><th>シリアル番号</th><th>設置場所</th><th>取引先</th><th>一時納入日</th><th>延長契約日</th></tr></thead><tbody><tr th:each="row,stat : ${form.kotaiRows}" th:attr="data-brand=${row.brandkoseiId},data-kosei=${row.kikikoseiId}" th:attrappend="data-index=${stat.index}" tabindex="0"><td class="row-number" th:text="${stat.count}"></td><td class="check-cell"><input type="checkbox" class="chk-kotai" name="kotaiSelection" th:value="${stat.index}" th:checked="${row.checkFlg}" th:disabled="${!row.quoted && !row.checkFlg}" th:attr="data-quoted=${row.quoted},data-brand=${row.brandkoseiId},data-kosei=${row.kikikoseiId},data-meisai=${row.kikimeisaiId}" aria-label="選択"/></td><td th:text="${row.display['UM_MITSUMORI_NO']}" th:title="${row.display['UM_MITSUMORI_NO']}"></td><td th:text="${row.display['KIKIHINMEI_NK']}" th:title="${row.display['KIKIHINMEI_NK']}"></td><td th:text="${row.display['KIKIKATASHIKI']}" th:title="${row.display['KIKIKATASHIKI']}"></td><td class="amount" th:text="${row.display['SURYO_NM']}" th:title="${row.display['SURYO_NM']}"></td><td th:text="${row.kotaiNk}" th:title="${row.kotaiNk}"></td><td th:text="${row.serialNo}" th:title="${row.serialNo}"></td><td th:text="${row.setchibasyo}" th:title="${row.setchibasyo}"></td><td th:text="${row.display['TORIHIKISAKI_NK']}" th:title="${row.display['TORIHIKISAKI_NK']}"></td><td th:text="${row.itizinonnyuDt}" th:title="${row.itizinonnyuDt}"></td><td th:text="${row.display['MAG_ENCHOKEIYAKUKIGEN_DT']}" th:title="${row.display['MAG_ENCHOKEIYAKUKIGEN_DT']}"></td></tr></tbody></table><p class="empty-grid" id="kotaiEmpty" hidden>表示するデータがありません。</p></div></section>
</main></div><div class="footer-actions"><span class="step-caption">2 / 2　機器・個体選定</span><button type="submit" class="btn-primary" id="applyButton">適用</button></div></form></body></html>
