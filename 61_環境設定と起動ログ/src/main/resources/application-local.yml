# 通常の個人開発用（プロファイル未指定時の既定）。Eclipseで環境指定をしなくてもlocalを使う。
# アプリと添付は自分のPC上、DBはapplication.ymlの検証DB（ILCM-SYSDEV / SYSDEV）を使用する。
# DBも自分のPCだけに閉じた環境ではない。チームで決めた検証用データで確認する。
# このPCへ保存した添付の情報は検証DBに登録され、別PC・検証サーバーから取得できない場合がある。
# 共有添付を確認するときはdevを指定する。DB接続先・添付保存先は起動ログで確認する。
mcm:
  file:
    upload-path: C:/opt/mcm/upload
