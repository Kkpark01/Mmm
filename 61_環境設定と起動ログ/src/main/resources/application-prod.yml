# 本番サーバー用（spring.profiles.active=prod またはSPRING_PROFILES_ACTIVE=prod）。
# 本番での環境指定は必須。未指定では既定localとなり、検証DBへ接続する。
# 配備後は起動ログで使用環境=prod、本番DB接続先、本番添付保存先を確認する。
# 接続先・保存先は未確定のため、値は環境変数から受け取る。
# 環境変数が未設定のまま prod で起動すると、プレースホルダー未解決で起動エラーになる
# （application.yml の検証用DBに誤って接続しないための安全策）。
# パスワード等の秘密情報はファイルに書かず、環境変数で渡すこと。
#
# 必要な環境変数：
#   MCM_DB_URL           例) jdbc:sqlserver://{本番DBサーバー}:1433;databaseName={本番DB名};encrypt=true;trustServerCertificate=true
#   MCM_DB_USERNAME
#   MCM_DB_PASSWORD
#   MCM_FILE_UPLOAD_PATH 例) \\{本番ファイルサーバー}\{共有名}\MCM
spring:
  datasource:
    url: ${MCM_DB_URL}
    username: ${MCM_DB_USERNAME}
    password: ${MCM_DB_PASSWORD}

mcm:
  file:
    upload-path: ${MCM_FILE_UPLOAD_PATH}
