; 新MCM検証DB向け。パスワードをこのファイルへ書かない。
Backend=SQLSERVER
Provider=MSOLEDBSQL19
Server=ILCM-SYSDEV
Port=1433
Database=SYSDEV
Authentication=SqlLogin
TrustServerCertificate=True
ConnectionTimeoutSeconds=15
CommandTimeoutSeconds=600
; SQL認証は実行者の環境変数MCM_MACRO_DB_USER / MCM_MACRO_DB_PASSWORDを使用。
; Windows認証を利用できる場合だけAuthentication=Windowsへ変更する。

; 参照先を変える場合は、必要なReference_*の行の先頭の;を外して設定します。
