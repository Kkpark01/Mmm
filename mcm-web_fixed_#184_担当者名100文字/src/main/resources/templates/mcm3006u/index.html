<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MCM3006U 担当者マスタ</title>
    <!--
        【変換元】Mcm3006uScreen.Designer.vb / Mcm3006uScreen.vb
          画面ID: MCM3006U
          画面名: 担当者マスタ

        【VB.NETコントロール → HTML要素 対応】
          CpLabel1                    → .section-label "≪担当者≫"
          MCMMOTANTODataGridView       → #tantoTable（担当者一覧テーブル）
          MCMMOTANTOROWINSERTBUTTON    → #addRowBtn "行追加"
          MCMMOTANTOROWDELETEBUTTON    → #delRowBtn "行削除"
          CpLabel2                    → .section-label "≪利用権限≫"
          MCM_MO_TANTOKENGENDataGridView → #kengenTable（権限一覧テーブル）
          UpdateButton                → #saveBtn "登録"
    -->
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../css/common.css"/>
    <link rel="stylesheet" th:href="@{/css/mcm3006u.css}" href="../css/mcm3006u.css"/>
    <!-- ========== 【レイアウト統一】MCM0017U / MCM0021U 準拠の共通スタイル ========== -->
    <!-- 既存の mcm3006u.css は一切削除せず、その上に共通レイアウトを重ねる -->
    <style>
        .header, .toolbar, .btn-area, button, .btn, .btn-close {
            -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none; }
        button, .btn, .btn-close { cursor:pointer; }

        /* ── ヘッダー（MCM0017U 準拠） ── */
        .header { display:flex; align-items:center; justify-content:space-between;
                  background-color:#453f78; color:#fff; height:30px; padding:0 10px; box-sizing:border-box; }
        .header .header-left, .header .header-right { display:flex; align-items:center; }
        .header .header-center { flex:1; text-align:center; }
        .header .header-center h1 { margin:0; font-size:18px; font-weight:bold; color:#fff;
                                    letter-spacing:2px; line-height:30px; }
        .btn-close { display:inline-block; padding:2px 12px; font-size:12px; color:#000;
                     text-decoration:none; background-color:#f0f0f0; border:1px solid #adadad;
                     border-radius:2px; box-shadow: inset 0 1px 0 #fff; line-height:1.6; }
        .btn-close:hover  { background-color:#e5f1fb; border-color:#7eb4ea; }
        .btn-close:active { background-color:#cce4f7; border-color:#569de5; }

        /* ── セクション見出し（MCM0017U 準拠） ── */
        .section { margin:0 0 6px 0; }
        .section-header { display:flex; align-items:center; gap:10px; padding:4px 6px; }
        .section-header .grid-title { font-size:13px; font-weight:bold; color:#333; }
        .section-header .toolbar { margin-left:auto; padding:0; }
        .toolbar { display:flex !important; justify-content:flex-end !important; gap:6px; }

        /* ── グリッド枠（MCM0017U 準拠） ── */
        .grid-container { overflow-y:auto; overflow-x:auto; border:1px solid #d5dbdb; position:relative; }
        .grid-scroll-parent { height:calc(38vh - 60px); }
        .grid-scroll-child  { height:calc(28vh - 40px); }

        .data-grid { border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:12px; }
        .data-grid thead th { position:sticky; top:0; z-index:5; background-color:#eef2f5;
                              box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5;
                              text-align:left; padding:4px 6px; }
        .data-grid th, .data-grid td { border-right:1px solid #d5dbdb; border-bottom:1px solid #d5dbdb; }
        .data-grid th:first-child, .data-grid td:first-child { border-left:1px solid #d5dbdb; }
        .data-grid td { padding:0; overflow:hidden; vertical-align:middle; height:22px; line-height:22px; }

        /* ── グリッド内入力欄（MCM0017U 準拠） ── */
        .data-grid .grid-input { box-sizing:border-box; display:block; width:100%;
                                 min-height:22px; height:22px; line-height:22px;
                                 border:none; margin:0; padding:0 4px; background:transparent; }
        .data-grid .grid-input:focus { outline:none; box-shadow: inset 0 0 0 1px #7eb4ea; }
        .data-grid select.grid-input { padding:0 2px; }
        .data-grid input[type=number].grid-input { text-align:right; }
        .data-grid input[type=number]::-webkit-outer-spin-button,
        .data-grid input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
        .data-grid input[type=number] { -moz-appearance:textfield; appearance:textfield; }
        .data-grid input.field-error, .data-grid select.field-error {
            outline:2px solid #d32f2f; background-color:#ffebee !important; }

        /* ── 読み取り専用セル・選択行（MCM0017U 準拠） ── */
        .data-grid td.col-created-dt, .data-grid td.col-created-by,
        .data-grid td.col-updated-dt, .data-grid td.col-updated-by {
            background-color:#d9d9d9; color:#333; font-size:11px; white-space:nowrap;
            padding:0 6px; text-overflow:ellipsis; line-height:22px; }
        .data-grid tr.selected-row td { background-color:#bdbdbd !important; }

        /* ── 登録ボタン行 ── */
        .form-actions, .btn-area { display:flex; justify-content:flex-end; gap:6px; }

        /* ── 行選択マーカー（▶列 / MCM0017U 準拠） ── */
        .data-grid th.col-select, .data-grid td.col-select {
            width:22px; min-width:22px; text-align:center; vertical-align:middle; padding:0; }
        .data-grid .row-marker { display:inline-flex; align-items:center; justify-content:center;
                                 width:14px; height:18px; line-height:18px; }
        .data-grid .row-marker::before { content:""; display:inline-block; width:14px; min-width:14px; text-align:center; }
        .data-grid tr.row-active .row-marker::before { content:"\25B6"; color:#000; font-size:13px; line-height:18px; }

        /* ── セル選択（2クリック編集 / MCM0017U 準拠） ── */
        .data-grid td.cell-selected { background-color:#e0e0e0 !important;
                                      outline:2px solid #7a7a7a; outline-offset:-2px; }
        .data-grid td.cell-selected .grid-input { background-color:transparent !important; }
        .data-grid .grid-input[readonly] { caret-color:transparent; cursor:default; }

        /* ── 列幅リサイザ（MCM0017U 準拠） ── */
        .data-grid th .col-resizer { position:absolute; top:0; right:0; width:6px; height:100%;
                                     cursor:col-resize; user-select:none; z-index:6; }
        .data-grid th .col-resizer:hover { background:rgba(69,63,120,.25); }
        body.col-resizing { cursor:col-resize !important; }
        body.col-resizing * { user-select:none !important; }

        /* ── ミニダイアログ（MCM0017U 準拠） ── */
        .mini-dialog-overlay { position:fixed; inset:0; background:rgba(0,0,0,.25);
                               display:none; align-items:center; justify-content:center; z-index:1000; }
        .mini-dialog { background:#fbfbfb; min-width:300px; max-width:90%;
                       border:1px solid #7a7a7a; border-radius:6px; overflow:hidden;
                       box-shadow:0 8px 24px rgba(0,0,0,.35);
                       font-family:'Segoe UI','Yu Gothic UI','Meiryo',sans-serif; }
        .mini-dialog-head { display:flex; align-items:center; justify-content:space-between;
                            background:#ffffff; color:#000; padding:6px 8px 6px 12px;
                            font-size:12px; border-bottom:1px solid #e5e5e5; }
        .mini-dialog-head .mini-close { border:none; background:transparent; font-size:15px;
                                        line-height:1; color:#444; cursor:pointer;
                                        padding:2px 6px; border-radius:3px; }
        .mini-dialog-head .mini-close:hover { background:#e81123; color:#fff; }
        .mini-dialog-body { display:flex; align-items:center; gap:12px;
                            padding:20px 16px; background:#fbfbfb; white-space:pre-line; }
        .mini-dialog-body .mini-icon { flex:0 0 auto; }
        .mini-dialog-body .mini-msg { color:#000000; font-size:13px; }
        .mini-dialog-foot { padding:10px 16px 14px; text-align:right; background:#fbfbfb; }
        .mini-dialog-foot button { min-width:84px; padding:5px 12px; font-size:12px;
                                   background:#e1e1e1; border:1px solid #adadad;
                                   border-radius:3px; cursor:pointer; }
        .mini-dialog-foot button:hover { background:#e5f1fb; border-color:#0078d4; }
        .mini-dialog-foot button:focus { outline:1px solid #0078d4; outline-offset:1px; }

        /* =================================================================
           入力枠を「表のセルと全く同じ大きさ」に揃える（MCM0017U 準拠）
           【原因】mcm3006u.css の .tanto-table input / select ルールが
                   border:1px / padding:1px 3px / font-size:13px を付けており、
                   .data-grid .grid-input（枠なし・高さ22px）より詳細度が高いため
                   セルより内側に一回り小さい枠が描かれてズレていた。
           mcm3006u.css は一切変更せず、ここで同じ詳細度以上で上書きする。
           ================================================================= */

        /* セル側：MCM0017U と同じく余白ゼロ・高さ22px（mcm3006u.css の padding:2px 4px を打ち消す） */
        .tanto-table tbody td, .kengen-table tbody td {
            padding:0; height:22px; line-height:22px; overflow:hidden; vertical-align:middle; }
        /* 読み取り専用セル（登録日時・登録者・更新日時・更新者）だけ左右余白を残す */
        .tanto-table tbody td.col-created-dt, .tanto-table tbody td.col-created-by,
        .tanto-table tbody td.col-updated-dt, .tanto-table tbody td.col-updated-by,
        .kengen-table tbody td.col-created-dt, .kengen-table tbody td.col-created-by,
        .kengen-table tbody td.col-updated-dt, .kengen-table tbody td.col-updated-by,
        .kengen-table tbody td.col-kbunrui-nk {
            padding:0 6px; white-space:nowrap; text-overflow:ellipsis; }
        .tanto-table tbody td.col-select, .kengen-table tbody td.col-select {
            padding:0; text-align:center; vertical-align:middle; }

        /* 入力欄側：セルいっぱいに広げ、枠線を消す（MCM0017U の .grid-input と同一） */
        .tanto-table input.grid-input, .tanto-table select.grid-input,
        .kengen-table input.grid-input, .kengen-table select.grid-input,
        .tanto-table input[type="text"], .tanto-table input[type="email"],
        .tanto-table input[type="number"], .tanto-table select,
        .kengen-table input[type="text"], .kengen-table input[type="number"],
        .kengen-table select {
            box-sizing:border-box; display:block; width:100%;
            min-height:22px; height:22px; line-height:22px;
            border:none; margin:0; padding:0 4px;
            background:transparent; font-size:12px;
            font-family:inherit; vertical-align:middle; }
        /* select は矢印分の余白のみ詰める（MCM0017U 準拠） */
        .tanto-table select.grid-input, .kengen-table select.grid-input,
        .tanto-table select, .kengen-table select { padding:0 2px; }
        /* 数値列は右寄せ（元の見た目を維持） */
        .tanto-table input[type="number"], .kengen-table input[type="number"] { text-align:right; }
        /* フォーカス枠はセルの内側にぴったり収める（外側に膨らませない） */
        .tanto-table .grid-input:focus, .kengen-table .grid-input:focus {
            outline:none; box-shadow: inset 0 0 0 1px #7eb4ea; }
        /* エラー枠もセルの内側に収める */
        .tanto-table .grid-input.field-error, .kengen-table .grid-input.field-error {
            outline:none; box-shadow: inset 0 0 0 2px #d32f2f;
            background-color:#ffebee !important; }
        /* 行選択・セル選択の背景を入力欄が隠さないようにする */
        .data-grid tbody tr.selected-row td .grid-input,
        .data-grid tbody tr.row-selected td .grid-input,
        .data-grid td.cell-selected .grid-input { background:transparent !important; }

        /* 表全体もセル境界を1本に揃える（MCM0017U と同じ separate 方式）
           mcm3006u.css は td に border:1px（4辺）を指定しているため、
           右下のみ引く方式と重なって線が二重になり列がズレて見える。
           上辺・左辺だけを打ち消して MCM0017U と同じ1本線にする。 */
        .tanto-table, .kengen-table { border-collapse:separate; border-spacing:0; table-layout:fixed; }
        .tanto-table th, .kengen-table th { padding:4px 6px; }
        .tanto-table th, .tanto-table td, .kengen-table th, .kengen-table td {
            border-top:none; border-left:none;
            border-right:1px solid #d5dbdb; border-bottom:1px solid #d5dbdb; }
        .tanto-table th:first-child, .tanto-table td:first-child,
        .kengen-table th:first-child, .kengen-table td:first-child {
            border-left:1px solid #d5dbdb; }
        .tanto-table thead th, .kengen-table thead th {
            box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5; }
        /* =================================================================
           見出し・読み取り専用セルでテキスト選択カーソル（Iビーム）を出さない
           【変換元】MCM0017U index.html A55:A60 / A182:A183
             .data-grid thead th, td.col-select, td.col-readonly {
                 user-select:none; cursor:default; }
           MCM3006U には col-readonly クラスが無いため、該当する
           登録日時・登録者・更新日時・更新者・分類名・▶列 を個別に指定する。
           ================================================================= */
        .tanto-table thead th, .kengen-table thead th,
        .tanto-table thead, .kengen-table thead,
        .tanto-table tbody td.col-select, .kengen-table tbody td.col-select,
        .tanto-table tbody td.col-created-dt, .tanto-table tbody td.col-created-by,
        .tanto-table tbody td.col-updated-dt, .tanto-table tbody td.col-updated-by,
        .kengen-table tbody td.col-created-dt, .kengen-table tbody td.col-created-by,
        .kengen-table tbody td.col-updated-dt, .kengen-table tbody td.col-updated-by,
        .kengen-table tbody td.col-kbunrui-nk,
        .tanto-table tbody td.col-tanto-id, .kengen-table tbody td.col-kbunrui-id,
        .data-grid .row-marker, .section-header, .section-label, .grid-title {
            -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
            user-select:none; cursor:default; }
        /* 見出しは幅変更グリップ上だけ col-resize カーソルにする（MCM0017U 準拠） */
        .data-grid th .col-resizer { cursor:col-resize; }
        /* 読み取り専用セル内の <span> も同様（Iビームは span 側で出るため） */
        .tanto-table tbody td.col-created-dt span, .tanto-table tbody td.col-created-by span,
        .tanto-table tbody td.col-updated-dt span, .tanto-table tbody td.col-updated-by span,
        .kengen-table tbody td.col-created-dt span, .kengen-table tbody td.col-created-by span,
        .kengen-table tbody td.col-updated-dt span, .kengen-table tbody td.col-updated-by span,
        .kengen-table tbody td.col-kbunrui-nk span {
            -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
            user-select:none; cursor:default; }
        /* 入力可能セルは従来どおりテキストカーソル（編集中のみキャレット表示） */
        .tanto-table .grid-input, .kengen-table .grid-input { cursor:text; }
        .tanto-table .grid-input[readonly], .kengen-table .grid-input[readonly] {
            caret-color:transparent; cursor:default; }
        .tanto-table select.grid-input, .kengen-table select.grid-input { cursor:default; }


        /* =================================================================
           ボタンを MCM0017U に合わせる
           【変換元】mcm0017u.css A43:A51
             .btn         { padding:4px 16px; font-size:13px;
                            border:1px solid transparent; border-radius:3px;
                            cursor:pointer; min-width:60px; }
             .btn-primary { background-color:#3498db; color:#fff; }
             .btn-primary:hover { background-color:#2980b9; }
             .btn-danger  { background-color:#e74c3c; color:#fff; }
             .btn-danger:hover  { background-color:#c0392b; }
             .form-actions{ text-align:right; padding:12px 16px; }
           MCM3006U は common.css A58:A66 の共通ボタン（padding:8px 20px /
           font-size:14px）を継承していて一回り大きかったため、ここで揃える。
           common.css / mcm3006u.css は一切変更しない。
           ※行追加は「サイズのみ揃え、背景色は現状維持」とのご指示のため
             #addRowBtn だけ背景・文字色・枠線を上書きしない。
           ================================================================= */

        /* ── サイズは3ボタン共通（MCM0017U 準拠） ── */
        .btn-area .btn, .form-actions .btn, #addRowBtn, #delRowBtn {
            display:inline-flex; align-items:center; justify-content:center;
            padding:4px 16px; font-size:13px; min-width:60px;
            border-radius:3px; cursor:pointer; line-height:1.5;
            font-family:inherit; transition:0.15s; }

        /* ── 登録ボタン：MCM0017U と同じ青（#3498db） ── */
        .form-actions .btn-primary {
            background-color:#3498db; color:#fff; border:1px solid transparent; }
        .form-actions .btn-primary:hover { background-color:#2980b9; }
        .form-actions .btn-primary:active { background-color:#2471a3; }

        /* ── 行削除：MCM0017U と同じ赤（#e74c3c / .btn-danger 相当） ── */
        #delRowBtn {
            background-color:#e74c3c; color:#fff; border:1px solid transparent; }
        #delRowBtn:hover  { background-color:#c0392b; }
        #delRowBtn:active { background-color:#a93226; }

        /* ── 行追加：サイズのみ統一。背景色・文字色・枠線は現状のまま ── */
        /*    （common.css A65 の .btn-secondary = 白背景 を継承させるため何も指定しない） */

        /* ── 登録ボタン行の余白（MCM0017U: .form-actions） ── */
        .form-actions { text-align:right; }
        /* ── 利用権限グリッド：備考列をウィンドウ右端まで伸ばす ──
           他の列は固定幅、備考だけ auto にして「残り幅を全部吸収」させる。
           table-layout:fixed + width:100% の組み合わせで、固定幅列の合計を
           引いた残りが auto 列に配分される。
           ※ mcm3006u.css は一切変更せず、後勝ちで上書きする。 */
        .kengen-table { width:100%; min-width:100%; table-layout:fixed; }
        .kengen-table th.col-kbiko,
        .kengen-table td.col-kbiko { width:auto; min-width:120px; }
        /* 備考より右の列が伸びて余白を奪わないよう、固定幅を明示しておく */
        .kengen-table th.col-created-dt, .kengen-table td.col-created-dt,
        .kengen-table th.col-updated-dt, .kengen-table td.col-updated-dt {
            width:110px; min-width:110px; }
        .kengen-table th.col-created-by, .kengen-table td.col-created-by,
        .kengen-table th.col-updated-by, .kengen-table td.col-updated-by {
            width:80px; min-width:80px; }
        /* 備考欄の入力ボックスもセル幅いっぱいに追従させる */
        .kengen-table td.col-kbiko .grid-input { width:100%; }



        /* ── 担当者グリッドのみ：▶列の右側に行番号を表示するための列幅・配置 ──
           A87:A88 の .data-grid th.col-select（22px）を、担当者表だけ広げて
           ▶マーカー＋番号が並ぶ余白を作る。利用権限表(.kengen-table)は現状維持。
           A151 の .tanto-table tbody td.col-select と同じ詳細度以上で上書きする。 */
        .tanto-table th.col-select, .tanto-table td.col-select {
            width:46px; min-width:46px; }
        .tanto-table tbody td.col-select {
            text-align:left; white-space:nowrap; padding:0 4px 0 2px; }
        .tanto-table tbody td.col-select .row-marker { vertical-align:middle; }
        .tanto-table tbody td.col-select .row-no {
            display:inline-block; min-width:22px; text-align:right;
            font-size:11px; color:#333; line-height:22px; vertical-align:middle;
            -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none;
            user-select:none; cursor:default; }


        /* =================================================================
           【MCM0017U 準拠】担当者グリッドの必須項目を色分けする
           対象：ログインID / 担当者名 / 事業所名
           【変換元】MCM0017U index.html A85:A93
             .data-grid thead th.col-required { color: #d32f2f; }        ← 見出し赤文字
             .data-grid td.col-required { background-color: #e3f2fd; }   ← セル薄い水色
             .data-grid td.col-required .grid-input { background-color: #e3f2fd; }
             .data-grid tbody tr.row-selected > td.col-required { background-color:#bdbdbd !important; }
           MCM3006U の HTML には col-required クラスが無いため、
           該当する列クラス（col-login-id / col-tanto-nk / col-jigyosyo-nk）を
           直接指定して同じ見た目にする（HTML・mcm3006u.css は変更しない）。
           ================================================================= */

        /* -- 見出し：赤文字（MCM0017U と同じ #d32f2f） -- */
        .tanto-table thead th.col-login-id,
        .tanto-table thead th.col-tanto-nk,
        .tanto-table thead th.col-jigyosyo-nk,
        .data-grid thead th.col-required { color:#d32f2f; }

        /* ── セル：薄い水色（MCM0017U と同じ #e3f2fd） ── */
        .tanto-table tbody td.col-login-id,
        .tanto-table tbody td.col-tanto-nk,
        .tanto-table tbody td.col-jigyosyo-nk,
        .data-grid tbody td.col-required { background-color:#e3f2fd; }
        /* 入力欄は背景が transparent のため、セル色が透けて同じ色に見える。
           念のため入力欄側にも同色を明示しておく（MCM0017U A87:A88 と同じ） */
        .tanto-table tbody td.col-login-id .grid-input,
        .tanto-table tbody td.col-tanto-nk .grid-input,
        .tanto-table tbody td.col-jigyosyo-nk .grid-input,
        .tanto-table tbody td.col-login-id input,
        .tanto-table tbody td.col-tanto-nk input,
        .tanto-table tbody td.col-jigyosyo-nk input,
        .data-grid tbody td.col-required .grid-input,
        .data-grid tbody td.col-required select.grid-input { background-color:#e3f2fd; }

        /* ── 行選択時は必須列もグレーに揃える（MCM0017U A89:A93 準拠） ──
           MCM3006U の選択行クラスは .selected-row のため両方を指定する。 */
        .tanto-table tbody tr.selected-row > td.col-login-id,
        .tanto-table tbody tr.selected-row > td.col-tanto-nk,
        .tanto-table tbody tr.selected-row > td.col-jigyosyo-nk,
        .tanto-table tbody tr.selected-row > td.col-login-id .grid-input,
        .tanto-table tbody tr.selected-row > td.col-tanto-nk .grid-input,
        .tanto-table tbody tr.selected-row > td.col-jigyosyo-nk .grid-input,
        .tanto-table tbody tr.selected-row > td.col-login-id input,
        .tanto-table tbody tr.selected-row > td.col-tanto-nk input,
        .tanto-table tbody tr.selected-row > td.col-jigyosyo-nk input,
        .data-grid tbody tr.selected-row > td.col-required,
        .data-grid tbody tr.selected-row > td.col-required .grid-input,
        .data-grid tbody tr.row-selected > td.col-required,
        .data-grid tbody tr.row-selected > td.col-required .grid-input {
            background-color:#bdbdbd !important; }

        /* ── セル選択（2クリック編集）中も既存どおりグレー枠を優先させる ── */
        .tanto-table tbody td.cell-selected.col-login-id,
        .tanto-table tbody td.cell-selected.col-tanto-nk,
        .tanto-table tbody td.cell-selected.col-jigyosyo-nk {
            background-color:#e0e0e0 !important; }

        /* ── 入力エラー時の赤（既存 .field-error）を必須列でも確実に見せる ── */
        .tanto-table tbody td.col-login-id .grid-input.field-error,
        .tanto-table tbody td.col-tanto-nk .grid-input.field-error,
        .tanto-table tbody td.col-jigyosyo-nk .grid-input.field-error {
            background-color:#ffebee !important; }


        /* =================================================================
           【MCM0017U 準拠】担当者グリッドを画面いっぱいに広げる（サイズ調整版）
           【変換元】MCM0017U index.html A38:A42
             .grid-container { height: calc(100vh - 250px); overflow:auto; }
           MCM3006U は担当者／利用権限の2グリッド構成。
           固定要素の実測積算 = 196px
             ヘッダ30 + 見出し36 + 見出し30 + セクション余白6x2
             + ラッパー余白8x2 + 権限上余白16 + ボタン行上余白16
             + ボタン28 + 枠線4 + 安全余裕8
           よって グリッドに使えるのは 100vh - 196px。
           前回の 70vh-120 / 30vh-60 は合計 100vh-180 となり 16px はみ出していた。
           今回は 62vh-100 / 26vh-50 = 合計 88vh-150 に縮小し、
           1000px画面で 74px、768px画面で 46px の余裕を確保する。
           元の指定（A52:A53 の 38vh / 28vh）は削除せず後勝ちで上書きする。
           ================================================================= */
        /* -- 担当者グリッド：残り高さの7割（下端までピッタリ使い切る） -- */
        .grid-scroll-parent {
            height:calc((100vh - 204px) * 0.7); min-height:180px; }

        /* -- 利用権限グリッド：残り高さの3割 -- */
        .grid-scroll-child {
            height:calc((100vh - 204px) * 0.3); min-height:110px; }

        /* -- 画面の左右いっぱいまで使う（余白を詰めて横幅を稼ぐ） -- */
        body { margin:0; }
        .content { width:100%; max-width:none; box-sizing:border-box; padding:0 8px; }
        .section { margin:0 0 6px 0; }
        /* 2つ目のセクション（利用権限）の上余白を詰める（元は style=margin-top:16px） */
        .content .section + .section { margin-top:8px !important; }

        /* =================================================================
           【重要】登録ボタンを画面下端に固定する（MCM0017U 準拠・全面見直し）
           MCM0017U を再確認した結果、以下2点の見落としがあった。
             (1) MCM0017U は <style> が2ブロックある（index.html A18:A150 と
                 A151:A200）。後半 A157:A158 で grid-scroll-parent/child を
                 再定義しており、こちらが実際に効いている。
             (2) MCM0017U は .table-wrapper を使っておらず（index.html A236 は
                 grid-container のみ）、mcm3006u.css A106 の margin-bottom:8px 等の
                 余分な余白が無い。
           グリッド高さを固定値で決める方式だと、画面サイズによって下に余りが出て
           登録ボタンが中途半端な位置で浮く。そこで body を縦フレックスにし、
           グリッド領域が余りを吸収し、ボタン行を最下段へ押し下げる。
           これで画面サイズに関係なく登録ボタンが常に下端に来る。
           mcm3006u.css / common.css は一切変更せず後勝ちで上書きする。
           ================================================================= */
        html, body { height:100%; }
        body { display:flex; flex-direction:column; min-height:100vh; }
        /* ヘッダーは縮まない固定要素 */
        body > .header { flex:0 0 auto; }
        /* content が残り高さを全て受け取る */
        .content { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
        .content > form#mainForm { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
        /* 担当者セクションが余った高さを吸収する（=ボタンが下端へ押し出される）
           ※構造: form#mainForm > div.section > div.section-header
                                              > div.table-wrapper.grid-container.grid-scroll-parent */
        .content > form#mainForm > .section:first-of-type {
            flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
        .content > form#mainForm > .section:first-of-type > .section-header { flex:0 0 auto; }
        .content > form#mainForm > .section:first-of-type > .grid-scroll-parent {
            flex:1 1 auto; height:auto !important; min-height:0; }
        /* hidden コンテナは高さを持たせない */
        .content > form#mainForm > #deleteIdContainer { flex:0 0 auto; }
        /* 利用権限セクションは固定高さのまま（縮ませない） */
        .content > form#mainForm > .section + .section { flex:0 0 auto; }
        /* 余分な下余白（mcm3006u.css A106 .table-wrapper margin-bottom:8px）を消す */
        .content .table-wrapper { margin-bottom:0 !important; }
        /* 登録ボタン行：常に最下段。MCM0017U mcm0017u.css A51 と同じ右寄せ */
        .content .btn-area.form-actions {
            flex:0 0 auto; display:block; text-align:right;
            margin:0 !important; padding:8px 0 !important; }
        .content .btn-area.form-actions .btn { display:inline-flex; vertical-align:middle; }


        /* -- エラーダイアログ内の改行(\n)を表示に反映する --
           showError() は textContent で文字を入れるため、既定では \n が
           改行として描画されない。pre-line にすると改行だけが有効になる。 */
        #miniDialogMsg { white-space: pre-line; }

        /* -- 必須未入力セルの赤枠（既存 .field-error を強調・後勝ち） --
           readonly セルや背景色付きの必須セル(.col-required)にも確実に効くよう
           outline に加えて box-shadow でも枠を描く。 */
        .data-grid input.field-error,
        .data-grid select.field-error {
            outline: 2px solid #d32f2f !important;
            outline-offset: -2px;
            box-shadow: inset 0 0 0 2px #d32f2f !important;
            background-color: #ffebee !important; }

        /* =================================================================
           【行高さ調整】グリッド1行の縦幅を小さくする（MCM0017U 準拠の構造のまま）
           変更前: .data-grid td / .grid-input = height:22px / line-height:22px
           変更後: 18px（文字サイズ 12px は変更せず、上下に約3pxの隙間を確保）
           ※ 項目の表示順・項目名・列幅・色は一切変更しない。
             上の A61 / A65 / A143 / A162 等の指定は削除せず後勝ちで上書きする。
           ================================================================= */
        /* -- データ行のセル高さ -- */
        .data-grid td,
        .tanto-table tbody td, .kengen-table tbody td {
            height:18px; line-height:18px; }
        /* -- 読み取り専用セル（登録日時・登録者・更新日時・更新者・分類名） -- */
        .data-grid td.col-created-dt, .data-grid td.col-created-by,
        .data-grid td.col-updated-dt, .data-grid td.col-updated-by,
        .tanto-table tbody td.col-created-dt, .tanto-table tbody td.col-created-by,
        .tanto-table tbody td.col-updated-dt, .tanto-table tbody td.col-updated-by,
        .kengen-table tbody td.col-created-dt, .kengen-table tbody td.col-created-by,
        .kengen-table tbody td.col-updated-dt, .kengen-table tbody td.col-updated-by,
        .kengen-table tbody td.col-kbunrui-nk {
            height:18px; line-height:18px; }
        /* -- セル内の入力欄・コンボもセル高さに合わせる（文字サイズは維持） -- */
        .data-grid .grid-input,
        .tanto-table input.grid-input, .tanto-table select.grid-input,
        .kengen-table input.grid-input, .kengen-table select.grid-input,
        .tanto-table input[type="text"], .tanto-table input[type="email"],
        .tanto-table input[type="number"], .tanto-table select,
        .kengen-table input[type="text"], .kengen-table input[type="number"],
        .kengen-table select {
            min-height:18px; height:18px; line-height:18px; }
        /* -- ▶マーカー・行番号も行高さに合わせる -- */
        .data-grid .row-marker { height:16px; line-height:16px; }
        .data-grid tr.row-active .row-marker::before { line-height:16px; }
        .tanto-table tbody td.col-select .row-no { line-height:18px; }
        /* -- 見出し行も同程度に詰める（文字サイズは変更しない） -- */
        .data-grid thead th,
        .tanto-table thead th, .kengen-table thead th {
            padding:2px 6px; line-height:18px; }

        /* =================================================================
           【グリッド間の隙間を利用権限グリッドへ振り替える】
           前回の「割合を 7:3 → 6:4 に変える」案は取りやめ。
           担当者グリッド枠の下端と ≪利用権限≫ 見出しの間に無駄な隙間が
           あるため、その隙間を詰めて、詰めた分だけ利用権限グリッドの
           高さに加算する。担当者グリッドは flex:1 1 auto（A435:A436）で
           残りを吸収するので、利用権限を先に確保すれば自動で調整される。
           【削れる隙間の内訳】（検算: 画面高さ検証!A54:C58）
             担当者 .section    margin-bottom 6px → 0px  ... 6px
             利用権限 section   margin-top    8px → 2px  ... 6px
             利用権限 見出し行  padding 4px×2 → 1px×2    ... 6px
                                            合計 ......... 18px
           ※ A403 / A405 / A45 等の既存指定は削除せず後勝ちで上書きする。
           ※ 項目の表示順・項目名・列幅・文字サイズは一切変更しない。
           ================================================================= */
        /* -- (1) 担当者セクション下の余白 6px → 0px -- */
        .content > form#mainForm > .section:first-of-type { margin-bottom:0 !important; }

        /* -- (2) 利用権限セクション上の余白 8px → 2px（A405 を後勝ちで上書き） -- */
        .content .section + .section { margin-top:2px !important; }

        /* -- (3) 利用権限の見出し行の上下 padding 4px → 1px（文字サイズは維持） -- */
        .content > form#mainForm > .section + .section > .section-header {
            padding-top:1px; padding-bottom:1px; }

        /* -- (4) 詰めた 18px を利用権限グリッドの高さに加算する -- */
        /*    ※ 割合は元の 0.3 のまま。増えるのは隙間分の 18px だけ。 */
        .grid-scroll-child {
            height:calc((100vh - 204px) * 0.3 + 18px); }
        .content > form#mainForm > .section + .section > .grid-scroll-child {
            flex:0 0 auto;
            height:calc((100vh - 204px) * 0.3 + 18px) !important;
            min-height:110px; }

        /* =================================================================
           【背景色のみ変更】利用権限グリッドの「分類」列を登録日時と同じ色にする
           変更前: .kengen-table td.col-kbunrui-nk は背景色の指定が無かった。
           変更後: 登録日時（.col-created-dt）と同じ #d9d9d9（A79 で定義）にする。
           【修正】当初 .data-grid.kengen-table tbody td.col-kbunrui-nk と書いたため
                   詳細度が上がりすぎ、行選択（A81 .selected-row=#bdbdbd）や
                   セル選択（A95 .cell-selected=#e0e0e0）の色を分類列だけが打ち消し、
                   「選択できない」状態になっていた。選択中の行・セルを :not() で
                   除外し、選択時は従来の色がそのまま出るようにする。
           ※ 変更するのは background-color だけ。文字色・文字サイズ・列幅・
             padding・項目名・表示順・選択動作は一切変更しない。
           ================================================================= */
        .kengen-table tbody tr:not(.selected-row):not(.row-selected) > td.col-kbunrui-nk:not(.cell-selected) {
            background-color:#d9d9d9; }

        /* =================================================================
           【背景色のみ変更】選択行の背景色を少し濃くする
           変更前: 行選択 .selected-row の背景 = #bdbdbd（A81 / A362）
                   → 読み取り専用セル（登録日時・分類）の #d9d9d9 と近く、
                     選択しているのか分かりにくかった。
           変更後: #9e9e9e（1段階濃いグレー）にして選択状態を分かりやすくする。
           ※ 変更するのは background-color だけ。文字色・文字サイズ・列幅・
             padding・項目名・表示順・選択動作（JS）は一切変更しない。
           ※ 既存の A81 / A362 は削除せず、後勝ちで上書きする。
           ================================================================= */
        .data-grid tbody tr.selected-row > td,
        .data-grid tbody tr.row-selected > td,
        .data-grid tbody tr.selected-row > td .grid-input,
        .data-grid tbody tr.row-selected > td .grid-input {
            background-color:#9e9e9e !important; }

        /* =================================================================
           【背景色のみ変更】セル選択の背景色を行選択と同じ濃さに揃える
           変更前: セル選択 .cell-selected の背景 = #e0e0e0（A95 / A368）
                   → 行選択の #9e9e9e より薄く、色が揃っていなかった。
           変更後: 行選択と同じ #9e9e9e にする。
           ※ 変更するのは background-color だけ。セル選択の枠線
             （outline:2px solid #7a7a7a）・文字色・文字サイズ・列幅・
             padding・項目名・表示順・選択動作（JS）は一切変更しない。
           ※ 既存の A95 / A368 は削除せず、後勝ちで上書きする。
             A368 は詳細度 (0,4,2) のため、同じ形で列指定も並べて確実に上書きする。
           ================================================================= */
        .data-grid tbody td.cell-selected,
        .tanto-table tbody td.cell-selected.col-login-id,
        .tanto-table tbody td.cell-selected.col-tanto-nk,
        .tanto-table tbody td.cell-selected.col-jigyosyo-nk,
        .kengen-table tbody td.cell-selected.col-riyokengen,
        .kengen-table tbody td.cell-selected.col-kbiko {
            background-color:#9e9e9e !important; }
        .data-grid tbody td.cell-selected .grid-input {
            background-color:transparent !important; }

        /* =================================================================
           【選択のみ】読み取り専用セル（分類・登録日時・登録者・更新日時・更新者）を
           セル選択したときの見た目。JS 側でセル自体に tabindex=-1 を付けて
           フォーカスを当てるため、ブラウザ既定のフォーカス枠が出てしまう。
           .cell-selected の枠線（outline:2px solid #7a7a7a）があるので既定枠は消す。
           ※ 背景色は .cell-selected の #9e9e9e がそのまま適用される。
           ※ 入力欄は存在しないため、編集は従来どおり一切できない。
           ================================================================= */
        .data-grid tbody td.col-kbunrui-nk:focus, .data-grid tbody td.col-created-dt:focus,
        .data-grid tbody td.col-created-by:focus, .data-grid tbody td.col-updated-dt:focus,
        .data-grid tbody td.col-updated-by:focus { outline:none; }

    </style>
    <script th:src="@{/js/common.js}"></script>
</head>
<body>

    <!-- ========== ヘッダー ========== -->
    <div class="header">
        <div class="header-left"></div>
        <div class="header-center"><h1>担当者マスタ（MCM3006U）</h1></div>
        <div class="header-right"><a class="btn-close" id="btnCloseLink" th:href="@{/menu}" href="/menu">閉じる</a></div>
    </div>

    <!-- ========== メッセージ ========== -->
    <div th:if="${message}" class="message success" th:text="${message}"></div>
    <div th:if="${error}"   class="message error"   th:text="${error}"></div>
    <div id="serverMessageData" hidden th:attr="data-message=${message},data-error=${error}"></div>

    <!-- ========== メインフォーム ========== -->
    <div class="content">
        <form id="mainForm" th:action="@{/mcm3006u/save}" method="post">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- ===== 担当者セクション ===== -->
            <div class="section">
                <!-- 【変換元】CpLabel1.Text = "≪担当者≫" -->
                <div class="section-header">
                    <span class="grid-title section-label">≪担当者≫</span>

                    <!-- 【変換元】MCMMOTANTOROWINSERTBUTTON / MCMMOTANTOROWDELETEBUTTON -->
                    <div class="btn-area toolbar">
                        <button type="button" id="addRowBtn" class="btn btn-secondary"
                                onclick="addTantoRow()">行追加</button>
                        <button type="button" id="delRowBtn" class="btn btn-secondary"
                                onclick="deleteSelectedTantoRow()">行削除</button>
                    </div>
                </div>

                <div class="table-wrapper grid-container grid-scroll-parent">
                <!-- 【変換元】MCMMOTANTODataGridView — 列順はConstant.vbのROW定数と一致 -->
                <table class="tanto-table data-grid" id="tantoTable">
                    <thead>
                        <tr>
                            <th class="col-select"></th>
                            <!-- 担当者ID: 非表示（VB版も Visible=False） -->
                            <th class="col-tanto-id">担当者ID</th>
                            <th class="col-login-id">ログインID</th>
                            <th class="col-tanto-nk">担当者名</th>
                            <th class="col-jigyosyo-nk">事業所名</th>
                            <th class="col-mail">メールアドレス</th>
                            <th class="col-oya-id">上位者ID</th>
                            <!-- 【変換元】SHINSA_FLGDataGridComboBoxColumn: McmShinsaDataTable -->
                            <th class="col-shinsa">審査</th>
                            <th class="col-mitsumori">見積審査上限</th>
                            <th class="col-keiyaku">契約審査上限</th>
                            <!-- 【変換元】SHONIN_FLGDataGridComboBoxColumn: McmShoninDataTable -->
                            <th class="col-shonin">承認</th>
                            <th class="col-mitsushonin">見積承認上限</th>
                            <th class="col-keishonin">契約承認上限</th>
                            <!-- 【変換元】SYSTEMRIYOFLGDataGridComboBoxColumn: McmSystemRiyoDataTable -->
                            <th class="col-sysriyo">システム利用</th>
                            <!-- 【変換元】MAINTENANCEFLGDataGridComboBoxColumn: McmMaintenanceDataTable -->
                            <th class="col-maintenance">メンテナンス</th>
                            <th class="col-biko">備考</th>
                            <th class="col-created-dt">登録日時</th>
                            <th class="col-created-by">登録者</th>
                            <th class="col-updated-dt">更新日時</th>
                            <th class="col-updated-by">更新者</th>
                        </tr>
                    </thead>
                    <tbody id="tantoTbody">
                        <tr th:each="tanto, stat : ${tantoList}"
                            th:data-tanto-id="${tanto.tantoId}"
                            th:onclick="|selectTantoRow(this)|"
                            class="tanto-row">

                            <td class="col-select"><span class="row-marker" aria-hidden="true"></span></td>

                            <!-- 担当者ID（非表示・hidden） -->
                            <td class="col-tanto-id">
                                <input type="hidden" name="tantoIds" th:value="${tanto.tantoId}"/>
                                <span th:text="${tanto.tantoId}"></span>

                                <!-- 【追加】パスワード（画面非表示・hidden で往復させる）
                                     ※ 担当者マスタ画面にはパスワード入力欄が無いため、
                                       hidden で現在値を保持しないと登録時に PASSWORD が

    <script th:inline="javascript">
    // ── 担当者行選択 → 権限テーブル連動表示 ──
    // 元VB: MCM_MO_TANTOKENGENDataGridView.DataMember = FK_MCM_MO_TANTO_MCM_MO_TANTOKENGEN
    let selectedTantoId = null;

    // ── 行選択マーカー（▶）の排他制御 / MCM0017U 準拠 ──
    function setActiveRow(gridSel, tr) {
        document.querySelectorAll(gridSel + ' tbody tr.row-active').forEach(r => {
            if (r !== tr) r.classList.remove('row-active');
        });
        if (tr) tr.classList.add('row-active');
    }

    // ── 行クリック → 選択（イベント委譲 / MCM0017U 準拠） ──
    function bindRowSelect(gridSel, fn) {
        const tb = document.querySelector(gridSel + ' tbody');
        if (!tb) return;
        tb.addEventListener('click', function (e) {
            const tr = e.target.closest('tr');
            if (!tr || !tb.contains(tr)) return;
            /* 未入力の必須項目がある行から離れようとしたらエラー（MCM0017U 準拠） */
            const prevTr = tb.querySelector('tr.row-active');
            if (prevTr && prevTr !== tr && typeof validateRowRequired === 'function'
                && !validateRowRequired(prevTr, true)) {
                e.preventDefault();
                e.stopPropagation();
                showError(buildRequiredMsg(getMissingLabelsForRow(prevTr)));
                const fm = prevTr.querySelector('.field-error');
                if (fm) { try { fm.removeAttribute('readonly'); fm.focus({ preventScroll: true }); } catch (ev) { } }
                return;
            }
            const onMarker = !!(e.target.closest('td.col-select'));
            fn(tr, onMarker);
        });
    }

    function selectTantoRow(tr, rowSel) {
        // 選択ハイライト（グレー反転は最左の▶列クリック時のみ / MCM0017U 準拠）
        document.querySelectorAll('.tanto-row').forEach(r => r.classList.remove('selected-row'));
        if (rowSel) tr.classList.add('selected-row');
        setActiveRow('#tantoTable', tr);

        selectedTantoId = tr.dataset.tantoId;

        // 権限テーブルをフィルタ表示
        document.querySelectorAll('.kengen-row').forEach(r => {
            r.style.display = r.dataset.tantoId === selectedTantoId ? '' : 'none';
        });
    }

    // ── 利用権限行の選択（▶マーカー / MCM0017U 準拠） ──
    function selectKengenRow(tr, rowSel) {
        document.querySelectorAll('.kengen-row').forEach(r => r.classList.remove('selected-row'));
        if (rowSel) tr.classList.add('selected-row');
        setActiveRow('#kengenTable', tr);
    }

    // ── 行追加 ──
    // 元VB: RowInsertButton_Click — Ajax で新規IDと初期権限行を取得して行追加
    function addTantoRow() {
        // 【修正】コンテキストパス(/mcm)が付かず404になるため @{} で解決する
        //   参考: MCM0017U は th:action="@{...}" の値を fetch に渡している
        const NEW_ROW_URL = /*[[@{/mcm3006u/api/newRow}]]*/ '/mcm3006u/api/newRow';
        fetch(NEW_ROW_URL, { credentials: 'same-origin' })
            .then(res => {
                if (!res.ok) { throw new Error('HTTP ' + res.status); }
                return res.json();
            })
            .then(data => {
                const tanto = data.tanto;
                const kengenList = data.kengenList;

                // 【修正】採番の重複回避
                //   /api/newRow はDBの MAX(TANTO_ID)+1 を返すため、登録前に何度
                //   行追加すると毎回同じIDが返り、TANTO_ID(PK) の重複でエラーになる。
                //   画面上に既にある担当者IDの最大値と比べ、大きい方の +1 を採用する。
                let maxId = 0;
                document.querySelectorAll('.tanto-row').forEach(r => {
                    const v = Number(r.dataset.tantoId);
                    if (!isNaN(v) && v > maxId) { maxId = v; }
                });
                if (Number(tanto.tantoId) <= maxId) {
                    const newId = maxId + 1;
                    tanto.tantoId = newId;
                    kengenList.forEach(k => { k.tantoId = newId; });
                }

                // 担当者行を追加
                const tbody = document.getElementById('tantoTbody');
                const tr = buildTantoRow(tanto);
                tbody.appendChild(tr);
                // 生成直後の行も readonly にして2クリック編集に揃える（MCM0017U 準拠）
                if (typeof finalizeNewRow === 'function') finalizeNewRow(tr);
                if (typeof markDirty === 'function') markDirty();


                // 権限行を追加
                const kengenTbody = document.getElementById('kengenTbody');
                kengenList.forEach(k => {
                    const kr = buildKengenRow(k);
                    kengenTbody.appendChild(kr);
                    if (typeof finalizeNewRow === 'function') finalizeNewRow(kr);
                });

                // 追加した行を選択状態にする
                selectTantoRow(tr);
            })
            .catch(err => alert('行追加に失敗しました。\n' + err));
    }

    // ── 行削除 ──
    // 元VB: MCMMOTANTOROWDELETEBUTTON — 選択行を削除（DBは登録時に反映）
    function deleteSelectedTantoRow() {
        if (!selectedTantoId) {
            alert('削除する行を選択してください。');
            return;
        }
        if (!confirm('選択した担当者行を削除しますか？')) return;

        // 担当者行を削除
        const row = document.querySelector(`.tanto-row[data-tanto-id="${selectedTantoId}"]`);
        if (row) {
            // 削除IDをhiddenに追加
            const container = document.getElementById('deleteIdContainer');
            const inp = document.createElement('input');
            inp.type = 'hidden';
            inp.name = 'deleteIds';
            inp.value = selectedTantoId;
            container.appendChild(inp);

            row.remove();
        }

        // 権限行を削除
        document.querySelectorAll(`.kengen-row[data-tanto-id="${selectedTantoId}"]`).forEach(r => r.remove());

        selectedTantoId = null;
    }

    // ── 登録確認 ──

    function confirmSave() {
        if (confirm('登録してもよろしいですか？')) {
            document.getElementById('mainForm').submit();

    }

                <!-- 【追加】パスワード（画面非表示・hidden で往復させる）
                     サーバが返す初期値 000000（McmConstants.PASSWORD_INI）を
                     登録POSTに載せないと PASSWORD が NULL で保存されてしまうため。
                     ※ パスワードの変更は MCM0025U/MCM0026U で行う。ここでは保持のみ。 -->
                <input type="hidden" name="passwords" value="${t.password || ''}"/>
            </td>
            <td class="col-login-id">
                <input type="text" class="grid-input" name="loginIds" value="" maxlength="20" required/>
            </td>
            <td class="col-tanto-nk">
                <input type="text" class="grid-input" name="tantoNks" value="" required/>
            </td>
            <td class="col-jigyosyo-nk">
                <input type="text" class="grid-input" name="jigyosyoNks" value="" maxlength="100" required/>
            </td>
            <td class="col-mail">
                <input type="text" class="grid-input" name="mailaddresses" value="" maxlength="200"/>
            </td>
            <td class="col-oya-id">
                <input type="text" class="grid-input" name="oyaloginIds" value="" maxlength="20"/>
            </td>
            <td class="col-shinsa">
                <select class="grid-input" name="shinsaFlgs">
                    <option value="0" selected>×</option>
                    <option value="1">○</option>
                </select>
            </td>
            <td class="col-mitsumori">
                <input type="number" class="grid-input" name="mitsumoriKins" value="0" min="0" step="1"/>
            </td>
            <td class="col-keiyaku">
                <input type="number" class="grid-input" name="keiyakuKins" value="0" min="0" step="1"/>
            </td>
            <td class="col-shonin">
                <select class="grid-input" name="shoninFlgs">

                    <option value="1">○</option>
                </select>
            </td>
            <td class="col-mitsushonin">

            <td class="col-keishonin">
                <input type="number" class="grid-input" name="keiyakushoninKins" value="0" min="0" step="1"/>
            </td>
            <td class="col-sysriyo">
                <select class="grid-input" name="systemriyoFlgs">
                    <option value="0">×</option>
                    <option value="1" selected>○</option>
                </select>
            </td>
            <td class="col-maintenance">
                <select class="grid-input" name="maintenanceFlgs">
                    <option value="0" selected>×</option>
                    <option value="1">○</option>
                </select>
            </td>
            <td class="col-biko">
                <input type="text" class="grid-input" name="bikos" value="" maxlength="4000"/>
            </td>
            <td class="col-created-dt"><span></span></td>
            <td class="col-created-by"><span></span></td>
            <td class="col-updated-dt"><span></span></td>
            <td class="col-updated-by"><span></span></td>

    // ── 権限行HTML生成 ──
    function buildKengenRow(k) {
        const tr = document.createElement('tr');
        tr.classList.add('kengen-row');
        tr.dataset.tantoId = k.tantoId;
        tr.style.display = String(k.tantoId) === String(selectedTantoId) ? '' : 'none';

        const riyoOptions = /*[[${riyokengenOptions}]]*/ [
            {key:'0',value:'なし'},{key:'1',value:'参照'},{key:'2',value:'作成'}
        ];
        const optHtml = riyoOptions.map(o =>
            `<option value="${o.key}" ${o.key === (k.riyokengenKbn || '0') ? 'selected' : ''}>${o.value}</option>`
        ).join('');

        tr.innerHTML = `
            <td class="col-select"><span class="row-marker" aria-hidden="true"></span></td>
            <td class="col-kbunrui-id">
                <input type="hidden" name="kengenTantoIds"  value="${k.tantoId}"/>
                <input type="hidden" name="kengenBunruiIds" value="${k.kengenbunruiId}"/>
            </td>
            <td class="col-kbunrui-nk"><span>${k.kengenbunruiNk || ''}</span></td>
            <td class="col-riyokengen">
                <select class="grid-input" name="riyokengenKbns">${optHtml}</select>

    // #184: maxlengthで切り捨てず、101文字以上は入力エラーとして知らせる。
    function validateTantoNameLength(input) {
        var inputs = input ? [input] : document.querySelectorAll('#tantoTbody input[name="tantoNks"]');
        var bad = false;
        inputs.forEach(function (el) {
            if (el.disabled) return;
            if (el.value.length > 100) {
                el.classList.add('field-error');
                bad = true;
            }
        });
        if (bad) showError('担当者は100桁以下で入力してください。');
        return !bad;
    }
    document.addEventListener('focusout', function (e) {
        if (e.target.matches('input[name="tantoNks"]')) validateTantoNameLength(e.target);
    });
    document.addEventListener('compositionend', function (e) {
        if (e.target.matches('input[name="tantoNks"]')) validateTantoNameLength(e.target);
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229
                && e.target.matches('input[name="tantoNks"]')
                && !validateTantoNameLength(e.target)) {
            e.preventDefault();
        }
    });
    document.addEventListener('input', function (e) {

            e.target.classList.remove('field-error');

    /* ── ミニダイアログ（MCM0017U: showError / showConfirm） ── */
    function showError(msg) {
        var ov = document.getElementById('miniDialogOverlay');
        var body = document.getElementById('miniDialogMsg');
        if (ov && body) {
            body.textContent = msg; ov.style.display = 'flex';
            var okBtn = document.getElementById('miniDialogOk');
            var closeX = document.getElementById('miniDialogCloseX');
            var close = function () {
                ov.style.display = 'none'; body.textContent = '';
                okBtn.onclick = null; if (closeX) closeX.onclick = null;
            };
            okBtn.onclick = close; if (closeX) closeX.onclick = close;
            setTimeout(function () { okBtn.focus(); }, 50);
        } else { alert(msg); }
    }
    function showConfirm(msg, onOk) {
        var ov = document.getElementById('confirmDialogOverlay');
        var body = document.getElementById('confirmMsg');
        var okBtn = document.getElementById('confirmOk');
        var cancelBtn = document.getElementById('confirmCancel');
        var closeX = document.getElementById('confirmCloseX');
        if (ov && body && okBtn && cancelBtn) {
            body.textContent = msg; ov.style.display = 'flex';
            var cleanup = function () {
                ov.style.display = 'none'; okBtn.onclick = null;
                cancelBtn.onclick = null; if (closeX) closeX.onclick = null;
            };
            okBtn.onclick = function () { cleanup(); if (onOk) onOk(); };
            cancelBtn.onclick = function () { cleanup(); };
            if (closeX) closeX.onclick = function () { cleanup(); };
            setTimeout(function () { okBtn.focus(); }, 50);
        } else { if (window.confirm(msg) && onOk) onOk(); }
    }

    /* ── 必須項目チェック（MCM0017U 準拠 / 必須は required 属性から自動判定） ── */
    function getColLabel(td) {
        if (!td) return '';
        var tr = td.parentElement;
        var ci = Array.prototype.indexOf.call(tr.children, td);
        var table = td.closest('table');
        var th = table ? table.querySelectorAll('thead th')[ci] : null;
        return th ? String(th.textContent || '').trim() : '';
    }
    function getRequiredDefs(tr) {
        var out = [];
        if (!tr || !tr.querySelectorAll) return out;
        tr.querySelectorAll('input.grid-input[required], select.grid-input[required]')
          .forEach(function (el) { out.push({ el: el, label: getColLabel(el.closest('td')) }); });
        return out;
    }
    function isElEmpty(el) { return !el || !el.value || String(el.value).trim() === ''; }
    /* 数値列・コンボは初期値を持つためテキスト列のみで空行判定する */
    function isRowContentEmptyTr(tr) {
        if (!tr) return true;
        var empty = true;
        tr.querySelectorAll('input.grid-input[type=text]').forEach(function (el) {
            if (el.value && String(el.value).trim() !== '') empty = false;
        });
        return empty;
    }
    /* 一部でも入力されている行だけチェックする。mark=true で .field-error 付与 */
    function validateRowRequired(tr, mark) {
        if (!tr) return true;
        if (isRowContentEmptyTr(tr)) return true;
        var defs = getRequiredDefs(tr);
        if (!defs.length) return true;
        var ok = true;
        defs.forEach(function (d) {
            if (isElEmpty(d.el)) { ok = false; if (mark) d.el.classList.add('field-error'); }
            else { d.el.classList.remove('field-error'); }
        });
        return ok;
    }
    function getMissingLabelsForRow(tr) {
        var labels = [];
        getRequiredDefs(tr).forEach(function (d) { if (isElEmpty(d.el)) labels.push(d.label); });
        return labels;
    }
    function buildRequiredMsg(labels) {
        if (!labels || !labels.length) return '未入力の必須項目があります。';
        return '未入力の必須項目があります。（' + labels.join('／') + '）';
    }
    function validateAllRows() {
        var bad = null;
        document.querySelectorAll('#tantoTable tbody tr').forEach(function (tr) {
            if (bad) return;
            if (!validateRowRequired(tr, true)) bad = tr;
        });
        return bad;
    }

    /* ── DBのNULL表記を空欄に整える（MCM0017U: normalizeNullDisplay） ── */
    function normalizeNullDisplay(root) {

        scope.querySelectorAll('#tantoTable input, #kengenTable input').forEach(function (input) {
            if (nullValues.indexOf(String(input.value || '').trim()) >= 0) input.value = '';
        });

    /* ── 列幅調整（ドラッグでリサイズ / MCM0017U: setupColumnResize） ──
       MCM3006U は mcm3006u.css の .col-* で列幅を定義しているため colgroup は作らず、
       thead の th に直接 width を書き込む方式にする（初期表示の幅は変わらない）。
       display:none の列（担当者ID・分類ID）はリサイザを付けない。 */
    function setupColumnResize(tableSel) {
        var table = document.querySelector(tableSel);
        if (!table) return;
        var ths = table.querySelectorAll('thead th');
        if (!ths.length) return;
        table.style.tableLayout = 'fixed';
        for (var i = 0; i < ths.length; i++) {
            (function (th) {
                if (window.getComputedStyle(th).display === 'none') return;
                if (th.querySelector('.col-resizer')) return;
                if (window.getComputedStyle(th).position === 'static') { th.style.position = 'relative'; }
                var grip = document.createElement('span');
                grip.className = 'col-resizer';
                th.appendChild(grip);
                grip.addEventListener('mousedown', function (e) {
                    e.preventDefault(); e.stopPropagation();
                    var startX = e.clientX;
                    var startW = th.getBoundingClientRect().width;
                    document.body.classList.add('col-resizing');
                    var onMove = function (ev) {
                        var w = startW + (ev.clientX - startX);
                        if (w < 22) { w = 22; }
                        th.style.width = w + 'px';
                        th.style.minWidth = w + 'px';
                        th.style.maxWidth = w + 'px';
                    };
                    var onUp = function () {
                        document.body.classList.remove('col-resizing');
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
                grip.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); });
            })(ths[i]);
        }
    }

    /* ── 2クリック編集＋矢印キー移動（MCM0017U: setupTwoClickEdit） ──
       1クリック目: セル選択（グレー枠）／2クリック目: 編集開始
       矢印キー: セル移動 ／ Enter・F2・文字入力: 編集開始 ／ Esc: 編集終了 */
    function setupTwoClickEdit(gridSel, onRowActivate) {
        var table = document.querySelector(gridSel);
        if (!table) return;
        var tbody = table.querySelector('tbody');
        if (!tbody) return;
        var selTd = null;
        var editing = null;
        var lastRow = null;

        /* 【追加】読み取り専用セル（.grid-input を持たない表示専用セル）の判定。
           対象: 分類 / 登録日時 / 登録者 / 更新日時 / 更新者 */
        var RO_TD_SEL = 'td.col-kbunrui-nk, td.col-created-dt, td.col-created-by, td.col-updated-dt, td.col-updated-by';
        function isReadonlyTd(td) { return !!(td && td.matches && td.matches(RO_TD_SEL)); }
        function isCellTd(td) { return !!(td && ((td.querySelector && td.querySelector('.grid-input')) || isReadonlyTd(td))); }
        function lockAll() {
            tbody.querySelectorAll('input.grid-input').forEach(function (i) {
                i.setAttribute('readonly', 'readonly');
            });
        }
        function clearCellSel() {
            table.querySelectorAll('td.cell-selected').forEach(function (t) { t.classList.remove('cell-selected'); });
            selTd = null;
        }
        function clearRowSelected() {
            table.querySelectorAll('tr.selected-row').forEach(function (t) { t.classList.remove('selected-row'); });
        }
        function stopEdit() {
            if (editing) { try { editing.blur(); } catch (ev) { } editing = null; }
            lockAll();
            try { var s = window.getSelection(); if (s) s.removeAllRanges(); } catch (ev) { }
        }
        function showRequiredError(tr) {
            showError(buildRequiredMsg(getMissingLabelsForRow(tr)));
            var fm = tr.querySelector('.field-error');
            if (fm) { try { fm.removeAttribute('readonly'); fm.focus({ preventScroll: true }); } catch (ev) { } }
        }
        function guardLeaveRow(nextTr) {
            if (!lastRow || !nextTr || lastRow === nextTr) return true;
            if (!document.body.contains(lastRow)) return true;
            if (validateRowRequired(lastRow, true)) return true;
            showRequiredError(lastRow);
            return false;
        }
        function selectTd(td) {
            if (!td) return;
            var tr = td.closest('tr');
            if (!guardLeaveRow(tr)) return;
            clearRowSelected();
            stopEdit();
            clearCellSel();
            selTd = td;
            td.classList.add('cell-selected');
            lastRow = tr;
            if (tr && typeof onRowActivate === 'function') { onRowActivate(tr); }
            var f = td.querySelector('.grid-input');
            if (f) { try { f.focus({ preventScroll: true }); } catch (ev) { f.focus(); } }
            else if (isReadonlyTd(td)) {
                /* 【追加】読み取り専用セルは入力欄が無いのでセル自体にフォーカスを当てる。
                   矢印キー移動を効かせるためだけの措置で、入力・編集はできない。 */
                if (!td.hasAttribute('tabindex')) { td.setAttribute('tabindex', '-1'); }
                try { td.focus({ preventScroll: true }); } catch (ev) { }
            }
        }
        function startEdit(td, typedChar) {
            if (!td) return;
            if (isReadonlyTd(td)) { return; }   /* 【追加】読み取り専用セルは編集させない（従来どおり編集不可） */
            var inp = td.querySelector('.grid-input');
            var trE = td.closest('tr');
            if (!guardLeaveRow(trE)) return;
            if (!inp || inp.disabled) return;
            lastRow = trE;
            clearRowSelected();
            clearCellSel();
            if (inp.tagName === 'SELECT') {
                editing = inp;
                try { inp.focus({ preventScroll: true }); } catch (ev) { inp.focus(); }
                return;
            }
            inp.removeAttribute('readonly');
            editing = inp;
            if (typedChar != null) {
                inp.value = typedChar;
                try { inp.dispatchEvent(new Event('input', { bubbles: true })); } catch (ev) { }
            }
            setTimeout(function () {
                try { inp.focus({ preventScroll: true }); } catch (ev) { inp.focus(); }
                if (typedChar != null) {
                    var L = String(inp.value).length;
                    try { inp.setSelectionRange(L, L); } catch (ev) { }
                } else {
                    try { inp.select(); } catch (ev) { }
                }
            }, 0);
        }

        lockAll();

        /* 行選択グレー と セル選択グレー を排他にする（MCM0017U 準拠） */
        function deselectRowOnOtherClick(e) {
            var t = e.target;
            if (!t || typeof t.closest !== 'function') return;
            var onMarker = !!t.closest('td.col-select');
            if (!onMarker) { clearRowSelected(); }
            var rt = (t.closest) ? t.closest('td') : null;   /* 【追加】読み取り専用セルもセル選択を保持する */
            if (onMarker || !(t.closest('.grid-input') || (rt && isReadonlyTd(rt)))) { stopEdit(); clearCellSel(); }
        }
        table.addEventListener('mousedown', deselectRowOnOtherClick, true);
        table.addEventListener('click', deselectRowOnOtherClick, true);

        table.addEventListener('mousedown', function (e) {
            /* 【追加】読み取り専用セル（分類・登録日時・登録者・更新日時・更新者）も
               クリックでセル選択できるようにする。これらは .grid-input を持たないため
               startEdit() が必ず抜ける ＝ 編集は従来どおり一切できない。 */
            var rtd = (e.target && e.target.closest) ? e.target.closest('td') : null;
            if (rtd && isReadonlyTd(rtd)) { e.preventDefault(); selectTd(rtd); return; }
            var inp = e.target.closest('.grid-input');
            if (!inp) return;
            var td = inp.closest('td');
            if (!isCellTd(td)) return;
            if (inp === editing) return;
            if (td === selTd) { startEdit(td); }
            else { e.preventDefault(); selectTd(td); }
        });

        table.addEventListener('keydown', function (e) {
            if (editing) {
                if (e.key === 'Escape') { var te = editing.closest('td'); stopEdit(); selectTd(te); return; }
                if (e.key === 'Enter') {
                    var t2 = editing.closest('td');
                    var ci2 = Array.prototype.indexOf.call(t2.parentElement.children, t2);
                    stopEdit();
                    var nr2 = t2.parentElement.nextElementSibling;
                    while (nr2 && !isCellTd(nr2.children[ci2])) nr2 = nr2.nextElementSibling;
                    if (nr2) { selectTd(nr2.children[ci2]); nr2.children[ci2].scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
                    else { selectTd(t2); }
                    e.preventDefault();
                }
                return;
            }
            if (!selTd) return;
            var tr = selTd.parentElement;
            var tds = Array.prototype.slice.call(tr.children);
            var ci = tds.indexOf(selTd);
            var target = null;
            if (e.key === 'ArrowDown') { var nr = tr.nextElementSibling; while (nr && !isCellTd(nr.children[ci])) nr = nr.nextElementSibling; if (nr) target = nr.children[ci]; }
            else if (e.key === 'ArrowUp') { var pr = tr.previousElementSibling; while (pr && !isCellTd(pr.children[ci])) pr = pr.previousElementSibling; if (pr) target = pr.children[ci]; }
            else if (e.key === 'ArrowRight') { for (var j = ci + 1; j < tds.length; j++) { if (isCellTd(tds[j])) { target = tds[j]; break; } } }
            else if (e.key === 'ArrowLeft') { for (var k = ci - 1; k >= 0; k--) { if (isCellTd(tds[k])) { target = tds[k]; break; } } }
            if (!target) {
                if (e.key === 'Enter' || e.key === 'F2') { startEdit(selTd); e.preventDefault(); return; }
                if (e.key === 'Backspace' || e.key === 'Delete') { startEdit(selTd, ''); e.preventDefault(); return; }
                if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { startEdit(selTd, e.key); e.preventDefault(); return; }
            }
            if (target) { e.preventDefault(); selectTd(target); target.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
        });
    }

    /* ── 閉じる：変更があるときだけ確認（MCM0017U 準拠） ── */
    function bindCloseConfirm() {
