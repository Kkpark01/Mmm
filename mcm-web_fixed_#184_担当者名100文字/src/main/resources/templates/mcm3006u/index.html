    /* =====================================================================
       担当者グリッド選択 → 利用権限グリッド連動表示（後勝ちで上書き）
       【変換元】MCM_MO_TANTOKENGENDataGridView
                 DataMember = FK_MCM_MO_TANTO_MCM_MO_TANTOKENGEN

       【表示されなかった原因】
         (1) 担当者IDが BigDecimal のため、担当者行は "1"、権限行は "1.0" の
             ように文字列表現がズレることがあり、=== の比較が常に false になって
             全行 display:none のままだった。
         (2) 権限行が MCM_MO_TANTOKENGEN に未登録の担当者は、そもそも行が
             1件も無かった（→ Repository を CROSS JOIN 化して対応済み）。

       ここでは (1) を数値化して比較することで解消する。
       既存の selectTantoRow / selectKengenRow は削除せず、後勝ちで置き換える。
       ===================================================================== */

    /* 担当者IDを比較用に正規化する（"1" と "1.0" と 1 を同一とみなす） */
    function normTantoId(v) {
        if (v === null || v === undefined) return '';
        var s = String(v).trim();
        if (s === '') return '';
        var n = Number(s);
        return isNaN(n) ? s : String(n);
    }

    /* 選択中の担当者に紐づく権限行だけを表示する */
    function refreshKengenGrid() {
        var key = normTantoId(selectedTantoId);
        var shown = 0;
        document.querySelectorAll('.kengen-row').forEach(function (r) {
            var hit = (key !== '' && normTantoId(r.dataset.tantoId) === key);
            r.style.display = hit ? '' : 'none';
            if (hit) shown++;
        });
        /* 権限行が1件も無い場合は「該当なし」を1行だけ出す（列数はthead基準） */
        var tb = document.getElementById('kengenTbody');
        if (!tb) return;
        var empty = tb.querySelector('tr.kengen-empty');
        if (shown === 0 && key !== '') {
            if (!empty) {
                var cols = document.querySelectorAll('#kengenTable thead th').length;
                empty = document.createElement('tr');
                empty.className = 'kengen-empty';
                var td = document.createElement('td');
                td.colSpan = cols;
                td.style.textAlign = 'center';
                td.style.color = '#888';
                td.style.padding = '6px';
                td.textContent = '該当する利用権限がありません。';
                empty.appendChild(td);
                tb.appendChild(empty);
            }
            empty.style.display = '';
        } else if (empty) {
            empty.style.display = 'none';
        }
    }

    /* 担当者行の選択（▶マーカー＋権限グリッド連動） */
    function selectTantoRow(tr, rowSel) {
        if (!tr) return;
        document.querySelectorAll('.tanto-row').forEach(function (r) {
            r.classList.remove('selected-row');
        });
        if (rowSel) tr.classList.add('selected-row');
        setActiveRow('#tantoTable', tr);
        selectedTantoId = tr.dataset.tantoId;
        refreshKengenGrid();
    }

    /* 行追加で生成する権限行も同じ正規化ルールで表示判定する */
    var __buildKengenRowBase = buildKengenRow;
    buildKengenRow = function (k) {
        var tr = __buildKengenRowBase(k);
        tr.style.display =
            normTantoId(k.tantoId) === normTantoId(selectedTantoId) ? '' : 'none';
        return tr;
    };

    /* 初期表示：先頭の担当者行を選択して権限グリッドを出す */
    window.addEventListener('DOMContentLoaded', function () {
        var firstRow = document.querySelector('#tantoTable tbody tr.tanto-row');
        if (firstRow) { selectTantoRow(firstRow, false); }
        else { refreshKengenGrid(); }
    });

    /* =====================================================================
       利用権限グリッドが空になる件の最終対処（後勝ちで上書き）
       【原因】
         画面の利用権限行は kengenList（担当者×権限分類のCROSS JOIN結果）を
         そのままレンダリングしている。そのため MCM_MO_TANTOKENGEN 側の状態や
         結合条件で担当者に対応する行が1件も生成されないと、担当者行を選択しても
         表示できる .kengen-row が存在せず『該当する利用権限がありません。』
         だけが出ていた。
       【対処】
         権限分類マスタ（kengenBunruiList）を画面に持たせておき、選択担当者に
         対応する行が0件のときは利用権限=なし(0) の行をその場で生成して表示する。
         元VB DataGridView が権限分類全件を常に表示していた挙動に合わせる。
         ※ 既存の関数・HTML・列構成は一切変更していない（後勝ちで上書きのみ）。
       ===================================================================== */

    /* 権限分類マスタ（サーバから受け取る。無ければ空配列） */
    var KENGEN_BUNRUI_LIST = /*[[${kengenBunruiList}]]*/ [];

    /* 選択担当者の権限行が無い場合に、権限分類マスタから行を補完生成する */
    function ensureKengenRowsFor(tantoId) {
        var key = normTantoId(tantoId);
        if (key === '') return 0;
        var tb = document.getElementById('kengenTbody');
        if (!tb) return 0;
        var exists = 0;
        document.querySelectorAll('.kengen-row').forEach(function (r) {
            if (normTantoId(r.dataset.tantoId) === key) exists++;
        });
        if (exists > 0) return exists;
        if (!KENGEN_BUNRUI_LIST || !KENGEN_BUNRUI_LIST.length) return 0;
        KENGEN_BUNRUI_LIST.forEach(function (b) {
            var kr = buildKengenRow({
                tantoId: tantoId,
                kengenbunruiId: b.kengenbunruiId,
                kengenbunruiNk: b.kengenbunruiNk,
                riyokengenKbn: '0',
                biko: ''
            });
            tb.appendChild(kr);
            if (typeof finalizeNewRow === 'function') finalizeNewRow(kr);
        });
        return KENGEN_BUNRUI_LIST.length;
    }

    /* 補完生成を挟んでから表示切替する（既存 refreshKengenGrid を後勝ちで上書き） */
    var __refreshKengenGridBase = refreshKengenGrid;
    refreshKengenGrid = function () {
        ensureKengenRowsFor(selectedTantoId);
        __refreshKengenGridBase();
    };

    /* 初期表示でも補完後の状態で描画し直す */
    window.addEventListener('DOMContentLoaded', function () {
        var firstRow = document.querySelector('#tantoTable tbody tr.tanto-row');
        if (firstRow) { selectTantoRow(firstRow, false); }
        else { refreshKengenGrid(); }
    });


    /* =====================================================================
       【MCM0017U 準拠】登録完了メッセージをポップアップ(ミニダイアログ)へ統一
       元: 画面上部の緑帯 <div class="message success"> による「登録しました。」表示
       ※ 既存の A289/A290 の帯は削除せず、CSS で非表示にして後勝ちで無効化する。
       参考: MCM0017U index.html!A204 showServerMessageOnce()
       ===================================================================== */

    /* 画面上部の帯メッセージを非表示にする（MCM0015U/MCM0016U/MCM0017U と同じ挙動） */
    (function () {
        var st = document.createElement('style');
        st.textContent = '.message.success, .message.error { display:none !important; }';
        document.head.appendChild(st);
    })();

    /* サーバーからのメッセージを1度だけダイアログ表示する */
    function showServerMessageOnce() {
        var data = document.getElementById('serverMessageData');
        if (!data) return;
        var errorMessage   = data.getAttribute('data-error');
        var successMessage = data.getAttribute('data-message');
        data.removeAttribute('data-error');
        data.removeAttribute('data-message');
        var title = document.getElementById('miniDialogTitle');
        if (errorMessage) {
            if (title) title.textContent = '入力エラー';
            showError(errorMessage);
        } else if (successMessage) {
            if (title) title.textContent = '情報';
            showError(successMessage);
        }
    }

    window.addEventListener('DOMContentLoaded', function () {
        showServerMessageOnce();
    });


    /* =====================================================================
       【MCM0017U 準拠】利用権限グリッド：備考列をウィンドウ右端まで伸ばす
       参考: MCM0017U index.html!A1287 fitInitial()
         var avail = wrap.clientWidth;
         if (avail > total) { ws[LAST] += (avail - total); }  ← 余り幅を最終列へ
       MCM0017U は colgroup の col に px を書いて実現しているが、MCM3006U は
       colgroup を持たないため thead の th に直接 px を書き込む方式で移植する。
       CSS の width:auto / calc() は table-layout:fixed 下では効かないため、
       幅は必ず JS で実測して px 指定する。
       ※ mcm3006u.css / common.css は一切変更しない（後勝ちで上書き）
       ===================================================================== */
    (function () {
        var MIN_BIKO = 120;
        function fitKengenBiko() {
            var table = document.getElementById('kengenTable');
            if (!table) return;
            var ths = table.querySelectorAll('thead th');
            if (!ths.length) return;
            var biko = table.querySelector('thead th.col-kbiko');
            if (!biko) return;
            var wrap = table.parentElement;
            var avail = wrap ? wrap.clientWidth : 0;
            if (!avail) return;
            /* 初回だけ CSS 由来の列幅を実測して記憶する（備考は最小幅で仮置き） */
            if (!table.__baseW) {
                var base = [];
                for (var i = 0; i < ths.length; i++) {
                    if (window.getComputedStyle(ths[i]).display === 'none') { base.push(0); continue; }
                    base.push(ths[i] === biko ? MIN_BIKO : Math.round(ths[i].getBoundingClientRect().width));
                }
                table.__baseW = base;
            }
            var bw = table.__baseW;
            var others = 0;
            for (var j = 0; j < ths.length; j++) { if (ths[j] !== biko) { others += bw[j]; } }
            /* 余り幅を全部備考へ（MCM0017U の ws[LAST] += (avail - total) と同じ考え方） */
            var w = avail - others - 2;
            if (w < MIN_BIKO) { w = MIN_BIKO; }
            for (var k = 0; k < ths.length; k++) {
                if (window.getComputedStyle(ths[k]).display === 'none') { continue; }
                var ww = (ths[k] === biko) ? w : bw[k];
                ths[k].style.width = ww + 'px';
                ths[k].style.minWidth = ww + 'px';
                ths[k].style.maxWidth = ww + 'px';
            }
            table.style.tableLayout = 'fixed';
            table.style.width = (others + w) + 'px';
        }
        window.fitKengenBikoWidth = fitKengenBiko;
        window.addEventListener('DOMContentLoaded', function () { setTimeout(fitKengenBiko, 0); });
        window.addEventListener('load', function () { setTimeout(fitKengenBiko, 0); });
        var __rt = null;
        window.addEventListener('resize', function () {
            if (__rt) { clearTimeout(__rt); }
            __rt = setTimeout(fitKengenBiko, 100);
        });
        /* 担当者行の選択で権限グリッドを描き直した直後にも再計算する */
        if (typeof refreshKengenGrid === 'function') {
            var __baseRefresh = refreshKengenGrid;
            refreshKengenGrid = function () {
                var r = __baseRefresh.apply(this, arguments);
                fitKengenBiko();
                return r;
            };
        }
    })();


    /* =====================================================================
       【担当者グリッドのみ】▶列の右側に昇順の行番号（1,2,3…）を表示する
       ・利用権限グリッド(#kengenTable)には付けない
       ・行追加／行削除／並び替えの後も自動で振り直す（MutationObserver）
       ・番号はあくまで表示用。name を持たないため送信データには影響しない
       ※ 既存コードは変更せず、末尾で後勝ちに追加する
       ===================================================================== */
    (function () {
        function renumberTantoRows() {
            var tbody = document.getElementById('tantoTbody');
            if (!tbody) return;
            var rows = tbody.querySelectorAll('tr.tanto-row');
            var no = 0;
            for (var i = 0; i < rows.length; i++) {
                var tr = rows[i];
                /* 非表示行は番号を飛ばさず、見えている行だけ 1 から連番にする */
                if (tr.style.display === 'none') { continue; }
                no++;
                var td = tr.querySelector('td.col-select');
                if (!td) { continue; }
                var span = td.querySelector('span.row-no');
                if (!span) {
                    span = document.createElement('span');
                    span.className = 'row-no';
                    span.setAttribute('aria-hidden', 'true');
                    td.appendChild(span);   /* ▶マーカーの右隣に置く */
                }
                if (span.textContent !== String(no)) { span.textContent = String(no); }
            }
        }
        window.renumberTantoRows = renumberTantoRows;

        function startWatch() {
            renumberTantoRows();
            var tbody = document.getElementById('tantoTbody');
            if (!tbody || !window.MutationObserver) { return; }
            var timer = null;
            var mo = new MutationObserver(function () {
                if (timer) { clearTimeout(timer); }
                timer = setTimeout(renumberTantoRows, 0);
            });
            mo.observe(tbody, { childList: true });
        }
        window.addEventListener('DOMContentLoaded', function () { setTimeout(startWatch, 0); });
        window.addEventListener('load', function () { setTimeout(renumberTantoRows, 0); });
    })();
    /* =====================================================================
       行追加した空の新規行が必須チェックをすり抜ける問題の修正（MCM0017U 準拠）

       【原因】
         validateRowRequired()（A1170）は isRowContentEmptyTr()（A1161）で
         「テキスト列が全部空の行」を true（=チェック対象外）として返す。
         行追加ボタンで作られた行は全項目が空なので、この判定に引っかかり
         必須チェックをすり抜けて確認ダイアログが出てしまっていた。

       【MCM0017U はどうしているか】
         (1) index.html A672 isAddedRow() で「行追加された行」を判別する
         (2) index.html A653 pruneBlankAddedRows() で、末尾にある
             「完全に空の追加行」は送信前に DOM から削除する（誤登録防止）
         (3) 空でない追加行は通常どおり必須チェックにかける
         つまり「空の追加行は登録対象から外す」「1つでも入力があれば必須
         チェックする」という二段構えになっている。

       【本画面での対応】
         MCM3006U には .row-status が無いため、行追加時に data-added="1" を
         付けて追加行を判別する。addTantoRow()（A872）本体は変更せず、
         MutationObserver で新しく増えた tr に印を付ける方式にする。
         その上で confirmSave() を後勝ちで上書きし、
           1. 完全に空の追加行を DOM から取り除く
           2. 残った行に必須チェックをかけ、未入力ならエラーポップを出す
           3. 問題なければ従来どおり確認ダイアログを出す
         既存の関数は一切削除せず、後勝ちで上書きする。
       ===================================================================== */
    (function () {
        'use strict';

        var tbody = null;

        /* 行追加で増えた行に data-added="1" を付ける（MCM0017U: row-status=added 相当） */
        function markAddedRows() {
            if (!tbody) { return; }
            tbody.querySelectorAll('tr').forEach(function (tr) {
                if (tr.hasAttribute('data-initial-row')) { return; }
                if (!tr.hasAttribute('data-added')) { tr.setAttribute('data-added', '1'); }
            });
        }
        function isAddedRow(tr) {
            return !!(tr && tr.getAttribute && tr.getAttribute('data-added') === '1');
        }

        /* 行の入力が全て空か（select やチェックボックスも含めて判定する） */
        function isRowBlank(tr) {
            if (!tr) { return true; }
            var blank = true;
            tr.querySelectorAll('input.grid-input').forEach(function (el) {
                if (el.type === 'checkbox') { if (el.checked) { blank = false; } return; }
                if (el.value && String(el.value).trim() !== '') { blank = false; }
            });
            return blank;
        }

        /* MCM0017U pruneBlankAddedRows 相当：末尾の空の追加行を送信対象から外す */
        function pruneBlankAddedRows() {
            if (!tbody) { return; }
            var rows = tbody.querySelectorAll('tr');
            for (var i = rows.length - 1; i >= 0; i--) {
                var r = rows[i];
                if (!isAddedRow(r)) { break; }
                if (!isRowBlank(r)) { break; }
                r.parentNode.removeChild(r);
            }
            if (typeof window.renumberTantoRows === 'function') { window.renumberTantoRows(); }
        }

        /* 追加行は「空でも必須チェックの対象」にする。
           既存の validateRowRequired は空行をスキップするため、ここで補う。

           【変更】最初に見つかったNG行で止めず、全行・全必須セルを走査して
                   未入力セルすべてに .field-error（赤枠）を付ける。
                   戻り値は「最初のNG行」で、エラーメッセージとフォーカス用に使う。 */
        function findInvalidRow() {
            var bad = null;
            if (!tbody) { return bad; }
            tbody.querySelectorAll('tr').forEach(function (tr) {
                if (tr.style && tr.style.display === 'none') { return; }
                var defs = (typeof getRequiredDefs === 'function') ? getRequiredDefs(tr) : [];
                if (!defs.length) { return; }
                var ng = false;
                defs.forEach(function (d) {
                    if (isElEmpty(d.el)) { ng = true; d.el.classList.add('field-error'); }
                    else { d.el.classList.remove('field-error'); }
                });
                if (ng && !bad) { bad = tr; }
            });
            return bad;
        }

        /* 未入力の必須セルを持つ行数・セル数を数える（メッセージ用） */
        function countInvalid() {
            var rows = 0, cells = 0;
            if (!tbody) { return { rows: rows, cells: cells }; }
            tbody.querySelectorAll('tr').forEach(function (tr) {
                if (tr.style && tr.style.display === 'none') { return; }
                var defs = (typeof getRequiredDefs === 'function') ? getRequiredDefs(tr) : [];
                var n = 0;
                defs.forEach(function (d) { if (isElEmpty(d.el)) { n++; } });
                if (n > 0) { rows++; cells += n; }
            });
            return { rows: rows, cells: cells };
        }

        /* 全行の赤枠をいったん消す（再チェック時に古い赤枠を残さない） */
        function clearAllFieldError() {
            if (!tbody) { return; }
            tbody.querySelectorAll('.field-error').forEach(function (el) {
                el.classList.remove('field-error');
            });
        }

        /* 登録：空の追加行を除去 → 全行の必須チェック → 確認ダイアログ（後勝ちで上書き）
           NG時は該当する必須セルを「全て」赤枠にし、複数ある場合は件数も知らせる。 */
        window.confirmSave = function () {
            pruneBlankAddedRows();
            clearAllFieldError();
            if (!validateTantoNameLength()) return;
            var bad = findInvalidRow();
            if (bad) {
                var cnt = countInvalid();
                var labels = (typeof getMissingLabelsForRow === 'function') ? getMissingLabelsForRow(bad) : [];
                var msg = buildRequiredMsg(labels);
                if (cnt.rows > 1) {
                    msg = '未入力の必須項目があります。（' + cnt.rows + '行 / ' + cnt.cells + '項目）'
                        + '\n赤枠の箇所を入力してください。';
                }
                showError(msg);
                var fm = bad.querySelector('.field-error');
                if (fm) {
                    try { fm.removeAttribute('readonly'); fm.focus({ preventScroll: true }); } catch (ev) { }
                }
                return;
            }
            showConfirm('登録します。よろしいですか？', function () {
                mcmDirty = false;
                document.getElementById('mainForm').submit();
            });
        };

        function start() {
            tbody = document.getElementById('tantoTbody');
            if (!tbody) { return; }
            /* 画面初期表示の行（DB既存行）には印を付け、追加行と区別する */
            tbody.querySelectorAll('tr').forEach(function (tr) {
                tr.setAttribute('data-initial-row', '1');
            });
            if (!window.MutationObserver) { return; }
            var mo = new MutationObserver(function () { markAddedRows(); });
            mo.observe(tbody, { childList: true });
        }
        window.addEventListener('DOMContentLoaded', function () { setTimeout(start, 0); });
    })();


    </script>
