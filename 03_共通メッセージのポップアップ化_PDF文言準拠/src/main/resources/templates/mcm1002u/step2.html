<!DOCTYPE html>
<!--
  【変換元】Mcm1002u2Screen.Designer.vb
    MCM1002U Screen2 - 見積依頼機器選定
    画面サイズ: 1263 x 923
    ボタン: 取引先見積・契約検索画面へ, 前へ, 依頼書発行, 登録
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
	<link rel="stylesheet" th:href="@{/css/common.css}" />
	<link rel="stylesheet" th:href="@{/css/mcm1002u.css}" />
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>
<div layout:fragment="content">
    <h2>見積依頼機器選定</h2>

    <!-- メッセージ -->
    <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
    

    <!-- ヘッダ情報 -->
    <div class="header-section">
        <label>納入先コード</label>
        <input type="text" th:value="${form.nonyusakiCd}" readonly class="readonly-field" style="width:110px"/>
        <label>納入先名</label>
        <input type="text" th:value="${form.nonyusakiNk}" readonly class="readonly-field" style="width:410px"/>
        <label>サポートID</label>
        <input type="text" th:value="${form.supportId}" readonly class="readonly-field" style="width:62px"/>
        <label>プラント名</label>
        <input type="text" th:value="${form.plantNk}" readonly class="readonly-field" style="width:384px"/>
    </div>

    <form id="mainForm" th:action="@{/mcm1002u/save}" th:object="${form}" method="post">
        <!-- 見積情報 -->
        <h3>&lt;&lt; 見積情報 &gt;&gt;</h3>
        <table class="grid-table mitsumori-table">
            <thead>
                <tr>
                    <th style="width:120px">見積依頼NO</th>
                    <th style="width:230px">取引先</th>
                    <th style="width:100px">回答希望日</th>
                    <th style="width:35px">8H</th>
                    <th style="width:35px">24H</th>
                    <th style="width:70px">点検有</th>
                    <th style="width:110px">点検可能曜日</th>
                    <th style="width:110px">夜間対応有</th>
                    <th style="width:110px">保守方法</th>
                    <th style="width:80px">パック契約</th>
                    <th style="width:80px">店舗直契約</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row, stat : *{mitsumoriRows}">
                    <td>
                        <span th:text="${row.tmIraiNo}"></span>
                        <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].tmIraiId}"/>
                        <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].tmIraiNo}"/>
                    </td>
                    <td>
                        <span th:text="${row.torihikisakiNk}"></span>
                        <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torihikisakiId}"/>
                        <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torihikisakiCd}"/>
                        <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torihikisakiNk}"/>
                    </td>
                    <td>
                        <input type="date"
                               th:field="*{mitsumoriRows[__${stat.index}__].kaitokizitsuDt}"/>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               th:field="*{mitsumoriRows[__${stat.index}__].h8}"/>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               th:field="*{mitsumoriRows[__${stat.index}__].h24}"/>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               th:field="*{mitsumoriRows[__${stat.index}__].tenkenumu}"/>
                    </td>
                    <td>
                        <select th:field="*{mitsumoriRows[__${stat.index}__].tenkenkanoyobi}">
                            <option th:each="opt : ${tenkenkanoyobiOptions}"
                                    th:value="${opt.key}" th:text="${opt.value}"></option>
                        </select>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               th:field="*{mitsumoriRows[__${stat.index}__].yakantaioumu}"/>
                    </td>
                    <td>
                        <select th:field="*{mitsumoriRows[__${stat.index}__].hosyuhoho}">
                            <option th:each="opt : ${hosyuhohoOptions}"
                                    th:value="${opt.key}" th:text="${opt.value}"></option>
                        </select>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               th:field="*{mitsumoriRows[__${stat.index}__].packFlg}"/>
                    </td>
                    <td class="text-center">
                        <input type="checkbox"
                               th:field="*{mitsumoriRows[__${stat.index}__].tenpoFlg}"/>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- << 機器構成パターン >> (ReadOnly) -->
        <h3>&lt;&lt; 機器構成パターン &gt;&gt;</h3>
        <table class="grid-table kikikosei-table" id="kikikoseiTable">
            <thead>
                <tr>
                    <th style="width:300px">機器構成名</th>
                    <th style="width:200px">手配製番</th>
                </tr>
            </thead>
            <tbody>
                <!-- TODO: th:each over kikikosei data from session/model -->
                <tr><td colspan="2" class="text-center">データは登録後に表示されます</td></tr>
            </tbody>
        </table>

        <!-- << 機器構成明細 >> (ReadOnly) -->
        <h3>&lt;&lt; 機器構成明細 &gt;&gt;</h3>
        <table class="grid-table kikimeisai-table" id="kikimeisaiTable">
            <thead>
                <tr>
                    <th style="width:200px">製造メーカー名</th>
                    <th style="width:300px">品名</th>
                    <th style="width:300px">型式</th>
                    <th style="width:55px">数量</th>
                </tr>
            </thead>
            <tbody>
                <!-- TODO: th:each over kikimeisai data -->
                <tr><td colspan="4" class="text-center">データは登録後に表示されます</td></tr>
            </tbody>
        </table>

        <!-- ボタン -->
        <div class="footer-buttons">
            <a th:href="@{/mcm1003u}">取引先見積・契約検索画面へ</a>
            <a th:href="@{/mcm1002u/back}">前へ</a>
            <span class="spacer"></span>
            <button type="submit" th:formaction="@{/mcm1002u/iraisho}"
                    class="btn btn-info">依頼書発行</button>
            <button type="submit" class="btn btn-primary"
                    onclick="return confirm('登録しますか？')">登録</button>
        </div>
    </form>

<script th:inline="javascript">
    /* 【変換元】Mcm1002u2Screen - 状態に応じた編集可否制御 */
    document.addEventListener('DOMContentLoaded', function() {
        var jotai = /*[[${delivery?.jotai}]]*/ '';
        var mitsumoriFlg = /*[[${delivery?.mitsumoriFlg}]]*/ 1;

        if (mitsumoriFlg === 3) { // SYUSEI
            if (jotai !== '作成中' && jotai !== '依頼') {
                // 編集不可にする
                document.querySelectorAll('.mitsumori-table input, .mitsumori-table select')
                    .forEach(function(el) { el.disabled = true; });
                document.querySelector('button[type="submit"]').style.display = 'none';
            }
        }
    });
</script>
</div>
</body>
</html>
