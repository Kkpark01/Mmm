<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${screenTitle}">パック契約・解約</title>
    <link rel="stylesheet" th:href="@{/css/mcm1009u.css}"/>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>
<!-- 【変換元】Mcm1009uScreen.Designer.vb MCM1009U パック契約・解約 -->

<h2 th:text="${screenTitle}">パック契約・解約</h2>

<!-- メッセージ表示 -->
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>


<!-- 検索エリア -->
<form th:action="@{/mcm1009u/search}" method="post" th:object="${form}" class="search-area">
    <div class="search-row">
        <label>取引先コード</label>
        <input type="text" th:field="*{torihikisakiCd}" size="12"/>
        <label>取引先名</label>
        <input type="text" th:field="*{torihikisakiNk}" size="30"/>
    </div>
    <div class="search-row">
        <label>納入先コード</label>
        <input type="text" th:field="*{nonyusakiCd}" size="14"/>
        <label>納入先名(旧名・カナなど)</label>
        <input type="text" th:field="*{nonyusakiNk}" size="30"/>
    </div>
    <div class="search-row">
        <label>サポートID</label>
        <input type="text" th:field="*{supportId}" size="10"/>
        <label>プラント名</label>
        <input type="text" th:field="*{plantNk}" size="30"/>
    </div>
    <div class="search-row">
        <label>状態</label>
        <label><input type="checkbox" th:field="*{jotaiMitsumori}"/> 見積</label>
        <label><input type="checkbox" th:field="*{jotaiKeiyaku}"/> 契約</label>
        <label><input type="checkbox" th:field="*{jotaiKaiyaku}"/> 解約</label>
        <label><input type="checkbox" th:field="*{jotaiHaki}"/> 破棄</label>
        <button type="submit" class="btn-search">検索</button>
    </div>
</form>

<hr/>
<p class="section-label">&lt;&lt; 取引先 &gt;&gt;</p>

<!-- データグリッド -->
<div class="grid-wrapper">
<table class="data-grid" th:if="${rows != null and !rows.isEmpty()}">
    <thead>
        <tr>
            <th class="col-jotai">状態</th>
            <th class="col-irai-no">依頼NO</th>
            <th class="col-jikantai">時間</th>
            <th class="col-shonin">承認</th>
            <th class="col-keiyaku-no">契約NO</th>
            <th class="col-fusei">不正</th>
            <th class="col-torihikisaki">取引先名</th>
            <th class="col-keiyaku-dt">契約日</th>
            <th class="col-kaiyaku-dt">解約日</th>
            <th class="col-nonyusaki-cd">納入先CD</th>
            <th class="col-nonyusaki-nk">納入先名</th>
            <th class="col-kyu-nonyusaki">旧納入先名</th>
            <th class="col-kojo">工場名</th>
            <th class="col-support">サポートID</th>
            <th class="col-plant">プラント名</th>
            <th th:if="${hasUpdateAuth}" class="col-link">契約</th>
            <th th:if="${hasUpdateAuth}" class="col-link">破棄</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="row : ${rows}">
            <td th:text="${row.jotai}"></td>
            <!-- 依頼NO -> MCM1004U -->
            <td>
                <a th:if="${row.tmIraiNo != null}"
                   th:href="@{/mcm1009u/forward/mcm1004u(tmKeiyakujikanId=${row.tmKeiyakujikanId})}"
                   th:text="${row.tmIraiNo}"></a>
            </td>
            <td th:text="${row.keiyakujikantai}"></td>
            <td th:text="${row.shoninjotai}"></td>
            <!-- 契約NO -> MCM1005U -->
            <td>
                <a th:if="${row.keiyakuNo != null}"
                   th:href="@{/mcm1009u/forward/mcm1005u(
                       tkKeiyakuId=${row.tkKeiyakuId},
                       tmKeiyakujikanId=${row.tmKeiyakujikanId},
                       torihikisakiId=${row.torihikisakiId},
                       torihikisakiCd=${row.torihikisakiCd},
                       torihikisakiNk=${row.torihikisakiNk},
                       nonyusakiCd=${row.nonyusakiCd},
                       nonyusakiNk=${row.nonyusakiNk},
                       supportId=${row.supportId},
                       plantNk=${row.plantNk},
                       plantId=${row.plantId})}"
                   th:text="${row.keiyakuNo}"></a>
            </td>
            <td th:text="${row.fusei}"></td>
            <td th:text="${row.torihikisakiNk}"></td>
            <td th:text="${row.keiyakuDt != null} ? ${#temporals.format(row.keiyakuDt, 'yyyy/MM/dd')} : ''"></td>
            <td th:text="${row.kaiyakuDt != null} ? ${#temporals.format(row.kaiyakuDt, 'yyyy/MM/dd')} : ''"></td>
            <td th:text="${row.nonyusakiCd}"></td>
            <td th:text="${row.nonyusakiNk}"></td>
            <td th:text="${row.kyunonyusakiNk}"></td>
            <td th:text="${row.nonyusakikojoNk}"></td>
            <td th:text="${row.supportId}"></td>
            <td th:text="${row.plantNk}"></td>
            <!-- 契約作成 -> MCM1006U1 -->
            <td th:if="${hasUpdateAuth}">
                <a th:if="${row.keiyakuKeiyaku != null}"
                   th:href="@{/mcm1009u/forward/mcm1006u1(
                       tmKeiyakujikanId=${row.tmKeiyakujikanId},
                       torihikisakiId=${row.torihikisakiId},
                       torihikisakiCd=${row.torihikisakiCd},
                       torihikisakiNk=${row.torihikisakiNk},
                       nonyusakiCd=${row.nonyusakiCd},
                       nonyusakiNk=${row.nonyusakiNk},
                       supportId=${row.supportId},
                       plantNk=${row.plantNk},
                       plantId=${row.plantId})}"
                   th:text="${row.keiyakuKeiyaku}"></a>
            </td>
            <!-- 契約破棄（confirm付き） -->
            <td th:if="${hasUpdateAuth}">
                <form th:if="${row.keiyakuDel != null}"
                      th:action="@{/mcm1009u/cancel-contract}" method="post"
                      onsubmit="return confirm('契約を破棄します。よろしいですか？');" style="display:inline;">
                    <input type="hidden" name="tkKeiyakuId" th:value="${row.tkKeiyakuId}"/>
                    <input type="hidden" name="tmKeiyakujikanId" th:value="${row.tmKeiyakujikanId}"/>
                    <button type="submit" class="btn-link-del" th:text="${row.keiyakuDel}"></button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<p th:if="${rows == null or rows.isEmpty()}" class="no-data">データがありません</p>
</div>

</body>
</html>
