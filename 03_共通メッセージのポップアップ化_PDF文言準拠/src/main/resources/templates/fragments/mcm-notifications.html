<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Hidden transport only: message text is escaped by Thymeleaf, then read as textContent. -->
<div th:fragment="messages(noticeMessage, noticeError, noticeErrors, noticeInfo)"
     data-mcm-notifications hidden>
    <span th:if="${noticeError != null}" data-mcm-notice="error" th:text="${noticeError}"></span>
    <span th:each="item : ${noticeErrors}" data-mcm-notice="error" th:text="${item}"></span>
    <span th:if="${noticeMessage != null}" data-mcm-notice="info" th:text="${noticeMessage}"></span>
    <span th:if="${noticeInfo != null}" data-mcm-notice="info" th:text="${noticeInfo}"></span>
</div>
</body>
</html>
