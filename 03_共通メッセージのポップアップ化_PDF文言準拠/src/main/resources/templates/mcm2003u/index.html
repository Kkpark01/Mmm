<!DOCTYPE html>
<!--
  【変換元】Mcm2003uScreen.Designer.vb / Mcm2003uScreen.vb
  MCM2003U — 店舗見積内容基本設定
  【デザイン参照】MCM0017U（紫帯ヘッダー / data-grid / カスタムダイアログ）
  Web版省略: Excel帳票出力、メール送信、SP_UM、ブランドタブ編集（MCM2005Uへ）
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf"        th:content="${_csrf != null} ? ${_csrf.token}      : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM2003U - 店舗見積内容基本設定</title>
    <style>
        /* ===== 共通レイアウト (MCM0017U 準拠) ===== */
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI","Yu Gothic UI","Meiryo",sans-serif; font-size: 12px; background: #fff; }
        button, .btn, .btn-close { cursor: pointer; -webkit-user-select: none; user-select: none; }

        /* ヘッダー */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 {
            margin: 0; font-size: 16px; font-weight: bold; color: #fff;
            letter-spacing: 1px; line-height: 30px;
        }
        .header .header-left, .header .header-right { display: flex; align-items: center; }
        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; line-height: 1.6;
        }
        .btn-close:hover { background-color: #e5f1fb; border-color: #7eb4ea; }

        /* アクションバー */
        .action-bar {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 10px; border-bottom: 1px solid #ccc; background: #f0f0f0;
        }
        .btn-primary {
            padding: 3px 14px; font-size: 12px;
            background: #0078d4; color: #fff; border: 1px solid #0067b8; border-radius: 2px;
        }
        .btn-primary:hover:not(:disabled) { background: #0067b8; }
        .btn-warning {
            padding: 3px 14px; font-size: 12px;
            background: #d08000; color: #fff; border: 1px solid #b57000; border-radius: 2px;
        }
        .btn-warning:hover:not(:disabled) { background: #b57000; }
        .btn-success {
            padding: 3px 14px; font-size: 12px;
            background: #107c10; color: #fff; border: 1px solid #0a6000; border-radius: 2px;
        }
        .btn-success:hover:not(:disabled) { background: #0a6000; }
        .btn-default {
            padding: 3px 14px; font-size: 12px;
            background: #e1e1e1; color: #000; border: 1px solid #adadad; border-radius: 2px;
        }
        .btn-default:hover { background: #e5f1fb; border-color: #0078d4; }
        button:disabled { opacity: 0.5; cursor: default; }

        /* メッセージ */
        .msg-area { padding: 4px 10px; }
        .msg-info  { background: #cfe2ff; border: 1px solid #9ec5fe; color: #084298; padding: 4px 10px; border-radius: 3px; }
        .msg-error { background: #f8d7da; border: 1px solid #f5c2c7; color: #842029; padding: 4px 10px; border-radius: 3px; }

        /* セクション共通 */
        .section { padding: 6px 10px; border-bottom: 1px solid #e0e0e0; }
        .section-title {
            font-size: 12px; font-weight: bold; color: #fff;
            background: #453f78; padding: 2px 8px; margin-bottom: 6px;
            display: inline-block; border-radius: 2px;
        }

        /* フォームグリッド */
        .form-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 4px 16px;
        }
        .form-row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
        .form-row label { white-space: nowrap; min-width: 110px; color: #333; font-size: 12px; }
        .form-row input[type="text"],
        .form-row input[type="date"] {
            height: 22px; border: 1px solid #aaa; padding: 0 4px; font-size: 12px;
            border-radius: 2px; background: #fff;
        }
        .form-row input:disabled, .form-row textarea:disabled {
            background: #f5f5f5; color: #555;
        }
        .form-row textarea {
            border: 1px solid #aaa; padding: 2px 4px; font-size: 12px;
            border-radius: 2px; resize: vertical; font-family: inherit;
        }
        .form-row .val-text { font-size: 12px; color: #222; }
        .input-sm  { width: 100px; }
        .input-md  { width: 160px; }
        .input-lg  { width: 260px; }
        .input-xl  { width: 360px; }

        /* 承認状態バッジ */
        .badge { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 11px; }
        .badge-sakuseichu  { background: #f0f0f0; color: #555; border: 1px solid #ccc; }
        .badge-shinsachu   { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .badge-shoninchu   { background: #cfe2ff; color: #084298; border: 1px solid #9ec5fe; }
        .badge-shoninzumi  { background: #d1e7dd; color: #0f5132; border: 1px solid #a3cfbb; }
        .badge-sashimodoshi { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
        .badge-mitsumori   { background: #e8f4e8; color: #1a6600; border: 1px solid #81c784; }
        .badge-keiyaku     { background: #dce7fd; color: #1a3c8a; border: 1px solid #90b4f8; }

        /* グリッド */
        .grid-section { padding: 6px 10px; border-bottom: 1px solid #e0e0e0; }
        .grid-wrap { overflow-x: auto; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; }
        .data-grid {
            border-collapse: separate; border-spacing: 0;
            table-layout: fixed; font-size: 11px; white-space: nowrap; width: max-content; min-width: 100%;
        }
        .data-grid thead th {
            position: sticky; top: 0; z-index: 5;
            background: #eef2f5;
            border-right: 1px solid #b0bec5; border-bottom: 2px solid #b0bec5;
            padding: 4px 6px; text-align: left; font-size: 11px;
        }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }
        .data-grid td {
            border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb;
            padding: 2px 6px; vertical-align: middle; height: 22px; line-height: 18px;
            overflow: hidden; text-overflow: ellipsis;
        }
        .data-grid td.col-chk { text-align: center; padding: 0; width: 28px; }
        .data-grid td.col-chk input[type="checkbox"] { margin: 0; vertical-align: middle; }
        .data-grid tbody tr:hover td { background: #f5f5f5; }
        .data-grid td a { color: #0078d4; text-decoration: none; }
        .data-grid td a:hover { text-decoration: underline; }
        .text-right { text-align: right; }
        .no-data { color: #888; font-size: 12px; padding: 8px 10px; }

        /* カスタムダイアログ (MCM0017U 準拠) */
        .mini-dialog-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.25);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .mini-dialog-overlay.active { display: flex; }
        .mini-dialog {
            background: #fbfbfb; min-width: 320px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; color: #444;
            cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 16px; background: #fbfbfb; white-space: pre-line; font-size: 13px;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; font-size: 22px; }
        .mini-dialog-foot {
            padding: 10px 16px 14px; text-align: right; background: #fbfbfb;
            display: flex; justify-content: flex-end; gap: 6px;
        }
        .mini-dialog-foot button {
            min-width: 72px; padding: 4px 12px; font-size: 12px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button.btn-ok {
            background: #0078d4; color: #fff; border-color: #0067b8;
        }
        .mini-dialog-foot button.btn-ok:hover { background: #0067b8; }
    </style>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>

<!-- サーバーメッセージ -->
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>

<!-- ===== ヘッダー ===== -->
<div class="header">
    <div class="header-left"></div>
    <div class="header-center"><h1>店舗見積内容基本設定（MCM2003U）</h1></div>
    <div class="header-right">
        <a class="btn-close" th:href="@{/menu}" href="/mcm/menu">閉じる</a>
    </div>
</div>

<!-- ===== アクションバー ===== -->
<div class="action-bar">
    <button type="button" class="btn-primary"
            th:disabled="${readOnly}"
            onclick="doSave()">見積登録</button>
    <button type="button" class="btn-warning"
            th:disabled="${readOnly}"
            onclick="doPublish()">見積発行</button>
    <button type="button" class="btn-success"
            th:disabled="${readOnly or (form.syouninJotai != null and form.syouninJotai != '0' and form.syouninJotai != '4')}"
            onclick="confirmSinsei()">申請</button>
    <button type="button" class="btn-default"
            th:onclick="|location.href='@{/mcm2003u/back}'|">検索画面へ</button>
</div>

<!-- ===== メッセージエリア ===== -->


<!-- ===== メインフォーム（見積登録・見積発行） ===== -->
<form id="mainForm" th:object="${form}" method="post" th:action="@{/mcm2003u/save}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" th:field="*{seniMotoKbn}"/>

    <!-- ===== 基本情報セクション ===== -->
    <div class="section">
        <span class="section-title">基本情報</span>
        <div class="form-grid">
            <div class="form-row">
                <label>見積NO:</label>
                <span class="val-text" th:text="${form.umMitsumoriNo}"></span>
            </div>
            <div class="form-row">
                <label>状態:</label>
                <span class="badge"
                      th:classappend="${form.jotai == '9'} ? 'badge-sakuseichu'
                                    : (${form.jotai == '1'} ? 'badge-mitsumori'
                                    : (${form.jotai == '2'} ? 'badge-keiyaku' : 'badge-sakuseichu'))"
                      th:text="${form.jotai == '9'} ? '作成中'
                               : (${form.jotai == '1'} ? '見積'
                               : (${form.jotai == '2'} ? '契約' : ${form.jotai}))"></span>
            </div>
            <div class="form-row">
                <label>承認状態:</label>
                <span class="badge"
                      th:classappend="${form.syouninJotai == '0'} ? 'badge-sakuseichu'
                                    : (${form.syouninJotai == '1'} ? 'badge-shinsachu'
                                    : (${form.syouninJotai == '2'} ? 'badge-shoninchu'
                                    : (${form.syouninJotai == '3'} ? 'badge-shoninzumi' : 'badge-sashimodoshi')))"
                      th:text="${form.syouninJotai == '0'} ? '作成中'
                               : (${form.syouninJotai == '1'} ? '審査中'
                               : (${form.syouninJotai == '2'} ? '承認中'
                               : (${form.syouninJotai == '3'} ? '承認済' : '差戻中')))"></span>
            </div>
            <div class="form-row">
                <label>見積作成日付:</label>
                <input type="text" th:field="*{mitsumoriDt}" class="input-sm"
                       th:disabled="${readOnly}" placeholder="yyyy/MM/dd"/>
            </div>
            <div class="form-row">
                <label>見積作成者:</label>
                <input type="text" th:field="*{mitsumorisakuseisyaNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>見積有効期限:</label>
                <input type="text" th:field="*{mitsumorigiken}" class="input-sm"
                       th:disabled="${readOnly}"/>
            </div>
        </div>
    </div>

    <!-- ===== 納入先情報セクション ===== -->
    <div class="section">
        <span class="section-title">納入先情報</span>
        <div class="form-grid">
            <div class="form-row">
                <label>納入先コード:</label>
                <span class="val-text" th:text="${form.nonyusakiCd}"></span>
            </div>
            <div class="form-row">
                <label>納入先名:</label>
                <span class="val-text" th:text="${form.nonyusakiNk}"></span>
            </div>
            <div class="form-row">
                <label>住所1:</label>
                <span class="val-text" th:text="${form.nonyusakijusyo1Nk}"></span>
            </div>
            <div class="form-row">
                <label>住所2:</label>
                <span class="val-text" th:text="${form.nonyusakijusyo2Nk}"></span>
            </div>
            <div class="form-row">
                <label>サポートID:</label>
                <span class="val-text" th:text="${form.supportId}"></span>
            </div>
            <div class="form-row">
                <label>プラント名:</label>
                <span class="val-text" th:text="${form.plantNk}"></span>
            </div>
            <div class="form-row">
                <label>納入部署名:</label>
                <input type="text" th:field="*{nonyubusyoNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>納入担当者名:</label>
                <input type="text" th:field="*{nonyutantosyaNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>TEL:</label>
                <input type="text" th:field="*{nonyutelNo}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>FAX:</label>
                <input type="text" th:field="*{nonyufaxNo}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
        </div>
    </div>

    <!-- ===== 依頼元・送付先セクション ===== -->
    <div class="section">
        <span class="section-title">依頼元・送付先</span>
        <div class="form-grid">
            <div class="form-row">
                <label>依頼元名称1:</label>
                <input type="text" th:field="*{iraimeisho1Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>依頼元名称2:</label>
                <input type="text" th:field="*{iraimeisho2Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>依頼元名称3:</label>
                <input type="text" th:field="*{iraimeisho3Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>依頼元名称4:</label>
                <input type="text" th:field="*{iraimeisho4Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>依頼元店舗略名:</label>
                <input type="text" th:field="*{iraitenporyakuNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>依頼元担当者:</label>
                <input type="text" th:field="*{iraitantoNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>送付先名称1:</label>
                <input type="text" th:field="*{sofumeisho1Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>送付先名称2:</label>
                <input type="text" th:field="*{sofumeisho2Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>送付先名称3:</label>
                <input type="text" th:field="*{sofumeisho3Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>送付先名称4:</label>
                <input type="text" th:field="*{sofumeisho4Nk}" class="input-lg"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>送付先店舗略名:</label>
                <input type="text" th:field="*{sofutenporyakuNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>送付先担当者:</label>
                <input type="text" th:field="*{sofutantoNk}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
        </div>
    </div>

    <!-- ===== 保守条件セクション ===== -->
    <div class="section">
        <span class="section-title">保守条件</span>
        <div class="form-grid">
            <div class="form-row">
                <label>契約時間帯:</label>
                <input type="text" th:field="*{keiyakujikantai}" class="input-md"
                       th:disabled="${readOnly}"/>
            </div>
            <div class="form-row">
                <label>保守方法:</label>
                <textarea th:field="*{hosyuhoho}" rows="3" class="input-xl"
                          th:disabled="${readOnly}"></textarea>
            </div>
            <div class="form-row">
                <label>備考:</label>
                <textarea th:field="*{biko}" rows="3" class="input-xl"
                          th:disabled="${readOnly}"></textarea>
            </div>
            <div class="form-row">
                <label>見積条件:</label>
                <textarea th:field="*{mitsumoriJouken}" rows="4" class="input-xl"
                          th:disabled="${readOnly}"></textarea>
            </div>
        </div>
    </div>

</form>

<!-- ===== ブランドタブ一覧 ===== -->
<div class="grid-section">
    <span class="section-title">ブランド一覧</span>
    <p style="font-size:11px;color:#888;margin:2px 0 4px;">
        ブランド詳細の編集は「詳細設定」リンクより MCM2005U で行ってください。
    </p>
    <div class="grid-wrap">
        <table class="data-grid" th:if="${not #lists.isEmpty(form.brandRows)}">
            <thead>
                <tr>
                    <th style="width:160px;">ブランド名</th>
                    <th style="width:220px;">ブランド詳細名</th>
                    <th style="width:100px;">契約時間帯</th>
                    <th style="width:100px;" class="text-right">ハード保守費</th>
                    <th style="width:80px;">詳細設定</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${form.brandRows}">
                    <td th:text="${row.brandNk}"></td>
                    <td th:text="${row.brandsyosaiNk}"></td>
                    <td th:text="${row.keiyakujikantai}"></td>
                    <td class="text-right"
                        th:text="${row.hardhosyuKin != null} ? ${#numbers.formatDecimal(row.hardhosyuKin,1,'COMMA',0,'DEFAULT')} : ''"></td>
                    <td>
                        <a th:href="@{/mcm2005u(umKihonBrandId=${row.umKihonBrandId})}"
                           th:text="'詳細設定'">詳細設定</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="no-data" th:if="${#lists.isEmpty(form.brandRows)}">ブランドデータがありません。</div>
    </div>
</div>

<!-- ===== 契約金額変動時期グリッド ===== -->
<div class="grid-section">
    <span class="section-title">契約金額変動時期</span>
    <div class="grid-wrap">
        <table class="data-grid" th:if="${not #lists.isEmpty(form.mitsumoriRows)}">
            <thead>
                <tr>
                    <th style="width:30px;">選択</th>
                    <th style="width:110px;">開始日</th>
                    <th style="width:110px;">終了日</th>
                    <th style="width:110px;" class="text-right">ハード保守費</th>
                    <th style="width:120px;" class="text-right">見積合計金額</th>
                    <th style="width:80px;">詳細設定</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row,iStat : ${form.mitsumoriRows}">
                    <td class="col-chk" style="text-align:center;">
                        <input type="checkbox" th:checked="${row.checkFlg}" disabled/>
                    </td>
                    <td th:text="${row.kaisiDt}"></td>
                    <td th:text="${row.syuryoDt}"></td>
                    <td class="text-right"
                        th:text="${row.hardhosyuKin != null} ? ${#numbers.formatDecimal(row.hardhosyuKin,1,'COMMA',0,'DEFAULT')} : ''"></td>
                    <td class="text-right"
                        th:text="${row.mitsumoriGkin != null} ? ${#numbers.formatDecimal(row.mitsumoriGkin,1,'COMMA',0,'DEFAULT')} : ''"></td>
                    <td>
                        <a th:href="@{/mcm2005u(umMitsumoriId=${row.umMitsumoriId})}"
                           th:text="'詳細設定'">詳細設定</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="no-data" th:if="${#lists.isEmpty(form.mitsumoriRows)}">契約金額変動時期データがありません。</div>
    </div>
</div>

<!-- ===== 添付ファイルグリッド ===== -->
<div class="grid-section">
    <span class="section-title">添付資料</span>
    <div class="grid-wrap">
        <table class="data-grid" th:if="${not #lists.isEmpty(form.tenpuRows)}">
            <thead>
                <tr>
                    <th style="width:260px;">ファイル名</th>
                    <th style="width:260px;">備考</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${form.tenpuRows}">
                    <td th:text="${row.tenpufileNk}"></td>
                    <td th:text="${row.biko}"></td>
                </tr>
            </tbody>
        </table>
        <div class="no-data" th:if="${#lists.isEmpty(form.tenpuRows)}">添付ファイルがありません。</div>
    </div>
</div>

<!-- ===== 申請フォーム（ダイアログ確認後サブミット） ===== -->
<form id="sinseiForm" th:action="@{/mcm2003u/sinsei}" method="post" style="display:none;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
</form>

<!-- ===== 申請確認ダイアログ ===== -->
<div class="mini-dialog-overlay" id="sinseiDlg">
    <div class="mini-dialog">
        <div class="mini-dialog-head">
            <span>申請確認</span>
            <button class="mini-close" onclick="closeSinseiDlg()">✕</button>
        </div>
        <div class="mini-dialog-body">
            <span class="mini-icon">❓</span>
            <span>申請を実施します。よろしいですか？</span>
        </div>
        <div class="mini-dialog-foot">
            <button onclick="closeSinseiDlg()">キャンセル</button>
            <button class="btn-ok" onclick="submitSinsei()">OK</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
    var savePath    = /*[[@{/mcm2003u/save}]]*/ '/mcm2003u/save';
    var publishPath = /*[[@{/mcm2003u/publish}]]*/ '/mcm2003u/publish';

    // ---- 見積登録 ----
    function doSave() {
        document.getElementById('mainForm').action = savePath;
        document.getElementById('mainForm').submit();
    }

    // ---- 見積発行 ----
    function doPublish() {
        document.getElementById('mainForm').action = publishPath;
        document.getElementById('mainForm').submit();
    }

    // ---- 申請確認ダイアログ表示 ----
    function confirmSinsei() {
        document.getElementById('sinseiDlg').classList.add('active');
    }
    function closeSinseiDlg() {
        document.getElementById('sinseiDlg').classList.remove('active');
    }
    function submitSinsei() {
        document.getElementById('sinseiForm').submit();
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
/*]]>*/
</script>
</body>
</html>
