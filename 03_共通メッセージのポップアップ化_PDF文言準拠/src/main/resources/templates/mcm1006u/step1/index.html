<!DOCTYPE html>
<!--
  【変換元】Mcm1006u1Screen.vb / Mcm1006u1Screen.Designer.vb
  MCM1006U — 取引先契約機器選定 (1/2) — 見積選択 + 期間入力
  【レイアウト】MCM0017U準拠（ヘッダー紫帯, data-grid スタイル）
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM1006U - 取引先契約機器選定 (1/2)</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" href="../../css/common.css"/>
    <style>
        body { margin: 0; font-family: 'Meiryo', 'メイリオ', sans-serif; font-size: 13px; }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px; box-sizing: border-box;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 { margin: 0; font-size: 16px; font-weight: bold; color: #fff; line-height: 30px; }
        .info-panel {
            background: #f5f5f5; border-bottom: 1px solid #ccc;
            padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px;
        }
        .info-item { display: flex; align-items: center; gap: 4px; }
        .info-item label { color: #555; white-space: nowrap; }
        .info-item span { font-weight: bold; }
        .kikan-panel {
            padding: 6px 12px; background: #fff; border-bottom: 1px solid #ccc;
            display: flex; align-items: center; gap: 12px;
        }
        .kikan-panel label { font-size: 12px; color: #555; }
        .kikan-panel input[type="text"] {
            width: 110px; height: 22px; border: 1px solid #aaa; padding: 0 4px;
            font-size: 12px; box-sizing: border-box;
        }
        .kikan-panel input[readonly] { background: #e0e0e0; }
        .error-panel {
            background: #fdecea; border: 1px solid #f44336; color: #c62828;
            padding: 6px 12px; margin: 4px 8px; border-radius: 3px; font-size: 12px;
        }
        .toolbar {
            padding: 4px 8px; display: flex; gap: 6px; border-bottom: 1px solid #ddd;
            background: #fafafa;
        }
        .btn {
            height: 24px; padding: 0 12px; font-size: 12px; cursor: pointer;
            border: 1px solid #aaa; border-radius: 3px; background: #fff;
        }
        .btn:hover { background: #e8e8f8; }
        .btn-next { background: #453f78; color: #fff; border-color: #453f78; }
        .btn-next:hover { background: #5a5499; }
        .grid-container {
            height: calc(100vh - 200px); overflow-y: auto; overflow-x: auto;
            border: 1px solid #d5dbdb; margin: 0 8px 8px;
        }
        .data-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12px; width: 100%; }
        .data-grid thead th {
            position: sticky; top: 0; z-index: 5;
            background-color: #eef2f5;
            box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5;
            text-align: left; padding: 4px 6px; white-space: nowrap;
        }
        .data-grid th, .data-grid td { border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb; }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }
        .data-grid td { padding: 2px 4px; vertical-align: middle; height: 22px; line-height: 22px; }
        .data-grid td.col-check { text-align: center; width: 36px; }
        .data-grid tbody tr:hover { background: #f0f4ff; }
        .data-grid tbody tr.row-checked { background: #e3f2fd; }
        .step-indicator { padding: 4px 12px; font-size: 11px; color: #888; }
    </style>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
    <div class="header-left"></div>
    <div class="header-center"><h1>MCM1006U　取引先契約機器選定</h1></div>
    <div class="header-right"></div>
</div>

<div class="step-indicator">ステップ 1 / 2　見積選択</div>

<!-- エラー表示 -->
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>

<!-- ヘッダー情報（読み取り専用） -->
<div class="info-panel">
    <div class="info-item">
        <label>納入先CD:</label>
        <span th:text="${form.nonyusakiCd}"></span>
    </div>
    <div class="info-item">
        <label>納入先名:</label>
        <span th:text="${form.nonyusakiNk}"></span>
    </div>
    <div class="info-item">
        <label>サポートID:</label>
        <span th:text="${form.supportId}"></span>
    </div>
    <div class="info-item">
        <label>プラント:</label>
        <span th:text="${form.plantNk}"></span>
    </div>
    <div class="info-item">
        <label>契約NO:</label>
        <span th:text="${form.keiyakuNo}"></span>
    </div>
    <div class="info-item">
        <label>取引先CD:</label>
        <span th:text="${form.torihikisakiCd}"></span>
    </div>
    <div class="info-item">
        <label>取引先名:</label>
        <span th:text="${form.torihikisakiNk}"></span>
    </div>
</div>

<!-- 期間入力 -->
<form id="step1Form" th:action="@{/mcm1006u/step1/next}" method="post">
    <input type="hidden" name="_csrf" th:value="${_csrf != null} ? ${_csrf.token} : ''"/>

    <!-- Delivery値のhidden（バリデーション失敗時に再送するため） -->
    <input type="hidden" name="seniMotoKbn"    th:value="${form.seniMotoKbn}"/>
    <input type="hidden" name="nonyusakiId"    th:value="${form.nonyusakiId}"/>
    <input type="hidden" name="nonyusakiCd"    th:value="${form.nonyusakiCd}"/>
    <input type="hidden" name="nonyusakiNk"    th:value="${form.nonyusakiNk}"/>
    <input type="hidden" name="plantId"        th:value="${form.plantId}"/>
    <input type="hidden" name="supportId"      th:value="${form.supportId}"/>
    <input type="hidden" name="plantNk"        th:value="${form.plantNk}"/>
    <input type="hidden" name="torihikisakiId" th:value="${form.torihikisakiId}"/>
    <input type="hidden" name="torihikisakiCd" th:value="${form.torihikisakiCd}"/>
    <input type="hidden" name="torihikisakiNk" th:value="${form.torihikisakiNk}"/>
    <input type="hidden" name="keiyakuNo"      th:value="${form.keiyakuNo}"/>
    <input type="hidden" name="tkKeiyakuId"    th:value="${form.tkKeiyakuId}"/>
    <input type="hidden" name="tkKikanId"      th:value="${form.tkKikanId}"/>
    <input type="hidden" name="tabFlg"         th:value="${form.tabFlg}"/>

    <div class="kikan-panel">
        <label>期間</label>
        <label>開始日:</label>
        <input type="text" id="kaisiDt" name="kaisiDt"
               th:value="${form.kaisiDt}"
               th:readonly="${kaisiReadonly}"
               placeholder="yyyy/MM/dd" maxlength="10"/>
        <span>～</span>
        <label>終了日:</label>
        <input type="text" id="syuryoDt" name="syuryoDt"
               th:value="${form.syuryoDt}"
               placeholder="yyyy/MM/dd" maxlength="10"/>
    </div>

    <!-- 見積グリッド -->
    <div class="grid-container">
        <table class="data-grid">
            <thead>
            <tr>
                <th class="col-check" style="width:36px;">選択</th>
                <th style="width:120px;">見積番号</th>
                <th style="width:200px;">見積名</th>
                <th style="width:110px;">開始日</th>
                <th style="width:110px;">終了日</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row, rowStat : ${form.mitsumoriRows}"
                th:classappend="${row.checkFlg == 1} ? 'row-checked' : ''">
                <td class="col-check">
                    <input type="checkbox" name="mitsumoriRows[__${rowStat.index}__].checkFlg"
                           value="1"
                           th:checked="${row.checkFlg == 1}"
                           th:attr="data-idx=${rowStat.index}"
                           onchange="updateRowStyle(this)"/>
                    <input type="hidden" name="mitsumoriRows[__${rowStat.index}__].tmIraiId"
                           th:value="${row.tmIraiId}"/>
                    <input type="hidden" name="mitsumoriRows[__${rowStat.index}__].tmKeiyakujikanId"
                           th:value="${row.tmKeiyakujikanId}"/>
                    <input type="hidden" name="mitsumoriRows[__${rowStat.index}__].tmIraiNo"
                           th:value="${row.tmIraiNo}"/>
                    <input type="hidden" name="mitsumoriRows[__${rowStat.index}__].mitsumoriNk"
                           th:value="${row.mitsumoriNk}"/>
                    <input type="hidden" name="mitsumoriRows[__${rowStat.index}__].kaisiDt"
                           th:value="${row.kaisiDt}"/>
                    <input type="hidden" name="mitsumoriRows[__${rowStat.index}__].syuryoDt"
                           th:value="${row.syuryoDt}"/>
                </td>
                <td th:text="${row.tmIraiNo}"></td>
                <td th:text="${row.mitsumoriNk}"></td>
                <td th:text="${row.kaisiDt}"></td>
                <td th:text="${row.syuryoDt}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(form.mitsumoriRows)}">
                <td colspan="5" style="text-align:center; color:#999; padding:12px;">
                    データがありません
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- ボタン -->
    <div class="toolbar">
        <button type="submit" class="btn btn-next">次へ &gt;</button>
        <button type="button" class="btn" onclick="history.back()">閉じる</button>
    </div>

</form>

<script>
function updateRowStyle(chk) {
    var row = chk.closest('tr');
    if (chk.checked) {
        row.classList.add('row-checked');
    } else {
        row.classList.remove('row-checked');
    }
}
// チェックボックスはvalue=1のみ送信されるため、未チェック時はvalue=0を追加送信
document.getElementById('step1Form').addEventListener('submit', function(e) {
    var checks = this.querySelectorAll('input[type="checkbox"][name$=".checkFlg"]');
    checks.forEach(function(chk) {
        if (!chk.checked) {
            var hidden = document.createElement('input');
            hidden.type  = 'hidden';
            hidden.name  = chk.name;
            hidden.value = '0';
            chk.parentNode.insertBefore(hidden, chk);
        }
    });
});
</script>
</body>
</html>
