<!DOCTYPE html>
<!--
  【変換元】Mcm0021uScreen.Designer.vb（1,945行）
    MCM0021U プラント付替え 画面テンプレート
    元UI: WinForms（6つのDataGridView + 検索条件 + 3つのGroupBox）

    変換ルール:
    - DataGridView → <table> + <thead> + <tbody> + th:each
    - GroupBox → <fieldset> + <legend>
    - TextBox → <input type="text">
    - CheckBox列 → <input type="checkbox">
    - ComboBox列 → <select> + th:each
    - Visible=False列 → hidden
    - ReadOnly DGV → テキスト表示のみ（th:text）
    - CPButton → <button>
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/mcm0021u.css}" />
    <title>プラント付替え（MCM0021U）</title>
    <style>
        /* メッセージダイアログ (WinForms準拠) */
        .mini-dialog-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.25);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .mini-dialog {
            background: #fbfbfb; min-width: 320px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #ffffff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; font-weight: normal; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; line-height: 1;
            color: #444; cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 16px; background: #fbfbfb; white-space: pre-line;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; }
        .mini-dialog-body .mini-msg { color: #000; font-size: 13px; }
        .mini-dialog-foot { padding: 10px 16px 14px; text-align: right; background: #fbfbfb; }
        .mini-dialog-foot button {
            min-width: 84px; padding: 5px 12px; font-size: 12px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button:focus { outline: 1px solid #0078d4; outline-offset: 1px; }
    </style>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>
<!-- コンテンツエリア -->
<div layout:fragment="content" class="mcm0021u-screen">
    <header class="header">
        <div class="header-left"></div>
        <div class="header-center"><h1>プラント付替え（MCM0021U）</h1></div>
        <div class="header-right">
            <!-- #264: 付替え元/先が設定済みの状態でクリアする場合のみ確認ダイアログを表示する -->
            <a class="btn-close" id="btnClose" th:href="@{/menu}"
               th:data-plant-id-moto="${form.plantIdMoto}"
               th:data-plant-id-saki="${form.plantIdSaki}">閉じる</a>
        </div>
    </header>
    <div class="screen-body">

    <!-- メッセージ表示 -->
    <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${clearConfirmationToken != null and replaceCompleted == true ? null : message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
    
    

    <!-- ============================================ -->
    <!-- 検索条件エリア -->
    <!-- 【変換元】NONYUSAKI_CDTextBox / NONYUSAKI_NKTextBox -->
    <!--           SUPPORT_IDTextBox / PLANT_NKTextBox / SearchButton -->
    <!-- ============================================ -->
    <form th:action="@{/mcm0021u/search}" method="post" th:object="${form}">
        <div class="search-area">
            <div class="search-row">
                <!-- 【変換元】NONYUSAKI_CDLabel + NONYUSAKI_CDTextBox -->
                <label>納入先コード</label>
                <input type="text" th:field="*{nonyusakiCd}" size="12" />
                <!-- 【変換元】NONYUSAKI_NKLabel + NONYUSAKI_NKTextBox -->
                <label class="label-right">納入先名(旧名・カナなど)</label>
                <input type="text" th:field="*{nonyusakiNk}" size="50" />
            </div>
            <div class="search-row">
                <!-- 【変換元】SUPPORT_IDLabel + SUPPORT_IDTextBox -->
                <label>サポートID</label>
                <input type="text" th:field="*{supportId}" size="8" />
                <!-- 【変換元】PLANT_NKLabel + PLANT_NKTextBox -->
                <label class="label-right">プラント名</label>
                <input type="text" th:field="*{plantNk}" size="30" />
                <!-- 【変換元】SearchButton -->
                <button type="submit" class="btn btn-primary">検索</button>
            </div>
        </div>
    </form>
    <hr />

    <!-- ============================================ -->
    <!-- 検索結果エリア -->
    <!-- 【変換元】KENSAKUKEKKAGroupBox -->
    <!-- ============================================ -->
    <fieldset class="result-area"
              th:data-selected-plant="${selectedPlantId}"
              th:data-selected-composition="${selectedKikikoseiId}"
              th:data-selected-brand="${selectedBrandkoseiId}">
        <legend>&lt;&lt; 検索結果 &gt;&gt;</legend>

        <!-- 付替え元/先設定ボタン -->
        <div class="result-toolbar">
        <h4>&lt;&lt; プラント情報 &gt;&gt;</h4>
        <div class="result-buttons">
            <!-- 【変換元】TsukekaemotoButton -->
            <form th:action="@{/mcm0021u/setMoto}" method="post"
                  class="inline-form" id="setMotoForm">
                <input type="hidden" name="searchToken" th:value="${searchToken}" />
                <input type="hidden" name="selectedKikikoseiId" value="" />
                <input type="hidden" name="selectedBrandkoseiId" value="" />
                <input type="hidden" name="plantId" id="motoPlantId" value="" />
                <button type="submit" class="btn">付替え元に設定</button>
            </form>
            <!-- 【変換元】TsukekaesakiButton -->
            <form th:action="@{/mcm0021u/setSaki}" method="post"
                  class="inline-form" id="setSakiForm">
                <input type="hidden" name="searchToken" th:value="${searchToken}" />
                <input type="hidden" name="selectedKikikoseiId" value="" />
                <input type="hidden" name="selectedBrandkoseiId" value="" />
                <input type="hidden" name="plantId" id="sakiPlantId" value="" />
                <input type="hidden" name="nonyusakiCd" id="sakiNonyusakiCd" value="" />
                <input type="hidden" name="nonyusakiNk" id="sakiNonyusakiNk" value="" />
                <input type="hidden" name="nonyusakikojoNk" id="sakiNonyusakikojoNk" value="" />
                <input type="hidden" name="supportId" id="sakiSupportId" value="" />
                <input type="hidden" name="plantNk" id="sakiPlantNk" value="" />
                <button type="submit" class="btn">付替え先に設定</button>
            </form>
        </div>
        </div>

        <!-- プラント情報テーブル（納入先DGV） -->
        <!-- 【変換元】MCM_MA_NONYUSAKIDataGridView (Size=1226x195, ReadOnly) -->
        <!--   Visible列: NONYUSAKI_CD(120), NONYUSAKI_NK(250), NONYUSAKIKOJO_NK(209), -->
        <!--              SUPPORT_ID(80), PLANT_NK(250) -->
        <!--   Hidden列: NONYUSAKI_ID, PLANT_ID -->
        <div class="table-scroll plant-grid-scroll">
            <table class="dgv-table" id="nonyusakiTable">
                        <colgroup class="grid-colgroup">
                            <col class="row-marker-col-width" style="width:48px" />
                        </colgroup>

                <thead>
                    <tr>
                                <th class="row-marker-col" style="width:48px" aria-label="行選択">&nbsp;</th>
                        <th style="width:120px">納入先コード</th>
                        <th style="width:250px">納入先名</th>
                        <th style="width:209px">納入先工場名</th>
                        <th style="width:80px">サポートID</th>
                        <th style="width:250px">プラント名</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="n, st : ${nonyusakiList}"
                        th:data-plant-id="${n.plantId}"
                        th:data-nonyusaki-cd="${n.nonyusakiCd}"
                        th:data-nonyusaki-nk="${n.nonyusakiNk}"
                        th:data-nonyusakikojo-nk="${n.nonyusakikojoNk}"
                        th:data-support-id="${n.supportId}"
                        th:data-plant-nk="${n.plantNk}"
                        class="clickable-row">
                                <td class="row-marker-cell"><span class="row-marker">▶</span><span class="row-number" th:text="${st.count}"></span></td>
                        <td th:text="${n.nonyusakiCd}"></td>
                        <td th:text="${n.nonyusakiNk}"></td>
                        <td th:text="${n.nonyusakikojoNk}"></td>
                        <td th:text="${n.supportId}"></td>
                        <td th:text="${n.plantNk}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 機器構成+ブランド / 機器明細 横並び -->
        <div class="kiki-area">
            <!-- 【変換元】MCM_MA_KIKIKOSEIDataGridView (Size=616x178, ReadOnly) -->
            <!--   Visible列: KIKIKOSEI_NK(130), SET_NM(70,右寄せ), TEHAISEIBAN(80), BRANDSYOSAI_NK(145) -->
            <!--   Hidden列: PLANT_ID, KIKIKOSEI_ID, BRAND_ID, IKOSAKI, BRANDKOSEI_ID -->
            <div class="kiki-left">
                <h4>&lt;&lt; 機器構成+ブランド &gt;&gt;</h4>
                <div class="table-scroll" style="max-height:180px;">
                    <table class="dgv-table">
                        <colgroup class="grid-colgroup">
                            <col class="row-marker-col-width" style="width:48px" />
                        </colgroup>

                        <thead>
                            <tr>
                                <th class="row-marker-col" style="width:48px" aria-label="行選択">&nbsp;</th>
                                <th style="width:130px">機器構成名</th>
                                <th style="width:70px">セット数</th>
                                <th style="width:80px">手配製番</th>
                                <th style="width:145px">ブランド</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="k, st : ${kikikoseiList}" class="composition-row" hidden
                                th:data-plant-id="${k.plantId}" th:data-composition-id="${k.kikikoseiId}"
                                th:data-brand-id="${k.brandkoseiId}">
                                <td class="row-marker-cell"><span class="row-marker">▶</span><span class="row-number" th:text="${st.count}"></span></td>
                                <td th:text="${k.kikikoseiNk}"></td>
                                <td th:text="${k.setNm}"></td>
                                <td th:text="${k.tehaiseiban}"></td>
                                <td th:text="${k.brandsyosaiNk}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 【変換元】MCM_MA_KIKIMEISAIDataGridView (Size=594x178, ReadOnly) -->
            <!--   Visible列: SEIZOMAKER_NK(132), KIKIHINMEI_NK(110), KIKIKATASHIKI(110), SURYO_NM(55,右寄せ) -->
            <!--   Hidden列: SEIZOMAKER_ID, KIKIMEISAI_ID, KIKIKOSEI_ID -->
            <div class="kiki-right">
                <h4>&lt;&lt; 1セット分の構成明細 &gt;&gt;</h4>
                <div class="table-scroll" style="max-height:180px;">
                    <table class="dgv-table">
                        <colgroup class="grid-colgroup">
                            <col class="row-marker-col-width" style="width:48px" />
                        </colgroup>

                        <thead>
                            <tr>
                                <th class="row-marker-col" style="width:48px" aria-label="行選択">&nbsp;</th>
                                <th style="width:132px">製造メーカー</th>
                                <th style="width:110px">品名</th>
                                <th style="width:110px">型式</th>
                                <th style="width:55px">数量</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="m, st : ${kikimeisaiList}" class="detail-row" hidden
                                th:data-composition-id="${m.kikikoseiId}" th:data-brand-id="${m.brandkoseiId}">
                                <td class="row-marker-cell"><span class="row-marker">▶</span><span class="row-number" th:text="${st.count}"></span></td>
                                <td th:text="${m.seizomakerNk}"></td>
                                <td th:text="${m.kikihinmeiNk}"></td>
                                <td th:text="${m.kikikatashiki}"></td>
                                <td th:text="${m.suryoNm}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </fieldset>

    <!-- ============================================ -->
    <!-- 付替え元 / 付替え先エリア -->
    <!-- ============================================ -->
    <form th:action="@{/mcm0021u/replace}" method="post" th:object="${form}"
          id="replaceForm">
        <input type="hidden" th:field="*{plantIdMoto}" />
        <input type="hidden" th:field="*{plantIdSaki}" />

        <div class="tsukekae-area">
            <!-- ============================================ -->
            <!-- 付替え元 GroupBox -->
            <!-- 【変換元】TSUKEKAEMOTOGroupBox (Size=683x378) -->
            <!-- ============================================ -->
            <fieldset class="tsukekae-moto">
                <legend>&lt;&lt; 付替え元 &gt;&gt;</legend>

                <!-- 納入先情報（バインド表示） -->
                <!-- 【変換元】NONYUSAKI_CD_MOTO_TextBox 等の読取専用テキストボックス群 -->
                <div class="nonyusaki-info">

                    <div class="info-row">
                        <label>納入先コード</label>
                        <span th:text="${motoPlant != null ? motoPlant.nonyusakiCd : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>納入先名</label>
                        <span th:text="${motoPlant != null ? motoPlant.nonyusakiNk : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>納入先工場名</label>
                        <span th:text="${motoPlant != null ? motoPlant.nonyusakikojoNk : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>サポートID</label>
                        <span th:text="${motoPlant != null ? motoPlant.supportId : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>プラント名</label>
                        <span th:text="${motoPlant != null ? motoPlant.plantNk : ''}"></span>
                    </div>
                </div>

                <!-- 付替え元DGV -->
                <!-- 【変換元】MCM_MA_KIKIKOSEI_MOTODataGridView (Size=671x248) -->
                <!--   IDOCHECK(20,CheckBox), KIKIKOSEI_NK(100), SET_NM(67,右寄せ), -->
                <!--   TEHAISEIBAN(80), BRANDSYOSAI_NK(100), IRAISAKI(付替え先ブランド,ComboBox) -->
                <div class="table-scroll transfer-grid-scroll">

                    <table class="dgv-table dgv-editable">
                        <colgroup class="grid-colgroup">
                            <col class="row-marker-col-width" style="width:48px" />
                        </colgroup>

                        <thead>
                            <tr>
                                <th class="row-marker-col" style="width:48px" aria-label="行選択">&nbsp;</th>
                                <th style="width:25px"></th>
                                <th style="width:100px">機器構成名</th>
                                <th style="width:67px">セット数</th>
                                <th style="width:80px">手配製番</th>
                                <th style="width:100px">ブランド</th>
                                <th style="width:130px">付替え先ブランド</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row, st : ${motoRows}">
                                <td class="row-marker-cell"><span class="row-marker">▶</span><span class="row-number" th:text="${st.count}"></span></td>
                                <td class="text-center">
                                    <!-- 【変換元】IDOCHECK_KIKIKOSEI_MOTO_CheckBox -->
                                    <input type="checkbox"
                                           th:name="|motoRows[${st.index}].idoCheck|"
                                           th:checked="${row.idoCheck == null or row.idoCheck == 1}"
                                           th:disabled="${replaceCompleted == true}" value="true" />
                                    <!-- hidden fields for row data -->
                                    <input type="hidden"
                                           th:name="|motoRows[${st.index}].kikikoseiId|"
                                           th:value="${row.kikikoseiId}" />
                                    <input type="hidden"
                                           th:name="|motoRows[${st.index}].brandkoseiId|"
                                           th:value="${row.brandkoseiId}" />
                                    <input type="hidden"
                                           th:name="|motoRows[${st.index}].kikikoseiNk|"
                                           th:value="${row.kikikoseiNk}" />
                                    <input type="hidden"
                                           th:name="|motoRows[${st.index}].brandsyosaiNk|"
                                           th:value="${row.brandsyosaiNk}" />
                                </td>
                                <td th:text="${row.kikikoseiNk}"></td>
                                <td th:text="${row.setNm}"></td>
                                <td th:text="${row.tehaiseiban}"></td>
                                <td th:text="${row.brandsyosaiNk}"></td>
                                <td>
                                    <!-- 【変換元】IRAISAKI_KIKIKOSEI_MOTO_TextBox (ComboBox) -->
                                    <select th:name="|motoRows[${st.index}].ikosaki|"
                                            class="combo-brand" th:disabled="${replaceCompleted == true}">
                                        <option value="">--選択--</option>
                                        <option th:each="bc : ${brandCombo}"
                                                th:value="${bc[0]}"
                                                th:text="${bc[1]}"
                                                th:selected="${row.ikosaki != null and row.ikosaki.compareTo(bc[0]) == 0}">
                                        </option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>


            </fieldset>

            <!-- ============================================ -->
            <!-- 付替え先 GroupBox -->
            <!-- 【変換元】TSUKEKAESAKIGroupBox (Size=542x378) -->
            <!-- ============================================ -->
            <fieldset class="tsukekae-saki">
                <legend>&lt;&lt; 付替え先 &gt;&gt;</legend>

                <!-- 納入先情報 -->
                <div class="nonyusaki-info">
                    <div class="info-row">
                        <label>納入先コード</label>
                        <span th:text="${sakiNonyusaki != null ? sakiNonyusaki['nonyusakiCd'] : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>納入先名</label>
                        <span th:text="${sakiNonyusaki != null ? sakiNonyusaki['nonyusakiNk'] : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>納入先工場名</label>
                        <span th:text="${sakiNonyusaki != null ? sakiNonyusaki['nonyusakikojoNk'] : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>サポートID</label>
                        <span th:text="${sakiNonyusaki != null ? sakiNonyusaki['supportId'] : ''}"></span>
                    </div>
                    <div class="info-row">
                        <label>プラント名</label>
                        <span th:text="${sakiNonyusaki != null ? sakiNonyusaki['plantNk'] : ''}"></span>
                    </div>
                </div>

                <!-- 付替え先DGV -->
                <!-- 【変換元】MCM_MA_KIKIKOSEI_SAKIDataGridView (Size=530x248, ReadOnly) -->
                <!--   Visible: KIKIKOSEI_NK(100), SET_NM(80,右寄せ), TEHAISEIBAN(80), BRANDSYOSAI_NK(100) -->
                <div class="table-scroll transfer-grid-scroll">

                    <table class="dgv-table">
                        <colgroup class="grid-colgroup">
                            <col class="row-marker-col-width" style="width:48px" />
                        </colgroup>

                        <thead>
                            <tr>
                                <th class="row-marker-col" style="width:48px" aria-label="行選択">&nbsp;</th>
                                <th style="width:100px">機器構成名</th>
                                <th style="width:80px">セット数</th>
                                <th style="width:80px">手配製番</th>
                                <th style="width:100px">ブランド</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s, st : ${sakiRows}">
                                <td class="row-marker-cell"><span class="row-marker">▶</span><span class="row-number" th:text="${st.count}"></span></td>
                                <td th:text="${s.kikikoseiNk}"></td>
                                <td th:text="${s.setNm}"></td>
                                <td th:text="${s.tehaiseiban}"></td>
                                <td th:text="${s.brandsyosaiNk}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>


            </fieldset>
        </div>

        <!-- 付替えボタン -->
        <!-- 【変換元】ReplaceButton (Location=1160,880) -->
        <div class="button-area">
            <button type="submit" class="btn btn-danger"
                    id="replaceButton" th:disabled="${replaceCompleted == true}">
                付替え
            </button>
        </div>
    </form>

    <p th:if="${replaceCompleted == true}" class="msg-info">付替え元は実行時の設定、付替え先は更新後の内容です。次の付替えは、付替え元を設定し直してください。</p>

    <!-- MSG_0098：更新完了後の一度だけ確認する。キャンセルでは付替え結果・設定を保持する。 -->
    <form th:if="${clearConfirmationToken != null and replaceCompleted == true}"
          id="clearCompletedForm" th:action="@{/mcm0021u/clearCompleted}" method="post">
        <input type="hidden" name="clearToken" th:value="${clearConfirmationToken}"/>
    </form>
    <script>
    document.addEventListener('DOMContentLoaded', async function () {
        const clearForm = document.getElementById('clearCompletedForm');
        if (!clearForm) return;
        window.McmCommon?.hideProgress(true);
        if (await McmNotifications.confirm('付替えを完了しました。付替え元、付替え先をクリアしてよろしいですか？')) {
            window.McmCommon?.showProgress();
            clearForm.submit();
        }
    });
    </script>

    <!-- メッセージダイアログ -->
    

    <!-- ============================================ -->
    <!-- JavaScript: 行選択 + hidden値セット -->
    <!-- 【変換元】MCM_MA_NONYUSAKIDataGridView.CellClick イベント -->
    <!--   元コード: plantId = DataGridView(COL_PLANT_ID_NONYUSAKI, CurrentRow.Index) -->
    <!-- ============================================ -->
    <script th:inline="javascript">
    function showErrorDialog(title, msg) {
        return McmNotifications.error(msg);
    }

    document.addEventListener('DOMContentLoaded', function() {
        // #264: 付替え元・先を設定済みの状態で「閉じる」を押下した場合、
        //   クリア確認ダイアログ（MSG_0098G）を表示し、キャンセル時は遷移を中止する。
        var btnClose = document.getElementById('btnClose');
        if (btnClose) {
            btnClose.addEventListener('click', function (event) {
                var motoSet = btnClose.dataset.plantIdMoto && btnClose.dataset.plantIdMoto !== '0';
                var sakiSet = btnClose.dataset.plantIdSaki && btnClose.dataset.plantIdSaki !== '0';
                if ((motoSet || sakiSet)
                        && !window.confirm('付替えを完了しました。付替え元、付替え先をクリアしてよろしいですか？')) {
                    event.preventDefault();
                }
            });
        }

        // #191: 検索前もボタンを表示し、対象なしでは送信せず通知する。
        ['setMotoForm', 'setSakiForm'].forEach(function (id) {
            document.getElementById(id).addEventListener('submit', function (event) {
                var plantId = this.querySelector('input[name="plantId"]').value.trim();
                var hasResults = !!this.elements.searchToken.value
                    && document.querySelectorAll('#nonyusakiTable .clickable-row').length > 0;
                if (id === 'setMotoForm' && hasResults && (!plantId || Number(plantId) === 0)) {
                    event.preventDefault();
                    if (window.McmCommon) window.McmCommon.hideProgress();
                    showErrorDialog('メッセージ', '付替え元が１件もチェックされていません。');
                } else if (id === 'setSakiForm' && hasResults && (!plantId || Number(plantId) === 0)) {
                    // #259: 検索済みだが未選択の場合は「付替え対象が検索されていません。」ではなく専用メッセージを表示する。
                    event.preventDefault();
                    if (window.McmCommon) window.McmCommon.hideProgress();
                    showErrorDialog('メッセージ', '付替え先が１件もチェックされていません。');
                } else if (!plantId || Number(plantId) === 0 || !this.elements.searchToken.value) {
                    event.preventDefault();
                    if (window.McmCommon) window.McmCommon.hideProgress();
                    showErrorDialog('メッセージ', '付替え対象が検索されていません。');
                } else if (id === 'setMotoForm' && !this.elements.selectedKikikoseiId.value) {
                    event.preventDefault();
                    if (window.McmCommon) window.McmCommon.hideProgress();
                    showErrorDialog('メッセージ', '機器情報が存在しない為、付け替え元に設定することは出来ません。');
                }
            });
        });
        // #261: ブランド未選択を確認ダイアログより先に通知する。サーバーでも再検査する。
        document.getElementById('replaceForm').addEventListener('submit', function (event) {
            var error = '';
            if (!this.elements.plantIdMoto.value) error = '付替え元が設定されていません。';
            else if (!this.elements.plantIdSaki.value) error = '付替え先が設定されていません。';
            else {
                var checked = Array.from(this.querySelectorAll('input[type="checkbox"]:checked'));
                if (checked.some(function (box) {
                    var brand = box.closest('tr').querySelector('.combo-brand').value.trim();
                    return !brand || /^0+(?:\.0+)?$/.test(brand);
                })) error = '付替え先ブランドが選択されていないデータがあります。';
                else if (!checked.length) error = '付替え対象を1件以上チェックしてください。';
            }
            if (error || !confirm('付替えしてもよろしいですか？')) {
                event.preventDefault();
                if (window.McmCommon) window.McmCommon.hideProgress();
                if (error) showErrorDialog('メッセージ', error);
            }
        });
        // VBの親子リレーション：プラントID → 機器構成ID＋ブランド構成ID。
        // BigDecimalの1と1.0を同一視。Numberに変換せず大きなIDの桁落ちも防ぐ。
        function idKey(value) { return String(value == null ? '' : value).trim().replace(/\.0+$/, '').replace(/^0+(?=\d)/, ''); }
        var area = document.querySelector('.result-area');
        var rows = Array.from(document.querySelectorAll('#nonyusakiTable .clickable-row'));
        var compositions = Array.from(document.querySelectorAll('.composition-row'));
        var details = Array.from(document.querySelectorAll('.detail-row'));
        function clearSelection(row) {
            row.classList.remove('selected', 'row-active', 'row-selected');
            row.querySelectorAll('.cell-selected').forEach(function (cell) { cell.classList.remove('cell-selected'); });
        }
        function renumber(visible) {
            visible.forEach(function (row, i) { var n = row.querySelector('.row-number'); if (n) n.textContent = i + 1; });
        }
        function selectComposition(row) {
            compositions.forEach(function (r) { if (r !== row) clearSelection(r); });
            if (row) row.classList.add('selected', 'row-active');
            ['setMotoForm', 'setSakiForm'].forEach(function (id) {
                var form = document.getElementById(id);
                form.elements.selectedKikikoseiId.value = row ? row.dataset.compositionId : '';
                form.elements.selectedBrandkoseiId.value = row ? row.dataset.brandId : '';
            });
            details.forEach(function (d) {
                clearSelection(d);
                d.hidden = !row || idKey(d.dataset.compositionId) !== idKey(row.dataset.compositionId)
                    || idKey(d.dataset.brandId) !== idKey(row.dataset.brandId);
            });
            var visible = details.filter(function (d) { return !d.hidden; });
            renumber(visible);
            if (visible.length) visible[0].classList.add('row-active');
        }
        function selectPlant(row, restoring) {
            rows.forEach(function (r) { if (r !== row) clearSelection(r); });
            row.classList.add('selected', 'row-active');
            var plantId = row.dataset.plantId;
            document.getElementById('motoPlantId').value = plantId;
            document.getElementById('sakiPlantId').value = plantId;
            ['nonyusakiCd', 'nonyusakiNk', 'nonyusakikojoNk', 'supportId', 'plantNk'].forEach(function (key) {
                document.querySelector('#setSakiForm input[name="' + key + '"]').value = row.dataset[key] || '';
            });
            compositions.forEach(function (k) { k.hidden = idKey(k.dataset.plantId) !== idKey(plantId); });
            var visible = compositions.filter(function (k) { return !k.hidden; });
            renumber(visible);
            var restored = restoring && visible.find(function (k) {
                return idKey(k.dataset.compositionId) === idKey(area.dataset.selectedComposition)
                    && idKey(k.dataset.brandId) === idKey(area.dataset.selectedBrand);
            });
            selectComposition(restored || visible[0] || null);
        }
        rows.forEach(function (row) { row.addEventListener('click', function () { selectPlant(row, false); }); });
        compositions.forEach(function (row) { row.addEventListener('click', function () { if (!row.hidden) selectComposition(row); }); });
        // #257: 新規検索で先頭行を自動選択しない。元/先設定後は利用者の選択だけ復元する。
        var initial = area.dataset.selectedPlant && rows.find(function (row) {
            return idKey(row.dataset.plantId) === idKey(area.dataset.selectedPlant);
        });
        if (initial) selectPlant(initial, true);
        else selectComposition(null);

        // 全グリッド共通：通常セルはセルだけ灰色、▶列は行全体を灰色
        document.querySelectorAll('.dgv-table tbody td').forEach(function(cell) {
            cell.addEventListener('click', function() {
                var table = this.closest('.dgv-table');
                var row = this.closest('tr');
                table.querySelectorAll('tbody td.cell-selected').forEach(function(td) { td.classList.remove('cell-selected'); });
                table.querySelectorAll('tbody tr.row-selected').forEach(function(r) { r.classList.remove('row-selected'); });
                table.querySelectorAll('tbody tr.row-active').forEach(function(r) { r.classList.remove('row-active'); });
                if (this.classList.contains('row-marker-cell')) {
                    row.classList.add('row-selected');
                } else {
                    this.classList.add('cell-selected');
                }
                row.classList.add('row-active');
            });
        });

        // MCM0015Uと同じ列幅ドラッグ調整（全グリッド）
        document.querySelectorAll('.dgv-table').forEach(function(table) {
            var ths = Array.from(table.querySelectorAll('thead th'));
            if (ths.length === 0) return;
            var colgroup = table.querySelector('colgroup.grid-colgroup');
            var cols = colgroup ? Array.from(colgroup.querySelectorAll('col')) : [];
            while (cols.length < ths.length) {
                var addedCol = document.createElement('col');
                colgroup.appendChild(addedCol);
                cols.push(addedCol);
            }
            var widths = ths.map(function(th, idx) { return idx === 0 ? 48 : Math.round(th.getBoundingClientRect().width); });
            cols[0].className = 'row-marker-col-width';
            cols[0].style.width = '48px';
            function applyWidths() {
                var total = 0;
                widths.forEach(function(w, i) { if (i === 0) w = widths[i] = 48; cols[i].style.width = w + 'px'; total += w; });
                table.style.width = total + 'px';
            }
            applyWidths();
            ths.forEach(function(th, idx) {
                var handle = document.createElement('span');
                handle.className = 'col-resizer';
                th.appendChild(handle);
                var startX = 0, startW = 0;
                function onMove(ev) {
                    var x = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    widths[idx] = Math.max(40, Math.round(startW + (x - startX)));
                    applyWidths();
                }
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onUp);
                    document.body.classList.remove('col-resizing');
                }
                function onDown(ev) {
                    ev.preventDefault(); ev.stopPropagation();
                    startX = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    startW = widths[idx];
                    document.body.classList.add('col-resizing');
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                    document.addEventListener('touchmove', onMove, { passive: false });
                    document.addEventListener('touchend', onUp);
                }
                handle.addEventListener('mousedown', onDown);
                handle.addEventListener('touchstart', onDown, { passive: false });
            });
        });
    });
    </script>
    </div><!-- /.screen-body -->
</div>
</body>
</html>
