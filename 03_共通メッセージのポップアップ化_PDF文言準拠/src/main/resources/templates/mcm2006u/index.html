<!DOCTYPE html>
<!--
  【変換元】Mcm2006uScreen.Designer.vb / Mcm2006uTabControl.vb
  MCM2006U — ユーザ契約内容
  Web版省略: SP_UKストアドプロシージャ、ロック解除ボタン、タブ間日付自動連携
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf"        th:content="${_csrf != null} ? ${_csrf.token}      : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM2006U - ユーザ契約内容</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI","Yu Gothic UI","Meiryo",sans-serif; font-size: 12px; background: #fff; }
        button, .btn, .btn-close { cursor: pointer; -webkit-user-select: none; user-select: none; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 { margin: 0; font-size: 16px; font-weight: bold; color: #fff; letter-spacing: 1px; line-height: 30px; }
        .header .header-left, .header .header-right { display: flex; align-items: center; }
        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; line-height: 1.6;
        }
        .btn-close:hover { background-color: #e5f1fb; border-color: #7eb4ea; }

        .action-bar { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-bottom: 1px solid #ccc; background: #f0f0f0; }
        .btn-primary { padding: 3px 14px; font-size: 12px; background: #0078d4; color: #fff; border: 1px solid #0067b8; border-radius: 2px; }
        .btn-primary:hover:not(:disabled) { background: #0067b8; }
        .btn-default { padding: 3px 14px; font-size: 12px; background: #e1e1e1; color: #000; border: 1px solid #adadad; border-radius: 2px; }
        .btn-default:hover { background: #e5f1fb; border-color: #0078d4; }
        button:disabled { opacity: 0.5; cursor: default; }

        .msg-area { padding: 4px 10px; }
        .msg-info  { background: #cfe2ff; border: 1px solid #9ec5fe; color: #084298; padding: 4px 10px; border-radius: 3px; }
        .msg-error { background: #f8d7da; border: 1px solid #f5c2c7; color: #842029; padding: 4px 10px; border-radius: 3px; }

        .section { padding: 6px 10px; border-bottom: 1px solid #e0e0e0; }
        .section-title { font-size: 12px; font-weight: bold; color: #fff; background: #453f78; padding: 2px 8px; margin-bottom: 6px; display: inline-block; border-radius: 2px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 6px 16px; }
        .form-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 2px; min-width:0; }
        .form-row label { white-space: nowrap; flex:0 0 80px; color: #333; font-size: 12px; }
        .form-row input { min-width:0; max-width:calc(100% - 86px); flex-shrink:0; }
        .form-row label:not(:first-child) { flex:0 0 auto; }
        .form-row input[type="text"] { height: 22px; border: 1px solid #aaa; padding: 0 4px; font-size: 12px; border-radius: 2px; background: #fff; }
        .form-row input:read-only, .form-row input:disabled { background: #f5f5f5; color: #555; }

        /* タブ */
        .tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 10px 0; background: #e8e0f0; border-bottom: 2px solid #453f78; }
        .tab-btn { padding: 3px 10px; font-size: 12px; border: 1px solid #453f78; border-bottom: none; background: #d0c8e8; color: #333; cursor: pointer; border-radius: 3px 3px 0 0; text-decoration: none; }
        .tab-btn.active { background: #453f78; color: #fff; font-weight: bold; }
        .tab-btn:hover:not(.active) { background: #c0b8d8; }

        /* グリッド */
        .data-grid { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
        .data-grid th { background: #453f78; color: #fff; padding: 3px 6px; text-align: left; font-weight: bold; white-space: nowrap; border: 1px solid #6860a0; }
        .data-grid td { padding: 2px 6px; border: 1px solid #ddd; }
        .data-grid tr:nth-child(even) td { background: #f8f6ff; }
        .data-grid tr:hover td { background: #e8e0f0; }

        .tab-content { padding: 6px 10px; }
        .tab-section { margin-bottom: 8px; }
        .tab-section-title { font-size: 12px; font-weight: bold; color: #453f78; border-bottom: 1px solid #453f78; margin-bottom: 4px; }

        .badge { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 11px; }
        .badge-now    { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .badge-new    { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .badge-old    { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .badge-future { background: #d6d8d9; color: #383d41; border: 1px solid #c6c8ca; }
    </style>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
    <div class="header-left">
        <span th:text="${functionId}" style="font-size:11px; opacity:0.8;"></span>
    </div>
    <div class="header-center"><h1>ユーザ契約内容</h1></div>
    <div class="header-right">
        <a th:href="${session['mcm2006u.from2004'] == true} ? @{/mcm2004u} : @{/mcm2006u/back}" class="btn-close">閉じる</a>
    </div>
</div>

<!-- アクションバー -->
<div class="action-bar" th:unless="${readOnly}">
    <form id="saveForm" th:action="@{/mcm2006u/save}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
        <!-- ヘッダー隠しフィールド -->
        <input type="hidden" name="ukKeiyakuId"          th:value="${form.ukKeiyakuId}"/>
        <input type="hidden" name="jotai"                th:value="${form.jotai}"/>
        <input type="hidden" name="keiyakuDt"            th:value="${form.keiyakuDt}"/>
        <input type="hidden" name="shokaiKeiyakuDt"      th:value="${form.shokaiKeiyakuDt}"/>
        <input type="hidden" name="keiyakumanryoDt"      th:value="${form.keiyakumanryoDt}"/>
        <input type="hidden" name="entyokeiyakumanryoDt" th:value="${form.entyokeiyakumanryoDt}"/>
        <input type="hidden" name="kaiyakuDt"            th:value="${form.kaiyakuDt}"/>
        <button type="submit" class="btn-primary">登録</button>
    </form>
</div>

<!-- メッセージ -->
<div class="msg-area">
    <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
    
</div>

<!-- 契約ヘッダー -->
<div class="section">
    <span class="section-title">契約情報</span>
    <div class="form-grid">
        <div class="form-row">
            <label>納入先</label>
            <input type="text" th:value="${form.nonyusakiCd}" style="width:80px;" readonly/>
            <input type="text" th:value="${form.nonyusakiNk}" style="width:200px;" readonly/>
        </div>
        <div class="form-row">
            <label>住所1</label>
            <input type="text" th:value="${form.nonyusakijusyo1Nk}" style="width:300px;" readonly/>
        </div>
        <div class="form-row">
            <label>住所2</label>
            <input type="text" th:value="${form.nonyusakijusyo2Nk}" style="width:300px;" readonly/>
        </div>
        <div class="form-row">
            <label>担当部署</label>
            <input type="text" th:value="${form.nonyubusyoNk}" style="width:200px;" readonly/>
        </div>
        <div class="form-row">
            <label>担当者</label>
            <input type="text" th:value="${form.nonyutantosyaNk}" style="width:200px;" readonly/>
        </div>
        <div class="form-row">
            <label>TEL</label>
            <input type="text" th:value="${form.nonyutelNo}" style="width:130px;" readonly/>
            <label>FAX</label>
            <input type="text" th:value="${form.nonyufaxNo}" style="width:130px;" readonly/>
        </div>
        <div class="form-row">
            <label>契約日</label>
            <input type="text" th:value="${form.keiyakuDt}" style="width:90px;" readonly/>
        </div>
        <div class="form-row">
            <label>次回更新日</label>
            <input type="text" th:value="${form.jikaikosinDt}" style="width:90px;" readonly/>
        </div>
        <div class="form-row">
            <label>状態</label>
            <input type="text" th:value="${form.jotai}" style="width:60px;" readonly/>
        </div>
    </div>
</div>

<!-- 製番 -->
<div class="section" th:if="${!form.seibanRows.isEmpty()}">
    <span class="section-title">製番</span>
    <table class="data-grid" style="width:auto;">
        <thead>
            <tr>
                <th>開始日</th>
                <th>終了日</th>
                <th>確認区分</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="seiban : ${form.seibanRows}">
                <td th:text="${seiban.kaisiDt}"></td>
                <td th:text="${seiban.syuryoDt}"></td>
                <td th:text="${seiban.kakuninKbn}"></td>
            </tr>
        </tbody>
    </table>
</div>

<!-- 期間タブ -->
<div th:if="${!form.kikanTabs.isEmpty()}">
    <!-- タブナビゲーション -->
    <div class="tabs">
        <th:block th:each="tab : ${form.kikanTabs}">
            <a th:href="@{/mcm2006u(kikanId=${tab.ukKikanId})}"
               th:classappend="${selectedTab != null and selectedTab.ukKikanId == tab.ukKikanId} ? 'active' : ''"
               class="tab-btn">
                <span th:text="${tab.tabLabel}"></span>
                <span th:if="${tab.tabFlg == 1}" class="badge badge-now">現在</span>
                <span th:if="${tab.tabFlg == 4}" class="badge badge-new">新規</span>
                <span th:if="${tab.tabFlg == 5}" class="badge badge-old">過去</span>
                <span th:if="${tab.tabFlg == 3}" class="badge badge-future">将来</span>
            </a>
        </th:block>
        <!-- 変更ボタン（最新タブのみ） -->
        <th:block th:if="${selectedTab != null and !readOnly}">
            <a th:if="${selectedTab.tabFlg == 1 or selectedTab.tabFlg == 3 or selectedTab.tabFlg == 5}"
               th:href="@{/mcm2006u/change(kikanId=${selectedTab.ukKikanId})}"
               class="btn-default" style="margin-left:auto; text-decoration:none; padding:3px 10px;">変更</a>
        </th:block>
    </div>

    <!-- 選択タブの内容 -->
    <div class="tab-content" th:if="${selectedTab != null}">

        <!-- 期間情報 -->
        <div class="tab-section">
            <div class="tab-section-title">期間情報</div>
            <div class="form-grid">
                <div class="form-row">
                    <label>契約開始日</label>
                    <input type="text" th:value="${selectedTab.kaisiDt}" style="width:90px;" readonly/>
                    <label>終了日</label>
                    <input type="text" th:value="${selectedTab.syuryoDt}" style="width:90px;" readonly/>
                </div>
                <div class="form-row">
                    <label>保守方法</label>
                    <input type="text" th:value="${selectedTab.hosyuhoho}" style="width:200px;" readonly/>
                </div>
                <div class="form-row">
                    <label>保守額(月額)</label>
                    <input type="text" th:value="${selectedTab.hosyuGkin}" style="width:120px;" readonly/>
                </div>
                <div class="form-row">
                    <label>備考</label>
                    <input type="text" th:value="${selectedTab.biko}" style="width:300px;"
                           th:readonly="${readOnly}"/>
                </div>
            </div>
        </div>

        <!-- ブランドグリッド -->
        <div class="tab-section" th:if="${!selectedTab.brandRows.isEmpty()}">
            <div class="tab-section-title">ブランド</div>
            <table class="data-grid">
                <thead>
                    <tr>
                        <th>ブランド名</th>
                        <th>ブランド詳細名</th>
                        <th>契約時間帯</th>
                        <th>保守方法</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="brand : ${selectedTab.brandRows}">
                        <td th:text="${brand.brandNk}"></td>
                        <td th:text="${brand.brandsyosaiNk}"></td>
                        <td th:text="${brand.keiyakujikantai}"></td>
                        <td th:text="${brand.hosyuhoho}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 機器構成グリッド -->
        <div class="tab-section" th:if="${!selectedTab.koseiRows.isEmpty()}">
            <div class="tab-section-title">機器構成</div>
            <table class="data-grid">
                <thead>
                    <tr>
                        <th>機器構成名</th>
                        <th>セット名</th>
                        <th>単位</th>
                        <th>手配製番</th>
                        <th>コントローラ</th>
                        <th>保守方法</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kosei : ${selectedTab.koseiRows}">
                        <td th:text="${kosei.kikikoseiNk}"></td>
                        <td th:text="${kosei.setNm}"></td>
                        <td th:text="${kosei.tani}"></td>
                        <td th:text="${kosei.tehaiseiban}"></td>
                        <td th:text="${kosei.controllerFlg}"></td>
                        <td th:text="${kosei.hosyuhoho}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 機器明細グリッド -->
        <div class="tab-section" th:if="${!selectedTab.meisaiRows.isEmpty()}">
            <div class="tab-section-title">機器明細</div>
            <table class="data-grid">
                <thead>
                    <tr>
                        <th>品名</th>
                        <th>型式</th>
                        <th>数量</th>
                        <th>メーカー</th>
                        <th>保守方法</th>
                        <th>点検回数</th>
                        <th>点検曜日</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="meisai : ${selectedTab.meisaiRows}">
                        <td th:text="${meisai.kikihinmeiNk}"></td>
                        <td th:text="${meisai.kikikatashiki}"></td>
                        <td th:text="${meisai.suryoNm}"></td>
                        <td th:text="${meisai.seizomankerNk}"></td>
                        <td th:text="${meisai.hosyuhoho}"></td>
                        <td th:text="${meisai.tenkenkaisu}"></td>
                        <td th:text="${meisai.tenkenyobi}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 個体明細グリッド -->
        <div class="tab-section" th:if="${!selectedTab.kotaiRows.isEmpty()}">
            <div class="tab-section-title">個体明細</div>
            <table class="data-grid">
                <thead>
                    <tr>
                        <th>個体名</th>
                        <th>シリアルNO</th>
                        <th>設置場所</th>
                        <th>一時納入日</th>
                        <th>契約期限</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="kotai : ${selectedTab.kotaiRows}">
                        <td th:text="${kotai.kotaiNk}"></td>
                        <td th:text="${kotai.serialNo}"></td>
                        <td th:text="${kotai.setchibasyo}"></td>
                        <td th:text="${kotai.itizinonnyuDt}"></td>
                        <td th:text="${kotai.keiyakukigenDt}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 点検グリッド -->
        <div class="tab-section" th:if="${!selectedTab.tenkenRows.isEmpty()}">
            <div class="tab-section-title">点検スケジュール</div>
            <table class="data-grid" style="width:auto;">
                <thead>
                    <tr>
                        <th>点検日</th>
                        <th>点検状態</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tenken : ${selectedTab.tenkenRows}">
                        <td th:text="${tenken.tenkenDt}"></td>
                        <td th:text="${tenken.tenkenJotai}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div><!-- /tab-content -->
</div><!-- /タブ全体 -->

</body>
</html>
