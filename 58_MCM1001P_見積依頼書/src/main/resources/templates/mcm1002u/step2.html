<!DOCTYPE html>
<!--
  【変換元】Mcm1002u2Screen.vb / Mcm1002u2Screen.Designer.vb
  MCM1002U — 見積依頼機器選定 (2/2) — 見積依頼機器選定
  【機能構成・ボタン配置】VB版(MCM1002U2)準拠
  【デザイン】Web版他画面(MCM1001U/MCM1002U1)準拠：紫帯ヘッダー + data-grid スタイル
  画面サイズ: 1263 x 923
  ボタン: 取引先見積・契約検索画面へ(→MCM1003U), 前へ(→MCM1002U1), 依頼書発行, 登録
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>見積依頼機器選定（MCM1002U2）</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
    <style>
        body {
            margin: 0; font-family: "Yu Gothic UI", "Meiryo UI", Meiryo, sans-serif; font-size: 13px;
            /* [MCM1003U準拠] 画面外周パディング：ヘッダーを画面端から8px内側に配置する */
            padding: 8px; box-sizing: border-box;
        }

        /* ===== ヘッダー（MCM1001U 準拠：紫帯） ===== */
        .header, .btn-close { -webkit-user-select: none; user-select: none; }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            height: 40px; min-height: 40px; padding: 0 10px;
            background: #453f78; color: #fff; box-sizing: border-box;
        }
        .header-left, .header-right { display: flex; align-items: center; }
        .header-right { justify-content: flex-end; }
        .header-center { flex: 1; text-align: center; }
        .header-center h1 {
            margin: 0; color: #fff; font-size: 18px; line-height: 30px;
            letter-spacing: 2px; font-weight: bold;
        }
        .btn-close {
            box-sizing: border-box;
            display: inline-block; padding: 2px 12px; font-size: 12px;
            font-family: initial; color: #000; text-decoration: none;
            background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff;
            cursor: pointer; line-height: 1.6;
        }
        .btn-close:hover  { background-color: #e5f1fb; border-color: #7eb4ea; }
        .btn-close:active { background-color: #cce4f7; border-color: #569de5; }

        .info-panel {
            background: #f5f5f5; border-bottom: 1px solid #ccc;
            padding: 6px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px; font-size: 12px;
        }
        .info-item { display: flex; align-items: center; gap: 4px; }
        .info-item label { color: #555; white-space: nowrap; }
        .info-item input.readonly-field {
            background-color: #f0f0f0; border: 1px solid #999; padding: 2px 4px; font-size: 12px;
        }
        .info-item.grow { flex: 1; min-width: 200px; }
        .info-item.grow input.readonly-field { width: 100%; }

        .grid-section { margin: 8px 8px 6px; }
        .grid-section-title {
            font-size: 12px; font-weight: bold; color: #000;
            padding: 2px 8px; margin: 0 0 4px; display: inline-block;
        }

        /* ===== グリッド（VB版 DataGridView 準拠：全マス格子線 + 濃いグレー外枠）
           データ0件でも一定の大きさの枠を保つため、固定heightを指定する。 ===== */
        .grid-container {
            overflow-y: auto; overflow-x: auto;
            border: 1px solid #808080;
        }
        .grid-container.grid-mitsumori { height: 190px; }
        .grid-container.grid-kosei { height: 230px; width: 1000px; }
        .grid-container.grid-meisai { height: 230px; width: 1500px; }
        .data-grid { border-collapse: collapse; table-layout: fixed; font-size: 11px; width: 100%; }
        .data-grid thead th {
            position: sticky; top: 0; z-index: 5;
            background-color: #e0e0e0; color: #000;
            border: 1px solid #999;
            text-align: left; padding: 3px 5px; font-weight: normal; white-space: nowrap;
        }
        .data-grid td { border: 1px solid #ccc; padding: 1px 4px; vertical-align: middle; height: 20px; line-height: 20px; overflow: hidden; text-overflow: ellipsis; }
        .data-grid tbody tr:hover { background: #f0f0f0; }

        /* 見積情報グリッド：見積依頼NO・取引先セルは表示専用のため薄い灰色背景にする */
        .data-grid td.col-readonly-gray { background-color: #f0f0f0; }

        /* 機器構成パターン・機器構成明細グリッドは全体が表示専用のため薄い灰色背景にする */
        #kikikoseiTable td, #kikimeisaiTable td { background-color: #f0f0f0; }
        .data-grid select, .data-grid input[type="text"] { font-size: 11px; width: 100%; box-sizing: border-box; }
        .text-center { text-align: center; }

        /* 選択行マーカー列（MCM1002U1準拠：非選択時=行番号、選択時=▶インジケータ） */
        .data-grid th.col-select, .data-grid td.col-select { width: 25px; text-align: center; padding: 0; }
        .row-select-label {
            position: relative; display: inline-flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; min-height: 18px; cursor: pointer;
        }
        .row-select-radio { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; }
        .row-marker {
            position: relative; display: inline-block; width: 100%; height: 100%;
            text-align: right; padding-right: 8px; box-sizing: border-box; line-height: 20px;
        }
        .row-marker .row-no { color: #333; font-size: 11px; }
        /* [MCM1002U1準拠] 選択時も行番号は消さず、▶マーカーを左側に重ねて表示する */
        .row-select-radio:checked + .row-marker::before {
            content: "▶"; color: #000; position: absolute; left: 4px; top: 0; bottom: 0;
            display: flex; align-items: center; font-size: 10px;
        }

        /* ===== ボタン行（VB版配置：見積作成検索画面へ/前へ = 左下, 依頼書発行/登録 = 右下） ===== */
        .toolbar {
            padding: 8px; display: flex; gap: 6px; align-items: center;
        }
        .toolbar .spacer { flex-grow: 1; }
        .btn {
            height: 24px; padding: 0 12px; font-size: 12px; cursor: pointer;
            border: 1px solid #aaa; border-radius: 3px; background: #fff;
            text-decoration: none; color: #333; display: inline-flex; align-items: center;
        }
        .btn:hover { background: #e8e8f8; }
        .btn-primary { background: #453f78; color: #fff; border-color: #453f78; }
        .btn-primary:hover { background: #5a5499; }
        .btn-info { background: #5bc0de; color: #fff; border-color: #46b8da; }
        .btn-info:hover { background: #46b8da; }
    </style>
</head>
<body>
<main layout:fragment="content">

<!-- ヘッダー（MCM1001U 準拠：紫帯・左=戻る/右=閉じる） -->
<header class="header">
    <div class="header-left">
        <!-- 【#374】URL直接アクセス時はセッションの前回情報を復元しないよう、Screen1の初期表示へ遷移する -->
        <a th:href="${directAccess} ? @{/mcm1002u} : @{/mcm1002u/back}" class="btn-close">戻る</a>
    </div>
    <div class="header-center">
        <h1>見積依頼機器選定（MCM1002U2）</h1>
    </div>
    <div class="header-right">
        <a th:href="@{/menu}" class="btn-close">閉じる</a>
    </div>
</header>

<!-- メッセージ -->
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>

<!-- 取得エラーでも編集画面を移動せず、登録を繰り返さずに再取得できる。 -->
<div th:if="${excelDownloadUrl != null}" style="padding:6px 8px;">
    <button type="button" id="excelDownloadLink" class="btn"
            th:data-download-url="@{${excelDownloadUrl}}">依頼書を取得</button>
    <span id="excelDownloadStatus" role="status" aria-live="polite"></span>
</div>
<script th:if="${excelDownloadUrl != null}">
    document.addEventListener('DOMContentLoaded', function () {
        const button = document.getElementById('excelDownloadLink');
        const status = document.getElementById('excelDownloadStatus');
        async function download() {
            if (button.disabled) return;
            button.disabled = true;
            status.textContent = '依頼書を作成しています…';
            try {
                const response = await fetch(button.dataset.downloadUrl, {
                    credentials: 'same-origin', redirect: 'error', mcmNoProgress: true
                });
                const mime = response.headers.get('Content-Type') || '';
                if (!response.ok) {
                    const error = mime.includes('json') ? await response.json() : null;
                    throw new Error(error && error.message || '依頼書を取得できませんでした。再度操作してください。');
                }
                if (!mime.includes('application/vnd.ms-excel') && !mime.includes('application/zip')) {
                    throw new Error('依頼書を取得できませんでした。ログイン状態を確認してください。');
                }
                const disposition = response.headers.get('Content-Disposition') || '';
                const match = disposition.match(/filename\*=UTF-8''([^;]+)/i);
                const filename = match ? decodeURIComponent(match[1])
                    : (mime.includes('zip') ? '見積依頼書.zip' : '見積依頼書.xls');
                const url = URL.createObjectURL(await response.blob());
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 30000);
                status.textContent = '依頼書の取得を開始しました。';
            } catch (e) {
                status.textContent = '依頼書を取得できませんでした。';
                McmNotifications.error(e.message || '依頼書を取得できませんでした。再度操作してください。');
            } finally {
                button.disabled = false;
            }
        }
        button.addEventListener('click', download);
        download();
    });
</script>

<!-- ヘッダ情報（読み取り専用） -->
<div class="info-panel">
    <div class="info-item"><label>納入先コード</label>
        <input type="text" th:value="${form.nonyusakiCd}" readonly class="readonly-field" style="width:110px"/></div>
    <div class="info-item"><label>納入先名</label>
        <input type="text" th:value="${form.nonyusakiNk}" readonly class="readonly-field" style="width:410px"/></div>
    <div class="info-item"><label>サポートID</label>
        <input type="text" th:value="${form.supportId}" readonly class="readonly-field" style="width:62px"/></div>
    <div class="info-item grow"><label>プラント名</label>
        <input type="text" th:value="${form.plantNk}" readonly class="readonly-field"/></div>
</div>

<form id="mainForm" th:action="@{/mcm1002u/save}" th:object="${form}" method="post" data-mcm-no-progress>

    <!-- ===== 見積情報 ===== -->
    <div class="grid-section">
        <div class="grid-section-title">&lt;&lt; 見積情報 &gt;&gt;</div>

            <table class="data-grid" id="mitsumoriTable">
                <thead>
                    <tr>
                        <th class="col-select"></th>
                        <th style="width:120px">見積依頼NO</th>
                        <th style="width:230px">取引先</th>
                        <th style="width:100px">回答希望日</th>
                        <th style="width:35px">8H</th>
                        <th style="width:35px">24H</th>
                        <th style="width:70px">点検有</th>
                        <th style="width:110px">点検可能曜日</th>
                        <th style="width:110px">点検夜間対応有</th>
                        <th style="width:110px">保守方法</th>
                        <th style="width:80px">パック契約</th>
                        <th style="width:80px">店舗直契約</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, stat : *{mitsumoriRows}">
                        <td class="col-select">
                            <label class="row-select-label">
                                <input type="radio" name="mitsumoriRowSelect" class="row-select-radio" th:checked="${stat.index == 0}"/>
                                <span class="row-marker"><span class="row-no" th:text="${stat.count}"></span></span>
                            </label>
                        </td>
                        <td class="col-readonly-gray">
                            <span th:text="${row.tmIraiNo}"></span>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].tmIraiId}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].tmIraiNo}"/>
                        </td>
                        <td class="col-readonly-gray">
                            <span th:text="${row.torihikisakiNk}"></span>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torihikisakiId}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torihikisakiCd}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torihikisakiNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].toritelNo}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torifaxNo}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torijigyosyoNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].torisyutantosyaNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].toriassistantNk}"/>
                            <!-- 【不一致修正】NONYUSAKI_ID等はplantId由来のマスタ検索結果で
                                 ユーザー編集項目ではないが、登録時にMCM_TM_MITSUMORIへ保存する
                                 必要があるためhidden項目としてフォーム送信対象に含める。 -->
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyusakiId}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyusakiCd}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyusakiNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyusakijusyo1Nk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyusakijusyo2Nk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].plantId}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].supportId}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].plantNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyubusyoNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyutantosyaNk}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyutelNo}"/>
                            <input type="hidden" th:field="*{mitsumoriRows[__${stat.index}__].nonyufaxNo}"/>
                        </td>
                        <td>
                            <input type="text" class="kaitokizitsu-dt-input"
                                   th:field="*{mitsumoriRows[__${stat.index}__].kaitokizitsuDt}"/>
                        </td>
                        <!--
                          【#471】元VB: If Me.copyFlg Then 8H/24H列.ReadOnly = True
                            見積複製＋期間情報複写ありの場合のみ編集不可（disabledでマウス・キーボード操作とも不可）。
                            disabled項目は送信されないため、値はhiddenで送信する
                            （サーバー側でもrestoreLockedJikantai()で表示時の値へ戻す）。
                        -->
                        <td class="text-center" th:unless="${jikantaiLocked}">
                            <input type="checkbox"
                                   th:field="*{mitsumoriRows[__${stat.index}__].h8}"/>
                        </td>
                        <td class="text-center" th:if="${jikantaiLocked}">
                            <input type="checkbox" class="jikantai-locked" disabled="disabled" aria-label="8H（変更不可）"
                                   th:checked="${row.h8}"/>
                            <input type="hidden" th:name="|mitsumoriRows[${stat.index}].h8|" th:value="${row.h8}"/>
                        </td>
                        <td class="text-center" th:unless="${jikantaiLocked}">
                            <input type="checkbox"
                                   th:field="*{mitsumoriRows[__${stat.index}__].h24}"/>
                        </td>
                        <td class="text-center" th:if="${jikantaiLocked}">
                            <input type="checkbox" class="jikantai-locked" disabled="disabled" aria-label="24H（変更不可）"
                                   th:checked="${row.h24}"/>
                            <input type="hidden" th:name="|mitsumoriRows[${stat.index}].h24|" th:value="${row.h24}"/>
                        </td>
                        <td class="text-center">
                            <input type="checkbox"
                                   th:field="*{mitsumoriRows[__${stat.index}__].tenkenumu}"/>
                        </td>
                        <td>
                            <select th:field="*{mitsumoriRows[__${stat.index}__].tenkenkanoyobi}">
                                <option th:each="opt : ${tenkenkanoyobiOptions}"
                                        th:value="${opt.key}" th:text="${opt.value}"></option>
                            </select>
                        </td>
                        <td class="text-center">
                            <input type="checkbox"
                                   th:field="*{mitsumoriRows[__${stat.index}__].yakantaioumu}"/>
                        </td>
                        <td>
                            <select th:field="*{mitsumoriRows[__${stat.index}__].hosyuhoho}">
                                <option th:each="opt : ${hosyuhohoOptions}"
                                        th:value="${opt.key}" th:text="${opt.value}"></option>
                            </select>
                        </td>
                        <td class="text-center">
                            <input type="checkbox"
                                   th:field="*{mitsumoriRows[__${stat.index}__].packFlg}"/>
                        </td>
                        <td class="text-center">
                            <input type="checkbox"
                                   th:field="*{mitsumoriRows[__${stat.index}__].tenpoFlg}"/>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(form.mitsumoriRows)}">
                        <td colspan="12" style="text-align:center;color:#999;padding:8px;">データがありません</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== 機器構成パターン ===== (ReadOnly) -->
    <div class="grid-section">
        <div class="grid-section-title">&lt;&lt; 機器構成パターン &gt;&gt;</div>
        <div class="grid-container grid-kosei">
            <table class="data-grid" id="kikikoseiTable">
                <thead>
                    <tr>
                        <th class="col-select"></th>
                        <th style="width:300px">機器構成名</th>

                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, stat : *{kikikoseiRows}"

                                <span class="row-marker"><span class="row-no" th:text="${stat.count}"></span></span>
                            </label>
                        </td>
                        <td th:text="${row.kikikoseiNk}"></td>
                        <td th:text="${row.tehaiseiban}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(form.kikikoseiRows)}">
                        <td colspan="3" class="text-center" style="color:#999;padding:8px;">データがありません</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== 機器構成明細 ===== (ReadOnly) -->
    <div class="grid-section">
        <div class="grid-section-title">&lt;&lt; 機器構成明細 &gt;&gt;</div>
        <div class="grid-container grid-meisai">
            <table class="data-grid" id="kikimeisaiTable">
                <thead>
                    <tr>
                        <th class="col-select"></th>
                        <th style="width:200px">製造メーカー名</th>
                        <th style="width:300px">品名</th>
                        <th style="width:300px">型式</th>
                        <th style="width:55px">数量</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, stat : *{kikimeisaiRows}"
                        th:attr="data-kikikosei-id=${row.kikikoseiId}">
                        <td class="col-select">
                            <label class="row-select-label">

                                <span class="row-marker"><span class="row-no" th:text="${stat.count}"></span></span>
                            </label>

                        <td th:text="${row.seizomakerNk}"></td>

    <!-- ボタン行（VB版ボタン配置準拠：取引先見積・契約検索画面へ/前へ = 左下, 依頼書発行/登録 = 右下） -->
    <div class="toolbar">
        <a th:href="@{/mcm1003u}" class="btn">取引先見積・契約検索画面へ</a>
        <a th:href="${directAccess} ? @{/mcm1002u} : @{/mcm1002u/back}" class="btn">前へ</a>
        <span class="spacer"></span>
        <!-- 【不一致修正】元VB: IraisyoHakkoButton.AuthorityIsThrough=True（常時活性）。
             参照権限時はクリック後の登録処理をサーバー側でスキップし帳票出力のみ行う。 -->
        <!-- 【#374】URL直接アクセス時は対象データがないため非活性にする -->
        <button type="submit" th:formaction="@{/mcm1002u/iraisho}" class="btn" th:disabled="${directAccess}">依頼書発行</button>
        <!-- 【変換元】UpdateButton (AuthorityIsThrough=False) -->
        <button id="registerButton" type="submit" class="btn" th:disabled="${!canUpdate}" onclick="return confirmUpdate()">登録</button>
    </div>
</form>

<script th:inline="javascript">
    /* 【変換元】Mcm1002u2Screen - 状態に応じた編集可否制御 */

        var mitsumoriFlg = /*[[${delivery?.mitsumoriFlg}]]*/ 1;

        var readonly = !canUpdate || (mitsumoriFlg === 3 && jotai !== '作成中' && jotai !== '依頼');
        if (readonly) {

</script>

<script>
// =========================================================================
// 回答希望日の日付書式チェック（MCM0012U/MCM0013U準拠：yyyy/MM/dd）
//   ・セル移動時（blur）：即時にエラーモーダルを表示してフォーカスを戻す
//   ・登録／依頼書発行ボタン押下時：未入力欄も含め全件をまとめて検証する
// =========================================================================
function isValidDateStringKaitokizitsu(v) {
    if (!v) return true;
    if (!/^\d{4}\/\d{2}\/\d{2}$/.test(v)) return false;
    var p = v.split('/').map(function (n) { return parseInt(n, 10); });
    var d = new Date(p[0], p[1] - 1, p[2]);
    return d.getFullYear() === p[0] && (d.getMonth() + 1) === p[1] && d.getDate() === p[2];
}

function getKaitokizitsuValidationErrors() {
    var errors = [];
    document.querySelectorAll('.kaitokizitsu-dt-input').forEach(function (input) {
        if (input.disabled) return;
        var v = (input.value || '').trim();
        if (v && !isValidDateStringKaitokizitsu(v)) {
            errors.push('回答希望日はYYYY/MM/DDの書式で入力してください。');
        }
    });
    return errors;
}

document.addEventListener('DOMContentLoaded', function() {
    // セル移動時（blur）チェック
    document.querySelectorAll('.kaitokizitsu-dt-input').forEach(function (input) {
        input.addEventListener('blur', function () {
            var v = (this.value || '').trim();
            if (v && !isValidDateStringKaitokizitsu(v)) {
                var self = this;
                McmNotifications.error('回答希望日はYYYY/MM/DDの書式で入力してください。').then(function () {
                    self.focus();
                });
            }
        });
    });

    // 登録／依頼書発行ボタン押下時チェック（依頼書発行は確認ダイアログを持たないためsubmit時に検証する）
    var mainForm = document.getElementById('mainForm');
    if (mainForm) {
        mainForm.addEventListener('submit', function (e) {
            var errors = getKaitokizitsuValidationErrors();
            if (errors.length > 0) {
                e.preventDefault();
                McmNotifications.error(errors.join('\n'));
            } else {
                McmCommon.showProgress();
            }
        });
    }
});

// 登録ボタン押下時：先に日付書式を検証し、問題なければ確認ダイアログを出す
function confirmUpdate() {
    var errors = getKaitokizitsuValidationErrors();
    if (errors.length > 0) {
        McmNotifications.error(errors.join('\n'));
        return false;
    }
    return confirm('登録しますか？');
}
</script>

<script>
// =========================================================================
// 機器構成パターン → 機器構成明細 絞り込み表示（MCM1002U1準拠）
//   機器構成パターンの行を選択すると、対応する機器構成IDの明細のみを
//   「機器構成明細」グリッドに表示する。
// =========================================================================

// 指定された機器構成IDに対応する機器構成明細の行のみ表示する
function filterKikimeisaiByKosei(kikikoseiId) {
    document.querySelectorAll('#kikimeisaiTable tbody tr').forEach(function(tr) {
        if (tr.hasAttribute('data-kikikosei-id')) {
            tr.style.display = (tr.getAttribute('data-kikikosei-id') === kikikoseiId) ? '' : 'none';
        }
    });
    renumberKikimeisaiGrid();
}

// 表示されている行だけを対象に、左端マーカー列の行番号を1から振り直す
function renumberKikimeisaiGrid() {
    var table = document.getElementById('kikimeisaiTable');
    if (!table || !table.tBodies[0]) return;
    var no = 0;
    table.tBodies[0].querySelectorAll('tr').forEach(function(tr) {
        var noSpan = tr.querySelector('.row-no');
        if (!noSpan) return; // データ0件時の表示行等は対象外
        if (tr.style.display === 'none') return;
        no++;
        noSpan.textContent = String(no);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    var koseiTable = document.getElementById('kikikoseiTable');
    if (!koseiTable || !koseiTable.tBodies[0]) return;
    var body = koseiTable.tBodies[0];

    body.addEventListener('click', function(e) {
        var tr = e.target.closest('tr');
        if (!tr || !body.contains(tr) || !tr.hasAttribute('data-kikikosei-id')) return; // データ行以外は対象外

        var radio = tr.querySelector('.row-select-radio');
        if (radio) { radio.checked = true; }

        filterKikimeisaiByKosei(tr.getAttribute('data-kikikosei-id'));
    });

    // 初期表示：先頭行（デフォルト選択済み）に合わせて絞り込む
    var checkedRadio = body.querySelector('.row-select-radio:checked');
    if (checkedRadio) {
        var checkedTr = checkedRadio.closest('tr');
        if (checkedTr) {
            filterKikimeisaiByKosei(checkedTr.getAttribute('data-kikikosei-id'));
        }
    }
});
</script>
