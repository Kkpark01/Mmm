<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<!--
  【変換元】Mcm1001uScreen.vb / Mcm1001uScreen.Designer.vb
  MCM1001U — 見積依頼作成検索
  【機能構成・ボタン配置】VB版準拠（戻る/閉じる、検索、2グリッド、サポートIDリンク→MCM1002U1）
  【デザイン】Web版他画面（MCM1003U/MCM2001U等）準拠：紫帯ヘッダー + data-grid スタイル

    VB.NETコントロール → HTML要素の対応:
      TextBox_NONYUSAKI_CD  → #nonyusakiCd
      TextBox_SUPPORT_ID    → #supportId
      TextBox_NONYUSAKI_NK  → #nonyusakiNk
      TextBox_PLANT_NK      → #plantNk
      TextBox_ETC           → #etc
      Button_SearchButton   → #searchBtn
      DataGridView_NONYUSAKI → #nonyusakiGrid
      DataGridView_PLANT     → #plantGrid（SUPPORT_ID列がリンク → MCM1002U1）
-->
<head>
    <title>MCM1001U - 見積依頼作成検索</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/mcm1001u.css}" />
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>
<div layout:fragment="content" class="mcm1001u-screen">

    <!-- ===== ヘッダー（MCM1003U 準拠：紫帯・左=戻る/右=閉じる） ===== -->
    <header class="header">
        <div class="header-left">
            <a th:href="@{/mcm1003u}" class="btn-close">戻る</a>
        </div>
        <div class="header-center">
            <h1>見積依頼作成検索（MCM1001U）</h1>
        </div>
        <div class="header-right">
            <a th:href="@{/menu}" class="btn-close">閉じる</a>
        </div>
    </header>

    <div class="main-content">

        <!-- メッセージ -->
        <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
        

        <!-- ========== 検索条件エリア ========== -->
        <!--
            【変換元】Mcm1001uScreen.Designer.vb - 検索条件コントロール
              NONYUSAKI_CDTextBox / SUPPORT_IDTextBox / NONYUSAKI_NKTextBox
              PLANT_NKTextBox / ETCTextBox / SEARCHButton
        -->
        <form th:action="@{/mcm1001u/search}" method="post" class="search-area">
            <div class="search-grid">
                <div class="search-cell">
                    <label for="nonyusakiCd">納入先コード</label>
                    <input type="text" id="nonyusakiCd" name="nonyusakiCd"
                           th:value="${form?.nonyusakiCd}"
                           class="input-cd" maxlength="10" />
                </div>
                <div class="search-cell">
                    <label for="supportId">サポートID</label>
                    <input type="text" id="supportId" name="supportId"
                           th:value="${form?.supportId}"
                           class="input-support" maxlength="20" />
                </div>
                <div class="search-cell">
                    <label for="nonyusakiNk">納入先名(旧名・カナなど)</label>
                    <input type="text" id="nonyusakiNk" name="nonyusakiNk"
                           th:value="${form?.nonyusakiNk}"
                           class="input-wide" maxlength="100" />
                </div>
                <div class="search-cell">
                    <label for="plantNk">プラント名</label>
                    <input type="text" id="plantNk" name="plantNk"
                           th:value="${form?.plantNk}"
                           class="input-wide" maxlength="100" />
                </div>
                <div class="search-cell">
                    <label for="etc">その他(住所など)</label>
                    <input type="text" id="etc" name="etc"
                           th:value="${form?.etc}"
                           class="input-wide" maxlength="200" />
                </div>
                <div class="search-cell search-cell-button">
                    <button type="submit" id="searchBtn" class="btn-primary">検索</button>
                </div>
            </div>
        </form>

        <!-- ========== 納入先情報グリッド ========== -->
        <!--
            【変換元】DataGridView_NONYUSAKI
              7列(6表示+NONYUSAKI_ID hidden) / ReadOnly / Selection=FullRowSelect
        -->
        <div class="section-title">&lt;&lt;納入先情報&gt;&gt;</div>
        <div class="grid-container grid-nonyusaki">
            <table id="nonyusakiGrid" class="data-grid">
                <thead>
                    <tr>
                        <th style="width:93px">納入先コード</th>
                        <th style="width:220px">納入先名</th>
                        <th style="width:160px">納入先カナ名</th>
                        <th style="width:120px">納入先英名</th>
                        <th style="width:180px">納入先工場名</th>
                        <th style="width:155px">旧納入先名</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="n, stat : ${nonyusakiList}"
                        th:data-nonyusaki-id="${n.nonyusakiId}"
                        th:attr="data-rowno=${stat.count}"
                        class="nonyusaki-row clickable-row"
                        onclick="selectNonyusakiRow(this)">
                        <td th:text="${n.nonyusakiCd}"></td>
                        <td th:text="${n.nonyusakiNk}"></td>
                        <td th:text="${n.nonyusakikanaKn}"></td>
                        <td th:text="${n.nonyusakieimeiEn}"></td>
                        <td th:text="${n.nonyusakikojoNk}"></td>
                        <td th:text="${n.kyunonyusakiNk}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(nonyusakiList)}">
                        <td colspan="6" class="no-data">データがありません</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- ========== プラント情報グリッド ========== -->
        <!--
            【変換元】DataGridView_PLANT + PLANTDataGridView_CellContentClick
              10列(7表示+3hidden) / SUPPORT_ID列がリンク → MCM1002U1（見積フラグ=新規）
        -->
        <div class="section-title">&lt;&lt;プラント情報&gt;&gt;</div>
        <div class="grid-container grid-plant">
            <table id="plantGrid" class="data-grid">
                <thead>
                    <tr>
                        <th style="width:80px">サポートID</th>
                        <th style="width:240px">プラント名</th>
                        <th style="width:70px">納入日</th>
                        <th style="width:115px">保守終息日</th>
                        <th style="width:80px">稼働開始</th>
                        <th style="width:80px" class="text-right">稼働日数</th>
                        <th style="width:80px" class="text-right">稼働時間</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${plantList}"
                        th:data-nonyusaki-id="${p.nonyusakiId}"
                        class="plant-row"
                        onclick="selectPlantRow(this)">
                        <td>
                            <a th:href="@{/mcm1002u(mitsumori=1,
                                                     supportId=${p.supportId},
                                                     plantNk=${p.plantNk},
                                                     plantId=${p.plantId},
                                                     nonyusakiCd=${p.nonyusakiCd},
                                                     nonyusakiNk=${p.nonyusakiNk},
                                                     copyFlg=false)}"
                               class="grid-link"
                               th:text="${p.supportId}"></a>
                        </td>
                        <td th:text="${p.plantNk}"></td>
                        <td th:text="${p.nonyuDt}"></td>
                        <td th:text="${p.hosyusyusokuDt}"></td>
                        <td th:text="${p.systemkadoyoubi}"></td>
                        <td class="text-right" th:text="${p.systemkadonissu}"></td>
                        <td class="text-right" th:text="${p.systemkadojikan}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(plantList)}">
                        <td colspan="7" class="no-data">データがありません</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

<script th:inline="javascript">
    /**
     * 【変換元】MCM0010U 準拠：見えている行だけ1から連番を data-rowno に設定する。
     *   非表示(display:none)行や「データがありません」行は対象外とする。
     */
    function renumberRows(tbodySelector) {
        var no = 0;
        document.querySelectorAll(tbodySelector + ' tr').forEach(function(tr) {
            if (tr.querySelector('td.no-data')) { tr.removeAttribute('data-rowno'); return; }
            if (tr.style.display === 'none') { tr.removeAttribute('data-rowno'); return; }
            no++;
            tr.setAttribute('data-rowno', String(no));
        });
    }

    function selectNonyusakiRow(row) {
        document.querySelectorAll('#nonyusakiGrid tbody tr').forEach(function(tr) {
            tr.classList.remove('selected');
        });
        row.classList.add('selected');

        var nonyusakiId = row.getAttribute('data-nonyusaki-id');

        // 選択した納入先に紐づくプラント行だけを表示する
        document.querySelectorAll('#plantGrid tbody tr.plant-row').forEach(function(tr) {
            var plantNonyusakiId = tr.getAttribute('data-nonyusaki-id');
            if (plantNonyusakiId === nonyusakiId) {
                tr.style.display = '';
            } else {
                tr.style.display = 'none';
            }
        });
        renumberRows('#plantGrid tbody');

        // 表示された先頭のプラント行を自動選択する
        var firstPlantRow = document.querySelector('#plantGrid tbody tr.plant-row:not([style*="display: none"])');
        selectPlantRow(firstPlantRow);
    }

    function selectPlantRow(row) {
        document.querySelectorAll('#plantGrid tbody tr.plant-row').forEach(function(tr) {
            tr.classList.remove('selected');
        });
        if (row) {
            row.classList.add('selected');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        renumberRows('#nonyusakiGrid tbody');
        var firstRow = document.querySelector('#nonyusakiGrid tbody tr.nonyusaki-row');
        if (firstRow) {
            selectNonyusakiRow(firstRow);
        }
    });
</script>
</div>

</body>
</html>
