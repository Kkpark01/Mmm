<!DOCTYPE html>
<!--
  【変換元】Mcm1003uScreen.Designer.vb - MCM1003U 取引先見積・契約一覧
  【変換元行数】約64,000行（Designer.vb全体）
  【作成者】T.Kajimura (2008/02/14)
  【更新者】T.Iwasawa (2009/08/12), M.Ohsuka (2009/12/02, 2010/01/15)

  元コード: WinForms DataGridView + 検索条件エリア（TextBox / CheckBox / ComboBox）
  変換後:   Thymeleaf テンプレート + HTML <table> + フォーム
  デザイン: MCM0001U（メニュー画面）と統一
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>取引先見積・契約一覧</title>
    <link rel="stylesheet" th:href="@{/css/mcm1003u.css}" />
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"/>
    <script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script>
</head>
<body>
<div layout:fragment="content" class="mcm1003u-screen">

    <!-- ================================================================ -->
    <!-- ヘッダー（MCM0001Uと統一）                                        -->
    <!-- ================================================================ -->
    <header class="header">
        <div class="header-left"></div>
        <div class="header-center">
            <h1>取引先見積・契約一覧（MCM1003U）</h1>
        </div>
        <div class="header-right">
            <a th:href="@{/mcm1003u/close}" class="btn-close">閉じる</a>
        </div>
    </header>

    <!-- ================================================================ -->
    <!-- メインコンテンツ                                                   -->
    <!-- ================================================================ -->
    <div class="main-content">

        <!-- メッセージ表示エリア -->
        <th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
        

        <!-- ============================================================ -->
        <!-- 検索条件エリア（VB座標ベース配置）                               -->
        <!-- ============================================================ -->
        <!--
          【変換元】Mcm1003uScreen.Designer.vb - 検索エリアの各コントロール
            配置: Y:5〜138 の上部領域
        -->
        <form th:action="@{/mcm1003u/search}" th:object="${form}" method="post" class="search-area">

            <!-- Row 1: 見積依頼NO (X:21) / 契約NO (X:318) -->
            <div class="search-row">
                <div class="col-left">
                    <label for="mitsumoriIraiNo">見積依頼NO</label>
                    <input type="text" id="mitsumoriIraiNo" th:field="*{mitsumoriIraiNo}" class="input-sm" />
                </div>
                <div class="col-right">
                    <label for="keiyakuNo">契約NO</label>
                    <input type="text" id="keiyakuNo" th:field="*{keiyakuNo}" class="input-md" />
                </div>
            </div>

            <!-- Row 2: 依頼日 (X:21) / 依頼者 (X:318) -->
            <div class="search-row">
                <div class="col-left">
                    <label for="iraibi1">依頼日</label>
                    <input type="text" id="iraibi1" th:field="*{iraibi1}" class="input-date" placeholder="yyyy/MM/dd" />
                    <span class="date-separator">～</span>
                    <input type="text" id="iraibi2" th:field="*{iraibi2}" class="input-date" placeholder="yyyy/MM/dd" />
                </div>
                <div class="col-right">
                    <label for="iraisya">依頼者</label>
                    <select id="iraisya" th:field="*{iraisya}" class="input-sm">
                        <option value=""></option>
                        <option th:each="item : ${iraisyaList}" th:value="${item}" th:text="${item}"></option>
                    </select>
                </div>
            </div>

            <!-- Row 3: 取引先コード (X:21) / 取引先名 (X:318) -->
            <div class="search-row">
                <div class="col-left">
                    <label for="torihikisakiCd">取引先コード</label>
                    <input type="text" id="torihikisakiCd" th:field="*{torihikisakiCd}" class="input-sm" />
                </div>
                <div class="col-right">
                    <label for="torihikisakimei">取引先名</label>
                    <input type="text" id="torihikisakimei" th:field="*{torihikisakimei}" class="input-lg" />
                </div>
            </div>

            <!-- Row 4: 納入先コード (X:21) / 納入先名 (X:318) -->
            <div class="search-row">
                <div class="col-left">
                    <label for="nonyusakiCd">納入先コード</label>
                    <input type="text" id="nonyusakiCd" th:field="*{nonyusakiCd}" class="input-nonyusaki-cd" />
                </div>
                <div class="col-right">
                    <label for="nonyusakimei">納入先名（旧名・カナなど）</label>
                    <input type="text" id="nonyusakimei" th:field="*{nonyusakimei}" class="input-lg" />
                </div>
            </div>

            <!-- Row 5: サポートID (X:21) / プラント名 (X:318) -->
            <div class="search-row">
                <div class="col-left">
                    <label for="supportId">サポートID</label>
                    <input type="text" id="supportId" th:field="*{supportId}" class="input-xs" />
                </div>
                <div class="col-right">
                    <label for="plantmei">プラント名</label>
                    <input type="text" id="plantmei" th:field="*{plantmei}" class="input-lg" />
                </div>
            </div>

            <!-- Row 6: 状態チェックボックス (Y:114) -->
            <!--
              【変換元】Mcm1003uScreen.Designer.vb
                元コード: SagyochuCheckBox.Checked=True, IraiCheckBox.Checked=True, ...
            -->
            <div class="search-row checkbox-group">
                <label class="group-label">状態</label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{sagyochu}" /> 作成中
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{irai}" /> 依頼
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{mitsumori}" /> 見積
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{keiyaku}" /> 契約
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{kaiyaku}" /> 解約
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{haki}" /> 破棄
                </label>
            </div>

            <!-- Row 7: 承認状態チェックボックス (Y:137) -->
            <div class="search-row checkbox-group">
                <label class="group-label">承認状態</label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{shoninSakuseichu}" /> 作成中
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{shoninSinsachu}" /> 審査中
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{shoninShoninchu}" /> 承認中
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{shoninShoninzumi}" /> 承認済
                </label>
                <label class="cb-label">
                    <input type="checkbox" th:field="*{shoninSashimodoshi}" /> 差戻中
                </label>
            </div>

            <!-- 検索ボタン行内配置 -->
            <div class="button-row">
                <button type="submit" class="btn-search">検索</button>
            </div>
        </form>

        <!-- ============================================================ -->
        <!-- 区切り線（VB: CpLabel17 Y:159 H:1）                           -->
        <!-- ============================================================ -->
        <hr class="separator-line" />

        <!-- ============================================================ -->
        <!-- ボタン行: 行削除 / 新規（VB: Y:164）                           -->
        <!-- ============================================================ -->
        <!--
          【変換元】Mcm1003uScreen.Designer.vb
            RowDeleteButton (X:1087, Y:164, W:75)
            ShinkiButton    (X:1168, Y:164, W:75)
        -->
        <div class="button-row">
            <button type="button" class="btn" onclick="confirmDeleteRow()"
                    th:if="${canDelete and list != null and !list.isEmpty()}">行削除</button>
            <a th:if="${canEditMitsumori}" th:href="@{/mcm1003u/new}" class="btn">新規</a>
        </div>

        <!-- ============================================================ -->
        <!-- 検索件数                                                      -->
        <!-- ============================================================ -->
        <div th:if="${resultCount != null}" class="result-count">
            検索結果：<span th:text="${resultCount}">0</span>件
        </div>

        <!-- ============================================================ -->
        <!-- データ一覧テーブル（VB: UVADataGridView Y:189 H:686）          -->
        <!-- ============================================================ -->
        <!--
          【変換元】Mcm1003uScreen.Designer.vb - UVADataGridView
            元コード: DataGridView (ReadOnly=True, AllowUserToAddRows=False)
            可視カラム19列 / 非表示カラム11列
        -->
        <div class="table-card">
            <div class="table-container">
                <table class="data-grid">
                    <thead>
                        <tr>
                            <!-- [MCM0010U統一] 左端▶マーカー列は tr::before 疑似要素で描画するため実thは持たない -->
                            <!-- 可視カラム（VB Designer.vb の列順序どおり） -->
                            <th class="col-jotai">状態</th>
                            <th class="col-irai-no">依頼NO</th>
                            <th class="col-irai-dt">依頼日</th>
                            <th class="col-jikantai">時間</th>
                            <th class="col-shonin">承認</th>
                            <th class="col-keiyaku-no">契約NO</th>
                            <th class="col-fusei">不正</th>
                            <th class="col-torihikisaki">取引先名</th>
                            <th class="col-nonyusaki-cd">納入先コード</th>
                            <th class="col-nonyusaki">納入先名</th>
                            <th class="col-kyu-nonyusaki">旧納入先名</th>
                            <th class="col-nonyusaki-kojo">納入先工場名</th>
                            <th class="col-support-id">サポートID</th>
                            <th class="col-plant">プラント名</th>
                            <!-- リンク列 (VB: 各40px) -->
                            <th class="col-link">見積</th>
                            <th class="col-link">見積</th>
                            <th class="col-link">見積</th>
                            <th class="col-link">契約</th>
                            <th class="col-link">契約</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row, rowStat : ${list}" th:attr="data-irai-id=${row.tmIraiId}">
                            <!-- [MCM0010U統一] 行選択は tr::before マーカー列で行う（チェックボックス列は廃止） -->

                            <!-- 状態 -->
                            <td class="cell-center" th:text="${row.jotai}"></td>

                            <!-- 依頼NO（リンク → MCM1004U） -->
                            <td class="cell-link">
                                <a th:if="${row.tmIraiNo != null and !row.tmIraiNo.trim().isEmpty()}"
                                   th:href="@{/mcm1003u/link/irai-no(tmKeiyakujikanId=${row.tmKeiyakujikanId})}"
                                   th:text="${row.tmIraiNo}" class="grid-link"></a>
                            </td>

                            <!-- 依頼日 -->
                            <td th:text="${row.mitsumoriDt != null ? #temporals.format(row.mitsumoriDt, 'yyyy/MM/dd') : ''}"></td>

                            <!-- 時間（右寄せ） -->
                            <td class="cell-right" th:text="${row.keiyakujikantai}"></td>

                            <!-- 承認 -->
                            <td class="cell-center" th:text="${row.shoninjotai}"></td>

                            <!-- 契約NO（リンク → MCM1005U） -->
                            <td class="cell-link">
                                <a th:if="${row.keiyakuNo != null and !row.keiyakuNo.trim().isEmpty()}"
                                   th:href="@{/mcm1003u/link/keiyaku-no(
                                       tkKeiyakuId=${row.tkKeiyakuId},
                                       tmKeiyakujikanId=${row.tmKeiyakujikanId},
                                       torihikisakiId=${row.torihikisakiId},
                                       torihikisakiCd=${row.torihikisakiCd},
                                       torihikisakiNk=${row.torihikisakiNk},
                                       nonyusakiCd=${row.nonyusakiCd},
                                       nonyusakiNk=${row.nonyusakiNk},
                                       supportId=${row.supportId},
                                       plantNk=${row.plantNk},
                                       plantId=${row.plantId})}"
                                   th:text="${row.keiyakuNo}" class="grid-link"></a>
                            </td>

                            <!-- 不正 -->
                            <td class="cell-center" th:text="${row.fusei}"></td>

                            <!-- 取引先名 -->
                            <td th:text="${row.torihikisakiNk}"></td>

                            <!-- 納入先コード -->
                            <td th:text="${row.nonyusakiCd}"></td>

                            <!-- 納入先名 -->
                            <td th:text="${row.nonyusakiNk}"></td>

                            <!-- 旧納入先名 -->
                            <td th:text="${row.kyunonyusakiNk}"></td>

                            <!-- 納入先工場名 -->
                            <td th:text="${row.nonyusakikojoNk}"></td>

                            <!-- サポートID -->
                            <td th:text="${row.supportId}"></td>

                            <!-- プラント名 -->
                            <td th:text="${row.plantNk}"></td>

                            <!-- 見積(依頼) リンク → MCM1002U1 -->
                            <td class="cell-center">
                                <a th:if="${row.mitsumoriIrai != null and !row.mitsumoriIrai.trim().isEmpty()}"
                                   th:href="@{/mcm1003u/link/mitsumori-irai(
                                       tmKeiyakujikanId=${row.tmKeiyakujikanId},
                                       torihikisakiId=${row.torihikisakiId},
                                       torihikisakiCd=${row.torihikisakiCd},
                                       torihikisakiNk=${row.torihikisakiNk},
                                       nonyusakiCd=${row.nonyusakiCd},
                                       nonyusakiNk=${row.nonyusakiNk},
                                       supportId=${row.supportId},
                                       plantNk=${row.plantNk},
                                       plantId=${row.plantId},
                                       jotai=${row.jotai})}"
                                   th:text="${row.mitsumoriIrai}" class="grid-link"></a>
                            </td>

                            <!-- 見積(複製) リンク → MCM1002U1 or MCM1008U -->
                            <td class="cell-center">
                                <a th:if="${canEditMitsumori and row.mitsumoriCopy != null and !row.mitsumoriCopy.trim().isEmpty()}"
                                   th:href="@{/mcm1003u/link/mitsumori-copy(
                                       tmKeiyakujikanId=${row.tmKeiyakujikanId},
                                       torihikisakiId=${row.torihikisakiId},
                                       torihikisakiCd=${row.torihikisakiCd},
                                       torihikisakiNk=${row.torihikisakiNk},
                                       nonyusakiCd=${row.nonyusakiCd},
                                       nonyusakiNk=${row.nonyusakiNk},
                                       supportId=${row.supportId},
                                       plantNk=${row.plantNk},
                                       plantId=${row.plantId},
                                       jotai=${row.jotai})}"
                                   th:text="${row.mitsumoriCopy}" class="grid-link"></a>
                            </td>

                            <!-- 見積(破棄) リンク → POST with confirm -->
                            <td class="cell-center">
                                <a th:if="${canEditMitsumori and row.mitsumoriDel != null and !row.mitsumoriDel.trim().isEmpty()}"
                                   href="javascript:void(0)"
                                   th:text="${row.mitsumoriDel}"
                                   th:attr="data-tmkeiyakujikanid=${row.tmKeiyakujikanId},
                                            data-tkkeiyakuid=${row.tkKeiyakuId}"
                                   onclick="confirmDiscardMitsumori(this)"
                                   class="grid-link link-danger"></a>
                            </td>

                            <!-- 契約(作成) リンク → MCM1006U -->
                            <td class="cell-center">
                                <a th:if="${canEditKeiyaku and row.keiyakuKeiyaku != null and !row.keiyakuKeiyaku.trim().isEmpty()}"
                                   th:href="@{/mcm1003u/link/keiyaku-create(
                                       tmKeiyakujikanId=${row.tmKeiyakujikanId},
                                       torihikisakiId=${row.torihikisakiId},
                                       torihikisakiCd=${row.torihikisakiCd},
                                       torihikisakiNk=${row.torihikisakiNk},
                                       nonyusakiCd=${row.nonyusakiCd},
                                       nonyusakiNk=${row.nonyusakiNk},
                                       supportId=${row.supportId},
                                       plantNk=${row.plantNk},plantId=${row.plantId})}"
                                   th:text="${row.keiyakuKeiyaku}" class="grid-link"></a>
                            </td>

                            <!-- 契約(破棄) リンク → POST with confirm -->
                            <td class="cell-center">
                                <a th:if="${canEditKeiyaku and row.keiyakuDel != null and !row.keiyakuDel.trim().isEmpty()}"
                                   href="javascript:void(0)"
                                   th:text="${row.keiyakuDel}"
                                   th:attr="data-tkkeiyakuid=${row.tkKeiyakuId},
                                            data-tmkeiyakujikanid=${row.tmKeiyakujikanId}"
                                   onclick="confirmDiscardKeiyaku(this)"
                                   class="grid-link link-danger"></a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ============================================================ -->
        <!-- 下部ボタンエリア: 依頼一覧出力（VB: IraiIchiranSyutsuryokuButton Y:880） -->
        <!-- ============================================================ -->
        <div class="button-row">
            <a th:href="@{/mcm1003u/excel-download}" class="btn btn-wide">依頼一覧出力</a>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- Hidden Forms（見積破棄 / 契約破棄 / 行削除）                     -->
    <!-- ============================================================ -->
    <form id="discardMitsumoriForm" th:action="@{/mcm1003u/discard-mitsumori}" method="post" style="display:none;">
        <input type="hidden" id="dm_tmKeiyakujikanId" name="tmKeiyakujikanId" />
        <input type="hidden" id="dm_tkKeiyakuId" name="tkKeiyakuId" />
    </form>
    <form id="discardKeiyakuForm" th:action="@{/mcm1003u/discard-keiyaku}" method="post" style="display:none;">
        <input type="hidden" id="dk_tkKeiyakuId" name="tkKeiyakuId" />
        <input type="hidden" id="dk_tmKeiyakujikanId" name="tmKeiyakujikanId" />
    </form>
    <form id="deleteRowForm" th:action="@{/mcm1003u/delete-row}" method="post" style="display:none;">
        <input type="hidden" id="dr_tmIraiId" name="tmIraiId" />
    </form>

<!-- ================================================================ -->
<!-- JavaScript                                                        -->
<!-- ================================================================ -->
<script th:inline="javascript">

    let actionPending = false;
    async function confirmAction(message) {
        if (actionPending) return false;
        actionPending = true;
        try {
            const accepted = await McmNotifications.confirm(message);
            if (!accepted) actionPending = false;
            return accepted;
        } catch (error) { actionPending = false; throw error; }
    }
    window.addEventListener('pageshow', function() { actionPending = false; });

    /** 見積破棄の確認ダイアログ → POST送信 */
    async function confirmDiscardMitsumori(el) {
        if (!await confirmAction('見積を破棄します。よろしいですか？')) return;
        document.getElementById('dm_tmKeiyakujikanId').value = el.getAttribute('data-tmkeiyakujikanid');
        document.getElementById('dm_tkKeiyakuId').value = el.getAttribute('data-tkkeiyakuid') || '';
        document.getElementById('discardMitsumoriForm').submit();
    }

    /** 契約破棄の確認ダイアログ → POST送信 */
    async function confirmDiscardKeiyaku(el) {
        if (!await confirmAction('契約を破棄します。よろしいですか？')) return;
        document.getElementById('dk_tkKeiyakuId').value = el.getAttribute('data-tkkeiyakuid');
        document.getElementById('dk_tmKeiyakujikanId').value = el.getAttribute('data-tmkeiyakujikanid');
        document.getElementById('discardKeiyakuForm').submit();
    }

    /** 行削除の確認ダイアログ → POST送信（[MCM0010U統一] ▶で選択した行を対象にする） */
    async function confirmDeleteRow() {
        var selected = document.querySelector('.data-grid tbody tr.selected');
        if (!selected || !selected.getAttribute('data-irai-id')) {
            await McmNotifications.error('行が選択されていません。');
            return;
        }
        if (!await confirmAction('行を削除します。よろしいですか？')) return;
        document.getElementById('dr_tmIraiId').value = selected.getAttribute('data-irai-id');
        document.getElementById('deleteRowForm').submit();
    }

    document.addEventListener('DOMContentLoaded', function() {

        /* ===== [MCM0010U統一] 行選択／セル選択ロジック =====
         *   ・左端の▶マーカー列（tr::before）クリック → 行全体をグレー選択（▶表示）
         *   ・データセルクリック                       → そのセルのみグレー（cell-active）
         * MCM0010Uと同様、マーカーは実セルではなく tr::before 疑似要素のため、
         * e.target.closest('td') が null になるかどうかでマーカー/セルを判定する。
         */
        (function setupRowCellSelection() {
            var table = document.querySelector('.data-grid');
            if (!table || !table.tBodies[0]) return;
            var body = table.tBodies[0];
            body.addEventListener('click', function(e) {
                var tr = e.target.closest('tr');
                if (!tr || !body.contains(tr)) return;
                if (!tr.getAttribute('data-irai-id')) return; // データ行以外は対象外
                if (e.target.closest('a')) return;            // リンククリックは選択にしない

                var td = e.target.closest('td');
                var isMarkerClick = (td === null); // ::before マーカー領域のクリック

                body.querySelectorAll('tr.selected').forEach(function(r){ r.classList.remove('selected'); });
                body.querySelectorAll('td.cell-active').forEach(function(c){ c.classList.remove('cell-active'); });

                if (isMarkerClick) { tr.classList.add('selected'); }
                else { td.classList.add('cell-active'); }
            });
        })();

        /* ===== [MCM3006U/0010U準拠] 左端▶マーカー列に昇順の行番号を表示 ===== */
        (function renumber() {
            var table = document.querySelector('.data-grid');
            if (!table || !table.tBodies[0]) return;
            var no = 0;
            table.tBodies[0].querySelectorAll('tr').forEach(function(tr) {
                if (!tr.getAttribute('data-irai-id')) { tr.removeAttribute('data-rowno'); return; }
                if (tr.style.display === 'none') { tr.removeAttribute('data-rowno'); return; }
                no++;
                tr.setAttribute('data-rowno', String(no));
            });
        })();

        /* ===== [MCM0017U/0010U統一] 列幅ドラッグ変更（列間の境界を掴んで幅変更） ===== */
        (function setupColumnResize() {
            var table = document.querySelector('.data-grid');
            if (!table) return;
            var ths = table.querySelectorAll('thead th');
            if (!ths.length) return;
            var MARKER_W = 46; // tr::before マーカー列の固定幅
            var baseWidths = [];
            for (var i = 0; i < ths.length; i++) { baseWidths.push(ths[i].offsetWidth); }

            function applyWidths(ws) {
                var total = MARKER_W;
                for (var i = 0; i < ths.length; i++) { ths[i].style.width = ws[i] + 'px'; total += ws[i]; }
                table.style.width = total + 'px';
            }
            for (var c = 0; c < ths.length; c++) {
                (function(idx) {
                    var th = ths[idx];
                    if (th.querySelector('.col-resizer')) return;
                    var grip = document.createElement('span');
                    grip.className = 'col-resizer';
                    th.appendChild(grip);
                    grip.addEventListener('mousedown', function(e) {
                        e.preventDefault(); e.stopPropagation();
                        var startX = e.clientX, startW = baseWidths[idx];
                        document.body.classList.add('col-resizing');
                        function onMove(ev) {
                            var w = startW + (ev.clientX - startX);
                            if (w < 40) w = 40;
                            baseWidths[idx] = w;
                            applyWidths(baseWidths.slice());
                        }
                        function onUp() {
                            document.body.classList.remove('col-resizing');
                            document.removeEventListener('mousemove', onMove);
                            document.removeEventListener('mouseup', onUp);
                        }
                        document.addEventListener('mousemove', onMove);
                        document.addEventListener('mouseup', onUp);
                    });
                })(c);
            }
        })();
    });
</script>
</div>
</body>
</html>
