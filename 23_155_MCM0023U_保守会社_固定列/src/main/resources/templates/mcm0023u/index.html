<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title th:text="${screenTitle} + ' ' + ${screenId}">MCM0023U 保守会社マスタ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/mcm0023u.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-dialog.css}"/>
    <script th:src="@{/js/common.js}"></script>
<!-- #155 BEGIN: 画面単独で反映できる固定列処理 -->
<style>
/* #155: この画面内の固定列のみ。列幅変更・追加行にも追従する。 */
#hoshugaishaGrid { table-layout: fixed; }
#hoshugaishaGrid thead th:nth-of-type(1), #hoshugaishaGrid tbody td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#hoshugaishaGrid thead th:nth-of-type(2), #hoshugaishaGrid tbody td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#hoshugaishaGrid thead th:nth-of-type(3), #hoshugaishaGrid tbody td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#hoshugaishaGrid thead th:nth-of-type(4), #hoshugaishaGrid tbody td:nth-of-type(4) { position: sticky; left: var(--mcm-fixed-left-4, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#hoshugaishaGrid thead th:nth-of-type(-n+4) { top: 0; z-index: 20; background-color: #eef2f5; }
#hoshugaishaGrid tbody td.col-required:nth-of-type(-n+4) { background-color: #e3f2fd; }
#hoshugaishaGrid tbody td.col-readonly:nth-of-type(-n+4), #hoshugaishaGrid tbody td.readonly:nth-of-type(-n+4) { background-color: #d9d9d9; }
#hoshugaishaGrid thead th:nth-of-type(4), #hoshugaishaGrid tbody td:nth-of-type(4) { box-shadow: 2px 0 0 rgba(0,0,0,.08); }
#hoshugaishaGrid tr.row-deleted, #hoshugaishaGrid tr.row-deleted td { opacity: 1; }
</style>
<script>
/** #155: 固定列の位置を実際の列幅に追従させる。 */
(function () {
    "use strict";

    function initialize() {
        document.querySelectorAll('table[data-mcm-fixed-columns]').forEach(function (table) {
            var count = Number(table.dataset.mcmFixedColumns);
            var header = table.tHead && table.tHead.rows[0];
            if (!header || !Number.isInteger(count) || count < 1 || count > header.cells.length) return;
            var cells = Array.prototype.slice.call(header.cells, 0, count);

            function updateOffsets() {
                // 非表示の子グリッドは幅0になる。再表示時のResizeObserverで更新する。
                if (table.getBoundingClientRect().width === 0) return;
                var widths = cells.map(function (cell) { return cell.getBoundingClientRect().width; });
                var left = 0;
                widths.forEach(function (width, index) {
                    var name = '--mcm-fixed-left-' + (index + 1);
                    var value = left + 'px';
                    if (table.style.getPropertyValue(name) !== value) {
                        table.style.setProperty(name, value);
                    }
                    left += width;
                });
            }

            updateOffsets();
            // 列幅ドラッグ・初期幅調整・親子グリッドの表示切替を検知。
            // leftの更新は幅を変えないため、監視による再帰的なリサイズは発生しない。
            if (typeof ResizeObserver !== 'undefined') {
                var observer = new ResizeObserver(updateOffsets);
                observer.observe(table);
                cells.forEach(function (cell) { observer.observe(cell); });
            } else {
                // ResizeObserver非対応環境では既存の列幅変更処理を監視する。
                var colgroup = table.querySelector('colgroup');
                if (colgroup) {
                    new MutationObserver(updateOffsets).observe(colgroup, {
                        attributes: true, attributeFilter: ['style'], subtree: true
                    });
                }
            }
            window.addEventListener('resize', updateOffsets);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize, { once: true });
    } else {
        initialize();
    }
})();

</script>
<!-- #155 END -->
</head>
<body th:attr="data-update-authority=${isUpdateAuthority},data-delete-check-url=@{/mcm0023u/delete-check}">
<div class="header">
    <div class="header-left"></div>
    <div class="header-center"><h1 th:text="${screenTitle} + '（' + ${screenId} + '）'">保守会社マスタ（MCM0023U）</h1></div>
    <div class="header-right"><a class="btn-close" id="btnCloseLink" th:href="@{/menu}">閉じる</a></div>
</div>

<!-- 画面上部にはメッセージを表示せず、JavaScriptでダイアログ表示する -->
<div id="serverMessageData" hidden
     th:attr="data-success=${successMessage},data-error=${errorMessage},data-error-type=${errorType}">
    <span class="server-error-item" th:each="err : ${errors}" th:text="${err}"></span>
</div>

<form id="updateForm" th:action="@{/mcm0023u/update}" th:object="${mcm0023uForm}" method="post" novalidate>
    <div class="toolbar">
        <button type="button" id="btnDeleteRow" class="btn btn-danger" th:disabled="${!isUpdateAuthority}">行削除</button>
    </div>

    <div class="grid-container">
        <table id="hoshugaishaGrid" data-mcm-fixed-columns="4" class="data-grid" style="visibility:hidden;">
            <colgroup>
                <col style="width:28px"/>
                <col style="width:60px"/>
                <col style="width:60px"/>
                <col style="width:180px"/>
                <col style="width:180px"/>
                <col style="width:150px"/>
                <col style="width:90px"/>
                <col style="width:200px"/>
                <col style="width:200px"/>
                <col style="width:120px"/>
                <col style="width:120px"/>
                <col style="width:120px"/>
                <col style="width:120px"/>
                <col style="width:120px"/>
                <col style="width:110px"/>
                <col style="width:110px"/>
                <col style="width:200px"/>
                <col style="width:200px"/>
                <col style="width:300px"/>
                <col style="width:115px"/>
                <col style="width:80px"/>
                <col style="width:115px"/>
                <col style="width:80px"/>
            </colgroup>
            <thead>
            <tr>
                <th class="col-select"></th>
                <th class="col-required">No</th>
                <th>無効</th>
                <th class="col-required">保守会社名</th>
                <th>保守会社カナ</th>
                <th>事業所名</th>
                <th>郵便番号</th>
                <th>住所1</th>
                <th>住所2</th>
                <th>電話番号1</th>
                <th>電話番号2</th>
                <th>電話番号3</th>
                <th>FAX番号1</th>
                <th>FAX番号2</th>
                <th>主担当者</th>
                <th>アシスタント</th>
                <th>メールアドレス</th>
                <th>ホームページ</th>
                <th>備考</th>
                <th>登録日時</th>
                <th>登録者</th>
                <th>更新日時</th>
                <th>更新者</th>
            </tr>
            </thead>
            <tbody id="hoshugaishaTbody">
            <tr th:each="row,st : *{rows}"
                th:attr="data-hoshugaisha-id=${row.hoshugaishaId}"
                th:classappend="${row.rowStatus == 'deleted'} ? ' row-deleted' : ''">
                <td class="col-select">
                    <label class="row-select-label">
                        <input type="radio" name="rowSelect" class="row-select" th:disabled="${!isUpdateAuthority}"/>
                        <span class="row-marker" aria-hidden="true"></span>
                    </label>
                    <input type="hidden" th:field="*{rows[__${st.index}__].hoshugaishaId}" class="hoshugaisha-id-input"/>
                    <input type="hidden" th:field="*{rows[__${st.index}__].rowStatus}" class="row-status-input"/>
                    <input type="hidden" th:field="*{rows[__${st.index}__].originalLastupdateDt}" class="original-lastupdate-dt"/>
                </td>
                <!-- 【修正】type="number"は"e"/"+"/"-"/"."が入力可能で、数値以外入力チェックを
                     すり抜ける不具合があったため type="text" に統一する（MCM0015U準拠）。 -->
                <td class="col-required col-no"><input type="text" inputmode="numeric" class="grid-input input-right" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hyojijun}"/></td>
                <td class="col-checkbox"><input type="checkbox" class="yukou-check" th:disabled="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].yukoFlg}"/></td>
                <td class="col-required"><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshugaishaNk}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshugaishaKn}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshujigyosyoNk}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshuyubinNo}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshujusyo1Nk}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshujusyo2Nk}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshutel1No}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshutel2No}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshutel3No}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshufax1No}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshufax2No}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshusyutantosyaNk}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshuassistantNk}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshumailAddress}"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].hoshuhomepage}"/></td>
                <td><input type="text" class="grid-input col-biko" th:readonly="${!isUpdateAuthority}" th:field="*{rows[__${st.index}__].biko}"/></td>
                <td class="col-readonly" th:text="${row.createdDt != null ? #temporals.format(row.createdDt, 'yyyy/MM/dd HH:mm:ss') : ''}"></td>
                <td class="col-readonly" th:text="${row.createdBy}"></td>
                <td class="col-readonly" th:text="${row.lastupdateDt != null ? #temporals.format(row.lastupdateDt, 'yyyy/MM/dd HH:mm:ss') : ''}"></td>
                <td class="col-readonly" th:text="${row.lastupdateBy}"></td>
            </tr>
            <tr class="blank-row" th:with="bi=*{rows.size()}">
                <td class="col-select">
                    <label class="row-select-label">
                        <input type="radio" name="rowSelect" class="row-select" th:disabled="${!isUpdateAuthority}"/>
                        <span class="row-marker" aria-hidden="true"></span>
                    </label>
                    <input type="hidden" th:name="'rows[' + ${bi} + '].hoshugaishaId'" class="hoshugaisha-id-input" value=""/>
                    <input type="hidden" th:name="'rows[' + ${bi} + '].rowStatus'" class="row-status-input" value="unchanged"/>
                    <input type="hidden" th:name="'rows[' + ${bi} + '].originalLastupdateDt'" class="original-lastupdate-dt" value=""/>
                </td>
                <td class="col-required col-no"><input type="text" inputmode="numeric" class="grid-input input-right" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hyojijun'"/></td>
                <td class="col-checkbox"><input type="checkbox" class="yukou-check" th:disabled="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].yukoFlg'" value="true"/><input type="hidden" th:name="'_' + 'rows[' + ${bi} + '].yukoFlg'" value="on"/></td>
                <td class="col-required"><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshugaishaNk'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshugaishaKn'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshujigyosyoNk'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshuyubinNo'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshujusyo1Nk'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshujusyo2Nk'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshutel1No'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshutel2No'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshutel3No'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshufax1No'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshufax2No'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshusyutantosyaNk'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshuassistantNk'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshumailAddress'"/></td>
                <td><input type="text" class="grid-input" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].hoshuhomepage'"/></td>
                <td><input type="text" class="grid-input col-biko" th:readonly="${!isUpdateAuthority}" th:name="'rows[' + ${bi} + '].biko'"/></td>
                <td class="col-readonly"></td><td class="col-readonly"></td><td class="col-readonly"></td><td class="col-readonly"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="form-actions">
        <button type="button" id="btnUpdate" class="btn btn-primary" th:disabled="${!isUpdateAuthority}">登録</button>
    </div>
</form>

<!-- MCM0015Uと同じ確認ダイアログ -->
<div id="confirmDialogOverlay" class="mini-dialog-overlay">
    <div class="mini-dialog">
        <div class="mini-dialog-head">
            <span>確認</span>
            <button type="button" class="mini-close" id="confirmCloseX" aria-label="閉じる">✕</button>
        </div>
        <div class="mini-dialog-body">
            <span class="mini-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="15" fill="#1a6fd4"/>
                    <text x="16" y="23" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">?</text>
                </svg>
            </span>
            <span class="mini-msg" id="confirmMsg"></span>
        </div>
        <div class="mini-dialog-foot">
            <button type="button" id="confirmOk">OK</button>
            <button type="button" id="confirmCancel">キャンセル</button>
        </div>
    </div>
</div>

<!-- MCM0015Uと同じ入力エラー・情報ダイアログ -->
<div id="miniDialogOverlay" class="mini-dialog-overlay">
    <div class="mini-dialog">
        <div class="mini-dialog-head">
            <span id="miniDialogTitle">入力エラー</span>
            <button type="button" class="mini-close" id="miniDialogCloseX" aria-label="閉じる">✕</button>
        </div>
        <div class="mini-dialog-body">
            <span class="mini-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="15" fill="#1a6fd4"/>
                    <circle cx="16" cy="9" r="2" fill="#ffffff"/>
                    <rect x="14" y="13" width="4" height="11" rx="1" fill="#ffffff"/>
                </svg>
            </span>
            <span class="mini-msg" id="miniDialogMsg"></span>
        </div>
        <div class="mini-dialog-foot"><button type="button" id="miniDialogOk">OK</button></div>
    </div>
</div>

<script th:src="@{/js/mcm0023u.js}"></script>
</body>
</html>
