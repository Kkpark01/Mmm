<!DOCTYPE html>
<!--
  【変換元】Mcm0015uScreen.Designer.vb / Mcm0015uScreen.vb
  画面ID: MCM0015U / ブランドマスタ
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="_csrf" th:content="${_csrf != null} ? ${_csrf.token} : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title th:text="${screenTitle} + ' ' + ${screenId}">MCM0015U ブランドマスタ</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/mcm0015u.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-dialog.css}"/>
    <script th:src="@{/js/common.js}"></script>

    <style>
        .header, .toolbar, .form-actions, button, .btn, .btn-close, .mini-dialog {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        button, .btn, .btn-close { cursor: pointer; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            height: 30px; padding: 0 10px; box-sizing: border-box;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 {
            margin: 0; font-size: 18px; font-weight: bold; color: #fff;
            letter-spacing: 2px; line-height: 30px;
        }
        .header .header-left, .header .header-right { display: flex; align-items: center; }

        /* 登録ボタンを画面最下部に固定（高さを一定にして表計算の基準にする） */
        .form-actions {
            position: fixed; left: 0; right: 0; bottom: 0;
            height: 52px; box-sizing: border-box;
            padding: 8px 16px; background: #ffffff; border-top: 1px solid #e0e0e0;
            text-align: right; z-index: 10;
        }
        /* 表：画面上端(表の開始位置)から登録ボタンの上端まで、下ギリギリまで拡大
           182px = ヘッダ30 + タイトル余白 + ツールバー(行削除) 等の上部合計の実測値
           52px  = 登録ボタンバーの高さ */
        .grid-container {
            height: calc(100vh - 120px - 52px);
            overflow-y: auto; overflow-x: auto;
            border: 1px solid #d5dbdb; position: relative;
        }
        /* 備考列だけ幅指定なし＝余り吸収。他列は固定幅。ウィンドウ伸縮に備考が追従。 */
        /* width:autoでテーブル幅=列合計。100%にしないので、ある列を変えても他列は動かない。
           初期に画面いっぱいへ広げるのはJS(fitInitial)で最終列(備考)に余りを足して対応。 */
        .data-grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }

        .data-grid td.cell-selected{ background:#e0e0e0 !important; }

        .data-grid thead th {
            position: -webkit-sticky; position: sticky; top: 0; z-index: 5;
            background-color: #eef2f5;
            box-shadow: inset 0 -1px 0 #b0bec5, inset 0 1px 0 #b0bec5;
            text-align: left;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .data-grid th, .data-grid td {
            border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb;
        }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }

        .data-grid th .col-resizer {
            position: absolute; top: 0; right: 0; width: 6px; height: 100%;
            cursor: col-resize; user-select: none; z-index: 6;
        }
        .data-grid th .col-resizer:hover { background: rgba(69,63,120,.25); }
        body.col-resizing { cursor: col-resize !important; }
        body.col-resizing * { user-select: none !important; }

        .data-grid thead th,
        .data-grid td.col-select,
        .data-grid td.col-readonly {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            cursor: default;
        }
        .data-grid td { padding: 0; overflow: hidden; }
        .data-grid thead th { padding: 4px 6px; }
        .data-grid td.col-readonly { padding: 1px 6px; overflow: hidden; text-overflow: ellipsis; }
        .data-grid .grid-input {
            box-sizing: border-box; display: block; width: 100%;
            min-height: 17px; line-height: 1.7;
            border: none; margin: 0; padding: 0 4px; background: transparent;
        }
        .data-grid .grid-input:focus { outline: none; box-shadow: inset 0 0 0 1px #7eb4ea; }
        /* 選択(readonly)中はキャレットを出さない。編集中(readonly解除)のみ表示 */
        .data-grid .grid-input[readonly] { caret-color: transparent; cursor: default; }
        .data-grid .grid-input:not([readonly]) { caret-color: auto; }
        /* input-cell-fill: 入力セルは余白ゼロで入力欄がセル全面を占める */
        .data-grid tbody td:not(.col-readonly):not(.col-select) { padding: 0; }

        /* 行高を統一（入力欄・チェック・読取ぜんぶ同じ高さ・縦中央） */
        .data-grid tbody td { vertical-align: middle; padding: 0; }
        .data-grid td.col-readonly { padding: 0 6px; }
        .data-grid td.col-select {
            text-align: center; vertical-align: middle; padding: 0;
        }
        .data-grid td.col-select > * { vertical-align: middle; }
        /* チェック/ラジオを縦中央に：セルの表示高に合わせて中央寄せ */
        .data-grid td.col-select input[type="checkbox"],
        .data-grid td.col-select input[type="radio"] {
            margin: 0; display: inline-block; vertical-align: middle;
        }
        .data-grid td.col-select input[type="checkbox"],
        .data-grid td.col-select input[type="radio"] { margin: 0; vertical-align: middle; }

        .data-grid .input-right { text-align: right; }
        .data-grid .input-left  { text-align: left; }
        .data-grid .col-select { text-align: center; }

        .data-grid td.col-readonly {
            background-color: #d9d9d9; color: #333; font-size: 11px; white-space: nowrap;
        }

        .data-grid tr.row-deleted td {
            background-color: #fadbd8 !important; text-decoration: line-through; opacity: 0.6;
        }

        .data-grid thead th.col-required { color: #d32f2f; }
        .data-grid td.col-required { background-color: #e3f2fd; }
        .data-grid td.col-required .grid-input { background-color: #e3f2fd; }

        .data-grid .row-select-label { display: block; width: 100%; height: 100%; cursor: pointer; line-height: 1.7; }
        .data-grid .row-select { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
        .data-grid .row-marker::before { content: ""; display: inline-block; min-width: 1em; }
        .data-grid tr.row-active .row-marker::before { content: "\25B6"; color: #000000; font-size: 13px; }

        .data-grid tr.row-selected td { background-color: #bdbdbd !important; }
        .data-grid tr.row-selected td .grid-input { background-color: #bdbdbd !important; }
        /* セル選択（1回目クリック）：Excel風の灰色背景＋枠 */
        .data-grid td.cell-selected { background-color: #e0e0e0 !important; outline: 2px solid #7a7a7a; outline-offset: -2px; }
        .data-grid td.cell-selected .grid-input { background-color: transparent !important; }

        .data-grid input.field-error { outline: 2px solid #d32f2f; background-color: #ffebee !important; }

        .data-grid input[type="number"]::-webkit-outer-spin-button,
        .data-grid input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .data-grid input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            text-decoration: none; background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; cursor: pointer; line-height: 1.6;
        }
        .btn-close:hover  { background-color: #e5f1fb; border-color: #7eb4ea; }
        .btn-close:active { background-color: #cce4f7; border-color: #569de5; }

        .toolbar { display: flex !important; justify-content: flex-end !important; gap: 6px; }

        .mini-dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .mini-dialog {
            background: #fbfbfb; min-width: 300px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #ffffff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; font-weight: normal; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; line-height: 1;
            color: #444; cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: center; gap: 12px;
            padding: 20px 16px; background: #fbfbfb; white-space: pre-line;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; }
        .mini-dialog-body .mini-msg { color: #000000; font-size: 13px; }
        .mini-dialog-foot { padding: 10px 16px 14px; text-align: right; background: #fbfbfb; }
        .mini-dialog-foot button {
            min-width: 84px; padding: 5px 12px; font-size: 12px; margin-left: 8px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button:focus { outline: 1px solid #0078d4; outline-offset: 1px; }
    </style>
<!-- #155 BEGIN: 画面単独で反映できる固定列処理 -->
<style>
/* #155: この画面内の固定列のみ。列幅変更・追加行にも追従する。 */
#brandGrid { table-layout: fixed; }
#brandGrid thead th:nth-of-type(1), #brandGrid tbody td:nth-of-type(1) { position: sticky; left: var(--mcm-fixed-left-1, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#brandGrid thead th:nth-of-type(2), #brandGrid tbody td:nth-of-type(2) { position: sticky; left: var(--mcm-fixed-left-2, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#brandGrid thead th:nth-of-type(3), #brandGrid tbody td:nth-of-type(3) { position: sticky; left: var(--mcm-fixed-left-3, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#brandGrid thead th:nth-of-type(4), #brandGrid tbody td:nth-of-type(4) { position: sticky; left: var(--mcm-fixed-left-4, 0px); z-index: 3; background-color: #fff; overflow: hidden; }
#brandGrid thead th:nth-of-type(-n+4) { top: 0; z-index: 20; background-color: #eef2f5; }
#brandGrid tbody td.col-required:nth-of-type(-n+4) { background-color: #e3f2fd; }
#brandGrid tbody td.col-readonly:nth-of-type(-n+4), #brandGrid tbody td.readonly:nth-of-type(-n+4) { background-color: #d9d9d9; }
#brandGrid thead th:nth-of-type(4), #brandGrid tbody td:nth-of-type(4) { box-shadow: 2px 0 0 rgba(0,0,0,.08); }
#brandGrid tr.row-deleted, #brandGrid tr.row-deleted td { opacity: 1; }
</style>
<script>
/** #155: 固定列の位置を実際の列幅に追従させる。 */
(function () {
    "use strict";

    function initialize() {
        document.querySelectorAll('table[data-mcm-fixed-columns]').forEach(function (table) {
            var count = Number(table.dataset.mcmFixedColumns);
            var header = table.tHead && table.tHead.rows[0];
            if (!header || !Number.isInteger(count) || count < 1 || count > header.cells.length) return;
            var cells = Array.prototype.slice.call(header.cells, 0, count);

            function updateOffsets() {
                // 非表示の子グリッドは幅0になる。再表示時のResizeObserverで更新する。
                if (table.getBoundingClientRect().width === 0) return;
                var widths = cells.map(function (cell) { return cell.getBoundingClientRect().width; });
                var left = 0;
                widths.forEach(function (width, index) {
                    var name = '--mcm-fixed-left-' + (index + 1);
                    var value = left + 'px';
                    if (table.style.getPropertyValue(name) !== value) {
                        table.style.setProperty(name, value);
                    }
                    left += width;
                });
            }

            updateOffsets();
            // 列幅ドラッグ・初期幅調整・親子グリッドの表示切替を検知。
            // leftの更新は幅を変えないため、監視による再帰的なリサイズは発生しない。
            if (typeof ResizeObserver !== 'undefined') {
                var observer = new ResizeObserver(updateOffsets);
                observer.observe(table);
                cells.forEach(function (cell) { observer.observe(cell); });
            } else {
                // ResizeObserver非対応環境では既存の列幅変更処理を監視する。
                var colgroup = table.querySelector('colgroup');
                if (colgroup) {
                    new MutationObserver(updateOffsets).observe(colgroup, {
                        attributes: true, attributeFilter: ['style'], subtree: true
                    });
                }
            }
            window.addEventListener('resize', updateOffsets);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize, { once: true });
    } else {
        initialize();
    }
})();

</script>
<!-- #155 END -->
</head>

                </td>

                </td>
                <td class="col-required">
                    <input type="text" inputmode="numeric" class="grid-input input-right money-input" th:field="*{rows[__${st.index}__].remoteKin}" readonly/>
                </td>
                <td class="col-required">
                    <input type="text" inputmode="numeric" class="grid-input input-right money-input" th:field="*{rows[__${st.index}__].dremosKin}" readonly/>
                </td>

<script>
    (function () {
        "use strict";
        var MSG_REQUIRED = "未入力の必須項目があります。（ブランド／リモート一時導入費／DREMOS保守費／No）";

        function moneyDigits(s) { return (s == null ? "" : String(s)).replace(/[^\d-]/g, ""); }
        function formatYen(s) {
            var d = moneyDigits(s);
            if (d === "" || d === "-") return "";
            var neg = d.charAt(0) === "-"; if (neg) d = d.slice(1);
            d = d.replace(/^0+(?=\d)/, "");
            return "￥" + (neg ? "-" : "") + d.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function getReq(tr) {

        // ★数値チェック：￥・カンマを除いた上で整数かを判定（VB CPValidate NUMERIC 相当）
        function isNumericValue(v) {
            var s = String(v == null ? "" : v).trim().replace(/[,￥]/g, "");
            if (s === "") return true;
            return /^[+-]?\d+$/.test(s);
        }
        // CPValidate.xml 準拠の入力チェックルール（VB CPValidateUtility 相当）
        var LENGTH_RULES = [
            { pattern: /\.hyojijun$/,  maxLen: 6,    label: "No",                numeric: true, decimal: true },
            { pattern: /\.brandNk$/,   maxLen: 80,   label: "ブランド" },
            { pattern: /\.remoteKin$/,               label: "リモート一時導入費", numeric: true },
            { pattern: /\.dremosKin$/,               label: "DREMOS保守費",      numeric: true },
            { pattern: /\.biko$/,      maxLen: 4000, label: "備考" }
        ];
        function checkCellLength(inp) {
            if (!inp || inp.value === "") return null;
            var name = inp.name || "";
            for (var i = 0; i < LENGTH_RULES.length; i++) {
                var rule = LENGTH_RULES[i];
                if (!rule.pattern.test(name)) continue;
                // ★数字以外が入力されたらエラー（セル移動時・登録時の両方で判定される）
                if (rule.numeric && !isNumericValue(inp.value)) {
                    return rule.label + "は数値で入力してください。";
                }
                if (!rule.maxLen) return null;
                var over;
                if (rule.decimal) {
                    var num = parseFloat(String(inp.value).replace(/[,￥]/g, ""));
                    over = !isNaN(num) && Math.abs(Math.trunc(num)) >= Math.pow(10, rule.maxLen);
                } else {
                    over = inp.value.length > rule.maxLen;
                }
                return over ? rule.label + "は" + rule.maxLen + "桁以下で入力してください。" : null;
            }
            return null;
        }
        // ★編集開始前の値を記憶する（数値エラー時のロールバック用）
        function rememberPrevValue(inp) {

        // ★入力が確定できた時点で記憶をクリア（次回編集の基準を最新値にする）
        function commitPrevValue(inp) {

        //   No は元の数値へ、リモート一時導入費／DREMOS保守費は初期値の空白へ戻る。
        function revertToPrevValue(inp) {
            if (!inp) return;
            var prev = inp.getAttribute("data-prev-value");

            inp.removeAttribute("data-prev-value");

        function validateRow(tr, mark) {

            var trigger = [r.brand, r.remote, r.dremos, r.biko]; // ★備考のみの入力も必須チェック対象にする
            var anyFilled = trigger.some(function (el) { return !isEmpty(el); });
            var targets = [r.no, r.brand, r.remote, r.dremos];
            targets.forEach(function (el) { if (el) el.classList.remove("field-error"); });
            if (!anyFilled) return true;
            var missing = targets.filter(function (el) { return isEmpty(el); });
            if (missing.length > 0) { if (mark) missing.forEach(function (el) { if (el) el.classList.add("field-error"); }); return false; }
            return true;
        }
        function getMissingLabels(tr) {
            if (!tr) return [];
            var r = getReq(tr);
            if (!r.brand || !r.remote || !r.dremos) return [];
            var anyFilled = [r.brand, r.remote, r.dremos, r.biko].some(function (el) { return !isEmpty(el); });
            if (!anyFilled) return [];
            var defs = [
                { el: r.no, label: "No" },
                { el: r.brand, label: "ブランド" },
                { el: r.remote, label: "リモート一時導入費" },
                { el: r.dremos, label: "DREMOS保守費" }
            ];
            var labels = [];
            defs.forEach(function (d) { if (isEmpty(d.el)) labels.push(d.label); });
            return labels;
        }
        function buildRequiredMsg(labels) {

        function hasUnsavedChanges() {

        var activeRow = null;

        document.addEventListener("focusin", function (e) {

        function spawnBlankRow(baseTr) {
            var tbody = document.getElementById("brandTbody");

        function applyServerRows(serverRows) {

            serverRows.forEach(function (row) {
                if (!row) return;
                var tr = findRowByIndex(tbody, row.rowIndex);
                if (!tr) return;
                if (row.status === "deleted") { // 削除行は markAllRowsUnchanged で既に除去済み
                    if (tr.parentNode) tr.parentNode.removeChild(tr);
                    return;
                }
                applyRowData(tr, row);
            });
        }

        // フォームの行番号（rows[n]）から画面上の行を探す
        function findRowByIndex(tbody, rowIndex) {
            if (rowIndex === undefined || rowIndex === null) return null;
            var inp = tbody.querySelector('input[name^="rows[' + rowIndex + ']."]');
            return inp ? inp.closest("tr") : null;
        }

        // 1行分のデータを画面へ反映する
        function applyRowData(tr, row) {
            if (!tr || !row) return;

            // 読み取り専用セル（登録日時・登録者・更新日時・更新者）
            var readonlyTds = tr.querySelectorAll("td.col-readonly");
            if (readonlyTds.length >= 4) {
                readonlyTds[0].textContent = row.createdDt    || "";
                readonlyTds[1].textContent = row.createdBy    || "";
                readonlyTds[2].textContent = row.lastupdateDt || "";
                readonlyTds[3].textContent = row.lastupdateBy || "";
            }

            // 新規行に採番された brandId を反映（次回更新で「新規」と誤判定されないように）
            var idInput = tr.querySelector(".brand-id-input");
            if (idInput && row.brandId) {
                idInput.value = row.brandId;
                tr.setAttribute("data-brand-id", row.brandId);
            }

            // ★楽観ロック用の hidden を最新値に更新（続けて更新しても排他エラーにならないように）
            var orgInput = tr.querySelector('input[name$=".originalLastupdateDt"]');
            if (orgInput) orgInput.value = row.originalLastupdateDt || "";

            // No は自動採番されるため、サーバー側の確定値で更新する
            var noInput = tr.querySelector('.col-no input.grid-input');
            if (noInput && row.hyojijun !== undefined && row.hyojijun !== null) {
                noInput.value = row.hyojijun;
                noInput.removeAttribute("data-auto-no");
            }

            // 金額欄はサーバー側の確定値を￥書式で表示し直す
            setInputValue(tr, ".remoteKin", row.remoteKin, true);
            setInputValue(tr, ".dremosKin", row.dremosKin, true);
        }

        function setInputValue(tr, suffix, value, isMoney) {
            var inp = tr.querySelector('input[name$="' + suffix + '"]');
            if (!inp || value === undefined || value === null) return;
            inp.value = (isMoney && value !== "") ? formatYen(value) : value;
            inp.classList.remove("field-error");
        }

        /*
         * 【性能改善】行データをDOMから直接読み取り、JSONオブジェクトとして構築する。
         *   従来は FormData（application/x-www-form-urlencoded 形式）で送信しており、
         *   Spring MVC側のインデックス付きプロパティ（rows[0].xxx〜rows[N].xxx）の
         *   バインディングが行数に対してほぼ二乗的に遅くなっていた（211行で約36秒）。
         *   JSON化することで、サーバー側は Jackson の線形時間デシリアライズに切り替わる。
         */
        function buildRowsPayload() {
            var rows = [];
            document.querySelectorAll('#brandTbody input.row-status-input').forEach(function (statusInp) {
                var tr = statusInp.closest("tr");
                if (!tr) return;
                if (tr.classList.contains("blank-row")) return; // 未使用の末尾空行は送信しない
                function val(sel) {
                    var el = tr.querySelector(sel);
                    return el ? el.value : "";
                }
                var brandId = val('.brand-id-input');
                var status = statusInp.value;
                // removeEmptyRowsBeforeSubmit 相当：新規行かつ未入力なら送信対象から外す
                if ((brandId === "" || brandId == null) && isRowContentEmpty(tr)) return;

                var remoteKinRaw = val('input[name$=".remoteKin"]');
                var dremosKinRaw = val('input[name$=".dremosKin"]');
                rows.push({
                    rowStatus: status,
                    brandId: brandId === "" ? null : brandId,
                    originalLastupdateDt: val('input[name$=".originalLastupdateDt"]') || null,
                    hyojijun: val('.col-no input.grid-input') || null,
                    yukouFlg: val('.yukou-hidden'),
                    brandNk: val('input[name$=".brandNk"]'),
                    remoteKin: isNumericValue(remoteKinRaw) ? moneyDigits(remoteKinRaw) : remoteKinRaw,
                    dremosKin: isNumericValue(dremosKinRaw) ? moneyDigits(dremosKinRaw) : dremosKinRaw,
                    biko: val('input[name$=".biko"]')
                });
            });
            return rows;
        }

        function submitAjax() {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            var payload = { rows: buildRowsPayload() };
            var headers = { "X-Requested-With": "XMLHttpRequest", "Content-Type": "application/json" };
            var mh = document.querySelector('meta[name="_csrf_header"]');
            var mt = document.querySelector('meta[name="_csrf"]');
            if (mh && mt && mh.content && mt.content) headers[mh.content] = mt.content;

            /* 【共通プログレスインジケーター】サーバー処理中は画面全体を無効化する */
            window.McmCommon && window.McmCommon.showProgress();
            fetch(form.getAttribute("action"), { method: "POST", headers: headers, body: JSON.stringify(payload) })
            .then(function (res) {
                restoreDisabledInputs();
                if (!res.ok) {
                    return res.json().catch(function () { return null; }).then(function (data) {
                        showError((data && data.message) ? data.message : "登録に失敗しました。時間をおいて再度お試しください。");
                    });
                }
                return res.json().catch(function () { return {}; }).then(function (data) {
                    markAllRowsUnchanged();
                    // ★登録日時・登録者・更新日時・更新者はサーバー側で採番されるため、
                    //   返却されたJSONで該当セルのみ書き換える（画面は再読み込みしない）。
                    applyServerRows(data && data.rows);
                    showInfo((data && data.message) ? data.message : "登録処理が完了しました。");
                });
            }).catch(function () {
                restoreDisabledInputs();
                showError("通信エラーが発生しました。時間をおいて再度お試しください。");
            }).finally(function () {
                window.McmCommon && window.McmCommon.hideProgress();
            });
        }

        var btnDeleteRow = document.getElementById("btnDeleteRow");
        if (btnDeleteRow) {
            btnDeleteRow.addEventListener("click", function (e) {
                e.stopImmediatePropagation(); e.preventDefault();
                var tbody = document.getElementById("brandTbody");
                var selected = tbody ? tbody.querySelector(".row-select:checked") : null;
                if (!selected) { showError("行が選択されていません。"); return; }
                var trDel = selected.closest("tr");
                if (!trDel) { showError("行が選択されていません。"); return; }
                // ★実際に行を隠す処理（確認OK後に実行）
                function doDelete() {
                    showConfirm("選択した行を削除します。よろしいですか？", function () {
                        var st = trDel.querySelector(".row-status-input");
                        var status = st ? st.value : "unchanged";
                        if (status === "new" || trDel.classList.contains("blank-row")) {
                            trDel.parentNode.removeChild(trDel);
                        } else if (st) {
                            st.value = "deleted"; trDel.style.display = "none"; trDel.classList.add("row-deleted");
                        }
                    });
                }

                // ★新規行（未登録）はブランド構成から参照され得ないので即削除
                var stChk = trDel.querySelector(".row-status-input");
                var idEl  = trDel.querySelector(".brand-id-input");
                var idVal = idEl ? idEl.value : "";
                var isNewRow = trDel.classList.contains("blank-row")
                            || (stChk && stChk.value === "new")
                            || idVal === "" || Number(idVal) <= 0;
                if (isNewRow) { doDelete(); return; }

                // ★既存行はサーバーへ使用中かを問い合わせ、使用中ならエラーを出して中断する
                //   URLは form action（例 /mcm0015u/update）から組み立てる。
                //   相対パスだとページURL次第で /deletable 等に化けるため。
                var actUrl = form.getAttribute("action");
                var baseUrl = actUrl.replace(/\/update(\?.*)?$/, "");
                fetch(baseUrl + "/deletable?brandId=" + encodeURIComponent(idVal), {
                    headers: { "X-Requested-With": "XMLHttpRequest" }
                })
                .then(function (res) {
                    if (!res.ok) { throw new Error("deletable API status " + res.status); }
                    return res.json();
                })
                .then(function (data) {
                    if (!data || typeof data.deletable === "undefined") {
                        throw new Error("deletable API invalid response");
                    }
                    if (data.deletable === false) {
                        showError(data.message || "既に使用されている為、削除する事が出来ません。", { title: "削除エラー", icon: "warn" });
                        return;
                    }
                    doDelete();
                })
                .catch(function (err) {
                    // ★判定できない場合は削除させない（安全側に倒す）。
                    //   ここで削除を通すと、使用中の行が消えてしまうため。
                    showError("削除可否を確認できませんでした。時間をおいて再度お試しください。", { title: "削除エラー", icon: "warn" });
                });
            }, true);
        }

        var btnCloseLink = document.getElementById("btnCloseLink");
        if (btnCloseLink) {
            btnCloseLink.addEventListener("click", function (e) {
                if (hasUnsavedChanges()) {
                    e.preventDefault();
                    var href = btnCloseLink.getAttribute("href");
                    showConfirm("データが変更されています。破棄されますがよろしいですか？", function () {
                        window.location.href = href;
                    });
                }
            });
        }

        // ============ 列幅リサイズ（掴んだ列だけpx変更／備考が調整役・ウィンドウ追従）============
        (function setupColumnResize() {
            var table = document.getElementById("brandGrid");
            if (!table) return;
            var container = table.parentElement; // .grid-container
            var cols = table.querySelectorAll("colgroup col");

            function pxOf(col) {
                var w = parseFloat(col.style.width);
                if (!isNaN(w)) return w;
                return col.getBoundingClientRect().width;
            }
            // 初期の列幅（colgroupのwidth）を控える＝リセット基準
            var baseWidths = [];
            cols.forEach(function (c) { baseWidths.push(Math.round(pxOf(c))); });
            var widths = baseWidths.slice();

            function applyWidths() {
                var total = 0;
                widths.forEach(function (w, i) { cols[i].style.width = w + "px"; total += w; });
                table.style.width = total + "px";
            }

            // 初期基準に戻し、コンテナ幅に満たなければ余りを備考(index6)に足して画面いっぱいに
            function fitInitial() {
                widths = baseWidths.slice();          // ★初期サイズに戻す
                var avail = container.clientWidth - 2;
                var total = widths.reduce(function (a, b) { return a + b; }, 0);
                if (total < avail) { widths[6] += (avail - total); }
                applyWidths();
            }
            fitInitial();
            table.style.visibility = "visible"; // ★列幅確定後に表示（初期チラつき防止）

            // ★ウィンドウをリサイズしたら、列幅を初期サイズに戻して再フィット
            var rzTimer = null;
            window.addEventListener("resize", function () {
                if (rzTimer) clearTimeout(rzTimer);
                rzTimer = setTimeout(fitInitial, 100);
            });

            var ths = table.querySelectorAll("thead th");
            ths.forEach(function (th, idx) {
                var handle = document.createElement("span");
                handle.className = "col-resizer";
                th.appendChild(handle);
                var startX = 0, startW = 0;
                function onMove(ev) {
                    var x = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    widths[idx] = Math.max(40, Math.round(startW + (x - startX)));
                    applyWidths();
                }
                function onUp() {
                    document.removeEventListener("mousemove", onMove);
                    document.removeEventListener("mouseup", onUp);
                    document.removeEventListener("touchmove", onMove);
                    document.removeEventListener("touchend", onUp);
                    document.body.classList.remove("col-resizing");
                }
                function onDown(ev) {
                    ev.preventDefault(); ev.stopPropagation();
                    startX = ev.touches ? ev.touches[0].clientX : ev.clientX;
                    startW = widths[idx];
                    document.body.classList.add("col-resizing");
                    document.addEventListener("mousemove", onMove);
                    document.addEventListener("mouseup", onUp);
                    document.addEventListener("touchmove", onMove, { passive: false });
                    document.addEventListener("touchend", onUp);
                }
                handle.addEventListener("mousedown", onDown);
                handle.addEventListener("touchstart", onDown, { passive: false });
            });
        })();


        // ====== Excel風：選択/編集。選択セルで文字キー→上書き編集。矢印で移動 ======
        (function twoClickEdit(){
            var tbody=document.getElementById("brandTbody");
            if(!tbody) return;
            var selTd=null;      // 選択中td(灰)
            var lastRow=null;    // 最後に触った行（編集後もselTdはnullになるため独立保持）
            var editing=null;    // 編集中input

            function clearSel(){
                tbody.querySelectorAll("td.cell-selected").forEach(function(td){td.classList.remove("cell-selected");});
                selTd=null;
            }
            function stopEdit(){
                if(editing){ try{editing.blur();}catch(e){} editing=null; }
                tbody.querySelectorAll(".grid-input").forEach(function(i){ i.setAttribute("readonly","readonly"); });
                try{ var sel=window.getSelection(); if(sel) sel.removeAllRanges(); }catch(e){}  // ★全選択(ハイライト)を消す
            }
            function assignNoForRow(tr){
                if(!tr) return;
                var st=tr.querySelector(".row-status-input");
                var isNew=tr.classList.contains("blank-row")||(st&&st.value==="new");
                var noInput=tr.querySelector('.col-no input.grid-input');
                if(!isNew||!noInput||noInput.value!=="") return;
                var prev=tr.previousElementSibling;
                while(prev){ var pno=prev.querySelector('.col-no input.grid-input');
                    if(pno&&pno.value!==""){ var v=parseInt(pno.value,10); if(!isNaN(v)){ noInput.value=v+1; break; } }
                    prev=prev.previousElementSibling; }
                if(noInput.value==="") noInput.value=1;
                noInput.setAttribute("data-auto-no","1");
            }
            // ★桁数・文字数エラーを探すヘルパー（行/セルどちらのスコープでも使用可）
            function firstLengthErrorIn(scope){
                if(!scope || typeof checkCellLength !== "function") return null;
                var found = null;
                scope.querySelectorAll(".grid-input").forEach(function(inp){
                    if(found || !inp.name) return;
                    var msg = checkCellLength(inp);
                    if(msg){ inp.classList.add("field-error"); found = { msg: msg, inp: inp }; }
                });
                return found;
            }
            function selectTd(td){
                if(!td) return;
                var newTr = td.closest("tr");
                // ★他の行を選択する時、前に触った行に「一部入力あり＆必須未入力」があればエラーで選択を止める
                if(lastRow && newTr && lastRow!==newTr && document.body.contains(lastRow) && typeof validateRow==="function"){
                    if(!validateRow(lastRow, true)){
                        showError(buildRequiredMsg(getMissingLabels(lastRow)));
                        var fm=lastRow.querySelector(".field-error");
                        if(fm){ try{fm.removeAttribute("readonly"); fm.focus({preventScroll:true});}catch(e){} }
                        return; // 選択を切り替えない
                    }
                }
                // ★桁数・文字数チェック（セル移動時、VB CPValidate 相当）
                var lenScope = (lastRow && newTr && lastRow !== newTr) ? lastRow
                             : (selTd || (editing ? editing.closest("td") : null));
                if(lenScope && lenScope !== td && document.body.contains(lenScope)){
                    var lenErr = firstLengthErrorIn(lenScope);
                    if(lenErr){
                        showError(lenErr.msg);
                        revertToPrevValue(lenErr.inp);   // ★入力される一つ前の状態に戻す
                        stopEdit(); clearSel();          // 戻した後はエラー欄に留まらず選択解除
                    } else { lenScope.querySelectorAll(".grid-input").forEach(commitPrevValue); }
                }
                clearSelectedHighlight();   // 左端▶以外を触ったら行選択(グレー)を解除
                stopEdit(); clearSel();
                selTd=td; td.classList.add("cell-selected");
                var tr=td.closest("tr");
                // 前に触った新規行が「No以外空」なら No を消す
                if(lastRow && lastRow!==tr){ clearAutoNoIfUntouched(lastRow); }
                lastRow=tr;   // 最後に触った行を更新
                // 新規行を選択したら No を自動採番
                assignNoForRow(tr);
                // ▶を選択行に表示
                if(typeof setActiveRow==="function") setActiveRow(tr);
            }
            // 編集開始。typedChar があればその文字で上書き開始
            function startEdit(td, typedChar){
                if(!td) return;
                var inp=td.querySelector(".grid-input"); if(!inp) return;
                rememberPrevValue(inp);     // ★編集前の値を記憶（数値エラー時はここへ戻す）
                lastRow=td.closest("tr");   // 編集した行を記録
                clearSelectedHighlight();   // 左端▶以外を触ったら行選択(グレー)を解除
                clearSel();
                inp.removeAttribute("readonly"); editing=inp;
                if(typedChar!=null){
                    inp.value=typedChar;   // ★打った文字で上書き
                    // JSでvalueを変えてもinputイベントは発火しないため手動発火（新規行の昇格/追加を動かす）
                    try{ inp.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
                }
                setTimeout(function(){
                    inp.focus({preventScroll:true});
                    if(typedChar!=null){
                        // 末尾にキャレット
                        var L=inp.value.length; try{inp.setSelectionRange(L,L);}catch(e){}
                    }else{
                        if(inp.type!=="checkbox"&&inp.type!=="radio"){ try{inp.select();}catch(e){} }
                    }
                },0);
            }
            function isCellTd(td){ return td && td.querySelector && (td.querySelector(".grid-input") || td.querySelector(".yukou-check")); }

            // クリック：1回目=選択(フォーカスしない) / 2回目=編集
            // === ROW-DESELECT-GUARD ===
            // 左端▶(row-select-label)以外を押したら「行選択グレー」を解除する。
            // 入力欄(.grid-input)を持たないセル(readonly列/チェック列/▶列)を押したら「セル選択グレー」も解除する。
            // キャプチャフェーズなので、2クリック編集の mousedown や必須チェックの early return より先に走る。
            function deselectRowOnOtherClick(e){
                var t = e.target;
                if(!t || typeof t.closest !== "function") return;
                var onMarker = t.closest(".row-select-label") || t.closest(".row-select");
                if(!onMarker) clearSelectedHighlight();                 // ▶以外 → 行選択グレーを解除
                if(onMarker || !(t.closest(".grid-input")||t.closest(".yukou-check"))){
                    stopEdit(); clearSel();                        // 入力欄の無いセル/▶列 → セル選択グレーも解除
                }
            }
            tbody.addEventListener("mousedown", deselectRowOnOtherClick, true);
            tbody.addEventListener("click", deselectRowOnOtherClick, true);
            // === /ROW-DESELECT-GUARD ===
            tbody.addEventListener("mousedown", function(e){
                var inp=e.target.closest(".grid-input")||e.target.closest(".yukou-check"); if(!inp) return;
                var td=inp.closest("td");
                if(inp===editing) return;
                e.preventDefault();                 // フォーカス当てない＝勝手に編集不可
                if(inp.classList.contains("yukou-check")){ selectTd(td); return; }   // チェック列は選択のみ（切替はSpaceキー）
                if(td===selTd){ startEdit(td); } else { selectTd(td); }
            });

            document.addEventListener("keydown", function(e){
                if(editing){
                    if(e.key==="Escape"){ var t=editing.closest("td"); stopEdit(); selectTd(t); }
                    if(e.key==="Enter"){
                        var t2=editing.closest("td"); var ci2=Array.prototype.indexOf.call(t2.parentElement.children,t2);
                        stopEdit();
                        var nr=t2.parentElement.nextElementSibling;
                        while(nr && !(nr.children[ci2] && nr.children[ci2].querySelector && nr.children[ci2].querySelector(".grid-input"))) nr=nr.nextElementSibling;
                        if(nr){ selectTd(nr.children[ci2]); nr.children[ci2].scrollIntoView({block:"nearest"}); }
                        else { selectTd(t2); }
                        e.preventDefault();
                    }
                    return;
                }
                if(!selTd) return;
                var tr=selTd.parentElement;
                var tds=Array.prototype.slice.call(tr.children);
                var ci=tds.indexOf(selTd);
                var target=null;

                if(e.key==="ArrowDown"){ var nr=tr.nextElementSibling; while(nr && !isCellTd(nr.children[ci])) nr=nr.nextElementSibling; if(nr) target=nr.children[ci]; }
                else if(e.key==="ArrowUp"){ var pr=tr.previousElementSibling; while(pr && !isCellTd(pr.children[ci])) pr=pr.previousElementSibling; if(pr) target=pr.children[ci]; }
                else if(e.key==="ArrowRight"){ for(var j=ci+1;j<tds.length;j++){ if(isCellTd(tds[j])){ target=tds[j]; break; } } }
                else if(e.key==="ArrowLeft"){ for(var k=ci-1;k>=0;k--){ if(isCellTd(tds[k])){ target=tds[k]; break; } } }
                // ★チェックボックスセル：SpaceキーでチェックON/OFF（Excel準拠）
                var chk = selTd.querySelector(".yukou-check");
                if(chk){
                    if(e.key===" "||e.key==="Spacebar"||e.code==="Space"){
                        e.preventDefault();
                        if(chk.disabled) return;
                        chk.checked = !chk.checked;
                        try{ chk.dispatchEvent(new Event("change",{bubbles:true})); }catch(ev){}
                        return;
                    }
                    // チェック列では編集開始・文字入力を行わない（矢印キー移動のみ許可）
                    if(e.key==="Enter"||e.key==="F2"||e.key==="Backspace"||e.key==="Delete"||
                       (e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey)){
                        e.preventDefault(); return;
                    }
                }
                if(e.key==="Enter"||e.key==="F2"){ startEdit(selTd); e.preventDefault(); return; }
                else if(e.key==="Backspace"||e.key==="Delete"){ startEdit(selTd,""); e.preventDefault(); return; }
                else if(e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){
                    // ★選択セルで文字キー→その文字で上書き編集開始
                    startEdit(selTd, e.key); e.preventDefault(); return;
                }

                if(target){ e.preventDefault(); selectTd(target); target.scrollIntoView({block:"nearest",inline:"nearest"}); }
            });

            document.addEventListener("mousedown", function(e){
                if(!e.target.closest("#brandTbody")){ stopEdit(); clearSel(); }
            });
        })();

        applyYenAll();
    })();
</script>
