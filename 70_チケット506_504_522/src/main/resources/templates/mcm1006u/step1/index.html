<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取引先契約機器設定（MCM1006U1）</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/mcm-customer-screens.css}">
<link rel="stylesheet" th:href="@{/css/mcm-notifications.css}">
<link rel="stylesheet" th:href="@{/css/mcm1006u.css(v=20260930-50)}">
<script defer th:src="@{/js/mcm-notifications.js}"></script>
<script defer th:src="@{/js/mcm1006u.js(v=20260929-44)}"></script>
</head><body class="mcm-customer-screen mcm1006u">
<header class="header"><div class="header-left"></div><h1>取引先契約機器設定（MCM1006U1）</h1>
<a class="btn btn-close" th:href="@{/mcm1006u/close}">閉じる</a></header>
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
<form id="step1Form" class="screen-form" th:action="@{/mcm1006u/step1/next}" method="post"><input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf.token}"><section class="contract-info" aria-label="契約情報">
<label class="info-label">納入先コード</label><span class="info-code" th:text="${form.nonyusakiCd}"></span><span></span><span class="info-name" th:text="${form.nonyusakiNk}"></span>
<label class="info-label">サポートID</label><span class="info-code" th:text="${form.supportId}"></span><label>プラント名</label><span class="info-name" th:text="${form.plantNk}"></span>
<label class="info-label">契約NO</label><span class="info-code" th:text="${form.keiyakuNo}"></span><label for="kaisiDt">期間</label><div class="contract-dates">
<input type="text" id="kaisiDt" name="kaisiDt" aria-label="開始日" placeholder="yyyy/MM/dd" th:value="${form.kaisiDt}" th:readonly="${kaisiReadonly or !canUpdate}" maxlength="10"><span>～</span><input type="text" id="syuryoDt" name="syuryoDt" aria-label="終了日" placeholder="yyyy/MM/dd" th:value="${form.syuryoDt}" th:readonly="${!canUpdate}" maxlength="10">
</div>
<label class="info-label">取引先コード</label><span class="info-code" th:text="${form.torihikisakiCd}"></span><label class="info-label">取引先名</label><span class="info-name" th:text="${form.torihikisakiNk}"></span>
</section><div class="screen-grids"><section class="grid-section grid-top-left"><h2>≪見積情報≫</h2><div class="grid-container mcm-grid"><table id="mitsumoriGrid" class="data-grid" aria-label="≪見積情報≫"><colgroup><col style="width:26px"><col style="width:40px"><col style="width:110px"><col style="width:60px"><col style="width:90px"><col style="width:80px"><col style="width:110px"><col style="width:110px"></colgroup><thead><tr><th class="row-pointer" aria-label="行選択"></th><th scope="col"></th><th scope="col">見積依頼NO</th><th scope="col">時間</th><th scope="col">保守方法</th><th scope="col">点検</th><th scope="col">点検可能曜日</th><th scope="col">点検夜間対応</th></tr></thead><tbody><tr th:each="row,stat : ${form.mitsumoriRows}" th:id="|mitsumoriRow_${stat.index}|" th:attr="data-keiyakujikan-id=${row.tmKeiyakujikanId}"><td class="row-pointer" aria-label="行選択"><span aria-hidden="true">▶</span></td><td class="col-check"><input type="checkbox" th:name="|mitsumoriRows[${stat.index}].checkFlg|" value="1" th:checked="${row.checkFlg == 1}" th:disabled="${!canUpdate or !(true)}" aria-label="選定"></td><td class="" th:text="${row.tmIraiNo}" th:title="${row.tmIraiNo}"></td><td class="" th:text="${row.keiyakujikantai}" th:title="${row.keiyakujikantai}"></td><td class="" th:text="${step1Labels[stat.index]['HOSYUHOHO_LABEL']}" th:title="${step1Labels[stat.index]['HOSYUHOHO_LABEL']}"></td><td class="" th:text="${step1Labels[stat.index]['TENKENUMU_LABEL']}" th:title="${step1Labels[stat.index]['TENKENUMU_LABEL']}"></td><td class="" th:text="${step1Labels[stat.index]['YOBI_LABEL']}" th:title="${step1Labels[stat.index]['YOBI_LABEL']}"></td><td class="" th:text="${step1Labels[stat.index]['YAKAN_LABEL']}" th:title="${step1Labels[stat.index]['YAKAN_LABEL']}"></td></tr><tr class="empty-row" hidden><td colspan="8">データがありません</td></tr></tbody></table></div></section><section class="grid-section grid-top-right"><h2>≪見積期間≫</h2><div class="grid-container mcm-grid"><table id="kikanGrid" class="data-grid" aria-label="≪見積期間≫"><colgroup><col style="width:26px"><col style="width:110px"><col style="width:85px"><col style="width:85px"><col style="width:110px"><col style="width:110px"><col style="width:100px"><col style="width:120px"></colgroup><thead><tr><th class="row-pointer" aria-label="行選択"></th><th scope="col">見積NO</th><th scope="col">開始日</th><th scope="col">終了日</th><th scope="col">標準価格合計</th><th scope="col">仕切り価格小計</th><th scope="col">出精値引き</th><th scope="col">仕切り価格合計</th></tr></thead><tbody><tr th:each="row,stat : ${step1KikanRows}" th:id="|kikanRow_${stat.index}|" th:attr="data-keiyakujikan-id=${row['TM_KEIYAKUJIKAN_ID']},data-kikan-id=${row['TM_KIKAN_ID']}"><td class="row-pointer" aria-label="行選択"><span aria-hidden="true">▶</span></td><td class="" th:text="${row['TM_MITSUMORI_NO']}" th:title="${row['TM_MITSUMORI_NO']}"></td><td class="" th:text="${row['KAISI_DT']}" th:title="${row['KAISI_DT']}"></td><td class="" th:text="${row['SYURYO_DT']}" th:title="${row['SYURYO_DT']}"></td><td class="amount" th:text="${row['HYOJUNGOKEI_KIN'] == null ? '' : '¥' + #numbers.formatDecimal(row['HYOJUNGOKEI_KIN'], 1, 'COMMA', 0, 'POINT')}"></td><td class="amount" th:text="${row['SIKIRISYOKEI_KIN'] == null ? '' : '¥' + #numbers.formatDecimal(row['SIKIRISYOKEI_KIN'], 1, 'COMMA', 0, 'POINT')}"></td><td class="amount" th:text="${row['SYUSSEINEBIKI_KIN'] == null ? '' : '¥' + #numbers.formatDecimal(row['SYUSSEINEBIKI_KIN'], 1, 'COMMA', 0, 'POINT')}"></td><td class="amount" th:text="${row['SIKIRIGOKEI_KIN'] == null ? '' : '¥' + #numbers.formatDecimal(row['SIKIRIGOKEI_KIN'], 1, 'COMMA', 0, 'POINT')}"></td></tr><tr class="empty-row" hidden><td colspan="8">データがありません</td></tr></tbody></table></div></section><section class="grid-section grid-bottom"><h2>≪機器構成明細≫</h2><div class="grid-container mcm-grid"><table id="tankaGrid" class="data-grid" aria-label="≪機器構成明細≫"><colgroup><col style="width:26px"><col style="width:110px"><col style="width:100px"><col style="width:110px"><col style="width:120px"><col style="width:110px"><col style="width:60px"><col style="width:100px"><col style="width:100px"><col style="width:75px"><col style="width:130px"><col style="width:110px"><col style="width:200px"><col style="width:80px"><col style="width:90px"><col style="width:140px"><col style="width:150px"></colgroup><thead><tr><th class="row-pointer" aria-label="行選択"></th><th scope="col">機器構成名</th><th scope="col">手配製番</th><th scope="col">製造メーカー</th><th scope="col">品名</th><th scope="col">型式</th><th scope="col">数量</th><th scope="col">標準価格</th><th scope="col">仕切り価格</th><th scope="col">パック契約</th><th scope="col">契約内容</th><th scope="col">契約番号</th><th scope="col">保守契約時間</th><th scope="col">点検</th><th scope="col">保守方法</th><th scope="col">サービス形態</th><th scope="col">備考</th></tr></thead><tbody><tr th:each="row,stat : ${step1TankaRows}" th:id="|tankaRow_${stat.index}|" th:attr="data-kikan-id=${row['TM_KIKAN_ID']}"><td class="row-pointer" aria-label="行選択"><span aria-hidden="true">▶</span></td><td class="" th:text="${row['KIKIKOSEI_NK']}" th:title="${row['KIKIKOSEI_NK']}"></td><td class="" th:text="${row['TEHAISEIBAN']}" th:title="${row['TEHAISEIBAN']}"></td><td class="" th:text="${row['SEIZOMAKER_NK']}" th:title="${row['SEIZOMAKER_NK']}"></td><td class="" th:text="${row['KIKIHINMEI_NK']}" th:title="${row['KIKIHINMEI_NK']}"></td><td class="" th:text="${row['KIKIKATASHIKI']}" th:title="${row['KIKIKATASHIKI']}"></td><td class="" th:text="${row['SURYO_NM']}" th:title="${row['SURYO_NM']}"></td><td class="amount" th:text="${row['HYOJUN_KIN'] == null ? '' : '¥' + #numbers.formatDecimal(row['HYOJUN_KIN'], 1, 'COMMA', 0, 'POINT')}"></td><td class="amount" th:text="${row['SIKIRI_KIN'] == null ? '' : '¥' + #numbers.formatDecimal(row['SIKIRI_KIN'], 1, 'COMMA', 0, 'POINT')}"></td><td class="col-check"><input type="checkbox" disabled aria-label="パック契約" th:checked="${row['PACK_FLG'] != null and row['PACK_FLG'] == 1}"></td><td class="" th:text="${row['KEIYAKUNAIYO']}" th:title="${row['KEIYAKUNAIYO']}"></td><td class="" th:text="${row['KEIYAKU_NO']}" th:title="${row['KEIYAKU_NO']}"></td><td class="" th:text="${row['TORIHOSYUJIKAN_LABEL']}" th:title="${row['TORIHOSYUJIKAN_LABEL']}"></td><td class="" th:text="${row['TENKENUMU_LABEL']}" th:title="${row['TENKENUMU_LABEL']}"></td><td class="" th:text="${row['HOSYUHOHO_LABEL']}" th:title="${row['HOSYUHOHO_LABEL']}"></td><td class="" th:text="${row['SERVICEKEITAI_LABEL']}" th:title="${row['SERVICEKEITAI_LABEL']}"></td><td class="" th:text="${row['TMF_BIKO']}" th:title="${row['TMF_BIKO']}"></td></tr><tr class="empty-row" hidden><td colspan="17">データがありません</td></tr></tbody></table></div></section></div><footer class="toolbar"><button type="submit" class="btn btn-next" th:disabled="${!canUpdate}">次へ</button></footer></form></body></html>
