<!DOCTYPE html>
<!--
  【変換元】Mcm2008uScreen.Designer.vb / Mcm2008uScreen.vb
  MCM2008U — 審査・承認（店舗見積）
  【デザイン参照】MCM1011U（紫帯ヘッダー / data-grid / カスタムダイアログ）
-->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf"        th:content="${_csrf != null} ? ${_csrf.token}      : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM2008U - 審査・承認（店舗見積）</title>
    <style>
        /* ===== 共通レイアウト (MCM1011U 準拠) ===== */
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 8px; font-family: initial; font-size: 12px; background: #fff; }
        button, .btn, .btn-close { cursor: pointer; -webkit-user-select: none; user-select: none; }

        /* メニュー・MCM0015U/MCM0017Uと同じ帯の高さ・タイトル書体・余白 */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #453f78; color: #fff;
            min-height: 40px; padding: 0 10px;
        }
        .header .header-center { flex: 1; text-align: center; }
        .header .header-center h1 {
            margin: 0; font-size: 18px; font-weight: bold; color: #fff;
            letter-spacing: 2px; line-height: 30px;
        }
        .header .header-left, .header .header-right { display: flex; align-items: center; }
        .btn-close {
            display: inline-block; padding: 2px 12px; font-size: 12px; color: #000;
            background-color: #f0f0f0; border: 1px solid #adadad;
            border-radius: 2px; box-shadow: inset 0 1px 0 #fff; line-height: 1.6; text-decoration: none;
        }
        .btn-close:hover  { background-color: #e5f1fb; border-color: #7eb4ea; }

        /* 検索エリア */
        .search-area {
            padding: 6px 10px 4px;
            border-bottom: 1px solid #ccc;
            background: #f7f7f7;
        }
        .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
        .search-row label { white-space: nowrap; font-size: 12px; }
        .search-row input[type="text"] {
            height: 22px; border: 1px solid #aaa; padding: 0 4px; font-size: 12px; border-radius: 2px;
        }
        .search-row input[type="text"]:focus { outline: 1px solid #7eb4ea; border-color: #7eb4ea; }
        .input-sm  { width: 100px; }
        .input-md  { width: 160px; }
        .input-lg  { width: 220px; }
        .chk-group { display: flex; align-items: center; gap: 8px; }
        .chk-group label { display: flex; align-items: center; gap: 3px; cursor: pointer; }

        /* アクションバー */
        .action-bar {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 10px;
            border-bottom: 1px solid #ccc;
            background: #f0f0f0;
        }
        .btn-primary {
            padding: 3px 14px; font-size: 12px;
            background: #0078d4; color: #fff; border: 1px solid #0067b8; border-radius: 2px;
        }
        .btn-primary:hover { background: #0067b8; }
        .btn-warning {
            padding: 3px 14px; font-size: 12px;
            background: #d08000; color: #fff; border: 1px solid #b57000; border-radius: 2px;
        }
        .btn-warning:hover { background: #b57000; }
        .btn-search {
            padding: 3px 14px; font-size: 12px;
            background: #e1e1e1; color: #000; border: 1px solid #adadad; border-radius: 2px;
        }
        .btn-search:hover { background: #e5f1fb; border-color: #0078d4; }

        /* グリッド */
        .grid-wrap {
            /* タイトル帯+10px、上下余白+16pxを差し引き、下部領域を維持 */
            height: calc(100vh - 336px);
            overflow: auto;
            border-bottom: 1px solid #ccc;
        }
        .data-grid {
            border-collapse: separate; border-spacing: 0;
            table-layout: fixed; font-size: 12px; white-space: nowrap; width: max-content; min-width: 100%;
        }
        .data-grid thead th {
            position: sticky; top: 0; z-index: 5;
            background: #eef2f5;
            border-right: 1px solid #b0bec5; border-bottom: 2px solid #b0bec5;
            padding: 4px 6px; text-align: left; font-size: 12px;
        }
        .data-grid th:first-child, .data-grid td:first-child { border-left: 1px solid #d5dbdb; }
        .data-grid td {
            border-right: 1px solid #d5dbdb; border-bottom: 1px solid #d5dbdb;
            padding: 2px 6px; vertical-align: middle; height: 22px; line-height: 18px;
            overflow: hidden; text-overflow: ellipsis;
        }
        .data-grid td.col-chk { text-align: center; padding: 0; width: 28px; }
        .data-grid td.col-chk input[type="checkbox"] { margin: 0; vertical-align: middle; }
        .data-grid tbody tr:hover td { background: #f5f5f5; }
        .data-grid tbody tr.row-selected td { background: #bdbdbd !important; }
        .data-grid td a { color: #0078d4; text-decoration: none; }
        .data-grid td a:hover { text-decoration: underline; }

        /* 承認状態バッジ */
        .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
        .badge-shinsachu   { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
        .badge-shoninchu   { background: #cfe2ff; color: #084298; border: 1px solid #9ec5fe; }
        .badge-shoninzumi  { background: #d1e7dd; color: #0f5132; border: 1px solid #a3cfbb; }
        .badge-sashimodoshi { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }

        /* 詳細パネル（添付ファイル / 取引先見積関連） */
        .detail-panels {
            display: flex;
            border-top: 1px solid #ccc;
            background: #fafafa;
            min-height: 90px;
            max-height: 130px;
        }
        .detail-panel {
            flex: 1;
            padding: 5px 10px;
            overflow: auto;
        }
        .detail-panel + .detail-panel {
            border-left: 1px solid #ccc;
        }
        .panel-title {
            font-size: 12px; font-weight: bold; margin-bottom: 3px; color: #555;
        }
        .sub-table { border-collapse: collapse; font-size: 12px; }
        .sub-table th, .sub-table td { border: 1px solid #ccc; padding: 2px 6px; }
        .sub-table th { background: #eef2f5; }
        .sub-table td a { color: #0078d4; text-decoration: none; }
        .sub-table td a:hover { text-decoration: underline; }

        /* カスタムダイアログ (MCM1011U 準拠) */
        .mini-dialog-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.25);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .mini-dialog-overlay.active { display: flex; }
        .mini-dialog {
            background: #fbfbfb; min-width: 320px; max-width: 90%;
            border: 1px solid #7a7a7a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
        }
        .mini-dialog-head {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; color: #000; padding: 6px 8px 6px 12px;
            font-size: 12px; border-bottom: 1px solid #e5e5e5;
        }
        .mini-dialog-head .mini-close {
            border: none; background: transparent; font-size: 15px; color: #444;
            cursor: pointer; padding: 2px 6px; border-radius: 3px;
        }
        .mini-dialog-head .mini-close:hover { background: #e81123; color: #fff; }
        .mini-dialog-body {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 16px; background: #fbfbfb; white-space: pre-line; font-size: 13px;
        }
        .mini-dialog-body .mini-icon { flex: 0 0 auto; font-size: 22px; }
        .mini-dialog-foot { padding: 10px 16px 14px; text-align: right; background: #fbfbfb; display: flex; justify-content: flex-end; gap: 6px; }
        .mini-dialog-foot button {
            min-width: 72px; padding: 4px 12px; font-size: 12px;
            background: #e1e1e1; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
        }
        .mini-dialog-foot button:hover { background: #e5f1fb; border-color: #0078d4; }
        .mini-dialog-foot button.btn-ok {
            background: #0078d4; color: #fff; border-color: #0067b8;
        }
        .mini-dialog-foot button.btn-ok:hover { background: #0067b8; }
    </style>
    <script th:src="@{/js/common.js}"></script>
</head>
<body>

<!-- サーバーメッセージ（JS で showServerMessageOnce() により表示） -->
<div id="serverMessageData" hidden
     th:attr="data-message=${message},data-error=${error}"></div>

<!-- ===== ヘッダー ===== -->
<div class="header">
    <div class="header-left"></div>
    <div class="header-center"><h1>審査・承認（店舗見積）（MCM2008U）</h1></div>
    <div class="header-right">
        <a class="btn-close" th:href="@{/menu}" href="/mcm/menu">閉じる</a>
    </div>
</div>

<!-- ===== 検索条件フォーム ===== -->
<form th:action="@{/mcm2008u/search}" th:object="${form}" method="post" class="search-area">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="search-row">
        <label>納入先コード:</label>
        <input type="text" th:field="*{nonyusakiCd}" class="input-sm" placeholder="前方一致"/>

        <label>納入先名:</label>
        <input type="text" th:field="*{nonyusakiNk}" class="input-lg" placeholder="部分一致"/>

        <label>サポートID:</label>
        <input type="text" th:field="*{supportId}" class="input-sm" placeholder="部分一致"/>

        <label>プラント名:</label>
        <input type="text" th:field="*{plantNk}" class="input-md" placeholder="部分一致"/>
    </div>

    <div class="search-row">
        <label>承認状態:</label>
        <div class="chk-group">
            <label><input type="checkbox" th:field="*{shinsachu}"/>審査中</label>
            <label><input type="checkbox" th:field="*{shoninchu}"/>承認中</label>
            <label><input type="checkbox" th:field="*{shoninzumi}"/>承認済</label>
            <label><input type="checkbox" th:field="*{sashimodoshi}"/>差戻中</label>
        </div>
        <button type="submit" class="btn-search">検索</button>
    </div>
</form>

<!-- ===== 承認/差戻し アクションフォーム ===== -->
<form id="actionForm" method="post" th:action="@{/mcm2008u/approve}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="action-bar">
        <button type="button" class="btn-primary" onclick="doApprove()">承認</button>
        <button type="button" class="btn-warning" onclick="doReject()">差戻し</button>
        <span style="margin-left:10px; color:#555;">
            <span th:if="${form.mitsumoriRows != null and !form.mitsumoriRows.isEmpty()}"
                  th:text="'検索結果: ' + ${#lists.size(form.mitsumoriRows)} + '件'"></span>
        </span>
    </div>

    <!-- 一覧グリッド -->
    <div class="grid-wrap">
        <table class="data-grid" id="mainGrid">
            <colgroup>
                <col style="width:28px;"/>    <!-- チェック -->
                <col style="width:66px;"/>    <!-- 承認状態 -->
                <col style="width:110px;"/>   <!-- 書類NO -->
                <col style="width:85px;"/>    <!-- 開始日 -->
                <col style="width:50px;"/>    <!-- 時間 -->
                <col style="width:80px;"/>    <!-- 納入先CD -->
                <col style="width:150px;"/>   <!-- 納入先名 -->
                <col style="width:80px;"/>    <!-- サポートID -->
                <col style="width:120px;"/>   <!-- プラント名 -->
                <col style="width:60px;"/>    <!-- 機器構成 -->
                <col style="width:90px;"/>    <!-- 金額 -->
                <col style="width:90px;"/>    <!-- 作成者 -->
                <col style="width:85px;"/>    <!-- 審査日 -->
                <col style="width:85px;"/>    <!-- 承認日 -->
                <col style="width:55px;"/>    <!-- 状態 -->
            </colgroup>
            <thead>
            <tr>
                <th class="col-chk"><input type="checkbox" id="chkAll" title="全選択"/></th>
                <th>承認状態</th>
                <th>書類NO</th>
                <th>開始日</th>
                <th>時間</th>
                <th>納入先CD</th>
                <th>納入先名</th>
                <th>サポートID</th>
                <th>プラント名</th>
                <th>機器構成</th>
                <th style="text-align:right;">金額</th>
                <th>作成者</th>
                <th>審査日</th>
                <th>承認日</th>
                <th>状態</th>
            </tr>
            </thead>
            <tbody id="mainTbody">
            <tr th:if="${form.mitsumoriRows == null or form.mitsumoriRows.isEmpty()}">
                <td colspan="15" style="text-align:center; padding:12px; color:#888;">
                    検索条件を入力して「検索」ボタンを押してください。
                </td>
            </tr>
            <tr th:each="row,stat : ${form.mitsumoriRows}"
                th:id="'row-' + ${stat.index}"
                th:attr="data-index=${stat.index},data-mitsumoriid=${row.umKihonMitsumoriId}"
                th:classappend="${stat.index == 0} ? 'row-selected' : ''"
                onclick="selectRow(this)">

                <td class="col-chk">
                    <!--
                      承認済(3) / 差戻し(4) はチェック不可。
                      金額超過チェックはサーバーサイドで実施。
                    -->
                    <input type="checkbox" name="checkedIds"
                           th:value="${row.umKihonMitsumoriId}"
                           th:disabled="${row.syouninJotai == '3' or row.syouninJotai == '4'}"
                           th:attr="data-kingaku=${row.kingaku}"
                           onclick="event.stopPropagation()"/>
                </td>

                <!-- 承認状態バッジ -->
                <td th:switch="${row.syouninJotai}">
                    <span th:case="'1'" class="badge badge-shinsachu">審査中</span>
                    <span th:case="'2'" class="badge badge-shoninchu">承認中</span>
                    <span th:case="'3'" class="badge badge-shoninzumi">承認済</span>
                    <span th:case="'4'" class="badge badge-sashimodoshi">差戻中</span>
                    <span th:case="*"   th:text="${row.syouninJotai}"></span>
                </td>

                <!-- 書類NO → MCM2003U リンク（承認画面からの遷移: seniMotoKbn=4） -->
                <td>
                    <a th:if="${row.umKihonMitsumoriId != null}"
                       th:href="@{/mcm2008u/link/mcm2003u(umKihonMitsumoriId=${row.umKihonMitsumoriId})}"
                       th:text="${row.shoruiNo}"
                       target="_blank"></a>
                </td>

                <td th:text="${row.kaisiDt}"></td>
                <td th:text="${row.keiyakujikantai}"></td>
                <td th:text="${row.nonyusakiCd}"></td>
                <td th:text="${row.nonyusakiNk}" style="overflow:hidden;text-overflow:ellipsis;" th:title="${row.nonyusakiNk}"></td>
                <td th:text="${row.supportId}"></td>
                <td th:text="${row.plantNk}" style="overflow:hidden;text-overflow:ellipsis;" th:title="${row.plantNk}"></td>

                <!-- 機器構成リンク → MCM0013U -->
                <td>
                    <a th:if="${row.plantId != null}"
                       th:href="@{/mcm0013u(plantId=${row.plantId})}"
                       target="_blank">構成</a>
                </td>

                <td style="text-align:right;"
                    th:text="${row.kingaku != null} ? ${#numbers.formatInteger(row.kingaku, 1, 'COMMA')} : ''"></td>
                <td th:text="${row.iraitantoNk}"></td>
                <td th:text="${row.shinsaDt}"></td>
                <td th:text="${row.syouninDt}"></td>

                <!-- 状態 -->
                <td th:switch="${row.jotai}">
                    <span th:case="'1'">見積</span>
                    <span th:case="'2'">契約</span>
                    <span th:case="'3'">破棄</span>
                    <span th:case="'4'">解約</span>
                    <span th:case="*" th:text="${row.jotai}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</form>

<!-- ===== 詳細パネル（添付ファイル / 取引先見積関連） ===== -->
<div class="detail-panels">

    <!-- 添付ファイルパネル -->
    <div class="detail-panel">
        <div class="panel-title">添付ファイル</div>
        <div id="tenpuContent">
            <th:block th:each="row,stat : ${form.mitsumoriRows}">
                <div class="tenpu-item"
                     th:id="'tenpu-' + ${stat.index}"
                     th:style="${stat.index == 0} ? '' : 'display:none'">
                    <span th:if="${row.tenpuList == null or row.tenpuList.isEmpty()}"
                          style="color:#888; font-size:11px;">添付ファイルなし</span>
                    <table class="sub-table" th:if="${row.tenpuList != null and !row.tenpuList.isEmpty()}">
                        <thead>
                        <tr><th>ファイル名</th><th>ディレクトリ</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${row.tenpuList}">
                            <td th:text="${t.tenpufileNk}"></td>
                            <td th:text="${t.directory}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </th:block>
            <div id="tenpu-empty" th:if="${form.mitsumoriRows == null or form.mitsumoriRows.isEmpty()}">
                <span style="color:#888; font-size:11px;">申請一覧から行を選択すると添付ファイルが表示されます。</span>
            </div>
        </div>
    </div>

    <!-- 取引先見積関連パネル（TVAグリッド） -->
    <div class="detail-panel">
        <div class="panel-title">取引先見積関連</div>
        <div id="tvaContent">
            <th:block th:each="row,stat : ${form.mitsumoriRows}">
                <div class="tva-item"
                     th:id="'tva-' + ${stat.index}"
                     th:style="${stat.index == 0} ? '' : 'display:none'">
                    <span th:if="${row.tvaList == null or row.tvaList.isEmpty()}"
                          style="color:#888; font-size:11px;">関連取引先見積なし</span>
                    <table class="sub-table" th:if="${row.tvaList != null and !row.tvaList.isEmpty()}">
                        <thead>
                        <tr>
                            <th>依頼NO</th>
                            <th>見積日</th>
                            <th>取引先名</th>
                            <th>時間帯</th>
                            <th>状態</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${row.tvaList}">
                            <td>
                                <a th:if="${t.tmKeiyakujikanId != null}"
                                   th:href="@{/mcm1004u(tmKeiyakujikanId=${t.tmKeiyakujikanId})}"
                                   th:text="${t.tmIraiNo}"
                                   target="_blank"></a>
                                <span th:if="${t.tmKeiyakujikanId == null}" th:text="${t.tmIraiNo}"></span>
                            </td>
                            <td th:text="${t.mitsumoriDt}"></td>
                            <td th:text="${t.torihikisakiNk}"></td>
                            <td th:text="${t.keiyakujikantai}"></td>
                            <td th:text="${t.jotai}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </th:block>
            <div id="tva-empty" th:if="${form.mitsumoriRows == null or form.mitsumoriRows.isEmpty()}">
                <span style="color:#888; font-size:11px;">申請一覧から行を選択すると関連情報が表示されます。</span>
            </div>
        </div>
    </div>
</div>

<!-- ===== 確認ダイアログ ===== -->
<div id="confirmDialogOverlay" class="mini-dialog-overlay" role="dialog" aria-modal="true">
    <div class="mini-dialog">
        <div class="mini-dialog-head">
            <span id="confirmDialogTitle">確認</span>
            <button type="button" class="mini-close" onclick="closeConfirm()">✕</button>
        </div>
        <div class="mini-dialog-body">
            <span class="mini-icon">❓</span>
            <span id="confirmDialogMsg" class="mini-msg"></span>
        </div>
        <div class="mini-dialog-foot">
            <button type="button" onclick="closeConfirm()">キャンセル</button>
            <button type="button" class="btn-ok" id="confirmOkBtn">OK</button>
        </div>
    </div>
</div>

<!-- ===== エラーダイアログ ===== -->
<div id="miniDialogOverlay" class="mini-dialog-overlay" role="dialog" aria-modal="true">
    <div class="mini-dialog">
        <div class="mini-dialog-head">
            <span id="miniDialogTitle">エラー</span>
            <button type="button" class="mini-close" onclick="closeMini()">✕</button>
        </div>
        <div class="mini-dialog-body">
            <span class="mini-icon">⚠</span>
            <span id="miniDialogMsg" class="mini-msg"></span>
        </div>
        <div class="mini-dialog-foot">
            <button type="button" onclick="closeMini()">OK</button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    // ===================================================================
    // ダイアログ関数 (MCM1011U 準拠)
    // ===================================================================

    function showConfirm(message, onOk) {
        document.getElementById('confirmDialogMsg').textContent = message;
        var overlay = document.getElementById('confirmDialogOverlay');
        overlay.classList.add('active');
        document.getElementById('confirmOkBtn').onclick = function () {
            closeConfirm();
            onOk();
        };
    }

    function closeConfirm() {
        document.getElementById('confirmDialogOverlay').classList.remove('active');
    }

    function showError(message) {
        document.getElementById('miniDialogMsg').textContent = message;
        document.getElementById('miniDialogOverlay').classList.add('active');
    }

    function closeMini() {
        document.getElementById('miniDialogOverlay').classList.remove('active');
    }

    function showServerMessageOnce() {
        var el = document.getElementById('serverMessageData');
        if (!el) return;
        var msg = el.getAttribute('data-message');
        var err = el.getAttribute('data-error');
        if (err && err.trim()) {
            showError(err);
        } else if (msg && msg.trim()) {
            showError(msg);
        }
    }

    // ===================================================================
    // 行選択（添付ファイル + TVAパネル連動）
    // ===================================================================

    var selectedIndex = 0;

    function selectRow(tr) {
        document.querySelectorAll('#mainTbody tr').forEach(function(r) {
            r.classList.remove('row-selected');
        });
        tr.classList.add('row-selected');
        var idx = parseInt(tr.getAttribute('data-index'));
        selectedIndex = idx;
        showDetail(idx);
    }

    function showDetail(idx) {
        document.querySelectorAll('.tenpu-item').forEach(function(d) { d.style.display = 'none'; });
        document.querySelectorAll('.tva-item').forEach(function(d) { d.style.display = 'none'; });
        var tp = document.getElementById('tenpu-' + idx);
        var tv = document.getElementById('tva-' + idx);
        if (tp) tp.style.display = '';
        if (tv) tv.style.display = '';
    }

    // ===================================================================
    // 全選択チェックボックス
    // ===================================================================

    document.addEventListener('DOMContentLoaded', function () {
        showServerMessageOnce();

        var chkAll = document.getElementById('chkAll');
        if (chkAll) {
            chkAll.addEventListener('change', function () {
                document.querySelectorAll('[name="checkedIds"]:not(:disabled)').forEach(function(c) {
                    c.checked = chkAll.checked;
                });
            });
        }
    });

    // ===================================================================
    // 承認ボタン
    // ===================================================================

    function doApprove() {
        var checked = document.querySelectorAll('[name="checkedIds"]:checked');
        if (checked.length === 0) {
            showError('承認する申請を選択してください。');
            return;
        }
        showConfirm('選択した ' + checked.length + ' 件を承認しますか？', function () {
            var form = document.getElementById('actionForm');
            form.action = /*[[@{/mcm2008u/approve}]]*/ '/mcm2008u/approve';
            form.submit();
        });
    }

    // ===================================================================
    // 差戻しボタン
    // ===================================================================

    function doReject() {
        var checked = document.querySelectorAll('[name="checkedIds"]:checked');
        if (checked.length === 0) {
            showError('差戻しする申請を選択してください。');
            return;
        }
        showConfirm('選択した ' + checked.length + ' 件を差戻しますか？', function () {
            var form = document.getElementById('actionForm');
            form.action = /*[[@{/mcm2008u/reject}]]*/ '/mcm2008u/reject';
            form.submit();
        });
    }
</script>
</body>
</html>
