<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>単価精査（MCM1007U）</title>
<link rel="stylesheet" th:href="@{/css/mcm1007u.css(v=20260914)}"><link rel="stylesheet" th:href="@{/css/mcm-notifications.css(v=20260910)}"><script defer th:src="@{/js/mcm-notifications.js(v=20260910)}"></script></head>
<body class="mcm1007u-screen">
<header class="header"><div></div><h1>単価精査（MCM1007U）</h1><a id="closeButton" class="btn-close" th:href="@{/mcm1004u}">閉じる</a></header>
<main>
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
<div class="header-scroll"><div class="header-area">
<label for="supplier" style="left:8px;top:7px">取引先名</label><input id="supplier" readonly th:value="${header?.torihikisakiNk}" th:title="${header?.torihikisakiNk}" style="left:92px;top:7px;width:428px">
<label for="maker" style="left:8px;top:29px">製造メーカー名</label><input id="maker" readonly th:value="${header?.seizomakerNk}" th:title="${header?.seizomakerNk}" style="left:100px;top:29px;width:100px">
<label for="equipment" style="left:579px;top:7px">品名</label><input id="equipment" readonly th:value="${header?.atsukaikikiNk}" th:title="${header?.atsukaikikiNk}" style="left:614px;top:7px;width:448px">
<label for="model" style="left:579px;top:29px">型式</label><input id="model" readonly th:value="${header?.katashiki}" th:title="${header?.katashiki}" style="left:614px;top:29px;width:448px">
<label for="hours" style="left:8px;top:51px">契約時間帯</label><input id="hours" readonly th:value="${keiyakujikantai}" style="left:92px;top:51px;width:30px">
</div></div>
<div class="grid-heading"><span>≪ 単価一覧 ≫</span><span class="result-count">検索結果：<span th:text="${resultCount}">0</span> 件</span></div>
<div class="table-container"><table class="data-grid" aria-label="単価一覧">
<colgroup><col style="width:170px"><col style="width:80px"><col style="width:170px"><col style="width:140px"><col style="width:80px"><col style="width:90px"><col style="width:55px"><col style="width:80px"><col style="width:70px"><col style="width:70px"><col style="width:70px"></colgroup>
<thead><tr><th><button type="button">納入先</button></th><th><button type="button">サポートID</button></th><th><button type="button">プラント</button></th><th><button type="button">機器構成名</button></th><th data-type="number"><button type="button">標準価格</button></th><th data-type="number"><button type="button">仕切り価格</button></th><th data-type="number"><button type="button">数量</button></th><th><button type="button">点検有無</button></th><th><button type="button">見積日</button></th><th><button type="button">開始日</button></th><th><button type="button">終了日</button></th></tr></thead>
<tbody><tr th:each="row : ${list}">
<td th:text="${row.nonyusakiNk}" th:title="${row.nonyusakiNk}"></td><td th:text="${row.supportId}"></td><td th:text="${row.plantNk}" th:title="${row.plantNk}"></td><td th:text="${row.kikikoseiNk}" th:title="${row.kikikoseiNk}"></td>
<td class="cell-right" th:attr="data-value=${row.hyojunKin?.toPlainString()}" th:text="${row.hyojunKin != null ? '¥' + #numbers.formatDecimal(row.hyojunKin,1,'COMMA',0,'POINT') : ''}"></td>
<td class="cell-right" th:attr="data-value=${row.sikiriKin?.toPlainString()}" th:text="${row.sikiriKin != null ? '¥' + #numbers.formatDecimal(row.sikiriKin,1,'COMMA',0,'POINT') : ''}"></td>
<td class="cell-right" th:attr="data-value=${row.suryoNm?.toPlainString()}" th:text="${row.suryoNm != null ? row.suryoNm.stripTrailingZeros().toPlainString() : ''}"></td>
<td class="cell-center" th:text="${row.tenkenumu == '1' ? '点検あり' : (row.tenkenumu == '0' ? '点検なし' : '')}"></td>
<td th:text="${row.mitsumoriDt != null ? #temporals.format(row.mitsumoriDt,'yyyy/MM/dd') : ''}"></td><td th:text="${row.kaisiDt != null ? #temporals.format(row.kaisiDt,'yyyy/MM/dd') : ''}"></td><td th:text="${row.syuryoDt != null ? #temporals.format(row.syuryoDt,'yyyy/MM/dd') : ''}"></td>
</tr></tbody></table></div>
</main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('closeButton').addEventListener('click',event=>{if(window.opener&&!window.opener.closed){event.preventDefault();window.close();}});
  const table=document.querySelector('.data-grid'),body=table.tBodies[0],headers=[...table.tHead.rows[0].cells],rows=[...body.rows];
  const original=new Map(rows.map((row,i)=>[row,i]));
  const textCompare=new Intl.Collator('ja').compare;
  function numberCompare(a,b){
    if(!a||!b)return a===b?0:a?1:-1;
    const parts=v=>{const [whole,fraction='']=v.split('.');return {digits:BigInt(whole+fraction),scale:fraction.length};};
    const x=parts(a),y=parts(b),scale=Math.max(x.scale,y.scale),left=x.digits*10n**BigInt(scale-x.scale),right=y.digits*10n**BigInt(scale-y.scale);
    return left<right?-1:left>right?1:0;
  }
  function freeze(){let left=0;headers.slice(0,4).forEach((header,i)=>{table.querySelectorAll('tr').forEach(row=>{row.cells[i].style.left=left+'px';});left+=header.getBoundingClientRect().width;});}
  headers.forEach((header,i)=>header.querySelector('button').addEventListener('click',()=>{
    const ascending=header.getAttribute('aria-sort')!=='ascending';headers.forEach(h=>h.removeAttribute('aria-sort'));header.setAttribute('aria-sort',ascending?'ascending':'descending');
    const compare=header.dataset.type==='number'?numberCompare:textCompare;
    rows.sort((a,b)=>{const value=cell=>cell.dataset.value??cell.textContent.trim();return (ascending?1:-1)*compare(value(a.cells[i]),value(b.cells[i]))||original.get(a)-original.get(b);});
    body.append(...rows);freeze();
  }));
  new ResizeObserver(freeze).observe(document.querySelector('.table-container'));freeze();
});
</script></body></html>
