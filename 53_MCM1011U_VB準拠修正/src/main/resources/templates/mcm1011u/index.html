<!DOCTYPE html>
<!--
  【変換元】Mcm1011uScreen.Designer.vb / Mcm1011uScreen.vb
  MCM1011U — 審査・承認（取引先契約）
  【デザイン参照】MCM0017U（紫帯ヘッダー / data-grid / カスタムダイアログ）
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf"        th:content="${_csrf != null} ? ${_csrf.token}      : ''"/>
    <meta name="_csrf_header" th:content="${_csrf != null} ? ${_csrf.headerName} : ''"/>
    <title>MCM1011U - 審査・承認（取引先契約）</title>
    <link rel="stylesheet" th:href="@{/css/mcm1011u.css(v=20260930-53)}"/>
    <link rel="stylesheet" th:href="@{/css/mcm-notifications.css}"/>
    <script defer th:src="@{/js/mcm-notifications.js}"></script>
    <script defer th:src="@{/js/mcm1011u.js(v=20260930-53)}"></script>
</head>
<body>

<main class="mcm1011u-screen" layout:fragment="content" th:attr="data-reset-grid=${resetGridState}">
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message},noticeError=${error},noticeErrors=${errors},noticeInfo=${infoMessage})}"></th:block>
<!-- ===== ヘッダー ===== -->
<div class="header">
    <div class="header-left"></div>
    <div class="header-center"><h1>審査・承認（取引先契約）（MCM1011U）</h1></div>
    <div class="header-right">
        <a class="btn-close" th:href="@{/menu}" href="/mcm/menu">閉じる</a>
    </div>
</div>

<!-- ===== 検索条件フォーム ===== -->
<form th:action="@{/mcm1011u/search}" th:object="${form}" method="post" class="search-area">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <div class="search-grid">
        <label for="nonyusakiCd">納入先コード</label>
        <input type="text" id="nonyusakiCd" th:field="*{nonyusakiCd}" aria-label="納入先コード"/>
        <label for="nonyusakiNk">納入先名(旧名・カナなど)</label>
        <input type="text" id="nonyusakiNk" th:field="*{nonyusakiNk}" aria-label="納入先名"/>
        <label for="supportId">サポートID</label>
        <input type="text" id="supportId" th:field="*{supportId}"/>
        <label for="plantNk">プラント名</label>
        <input type="text" id="plantNk" th:field="*{plantNk}"/>
        <label>承認状態</label>
        <div class="status-group">
            <label><input type="checkbox" th:field="*{shinsachu}"/>審査中</label>
            <label><input type="checkbox" th:field="*{shoninchu}"/>承認中</label>
            <label><input type="checkbox" th:field="*{sashimodoshi}"/>差戻中</label>
            <label><input type="checkbox" th:field="*{shoninzumi}"/>承認済</label>
        </div>
        <button type="submit" class="search-submit">検索</button>
    </div>
</form>

<!-- ===== 承認/差戻し アクションフォーム ===== -->
<form id="actionForm" data-mcm-no-progress data-mcm-ignore-dirty method="post" th:action="@{/mcm1011u/approve}">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="listVersion" th:value="${listVersion}"/>

    <div class="section-caption">&lt;&lt; 申請 &gt;&gt;</div>
    <!-- 一覧グリッド -->
    <div class="grid-wrap mcm-grid">
        <table class="data-grid" id="mainGrid">
            <colgroup><col style="width:26px;"/><col style="width:20px;"/><col style="width:78px;"/><col style="width:100px;"/><col style="width:75px;"/><col style="width:60px;"/><col style="width:150px;"/><col style="width:150px;"/><col style="width:150px;"/><col style="width:150px;"/><col style="width:80px;"/><col style="width:150px;"/><col style="width:75px;"/><col style="width:80px;"/><col style="width:55px;"/><col style="width:110px;"/><col style="width:90px;"/><col style="width:110px;"/><col style="width:90px;"/></colgroup>
            <thead>
            <tr>
                <th class="row-head"></th><th class="col-chk"><input type="checkbox" id="chkAll" title="全選択" th:disabled="${!canUpdate}"/></th>
                <th>承認状態</th>
                <th>契約NO</th>
                <th>開始日</th>
                <th>時間</th>
                <th>取引先名</th>
                <th>納入先名</th>
                <th>旧納入先名</th>
                <th>納入先工場名</th>
                <th>サポートID</th>
                <th>プラント名</th>
                <th style="text-align:right;">金額</th>
                <th>担当者</th>
                <th>状態</th>
                <th>審査日</th>
                <th>審査者</th>
                <th>承認日</th>
                <th>承認者</th>
            </tr>
            </thead>
            <tbody id="mainTbody">
            <tr class="empty-grid-row" th:if="${form.keiyakuRows == null or form.keiyakuRows.isEmpty()}">
                <td colspan="19" style="text-align:center; padding:12px; color:#888;">
                    対象の申請はありません。
                </td>
            </tr>
            <tr th:each="row,stat : ${form.keiyakuRows}"
                th:id="'row-' + ${stat.index}"
                th:attr="data-index=${stat.index},data-row-key=${row.rowKey}"
                th:classappend="${stat.index == 0} ? 'row-selected selected' : ''"
                tabindex="0">

                <td class="row-head"><span class="row-pointer" aria-hidden="true">▶</span><span class="row-number" th:text="${stat.count}"></span></td><td class="col-chk">
                    <!--
                      承認済(3) / 差戻し(4) はチェック不可。
                      金額超過チェックはサーバーサイドで実施。
                    -->
                    <input type="checkbox" name="checkedIds"
                           th:value="${row.rowKey}"
                           th:disabled="${!canUpdate or (row.shoninjotai != '1' and row.shoninjotai != '2') or (row.shoninjotai == '1' and !viewerShinsa) or (row.shoninjotai == '2' and !viewerShonin) or row.kingaku == null or (row.shoninjotai == '1' and (keiyakuShinsaKin == null or row.kingaku > keiyakuShinsaKin)) or (row.shoninjotai == '2' and (keiyakuShoninKin == null or row.kingaku > keiyakuShoninKin))}"
                           th:attr="data-kingaku=${row.kingaku},data-jotai=${row.jotai}"
/>
                </td>

                <!-- 承認状態バッジ -->
                <td th:switch="${row.shoninjotai}">
                    <span th:case="'1'" class="badge badge-shinsachu">審査中</span>
                    <span th:case="'2'" class="badge badge-shoninchu">承認中</span>
                    <span th:case="'3'" class="badge badge-shoninzumi">承認済</span>
                    <span th:case="'4'" class="badge badge-sashimodoshi">差戻中</span>
                    <span th:case="*"   th:text="${row.shoninjotai}"></span>
                </td>

                <!-- 契約NO → MCM1005U リンク -->
                <td>
                    <a target="_blank" rel="noopener" th:if="${canDownloadAttachment}" th:href="@{/mcm1011u/link/mcm1005u(tkKeiyakuId=${row.tkKeiyakuId})}"
                       th:title="${row.keiyakuNo}" th:text="${row.keiyakuNo}"></a><span th:unless="${canDownloadAttachment}" th:text="${row.keiyakuNo}"></span>
                </td>

                <td th:text="${row.kaisiDt}"></td>
                <td th:text="${row.hoursDisplay}"></td>
                <td th:text="${row.torihikisakiNk}" style="overflow:hidden;text-overflow:ellipsis;" th:title="${row.torihikisakiNk}"></td>
                <td th:text="${row.nonyusakiNk}"    style="overflow:hidden;text-overflow:ellipsis;" th:title="${row.nonyusakiNk}"></td>
                <td th:text="${row.oldNonyusakiNk}" th:title="${row.oldNonyusakiNk}"></td>
                <td th:text="${row.nonyusakiKojoNk}" th:title="${row.nonyusakiKojoNk}"></td>
                <td th:text="${row.supportId}"></td>
                <td th:text="${row.plantNk}"        style="overflow:hidden;text-overflow:ellipsis;" th:title="${row.plantNk}"></td>
                <td style="text-align:right;"
                    th:text="${row.kingaku != null} ? ${'¥' + #numbers.formatInteger(row.kingaku, 1, 'COMMA')} : ''"></td>
                <td th:text="${row.iraitantosya}"></td>

                <!-- 状態 -->
                <td th:text="${row.jotaiName}"></td>
                <td th:text="${row.shinsaDt}"></td>
                <td th:text="${row.shinsaBy}"></td>
                <td th:text="${row.shoninDt}"></td>
                <td th:text="${row.shoninBy}"></td>
            </tr>
            </tbody>
        </table>
    </div>

<!-- ===== VB下段: 添付 ===== -->
<div class="lower-panels">
<div class="tenpu-panel">
    <div class="panel-title">&lt;&lt; 添付 &gt;&gt;</div>
    <div id="tenpuContent" class="mcm-grid">
        <th:block th:each="row,stat : ${form.keiyakuRows}">
            <div class="tenpu-item"
                 th:id="'tenpu-' + ${stat.index}"
                 th:style="${stat.index == 0} ? '' : 'display:none'">
                <table class="tenpu-table"><colgroup><col style="width:26px;"/><col style="width:300px;"/></colgroup>
                    <thead>
                    <tr>
                        <th></th><th>ファイル名</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t, fileStat : ${row.tenpuList}" tabindex="0">
                        <td class="row-head"><span class="row-pointer" aria-hidden="true">▶</span><span class="row-number" th:text="${fileStat.count}"></span></td>
                        <td th:title="${t.tenpufileNk}"><a data-mcm-no-progress th:if="${canDownloadAttachment}" th:href="@{/mcm1011u/attachment/download(tkKeiyakuId=${row.tkKeiyakuId},tkTenpuId=${t.tkTenpuId})}" th:text="${t.tenpufileNk}"></a><span th:unless="${canDownloadAttachment}" th:text="${t.tenpufileNk}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </th:block>
        <!-- 検索前の初期状態 -->
        <div id="tenpu-empty" th:if="${form.keiyakuRows == null or form.keiyakuRows.isEmpty()}">
            <table class="tenpu-table"><colgroup><col style="width:26px;"/><col style="width:300px;"/></colgroup><thead><tr><th></th><th>ファイル名</th></tr></thead><tbody></tbody></table>
        </div>
    </div>
</div>
</div>
<div class="action-bar">
    <button type="button" class="btn-warning" th:disabled="${!canUpdate}" id="rejectButton" th:data-action="@{/mcm1011u/reject}">差戻し</button>
    <button type="button" class="btn-primary" th:disabled="${!canUpdate}" id="approveButton" th:data-action="@{/mcm1011u/approve}">承認</button>
</div>
</form>

</main>
</body>
</html>
