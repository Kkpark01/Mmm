<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取引先契約機器設定（MCM1006U2）</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/mcm-customer-screens.css}">
<link rel="stylesheet" th:href="@{/css/mcm-notifications.css}">
<link rel="stylesheet" th:href="@{/css/mcm1006u.css(v=20260930-50)}">
<script defer th:src="@{/js/mcm-notifications.js}"></script>
<script defer th:src="@{/js/mcm1006u.js(v=20260929-44)}"></script>
</head><body class="mcm-customer-screen mcm1006u">
<header class="header"><div class="header-left"></div><h1>取引先契約機器設定（MCM1006U2）</h1>
<a class="btn btn-close" th:href="@{/mcm1006u/close}">閉じる</a></header>
<th:block th:replace="~{fragments/mcm-notifications :: messages(noticeMessage=${message}, noticeError=${error}, noticeErrors=${errors != null ? errors : errorMsg}, noticeInfo=${infoMessage})}"></th:block>
<form id="step2Form" class="screen-form" th:action="@{/mcm1006u/step2/complete}" method="post"><input type="hidden" name="_csrf" th:if="${_csrf != null}" th:value="${_csrf.token}"><section class="contract-info" aria-label="契約情報">
<label class="info-label">納入先コード</label><span class="info-code" th:text="${form.nonyusakiCd}"></span><span></span><span class="info-name" th:text="${form.nonyusakiNk}"></span>
<label class="info-label">サポートID</label><span class="info-code" th:text="${form.supportId}"></span><label>プラント名</label><span class="info-name" th:text="${form.plantNk}"></span>
<label class="info-label">契約NO</label><span class="info-code" th:text="${form.keiyakuNo}"></span><label for="kaisiDt">期間</label><div class="contract-dates">
<span th:text="${form.kaisiDt}"></span><span>～</span><span th:text="${form.syuryoDt}"></span>
</div>
<label class="info-label">取引先コード</label><span class="info-code" th:text="${form.torihikisakiCd}"></span><span></span><span class="info-name" th:text="${form.torihikisakiNk}"></span>
</section><div class="screen-grids"><section class="grid-section grid-top-left"><h2>≪機器構成パターン≫</h2><div class="grid-container mcm-grid"><table id="koseiGrid" class="data-grid" aria-label="≪機器構成パターン≫"><colgroup><col style="width:26px"><col style="width:25px"><col style="width:110px"><col style="width:110px"><col style="width:70px"><col style="width:55px"><col style="width:80px"><col style="width:150px"></colgroup><thead><tr><th class="row-pointer" aria-label="行選択"></th><th scope="col"></th><th scope="col">見積依頼NO</th><th scope="col">機器構成名</th><th scope="col">セット数</th><th scope="col">単位</th><th scope="col">手配製番</th><th scope="col">備考</th></tr></thead><tbody><tr th:each="row,stat : ${form.koseiRows}" th:id="|koseiRow_${stat.index}|" th:attr="data-kikikosei-id=${row.kikikoseiId}"><td class="row-pointer" aria-label="行選択"><span aria-hidden="true">▶</span></td><td class="col-check"><input type="checkbox" th:name="|koseiRows[${stat.index}].checkFlg|" value="1" th:checked="${row.checkFlg == 1}" th:disabled="${!canUpdate}" th:attr="data-eligible=${!#strings.isEmpty(row.tmIraiNo)}" aria-label="選定"></td><td class="" th:text="${row.tmIraiNo}" th:title="${row.tmIraiNo}"></td><td class="" th:text="${row.kikikoseiNk}" th:title="${row.kikikoseiNk}"></td><td class="" th:text="${row.setNm}" th:title="${row.setNm}"></td><td class="" th:text="${row.tani}" th:title="${row.tani}"></td><td class="" th:text="${row.tehaiseiban}" th:title="${row.tehaiseiban}"></td><td class="" th:text="${row.biko}" th:title="${row.biko}"></td></tr><tr class="empty-row" hidden><td colspan="8">データがありません</td></tr></tbody></table></div></section><section class="grid-section grid-top-right"><h2>≪納入機器明細≫</h2><div class="grid-container mcm-grid"><table id="meisaiGrid" class="data-grid" aria-label="≪納入機器明細≫"><colgroup><col style="width:26px"><col style="width:25px"><col style="width:110px"><col style="width:110px"><col style="width:120px"><col style="width:110px"><col style="width:60px"><col style="width:150px"></colgroup><thead><tr><th class="row-pointer" aria-label="行選択"></th><th scope="col"></th><th scope="col">見積依頼NO</th><th scope="col">製造メーカー</th><th scope="col">品名</th><th scope="col">型式</th><th scope="col">数量</th><th scope="col">備考</th></tr></thead><tbody><tr th:each="row,stat : ${form.meisaiRows}" th:id="|meisaiRow_${stat.index}|" th:attr="data-kikikosei-id=${row.kikikoseiId},data-kikimeisai-id=${row.kikimeisaiId}"><td class="row-pointer" aria-label="行選択"><span aria-hidden="true">▶</span></td><td class="col-check"><input type="checkbox" th:name="|meisaiRows[${stat.index}].checkFlg|" value="1" th:checked="${row.checkFlg == 1}" th:disabled="${!canUpdate}" th:attr="data-eligible=${!#strings.isEmpty(row.tmIraiNo)}" aria-label="選定"></td><td class="" th:text="${row.tmIraiNo}" th:title="${row.tmIraiNo}"></td><td class="" th:text="${row.seizomakerNk}" th:title="${row.seizomakerNk}"></td><td class="" th:text="${row.kikihinmeiNk}" th:title="${row.kikihinmeiNk}"></td><td class="" th:text="${row.kikikatashiki}" th:title="${row.kikikatashiki}"></td><td class="amount" th:text="${row.suryoNm}" th:title="${row.suryoNm}"></td><td class="" th:text="${row.biko}" th:title="${row.biko}"></td></tr><tr class="empty-row" hidden><td colspan="8">データがありません</td></tr></tbody></table></div></section><section class="grid-section grid-bottom"><h2>≪機器個体・明細≫</h2><div class="grid-container mcm-grid"><table id="kotaiGrid" class="data-grid" aria-label="≪機器個体・明細≫"><colgroup><col style="width:26px"><col style="width:25px"><col style="width:110px"><col style="width:120px"><col style="width:110px"><col style="width:60px"><col style="width:100px"><col style="width:110px"><col style="width:120px"><col style="width:150px"><col style="width:150px"><col style="width:90px"><col style="width:90px"></colgroup><thead><tr><th class="row-pointer" aria-label="行選択"></th><th scope="col"></th><th scope="col">見積依頼NO</th><th scope="col">品名</th><th scope="col">型式</th><th scope="col">数量</th><th scope="col">個体名</th><th scope="col">シリアル番号</th><th scope="col">設置場所</th><th scope="col">取引先</th><th scope="col">ブランド</th><th scope="col">一次納入日</th><th scope="col">延長契約日</th></tr></thead><tbody><tr th:each="row,stat : ${form.kotaiRows}" th:id="|kotaiRow_${stat.index}|" th:attr="data-kikikosei-id=${row.kikikoseiId},data-kikimeisai-id=${row.kikimeisaiId},data-kotaikanri-id=${row.kotaikanriId}"><td class="row-pointer" aria-label="行選択"><span aria-hidden="true">▶</span></td><td class="col-check"><input type="checkbox" th:name="|kotaiRows[${stat.index}].checkFlg|" value="1" th:checked="${row.checkFlg == 1}" th:disabled="${!canUpdate}" th:attr="data-eligible=${!#strings.isEmpty(row.tmIraiNo)}" aria-label="選定"></td><td class="" th:text="${row.tmIraiNo}" th:title="${row.tmIraiNo}"></td><td class="" th:text="${row.kikihinmeiNk}" th:title="${row.kikihinmeiNk}"></td><td class="" th:text="${row.kikikatashiki}" th:title="${row.kikikatashiki}"></td><td class="amount" th:text="${row.suryoNm}" th:title="${row.suryoNm}"></td><td class="" th:text="${row.kotaiNk}" th:title="${row.kotaiNk}"></td><td class="" th:text="${row.serialNo}" th:title="${row.serialNo}"></td><td class="" th:text="${row.setchibasyo}" th:title="${row.setchibasyo}"></td><td class="" th:text="${row.torihikisakiNk}" th:title="${row.torihikisakiNk}"></td><td class="" th:text="${row.brandsyosaiNk}" th:title="${row.brandsyosaiNk}"></td><td class="" th:text="${row.itijinonyugDt}" th:title="${row.itijinonyugDt}"></td><td class="" th:text="${row.enchokeiyakukigenDt}" th:title="${row.enchokeiyakukigenDt}"></td></tr><tr class="empty-row" hidden><td colspan="13">データがありません</td></tr></tbody></table></div></section></div><footer class="toolbar"><button type="submit" class="btn" id="btnBack" th:formaction="@{/mcm1006u/step2/back}" th:disabled="${!canUpdate}">前へ</button><button type="submit" class="btn btn-complete" th:disabled="${!canUpdate}">摘要</button></footer></form></body></html>
